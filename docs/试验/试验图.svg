<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="root" viewBox="0 0 400 400" width="400" height="400">
  <!-- 试验图：把测试图需求里会出现的几种动画各放一个，用来核实"冻结、取值、截图"的做法。不是美术。 -->
  <style>
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 4s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.2); } to { transform: rotate(360deg) scale(1); } }
    .breath { animation: breath 2s ease-in-out infinite alternate; }
    @keyframes breath { from { d: path("M 40 300 C 80 260 160 260 200 300 C 160 340 80 340 40 300 Z"); } to { d: path("M 40 300 C 80 230 160 240 200 300 C 160 370 80 360 40 300 Z"); } }
    .eye { animation: eye 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    @keyframes eye { 0% { fill: #e3263a; } 50% { fill: #3fe3f0; } 100% { fill: #e3263a; } }
    .rune { stroke-dasharray: 300; animation: rune 2s steps(8, end) infinite; }
    @keyframes rune { from { stroke-dashoffset: 300; } to { stroke-dashoffset: 0; } }
    .act-cast .halo { animation: cast 1200ms ease-out forwards; }
    @keyframes cast { from { opacity: 0.2; transform: scale(0.8); } to { opacity: 1; transform: scale(1.3); } }
    .halo { transform-box: fill-box; transform-origin: center; opacity: 0.2; }
  </style>
  <defs>
    <linearGradient id="lava" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#ffd84a"/><stop offset="1" stop-color="#8e2f3b"/>
      <animateTransform id="smilGrad" attributeName="gradientTransform" type="translate" from="0 0" to="1 0" dur="2s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowFill" cx="0.5" cy="0.5" r="0.5" fx="0.3" fy="0.3">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#2e66f0" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur id="fe" in="SourceGraphic" stdDeviation="2">
        <animate id="smilBlur" attributeName="stdDeviation" values="2;10;2" dur="1.2s" begin="indefinite" fill="freeze"/>
      </feGaussianBlur>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.6 0" result="g"/>
      <feComposite in="g" in2="SourceGraphic" operator="in" result="gi"/>
      <feBlend in="SourceGraphic" in2="gi" mode="multiply"/>
    </filter>
    <path id="track" d="M 60 80 C 120 20 280 20 340 80"/>
  </defs>
  <rect x="20" y="20" width="360" height="360" rx="24" fill="#161221"/>
  <rect id="lavaRect" x="40" y="180" width="320" height="40" fill="url(#lava)"/>
  <g id="spinner" class="spin"><rect x="250" y="250" width="80" height="80" fill="url(#glowFill)" stroke="#c2a670" stroke-width="3"/></g>
  <path id="breathCss" class="breath" d="M 40 300 C 80 260 160 260 200 300 C 160 340 80 340 40 300 Z" fill="#6e542b" filter="url(#grain)"/>
  <path id="morphSmil" fill="#1dbf5e" opacity="0.8" d="M 220 120 L 300 120 L 300 160 L 220 160 Z">
    <animate id="smilD" attributeName="d" dur="2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"
      values="M 220 120 L 300 120 L 300 160 L 220 160 Z;M 230 100 L 320 130 L 290 170 L 210 150 Z;M 220 120 L 300 120 L 300 160 L 220 160 Z"/>
  </path>
  <circle id="eye" class="eye" cx="120" cy="130" r="18" fill="#e3263a"/>
  <path id="rune" class="rune" d="M 60 240 C 120 200 180 280 240 240 S 320 220 340 250" fill="none" stroke="#f4f1ff" stroke-width="4" stroke-linecap="round"/>
  <circle id="halo" class="halo" cx="120" cy="130" r="40" fill="#3fe3f0" filter="url(#blur)" style="mix-blend-mode: screen"/>
  <use href="#track" fill="none" stroke="#9a8968" stroke-width="1" stroke-dasharray="4 4"/>
  <polygon id="bone" points="-10,-6 10,0 -10,6" fill="#e6dec8">
    <animateMotion id="smilMotion" dur="3s" repeatCount="indefinite" rotate="auto"><mpath href="#track"/></animateMotion>
  </polygon>
  <rect id="blink" x="340" y="340" width="20" height="20" fill="#e94fd8">
    <set id="smilSet" attributeName="visibility" to="hidden" begin="1s" dur="0.5s"/>
  </rect>
</svg>
