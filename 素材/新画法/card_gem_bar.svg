<svg xmlns="http://www.w3.org/2000/svg" class="svg-card_gem_bar" viewBox="0 0 132 34" width="132" height="34">
<title>宝石栏</title>
<style>
.svg-card_gem_bar g { transform-box: view-box; }
.svg-card_gem_bar #sheen { transform-origin: 66px 17px; opacity: 0; }

/* 待机 3000ms：0 静止/低位 → 1500 轻变化最大/高位 → 3000 与0帧一致（横栏及三处空槽坐标固定不动，仅金属棱亮光轻呼吸） */
@keyframes svg-card_gem_bar-idle-1 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0.9; animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; }
}
.svg-card_gem_bar:not([data-anim]) #sheen,
.svg-card_gem_bar[data-anim="idle"] #sheen { animation: svg-card_gem_bar-idle-1 3s infinite; }
</style>
<defs>
  <clipPath id="card_gem_bar-cbar">
    <path d="M10,2.5 H122 L129.5,10 V24 L122,31.5 H10 L2.5,24 V10 Z"/>
  </clipPath>
</defs>

<g id="root">
  <!-- 1 墨色垫底（平面板件稳固外框） -->
  <path d="M10,2.5 H122 L129.5,10 V24 L122,31.5 H10 L2.5,24 V10 Z" transform="translate(.4 .6)" fill="#1C1412" stroke="#1C1412" stroke-width="3.6" stroke-linejoin="round"/>
  <!-- 2 旧铜暗底 -->
  <path d="M10,2.5 H122 L129.5,10 V24 L122,31.5 H10 L2.5,24 V10 Z" fill="#6E542B"/>

  <g clip-path="url(#card_gem_bar-cbar)">
    <!-- 3 错位亮面 -->
    <path d="M10,2.5 H122 L129.5,10 V24 L122,31.5 H10 L2.5,24 V10 Z" transform="translate(-2 -2)" fill="#9A7B46"/>
    <!-- 4 右下加深 -->
    <path d="M129.5,12 V24 L122,31.5 H20 L30,28 H120 L126.5,22 V12 Z" fill="#3B2B14" opacity="0.8"/>
    <!-- 内凹暗铜盘面 -->
    <path d="M12,5.2 H120 L126,11.2 V22.8 L120,28.8 H12 L6,22.8 V11.2 Z" fill="#3B2B14" stroke="#1C1412" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M12.5,27.5 H119.5 L124.8,22.2 V12" fill="none" stroke="#9A7B46" stroke-width="0.9" opacity="0.7"/>
    <!-- 5 左上受光亮边与右下冷轮廓光 -->
    <path d="M3.8,22 V10.6 L10.6,3.8 H116 L114,5.2 H11.2 L5.2,11.2 V21 Z" fill="#C2A670"/>
    <path d="M128.2,14 V23.4 L121.4,30.2 H78 L79.5,28.8 H120.8 L126.8,22.8 V14.5 Z" fill="#8CAAB5" opacity="0.78"/>
    <!-- 6 铜绿与旧磕痕 -->
    <path d="M46,27 C49,27.5 52,26.8 54,25.5 M82,7 C85,6.5 88,7.2 90,8.5" fill="none" stroke="#5F8272" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
    <path d="M42,2.5 L43.5,4.5 L45,2.5 Z M96,31.5 L97.2,29.5 L98.8,31.5 Z" fill="#1C1412"/>
  </g>

  <!-- 两端铆钉与槽间哥特小菱饰 -->
  <circle cx="10.4" cy="17.4" r="2.6" fill="#1C1412"/><circle cx="10" cy="17" r="2.1" fill="#9A7B46"/><circle cx="9.3" cy="16.3" r="0.8" fill="#DDCB9A"/>
  <circle cx="122.4" cy="17.4" r="2.6" fill="#1C1412"/><circle cx="122" cy="17" r="2.1" fill="#6E542B"/><circle cx="121.3" cy="16.3" r="0.8" fill="#C2A670"/>
  <path d="M48,13.5 Q49.2,17 51.5,17 Q49.2,17 48,20.5 Q46.8,17 44.5,17 Q46.8,17 48,13.5 Z M84,13.5 Q85.2,17 87.5,17 Q85.2,17 84,20.5 Q82.8,17 80.5,17 Q82.8,17 84,13.5 Z" fill="#9A7B46" stroke="#1C1412" stroke-width="0.9"/>

  <!-- 左槽：圆槽 中心 (30,17)，可容 24px 图标 -->
  <g id="socket_red">
    <circle cx="30" cy="17" r="11.6" fill="#0D111C" stroke="#1C1412" stroke-width="2"/>
    <path d="M19.5,19 A11,11 0 0 1 38.5,10 A10.5,10 0 0 0 21,21 Z" fill="#161221"/>
    <path d="M21.5,24 A11,11 0 0 0 39.5,22" fill="none" stroke="#9A7B46" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
    <path d="M24,25.8 A11,11 0 0 0 36,25.8" fill="none" stroke="#DDCB9A" stroke-width="0.8" stroke-linecap="round" opacity="0.65"/>
  </g>

  <!-- 中槽：切角方槽 中心 (66,17)，可容 24px 图标 -->
  <g id="socket_green">
    <path d="M57.5,6.2 H74.5 L76.8,8.5 V25.5 L74.5,27.8 H57.5 L55.2,25.5 V8.5 Z" fill="#0D111C" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="56.2,24.5 56.2,9 58,7.2 73.5,7.2 60,12 58,24.5" fill="#161221"/>
    <path d="M57.5,26.8 H74 L75.8,25 V14" fill="none" stroke="#9A7B46" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
    <path d="M60,26.8 H72" fill="none" stroke="#DDCB9A" stroke-width="0.8" stroke-linecap="round" opacity="0.65"/>
  </g>

  <!-- 右槽：三角槽 中心 (102,17)，可容 24px 图标 -->
  <g id="socket_blue">
    <polygon points="102,5.2 114,26.6 90,26.6" fill="#0D111C" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="102,6.8 106,14 94.5,25.6 91.5,25.6" fill="#161221"/>
    <path d="M92,25.6 H112.5 L108,17.5" fill="none" stroke="#9A7B46" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <path d="M95,25.6 H109" fill="none" stroke="#DDCB9A" stroke-width="0.8" stroke-linecap="round" opacity="0.65"/>
  </g>

  <!-- 待机轻亮光层 -->
  <g id="sheen" opacity="0">
    <path d="M11,4.2 H64 M72,4.2 H118" fill="none" stroke="#DDCB9A" stroke-width="1.3" stroke-linecap="round" opacity="0.85"/>
    <circle cx="48" cy="17" r="1.2" fill="#DDCB9A"/>
    <circle cx="84" cy="17" r="1.2" fill="#DDCB9A"/>
  </g>
</g>
</svg>
