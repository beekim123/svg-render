/* 待机 3000：0 静止 → 1500 石墙暗面微光最亮 → 3000 回到静止。结构与平铺边完全固定 */
@keyframes svg-bg_tile-idle-1 {
  0% { opacity: 0; animation-timing-function: ease-in-out; }
  50% { opacity: 1; animation-timing-function: ease-in-out; }
  100% { opacity: 0; }
}
.svg-bg_tile:not([data-anim]) #sheen,
.svg-bg_tile[data-anim="idle"] #sheen { animation: svg-bg_tile-idle-1 3s infinite; }
</style>
