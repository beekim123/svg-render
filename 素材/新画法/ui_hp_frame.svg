<svg xmlns="http://www.w3.org/2000/svg" class="svg-ui_hp_frame" viewBox="0 0 256 48" width="256" height="48">
<title>血条框</title>
<style>
.svg-ui_hp_frame g { transform-box: view-box; }
.svg-ui_hp_frame #sheen { opacity: 0; }

/* idle 3000ms: 0 -> 1500 -> 3000 */
@keyframes svg-ui_hp_frame-idle-sheen {
  0% { opacity: 0; animation-timing-function: ease-in-out; }
  50% { opacity: 0.85; animation-timing-function: ease-in-out; }
  100% { opacity: 0; }
}
.svg-ui_hp_frame:not([data-anim]) #sheen,
.svg-ui_hp_frame[data-anim="idle"] #sheen {
  animation: svg-ui_hp_frame-idle-sheen 3s infinite;
}
</style>
<defs>
  <linearGradient id="ui_hp_frame-sheen-grad" x1="16" y1="4" x2="240" y2="44" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#DDCB9A" stop-opacity="0"/>
    <stop offset="0.35" stop-color="#DDCB9A" stop-opacity="0.85"/>
    <stop offset="0.7" stop-color="#8CAAB5" stop-opacity="0"/>
  </linearGradient>
</defs>
<g id="root">
  <!-- 九宫格 [16,16,16,16]，inner [8,8,8,8]：x=16..240 与 y=16..32 严格使用顺拉伸方向的平直结构 -->
  <!-- 外框旧铁与旧铜复合槽底 -->
  <rect x="2" y="2" width="252" height="44" rx="6" fill="#4A4742" stroke="#1C1412" stroke-width="2.8"/>
  <!-- 下半部铁槽背光暗面（顺水平方向直线） -->
  <path d="M3.5,25 H252.5 V40 A4.5,4.5 0 0 1 248,44.5 H8 A4.5,4.5 0 0 1 3.5,40 Z" fill="#2E2C28" opacity="0.9"/>
  <!-- 上沿旧铁受光亮边与下沿冷轮廓光（严格在 x=16..240 直线段） -->
  <line x1="16" y1="4.6" x2="240" y2="4.6" stroke="#948F86" stroke-width="1.6"/>
  <line x1="16" y1="6.4" x2="240" y2="6.4" stroke="#6E6A63" stroke-width="1.2"/>
  <line x1="16" y1="43.5" x2="240" y2="43.5" stroke="#8CAAB5" stroke-width="1.2" opacity="0.72"/>

  <!-- 中间离四边各 8 的深暗空槽（x:8..248, y:8..40，宽 240 高 32，代码往里填 hpFill 和字） -->
  <rect x="8" y="8" width="240" height="32" rx="3" fill="#0D111C" stroke="#1C1412" stroke-width="2.2"/>
  <!-- 槽内顶部下陷暗影与底部旧铜内衬边线 -->
  <rect x="9.2" y="9.2" width="237.6" height="5.2" fill="#161221" opacity="0.92"/>
  <line x1="16" y1="38.8" x2="240" y2="38.8" stroke="#6E542B" stroke-width="1.1" opacity="0.78"/>

  <!-- 四角旧铜包角（严格在四角 16×16 区域内：x<=15.5 或 x>=240.5，y<=15.5 或 y>=32.5，左上主光、右下暗面） -->
  <!-- 左上角 (0..16, 0..16) -->
  <g>
    <path d="M2,7 C2,4.2 4.2,2 7,2 H15.2 L13.2,7.2 H7.2 V13.2 L2,15.2 Z" fill="#9A7B46" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M3.2,13.5 V7 C3.2,4.8 4.8,3.2 7,3.2 H13.5" fill="none" stroke="#DDCB9A" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M12.5,5.5 C13.5,5.5 14.2,6.2 14,7.2" fill="none" stroke="#7A4A2E" stroke-width="1.2" opacity="0.55"/>
    <circle cx="5.8" cy="5.8" r="1.8" fill="#1C1412"/><circle cx="5.5" cy="5.5" r="1.2" fill="#C2A670"/><circle cx="5.1" cy="5.1" r="0.5" fill="#DDCB9A"/>
  </g>
  <!-- 右上角 (240..256, 0..16) -->
  <g>
    <path d="M254,7 C254,4.2 251.8,2 249,2 H240.8 L242.8,7.2 H248.8 V13.2 L254,15.2 Z" fill="#9A7B46" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M242,3.2 H249 C251,3.2 252.5,4.5 252.8,6.5" fill="none" stroke="#C2A670" stroke-width="1" stroke-linecap="round"/>
    <path d="M249.2,7.2 H253.2 V14.2 L249.2,12.5 Z" fill="#6E542B" opacity="0.8"/>
    <circle cx="250.4" cy="5.8" r="1.8" fill="#1C1412"/><circle cx="250.2" cy="5.5" r="1.2" fill="#9A7B46"/><circle cx="249.8" cy="5.1" r="0.5" fill="#DDCB9A"/>
  </g>
  <!-- 左下角 (0..16, 32..48) -->
  <g>
    <path d="M2,41 C2,43.8 4.2,46 7,46 H15.2 L13.2,40.8 H7.2 V34.8 L2,32.8 Z" fill="#6E542B" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M3.2,34.5 V41 C3.2,42.5 4,43.8 5.2,44.4" fill="none" stroke="#C2A670" stroke-width="1" stroke-linecap="round"/>
    <path d="M7.2,41.2 H13.8 L14.8,45.2 H7 C4.8,45.2 3.5,44 3.2,42 Z" fill="#3B2B14" opacity="0.75"/>
    <circle cx="5.8" cy="42.4" r="1.8" fill="#1C1412"/><circle cx="5.5" cy="42.2" r="1.2" fill="#9A7B46"/><circle cx="5.1" cy="41.8" r="0.5" fill="#C2A670"/>
  </g>
  <!-- 右下角 (240..256, 32..48) -->
  <g>
    <path d="M254,41 C254,43.8 251.8,46 249,46 H240.8 L242.8,40.8 H248.8 V34.8 L254,32.8 Z" fill="#6E542B" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M242,45.2 H249 C251.5,45.2 253.2,43.5 253.2,41 V34" fill="#3B2B14" opacity="0.82"/>
    <path d="M243.5,43.8 C246,44.2 248.5,43.5 250.5,41.5" fill="none" stroke="#5F8272" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
    <circle cx="250.4" cy="42.4" r="1.8" fill="#1C1412"/><circle cx="250.2" cy="42.2" r="1.2" fill="#6E542B"/><circle cx="249.8" cy="41.8" r="0.5" fill="#C2A670"/>
  </g>

  <!-- 待机独立材质光泽层（不改变九宫格几何与切线） -->
  <line id="sheen" opacity="0" x1="16" y1="4.6" x2="240" y2="4.6" stroke="url(#ui_hp_frame-sheen-grad)" stroke-width="2"/>
</g>
</svg>
