<svg xmlns="http://www.w3.org/2000/svg" class="svg-fx_hit" viewBox="0 0 160 160" width="160" height="160" style="color:#E6DEC8">
<title>特效 · 打中</title>
<style>
.svg-fx_hit g { transform-box: view-box; }
.svg-fx_hit #burst { transform-origin: 80px 80px; opacity: 0; }
.svg-fx_hit #core { transform-origin: 80px 80px; }
.svg-fx_hit #ring { transform-origin: 80px 80px; }
.svg-fx_hit .s1 { transform-origin: 80px 44px; }
.svg-fx_hit .s2 { transform-origin: 112px 52px; }
.svg-fx_hit .s3 { transform-origin: 118px 84px; }
.svg-fx_hit .s4 { transform-origin: 106px 114px; }
.svg-fx_hit .s5 { transform-origin: 76px 118px; }
.svg-fx_hit .s6 { transform-origin: 48px 110px; }
.svg-fx_hit .s7 { transform-origin: 42px 78px; }
.svg-fx_hit .s8 { transform-origin: 52px 48px; }

/* play 400：0 全透明 → 60 炸开到最大，中心最亮 → 150 停住 → 400 碎片飞散，淡出到全透明 */
@keyframes svg-fx_hit-play-1 {
  0% { opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  15% { opacity: 1; animation-timing-function: linear; }
  37.5% { opacity: 1; animation-timing-function: linear; }
  100% { opacity: 0; }
}
.svg-fx_hit[data-anim="play"] #burst { animation: svg-fx_hit-play-1 0.4s both; }

@keyframes svg-fx_hit-play-2 {
  0% { transform: translate(0px,0px) rotate(-18deg) scale(0.25,0.25); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  15% { transform: translate(0px,0px) rotate(0deg) scale(1.06,1.06); opacity: 1; animation-timing-function: linear; }
  37.5% { transform: translate(0px,0px) rotate(4deg) scale(1,1); opacity: 0.92; animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(22deg) scale(0.35,0.35); opacity: 0; }
}
.svg-fx_hit[data-anim="play"] #core { animation: svg-fx_hit-play-2 0.4s both; }

@keyframes svg-fx_hit-play-3 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(0.35,0.35); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  15% { transform: translate(0px,0px) rotate(0deg) scale(0.95,0.95); opacity: 1; animation-timing-function: linear; }
  37.5% { transform: translate(0px,0px) rotate(8deg) scale(1.04,1.04); opacity: 0.9; animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(25deg) scale(1.22,1.22); opacity: 0; }
}
.svg-fx_hit[data-anim="play"] #ring { animation: svg-fx_hit-play-3 0.4s both; }

@keyframes svg-fx_hit-play-4 {
  0% { transform: translate(0px,24px) rotate(-25deg) scale(0.3,0.3); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  15% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: linear; }
  37.5% { transform: translate(0px,-3px) rotate(8deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(-4px,-18px) rotate(48deg) scale(0.45,0.45); }
}
.svg-fx_hit[data-anim="play"] .s1 { animation: svg-fx_hit-play-4 0.4s both; }

@keyframes svg-fx_hit-play-5 {
  0% { transform: translate(-20px,18px) rotate(30deg) scale(0.3,0.3); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  15% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: linear; }
  37.5% { transform: translate(3px,-2px) rotate(-10deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(16px,-14px) rotate(-55deg) scale(0.45,0.45); }
}
.svg-fx_hit[data-anim="play"] .s2 { animation: svg-fx_hit-play-5 0.4s both; }

@keyframes svg-fx_hit-play-6 {
  0% { transform: translate(-24px,-2px) rotate(-20deg) scale(0.3,0.3); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  15% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: linear; }
  37.5% { transform: translate(3px,1px) rotate(12deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(18px,5px) rotate(62deg) scale(0.45,0.45); }
}
.svg-fx_hit[data-anim="play"] .s3 { animation: svg-fx_hit-play-6 0.4s both; }

@keyframes svg-fx_hit-play-7 {
  0% { transform: translate(-18px,-20px) rotate(25deg) scale(0.3,0.3); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  15% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: linear; }
  37.5% { transform: translate(2px,3px) rotate(-8deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(14px,16px) rotate(-48deg) scale(0.45,0.45); }
}
.svg-fx_hit[data-anim="play"] .s4 { animation: svg-fx_hit-play-7 0.4s both; }

@keyframes svg-fx_hit-play-8 {
  0% { transform: translate(2px,-24px) rotate(-30deg) scale(0.3,0.3); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  15% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: linear; }
  37.5% { transform: translate(-1px,3px) rotate(10deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(-5px,18px) rotate(56deg) scale(0.45,0.45); }
}
.svg-fx_hit[data-anim="play"] .s5 { animation: svg-fx_hit-play-8 0.4s both; }

@keyframes svg-fx_hit-play-9 {
  0% { transform: translate(20px,-18px) rotate(22deg) scale(0.3,0.3); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  15% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: linear; }
  37.5% { transform: translate(-3px,2px) rotate(-12deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(-16px,14px) rotate(-60deg) scale(0.45,0.45); }
}
.svg-fx_hit[data-anim="play"] .s6 { animation: svg-fx_hit-play-9 0.4s both; }

@keyframes svg-fx_hit-play-10 {
  0% { transform: translate(24px,2px) rotate(-28deg) scale(0.3,0.3); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  15% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: linear; }
  37.5% { transform: translate(-3px,-1px) rotate(9deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(-18px,-4px) rotate(52deg) scale(0.45,0.45); }
}
.svg-fx_hit[data-anim="play"] .s7 { animation: svg-fx_hit-play-10 0.4s both; }

@keyframes svg-fx_hit-play-11 {
  0% { transform: translate(18px,20px) rotate(20deg) scale(0.3,0.3); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  15% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: linear; }
  37.5% { transform: translate(-2px,-3px) rotate(-11deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(-14px,-16px) rotate(-54deg) scale(0.45,0.45); }
}
.svg-fx_hit[data-anim="play"] .s8 { animation: svg-fx_hit-play-11 0.4s both; }
</style>

<g id="root">
  <!-- 第 0 帧与末帧全透明；play 时中心白亮冲击 + 八簇带刻面的宝石碎片与亮片炸开旋转 -->
  <g id="burst">
    <!-- 外围染色冲击环与放射锐光 -->
    <g id="ring">
      <circle cx="80" cy="80" r="42" fill="none" stroke="currentColor" stroke-width="3.2" stroke-dasharray="14 8 6 8" stroke-linecap="round"/>
      <circle cx="80" cy="80" r="32" fill="none" stroke="#F4F1FF" stroke-width="1.6" stroke-dasharray="8 11" opacity="0.85"/>
      <!-- 四颗随冲击扩散的四角星芒 -->
      <path d="M80,22 Q81.4,28.6 88,30 Q81.4,31.4 80,38 Q78.6,31.4 72,30 Q78.6,28.6 80,22 Z M136,80 Q130.6,81.4 129,88 Q127.6,81.4 122,80 Q127.6,78.6 129,72 Q130.6,78.6 136,80 Z M80,138 Q78.6,131.4 72,130 Q78.6,128.6 80,122 Q81.4,128.6 88,130 Q81.4,131.4 80,138 Z M24,80 Q29.4,78.6 31,72 Q32.4,78.6 38,80 Q32.4,81.4 31,88 Q29.4,81.4 24,80 Z" fill="#F4F1FF"/>
    </g>

    <!-- 八簇带切面的宝石碎片（currentColor 主色 + 固定白亮刻面与暗刻面压在上面） -->
    <!-- 簇 1：上方大碎片 + 晶屑 -->
    <g class="s1">
      <polygon points="80,28 89,44 80,54 71,44" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="3.6" stroke-linejoin="round"/>
      <polygon points="80,28 89,44 80,54 71,44" fill="currentColor"/>
      <polygon points="80,28 80,43 71,44" fill="#F4F1FF" opacity="0.58"/>
      <polygon points="80,28 89,44 80,43" fill="#1C1412" opacity="0.18"/>
      <polygon points="80,43 89,44 80,54" fill="#1C1412" opacity="0.38"/>
      <polygon points="64,34 69,38 65,43 61,39" fill="#F4F1FF" stroke="#1C1412" stroke-width="1.4" stroke-linejoin="round"/>
    </g>

    <!-- 簇 2：右上切角方碎片 + 亮片 -->
    <g class="s2">
      <polygon points="122,38 126,52 112,60 102,52 108,40" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="3.6" stroke-linejoin="round"/>
      <polygon points="122,38 126,52 112,60 102,52 108,40" fill="currentColor"/>
      <polygon points="122,38 114,49 102,52 108,40" fill="#F4F1FF" opacity="0.55"/>
      <polygon points="122,38 126,52 112,60 114,49" fill="#1C1412" opacity="0.35"/>
      <polygon points="98,32 103,36 99,41 95,36" fill="currentColor" stroke="#1C1412" stroke-width="1.4" stroke-linejoin="round"/>
    </g>

    <!-- 簇 3：右侧锋利三角碎片 -->
    <g class="s3">
      <polygon points="134,82 115,93 106,84 115,74" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="3.6" stroke-linejoin="round"/>
      <polygon points="134,82 115,93 106,84 115,74" fill="currentColor"/>
      <polygon points="134,82 116,83 106,84 115,74" fill="#F4F1FF" opacity="0.55"/>
      <polygon points="134,82 115,93 106,84 116,83" fill="#1C1412" opacity="0.38"/>
      <polygon points="126,66 131,70 126,74 122,70" fill="#F4F1FF" stroke="#1C1412" stroke-width="1.4" stroke-linejoin="round"/>
    </g>

    <!-- 簇 4：右下多刻面碎片 -->
    <g class="s4">
      <polygon points="118,122 102,120 96,108 108,102 120,109" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="3.6" stroke-linejoin="round"/>
      <polygon points="118,122 102,120 96,108 108,102 120,109" fill="currentColor"/>
      <polygon points="96,108 108,102 109,112" fill="#F4F1FF" opacity="0.58"/>
      <polygon points="118,122 102,120 96,108 109,112 120,109" fill="#1C1412" opacity="0.36"/>
      <polygon points="124,98 128,103 123,106 119,101" fill="currentColor" stroke="#1C1412" stroke-width="1.4" stroke-linejoin="round"/>
    </g>

    <!-- 簇 5：下方尖锥碎片 -->
    <g class="s5">
      <polygon points="76,134 67,115 76,106 86,116" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="3.6" stroke-linejoin="round"/>
      <polygon points="76,134 67,115 76,106 86,116" fill="currentColor"/>
      <polygon points="76,134 67,115 76,106 76,118" fill="#F4F1FF" opacity="0.52"/>
      <polygon points="76,134 76,118 76,106 86,116" fill="#1C1412" opacity="0.38"/>
      <polygon points="92,124 96,129 90,132 87,127" fill="#F4F1FF" stroke="#1C1412" stroke-width="1.4" stroke-linejoin="round"/>
    </g>

    <!-- 簇 6：左下宝石块碎片 -->
    <g class="s6">
      <polygon points="38,120 42,104 56,100 60,112 50,122" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="3.6" stroke-linejoin="round"/>
      <polygon points="38,120 42,104 56,100 60,112 50,122" fill="currentColor"/>
      <polygon points="38,120 42,104 56,100 49,111" fill="#F4F1FF" opacity="0.58"/>
      <polygon points="38,120 49,111 56,100 60,112 50,122" fill="#1C1412" opacity="0.35"/>
      <polygon points="58,124 63,128 59,132 54,128" fill="currentColor" stroke="#1C1412" stroke-width="1.4" stroke-linejoin="round"/>
    </g>

    <!-- 簇 7：左侧菱形刻面碎片 -->
    <g class="s7">
      <polygon points="26,78 44,68 54,78 44,88" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="3.6" stroke-linejoin="round"/>
      <polygon points="26,78 44,68 54,78 44,88" fill="currentColor"/>
      <polygon points="26,78 44,68 54,78 43,78" fill="#F4F1FF" opacity="0.6"/>
      <polygon points="26,78 43,78 54,78 44,88" fill="#1C1412" opacity="0.36"/>
      <polygon points="32,94 37,97 34,102 29,98" fill="#F4F1FF" stroke="#1C1412" stroke-width="1.4" stroke-linejoin="round"/>
    </g>

    <!-- 簇 8：左上多面体碎片 -->
    <g class="s8">
      <polygon points="38,38 56,40 62,52 50,58 40,50" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="3.6" stroke-linejoin="round"/>
      <polygon points="38,38 56,40 62,52 50,58 40,50" fill="currentColor"/>
      <polygon points="38,38 56,40 50,49 40,50" fill="#F4F1FF" opacity="0.62"/>
      <polygon points="56,40 62,52 50,58 40,50 50,49" fill="#1C1412" opacity="0.32"/>
      <polygon points="32,58 37,61 34,66 29,62" fill="currentColor" stroke="#1C1412" stroke-width="1.4" stroke-linejoin="round"/>
    </g>

    <!-- 中心白亮冲击核 core -->
    <g id="core">
      <!-- 染色芒星外衬 -->
      <path d="M80,38 L88,64 L114,52 L96,74 L122,80 L96,86 L114,108 L88,96 L80,122 L72,96 L46,108 L64,86 L38,80 L64,74 L46,52 L72,64 Z" fill="currentColor" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
      <!-- 中心白亮冲击核 -->
      <path d="M80,48 L86,69 L106,62 L92,77 L112,80 L92,83 L106,98 L86,91 L80,112 L74,91 L54,98 L68,83 L48,80 L68,77 L54,62 L74,69 Z" fill="#F4F1FF" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </g>
</g>
</svg>
