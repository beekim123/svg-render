<svg xmlns="http://www.w3.org/2000/svg" class="svg-relic_biggem" viewBox="0 0 192 192" width="192" height="192">
<title>大宝石</title>
<style>
.svg-relic_biggem g { transform-box: view-box; }
.svg-relic_biggem #root { transform-origin: 96px 96px; }
.svg-relic_biggem #great_white_gem { transform-origin: 96px 92px; }
.svg-relic_biggem #front_gold_claws { transform-origin: 96px 92px; }
.svg-relic_biggem #gem_glint { transform-origin: 96px 92px; opacity: 0; }

/* idle 3000ms: 0 -> 1500 (50%) -> 3000 (100%) */
@keyframes svg-relic_biggem-idle-gem {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,-1.8px) rotate(0deg) scale(1.012,1.012); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-relic_biggem-idle-claws {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,-1.8px) rotate(0deg) scale(1.012,1.012); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-relic_biggem-idle-glint {
  0% { transform: translate(0px,0px) rotate(0deg) scale(0.75,0.75); opacity: 0; animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,0px) rotate(0deg) scale(1.05,1.05); opacity: 0.95; animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(0.75,0.75); opacity: 0; }
}
.svg-relic_biggem:not([data-anim]) #great_white_gem,
.svg-relic_biggem[data-anim="idle"] #great_white_gem {
  animation: svg-relic_biggem-idle-gem 3s infinite;
}
.svg-relic_biggem:not([data-anim]) #front_gold_claws,
.svg-relic_biggem[data-anim="idle"] #front_gold_claws {
  animation: svg-relic_biggem-idle-claws 3s infinite;
}
.svg-relic_biggem:not([data-anim]) #gem_glint,
.svg-relic_biggem[data-anim="idle"] #gem_glint {
  animation: svg-relic_biggem-idle-glint 3s infinite;
}
</style>
<defs>
  <clipPath id="relic_biggem-cgem">
    <path d="M96,22 C116,24 134,32 148,46 C160,60 166,76 166,94 C166,112 158,130 144,144 C130,156 114,162 96,162 C78,162 62,156 48,144 C34,130 26,112 26,94 C26,76 32,60 44,46 C58,32 76,24 96,22 Z"/>
