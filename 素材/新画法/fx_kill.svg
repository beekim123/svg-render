<svg xmlns="http://www.w3.org/2000/svg" class="svg-fx_kill" viewBox="0 0 320 320" width="320" height="320">
<title>特效 · 血打空</title>
<style>
.svg-fx_kill g { transform-box: view-box; }
.svg-fx_kill #crack_ring,
.svg-fx_kill #shards_inner,
.svg-fx_kill #shards_outer {
  opacity: 0;
  transform-origin: 160px 160px;
}

/* play 900ms：0(0%) 全透明 → 100(11.11%) 裂纹与碎片猛炸显形 → 250(27.78%) 峰值保持 → 550(61.11%) 扩散衰减 → 900(100%) 全透明 */
@keyframes svg-fx_kill-play-cracks {
  0% { transform: translate(0px,0px) rotate(-8deg) scale(0.32,0.32); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  11.11% { transform: translate(0px,0px) rotate(-1deg) scale(0.96,0.96); opacity: 1; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  27.78% { transform: translate(0px,0px) rotate(1deg) scale(1.03,1.03); opacity: 1; animation-timing-function: ease-in-out; }
  61.11% { transform: translate(0px,0px) rotate(3deg) scale(1.08,1.08); opacity: 0.65; animation-timing-function: linear; }
  100% { transform: translate(0px,0px) rotate(5deg) scale(1.11,1.11); opacity: 0; }
}
.svg-fx_kill[data-anim="play"] #crack_ring { animation: svg-fx_kill-play-cracks 0.9s both; }

@keyframes svg-fx_kill-play-inner {
  0% { transform: translate(0px,0px) rotate(-12deg) scale(0.35,0.35); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  11.11% { transform: translate(0px,0px) rotate(2deg) scale(0.94,0.94); opacity: 1; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  27.78% { transform: translate(0px,0px) rotate(7deg) scale(1.02,1.02); opacity: 1; animation-timing-function: ease-in-out; }
  61.11% { transform: translate(0px,0px) rotate(14deg) scale(1.12,1.12); opacity: 0.78; animation-timing-function: linear; }
  100% { transform: translate(0px,0px) rotate(20deg) scale(1.16,1.16); opacity: 0; }
}
.svg-fx_kill[data-anim="play"] #shards_inner { animation: svg-fx_kill-play-inner 0.9s both; }

@keyframes svg-fx_kill-play-outer {
  0% { transform: translate(0px,0px) rotate(10deg) scale(0.38,0.38); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  11.11% { transform: translate(0px,0px) rotate(-2deg) scale(0.9,0.9); opacity: 0.95; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  27.78% { transform: translate(0px,0px) rotate(-6deg) scale(1,1); opacity: 1; animation-timing-function: ease-in-out; }
  61.11% { transform: translate(0px,0px) rotate(-13deg) scale(1.1,1.1); opacity: 0.74; animation-timing-function: linear; }
  100% { transform: translate(0px,0px) rotate(-18deg) scale(1.14,1.14); opacity: 0; }
}
.svg-fx_kill[data-anim="play"] #shards_outer { animation: svg-fx_kill-play-outer 0.9s both; }
</style>
<g id="root">
  <!-- 1. 炸开的哥特锯齿裂纹环与击穿星芒 (#crack_ring，半径 r 不超过 122，放大 1.11 后严格在 320×320 内) -->
  <g id="crack_ring">
    <!-- 中央击穿深暗裂口芒 -->
    <polygon points="160,52 178,120 244,84 198,142 268,160 198,178 244,236 178,200 160,268 142,200 76,236 122,178 52,160 122,142 76,84 142,120" transform="translate(.6 .8)" fill="#1C1412" stroke="#1C1412" stroke-width="4.4" stroke-linejoin="round"/>
    <polygon points="160,52 178,120 244,84 198,142 268,160 198,178 244,236 178,200 160,268 142,200 76,236 122,178 52,160 122,142 76,84 142,120" fill="#161221" stroke="#E2D6BA" stroke-width="2" stroke-linejoin="round"/>
    <!-- 一圈折角崩裂石纹环（由收尖折线段组成，非平滑圆） -->
    <polygon points="160,42 204,60 246,52 254,100 278,160 252,212 240,260 196,256 160,278 118,254 74,258 66,208 42,160 68,108 78,58 122,62" fill="none" stroke="#1C1412" stroke-width="4.2" stroke-linejoin="round"/>
    <polygon points="160,46 202,64 242,56 250,102 274,160 248,210 236,256 194,252 160,274 120,250 78,254 70,206 46,160 72,110 82,62 124,66" fill="none" stroke="#E6DEC8" stroke-width="1.8" stroke-dasharray="16 9" stroke-linejoin="round"/>
  </g>

  <!-- 2. 内圈三色刻面宝石碎片 (#shards_inner：红圆/八角、绿切角方、蓝三角，严格照指南 §5.7 分五档刻面 + 高光棱) -->
  <g id="shards_inner">
    <!-- 红宝石碎片 1 (右上偏中，圆形/八角切工残块) -->
    <g>
      <polygon points="146,72 166,66 176,82 162,96 142,88" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="3.6" stroke-linejoin="round"/>
      <polygon points="146,72 166,66 176,82 162,96 142,88" fill="#E3263A"/>
      <polygon points="146,72 166,66 160,81 142,88" fill="#F4566A"/>
      <polygon points="166,66 176,82 162,96 160,81" fill="#A8172A"/>
      <polyline points="146,72 160,81 166,66" fill="none" stroke="#FFA3AB" stroke-width="0.9"/>
      <circle cx="153" cy="74" r="1.8" fill="#F4F1FF"/>
    </g>
    <!-- 红宝石碎片 2 (左下圆弧刻面块) -->
    <g>
      <polygon points="92,194 110,188 118,204 104,216 88,208" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="3.6" stroke-linejoin="round"/>
      <polygon points="92,194 110,188 118,204 104,216 88,208" fill="#E3263A"/>
      <polygon points="92,194 110,188 103,202 88,208" fill="#F4566A"/>
      <polygon points="110,188 118,204 104,216 103,202" fill="#6B0E1C"/>
      <circle cx="98" cy="196" r="1.8" fill="#F4F1FF"/>
    </g>
    <!-- 红宝石碎片 3 (右下圆形宝石块) -->
    <g>
      <circle cx="212.5" cy="196.7" r="12" fill="#1C1412"/>
      <circle cx="212" cy="196" r="10" fill="#E3263A"/>
      <path d="M204,191 A9,9 0 0,1 218,188 L212,196 Z" fill="#F4566A"/>
      <path d="M220,191 A9,9 0 0,1 206,203 L212,196 Z" fill="#A8172A"/>
      <circle cx="208" cy="192" r="2" fill="#F4F1FF"/>
    </g>

    <!-- 绿宝石碎片 1 (右上切角方形) -->
    <g transform="rotate(22 216 114)">
      <polygon points="205,101 225,101 229,105 229,125 225,129 205,129 201,125 201,105" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="3.6" stroke-linejoin="round"/>
      <polygon points="205,101 225,101 229,105 229,125 225,129 205,129 201,125 201,105" fill="#1DBF5E"/>
      <polygon points="205,101 225,101 220,110 208,120 201,125 201,105" fill="#4FDB85"/>
      <polygon points="229,105 229,125 225,129 205,129 210,120 222,110" fill="#0A5A2B"/>
      <rect x="209" y="109" width="12" height="12" fill="#1DBF5E" stroke="#A6F5C6" stroke-width="0.8"/>
      <circle cx="208" cy="107" r="1.8" fill="#F4F1FF"/>
    </g>
    <!-- 绿宝石碎片 2 (左上切角方形) -->
    <g transform="rotate(-18 92 124)">
      <polygon points="82,112 100,112 104,116 104,134 100,138 82,138 78,134 78,116" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="3.4" stroke-linejoin="round"/>
      <polygon points="82,112 100,112 104,116 104,134 100,138 82,138 78,134 78,116" fill="#1DBF5E"/>
      <polygon points="82,112 100,112 94,122 78,134 78,116" fill="#4FDB85"/>
      <polygon points="104,116 104,134 100,138 82,138 94,122" fill="#128A43"/>
      <circle cx="85" cy="118" r="1.8" fill="#F4F1FF"/>
    </g>
    <!-- 绿宝石碎片 3 (正下切角方) -->
    <g transform="rotate(8 159 225)">
      <rect x="149" y="215" width="20" height="20" rx="2" fill="#1C1412" stroke="#1C1412" stroke-width="3.2"/>
      <rect x="149" y="215" width="20" height="20" rx="2" fill="#128A43"/>
      <polygon points="149,215 169,215 159,225 149,235" fill="#4FDB85"/>
      <circle cx="154" cy="220" r="1.6" fill="#F4F1FF"/>
    </g>

    <!-- 蓝宝石碎片 1 (左上三角形) -->
    <g>
      <polygon points="118,74 136,102 102,98" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="3.6" stroke-linejoin="round"/>
      <polygon points="118,74 136,102 102,98" fill="#2E66F0"/>
      <polygon points="118,74 121,92 102,98" fill="#6A93F8"/>
      <polygon points="118,74 136,102 121,92" fill="#1D45B8"/>
      <polyline points="102,98 121,92 136,102" fill="none" stroke="#B4C8FF" stroke-width="0.9"/>
      <circle cx="116" cy="83" r="1.8" fill="#F4F1FF"/>
    </g>
    <!-- 蓝宝石碎片 2 (右侧三角形) -->
    <g>
      <polygon points="236,150 254,178 220,176" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="3.6" stroke-linejoin="round"/>
      <polygon points="236,150 254,178 220,176" fill="#2E66F0"/>
      <polygon points="236,150 238,169 220,176" fill="#6A93F8"/>
      <polygon points="236,150 254,178 238,169" fill="#122A78"/>
      <circle cx="234" cy="159" r="1.8" fill="#F4F1FF"/>
    </g>
    <!-- 蓝宝石碎片 3 (右下三角形) -->
    <g>
      <polygon points="186,216 204,242 172,240" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="3.4" stroke-linejoin="round"/>
      <polygon points="186,216 204,242 172,240" fill="#1D45B8"/>
      <polygon points="186,216 189,233 172,240" fill="#6A93F8"/>
      <circle cx="184" cy="225" r="1.6" fill="#F4F1FF"/>
    </g>
  </g>

  <!-- 3. 外圈飞散三色宝石小碎晶与白亮尖星 (#shards_outer，控制在 52..268 内，放大 1.14 后严格在 320×320 内) -->
  <g id="shards_outer">
    <!-- 红圆碎晶 -->
    <circle cx="74" cy="84" r="8.5" fill="#1C1412"/><circle cx="74" cy="84" r="6.8" fill="#E3263A"/><path d="M69,80 A6,6 0 0,1 78,79 L74,84 Z" fill="#FFA3AB"/>
    <circle cx="248" cy="94" r="8" fill="#1C1412"/><circle cx="248" cy="94" r="6.4" fill="#E3263A"/><path d="M243,90 A5.5,5.5 0 0,1 252,89 L248,94 Z" fill="#F4566A"/>
    <circle cx="122" cy="252" r="7.8" fill="#1C1412"/><circle cx="122" cy="252" r="6.2" fill="#A8172A"/><circle cx="120" cy="250" r="2.5" fill="#F4566A"/>

    <!-- 绿方碎晶 -->
    <g transform="rotate(30 195 62)">
      <rect x="187" y="54" width="16" height="16" rx="2" fill="#1C1412"/>
      <rect x="189" y="56" width="12" height="12" rx="1.5" fill="#1DBF5E"/>
      <polygon points="189,56 201,56 189,68" fill="#4FDB85"/>
    </g>
    <g transform="rotate(-24 62 164)">
      <rect x="54" y="156" width="16" height="16" rx="2" fill="#1C1412"/>
      <rect x="56" y="158" width="12" height="12" rx="1.5" fill="#1DBF5E"/>
      <polygon points="56,158 68,158 56,170" fill="#A6F5C6"/>
    </g>
    <g transform="rotate(15 241 225)">
      <rect x="233" y="217" width="16" height="16" rx="2" fill="#1C1412"/>
      <rect x="235" y="219" width="12" height="12" rx="1.5" fill="#128A43"/>
      <polygon points="235,219 247,219 235,231" fill="#4FDB85"/>
    </g>

    <!-- 蓝三角碎晶 -->
    <polygon points="84,230 100,252 72,250" fill="#1C1412" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="84,232 97,250 75,248" fill="#2E66F0"/>
    <polygon points="84,232 86,246 75,248" fill="#B4C8FF"/>

    <polygon points="260,142 272,162 248,160" fill="#1C1412" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="260,144 269,160 251,158" fill="#2E66F0"/>
    <polygon points="260,144 261,156 251,158" fill="#6A93F8"/>

    <polygon points="134,50 148,68 124,66" fill="#1C1412" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="134,52 145,66 127,64" fill="#6A93F8"/>

    <!-- 四颗白亮尖星 -->
    <path d="M160,54 L163,62 L171,65 L163,68 L160,76 L157,68 L149,65 L157,62 Z M62,118 L64.5,125 L71.5,127.5 L64.5,130 L62,137 L59.5,130 L52.5,127.5 L59.5,125 Z M258,194 L260.5,201 L267.5,203.5 L260.5,206 L258,213 L255.5,206 L248.5,203.5 L255.5,201 Z" fill="#F4F1FF" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
</g>
</svg>
