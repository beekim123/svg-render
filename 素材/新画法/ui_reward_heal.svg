<svg xmlns="http://www.w3.org/2000/svg" class="svg-ui_reward_heal" viewBox="0 0 64 64" width="64" height="64">
<title>奖励图标 · 回一颗心</title>
<style>
.svg-ui_reward_heal g { transform-box: view-box; }
.svg-ui_reward_heal #heart_pendant { transform-origin: 28px 34px; }
.svg-ui_reward_heal #plus_badge { transform-origin: 49px 17px; }
@keyframes svg-ui_reward_heal-idle-h {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,-1.2px) rotate(-1.5deg) scale(1.03,1.03); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-ui_reward_heal-idle-p {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,-1.4px) rotate(0deg) scale(1.06,1.06); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-ui_reward_heal:not([data-anim]) #heart_pendant,
.svg-ui_reward_heal[data-anim="idle"] #heart_pendant { animation: svg-ui_reward_heal-idle-h 3s infinite; }
.svg-ui_reward_heal:not([data-anim]) #plus_badge,
.svg-ui_reward_heal[data-anim="idle"] #plus_badge { animation: svg-ui_reward_heal-idle-p 3s infinite; }
</style>
<defs>
  <clipPath id="ui_reward_heal-cframe">
    <path d="M28,19.5 C21,13 7,16 6.5,29 C6,40 17,49 28,57.5 C39,49 50,40 49.5,29 C49,16 35,13 28,19.5 Z"/>
  </clipPath>
  <clipPath id="ui_reward_heal-cruby">
    <path d="M28,24 C22.5,18.5 11.5,21 11.2,30.5 C11,39 19.5,46 28,52.5 C36.5,46 45,39 44.8,30.5 C44.5,21 33.5,18.5 28,24 Z"/>
  </clipPath>
</defs>
<g id="root">
  <!-- 心形挂坠（照 ui_heart.svg 简化，红宝石是全图唯一鲜艳处） -->
  <g id="heart_pendant">
    <!-- 顶部旧铜吊环 -->
    <path d="M22.5,12 A5.5,4.8 0 1,1 33.5,12 A5.5,4.8 0 1,1 22.5,12 Z M25.5,12 A2.5,2 0 1,0 30.5,12 A2.5,2 0 1,0 25.5,12 Z" transform="translate(.5 .7)" fill="#1C1412" fill-rule="evenodd" stroke="#1C1412" stroke-width="4.4"/>
    <path d="M22.5,12 A5.5,4.8 0 1,1 33.5,12 A5.5,4.8 0 1,1 22.5,12 Z M25.5,12 A2.5,2 0 1,0 30.5,12 A2.5,2 0 1,0 25.5,12 Z" fill="#9A7B46" fill-rule="evenodd"/>
    <path d="M24.5,9.2 A4,3.2 0 0,1 29.5,8.6" fill="none" stroke="#DDCB9A" stroke-width="1.3" stroke-linecap="round"/>

    <!-- 旧铜心形外托（七层画法） -->
    <path d="M28,19.5 C21,13 7,16 6.5,29 C6,40 17,49 28,57.5 C39,49 50,40 49.5,29 C49,16 35,13 28,19.5 Z" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5.4" stroke-linejoin="round"/>
    <path d="M28,19.5 C21,13 7,16 6.5,29 C6,40 17,49 28,57.5 C39,49 50,40 49.5,29 C49,16 35,13 28,19.5 Z" fill="#6E542B"/>
    <g clip-path="url(#ui_reward_heal-cframe)">
      <path d="M28,19.5 C21,13 7,16 6.5,29 C6,40 17,49 28,57.5 C39,49 50,40 49.5,29 C49,16 35,13 28,19.5 Z" transform="translate(-2.8 -2.2)" fill="#9A7B46"/>
      <path d="M34,14 H51 V58 H28 C36,48 38,30 34,14 Z" fill="#3B2B14" opacity=".72"/>
      <path d="M8.5,29 C8.5,19 18,16 25,20 C18,18.5 11,21.5 10,29.5 Z" fill="#C2A670"/>
      <path d="M47.8,32 C46.5,41 38,48.5 29.5,55.5 C37,48 44.5,40.5 46.2,32 Z" fill="#8CAAB5" opacity=".82"/>
    </g>

    <!-- 鲜艳心形红宝石（全图唯一鲜艳处，多刻面无墨线） -->
    <path d="M28,24 C22.5,18.5 11.5,21 11.2,30.5 C11,39 19.5,46 28,52.5 C36.5,46 45,39 44.8,30.5 C44.5,21 33.5,18.5 28,24 Z" fill="#A8172A" stroke="#1C1412" stroke-width="2.6" stroke-linejoin="round"/>
    <g clip-path="url(#ui_reward_heal-cruby)">
      <polygon points="28,24 20,19 11,23 11,33 19,36 28,30" fill="#F4566A"/>
      <polygon points="28,24 36,19 45,23 45,34 36,43 28,30" fill="#6B0E1C"/>
      <polygon points="28,44 37,36 44,36 28,52.5" fill="#E3263A"/>
      <polygon points="28,29 20,25 16.5,31 19.5,38.5 28,45 36.5,38.5 39.5,31 36,25" fill="#E3263A"/>
      <polygon points="28,29 20,25 16.5,31 19.5,37 27,34" fill="#F4566A" opacity=".65"/>
      <path d="M28,29 L20,25 L16.5,31 L19.5,38.5 L28,45 L36.5,38.5 L39.5,31 L36,25 Z M28,24 V29 M16.5,31 H11 M39.5,31 H45 M28,45 V52.5" fill="none" stroke="#FFA3AB" stroke-width="0.75" opacity=".8"/>
      <path d="M13,30.5 C13,23 20,20.5 25.5,23.5 C20,22.5 14.8,24.8 14.2,30.8 Z" fill="#F4F1FF" opacity=".92"/>
    </g>
    <circle cx="19.5" cy="27.5" r="2" fill="#F4F1FF"/>

    <!-- 三颗旧铜包爪 -->
    <rect x="8.5" y="27.5" width="4.5" height="3.6" rx="1.2" fill="#C2A670" stroke="#1C1412" stroke-width="1.8"/>
    <rect x="43" y="27.5" width="4.5" height="3.6" rx="1.2" fill="#6E542B" stroke="#1C1412" stroke-width="1.8"/>
    <polygon points="28,50.5 30.8,53.5 28,56.5 25.2,53.5" fill="#9A7B46" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- 右上角成套小加号（低饱和旧纸色 + 旧铜暗面，不抢红宝石鲜艳度） -->
  <g id="plus_badge">
    <path d="M46,8 H52 V14 H58 V20 H52 V26 H46 V20 H40 V14 H46 Z" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5" stroke-linejoin="round"/>
    <path d="M46,8 H52 V14 H58 V20 H52 V26 H46 V20 H40 V14 H46 Z" fill="#9A8968"/>
    <path d="M46,8 H50.5 V15.5 H58 V18.5 H50.5 V26 H46 V20 H40 V14 H46 Z" fill="#E2D6BA"/>
    <circle cx="47.8" cy="11" r="1.2" fill="#FFFFFF"/>
  </g>
</g>
</svg>
