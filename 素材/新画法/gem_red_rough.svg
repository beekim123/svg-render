<svg xmlns="http://www.w3.org/2000/svg" class="svg-gem_red_rough" viewBox="0 0 100 100" width="100" height="100">
<title>红宝石 · 原石</title>
<style>
.svg-gem_red_rough g { transform-box: view-box; }
.svg-gem_red_rough #crack_glint { transform-origin: 50px 50px; opacity: 0; }

/* 待机 3000ms：0 → 1200 反光开始 → 1400 反光峰值 → 1600 反光消失 → 3000 与0帧一致 */
@keyframes svg-gem_red_rough-idle-1 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; animation-timing-function: linear; }
  40% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; animation-timing-function: ease-in-out; }
  46.67% { transform: translate(0px,0px) rotate(0deg) scale(1.02,1.02); opacity: 1; animation-timing-function: ease-in-out; }
  53.33% { transform: translate(0px,0px) rotate(0deg) scale(0.96,0.96); opacity: 0; animation-timing-function: linear; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; }
}
.svg-gem_red_rough:not([data-anim]) #crack_glint,
.svg-gem_red_rough[data-anim="idle"] #crack_glint { animation: svg-gem_red_rough-idle-1 3s infinite; }
</style>
<defs>
  <clipPath id="gem_red_rough-cstone">
    <path d="M49,12 C62,11.5 74,17 81,27 L78.5,30.5 L83,33 C87.5,42 88.5,54 85,65 C81,76 71,84 58,86.5 L55,83.5 L52,87 C38,87.5 25,82 18,71 C11.5,60 11,45 16.5,33 L20,31.5 L18.5,28 C25,18 36,12.5 49,12 Z"/>
  </clipPath>
  <clipPath id="gem_red_rough-cmain">
    <path d="M36,24 L56,21 L66,35 L58,56 L36,58 L24,42 Z"/>
  </clipPath>
  <clipPath id="gem_red_rough-csub">
    <path d="M56,62 L73,57 L76,70 L61,77 L50,71 Z"/>
  </clipPath>
  <radialGradient id="gem_red_rough-glow" cx="48" cy="48" r="35" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#F4566A" stop-opacity="0.58"/>
    <stop offset="0.65" stop-color="#E3263A" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#6B0E1C" stop-opacity="0"/>
  </radialGradient>
</defs>

<g id="root">
  <!-- 第 1 层：墨色垫底（往右下错开 0.6, 0.9，外轮廓左细右粗） -->
  <path d="M49,12 C62,11.5 74,17 81,27 L78.5,30.5 L83,33 C87.5,42 88.5,54 85,65 C81,76 71,84 58,86.5 L55,83.5 L52,87 C38,87.5 25,82 18,71 C11.5,60 11,45 16.5,33 L20,31.5 L18.5,28 C25,18 36,12.5 49,12 Z" transform="translate(.6 .9)" fill="#1C1412" stroke="#1C1412" stroke-width="6.2" stroke-linejoin="round"/>

  <!-- 第 2 层：铺石皮“暗”一档 -->
  <path d="M49,12 C62,11.5 74,17 81,27 L78.5,30.5 L83,33 C87.5,42 88.5,54 85,65 C81,76 71,84 58,86.5 L55,83.5 L52,87 C38,87.5 25,82 18,71 C11.5,60 11,45 16.5,33 L20,31.5 L18.5,28 C25,18 36,12.5 49,12 Z" fill="#4A4742"/>

  <!-- 第 3、4、5、6 层：裁在石皮轮廓内 -->
  <g clip-path="url(#gem_red_rough-cstone)">
    <!-- 第 3 层：错位亮面（往左上挪 -4.5, -4） -->
    <path d="M49,12 C62,11.5 74,17 81,27 L78.5,30.5 L83,33 C87.5,42 88.5,54 85,65 C81,76 71,84 58,86.5 L55,83.5 L52,87 C38,87.5 25,82 18,71 C11.5,60 11,45 16.5,33 L20,31.5 L18.5,28 C25,18 36,12.5 49,12 Z" transform="translate(-4.5 -4)" fill="#6E6A63"/>
    <!-- 右侧与右下转过去的弧边暗面 -->
    <path d="M68,16 C75,32 74,52 60,66 C46,78 30,82 18,76 L54,88 L86,74 L88,36 Z" fill="#4A4742" opacity="0.88"/>
    <!-- 第 4 层：加深（右下背光处与石皮凹坑） -->
    <path d="M86,52 C85,72 72,84 52,87 L34,85 C58,82 76,72 82,50 Z" fill="#2E2C28" opacity="0.85"/>
    <path d="M20,58 C25,55 32,59 30,65 C28,70 19,68 18,63 Z M71,36 C75,34 80,38 78,44 C76,48 70,46 69,41 Z" fill="#2E2C28" opacity="0.62"/>
    <!-- 第 6 层：石皮旧褐矿斑与颗粒记号 -->
    <path d="M23,66 C27,64 31,67 30,71 C28,74 22,73 21,69 Z M72,26 C75,25 79,28 77,32 C75,34 71,33 70,29 Z M39,77 C44,75 48,78 46,82 C43,84 38,82 39,77 Z" fill="#524531" opacity="0.65"/>
    <circle cx="29" cy="24" r="1.6" fill="#2E2C28" opacity="0.65"/>
    <circle cx="19" cy="48" r="1.5" fill="#2E2C28" opacity="0.6"/>
    <circle cx="80" cy="51" r="1.8" fill="#2E2C28" opacity="0.65"/>
    <circle cx="44" cy="72" r="1.4" fill="#2E2C28" opacity="0.65"/>
    <circle cx="26" cy="28" r="1.1" fill="#948F86" opacity="0.78"/>
    <circle cx="18" cy="54" r="1.2" fill="#948F86" opacity="0.72"/>
    <!-- 第 5 层：左上受光边（#948F86 削尖月牙） -->
    <path d="M14.5,52 Q14,35 24.5,22 Q35,13.5 52,13.5 Q37,15.8 26.8,24.2 Q16.8,36.5 16.5,52.5 Z" fill="#948F86"/>
    <!-- 第 5 层：右下冷色轮廓光（#8CAAB5，断成两截削尖） -->
    <path d="M84.5,44 Q86,56 81.5,67 Q83.8,56 82.6,44.5 Z M76.5,74.5 Q68,82.5 57.5,84.5 Q67.5,80.5 75,73.2 Z" fill="#8CAAB5" opacity="0.82"/>
  </g>

  <!-- 主裂口：先垫一圈最暗石皮凹陷托座，再嵌红宝石原矿 -->
  <path d="M35,21.8 L57.5,18.8 L68.5,34.5 L59.8,58.2 L34.8,60.2 L21.5,42.5 Z" fill="#1C1412"/>
  <path d="M36,24 L56,21 L66,35 L58,56 L36,58 L24,42 Z" fill="#6B0E1C"/>
  <!-- 主裂口里的红宝石刻面（平色多边形，按朝向取色，无内部墨线） -->
  <g clip-path="url(#gem_red_rough-cmain)">
    <polygon points="36,24 56,21 49,33 35,34" fill="#FFA3AB"/>
    <polygon points="24,42 36,24 35,34 33,45" fill="#F4566A"/>
    <polygon points="56,21 66,35 55,41 49,33" fill="#E3263A"/>
    <!-- 中央微倾台面 -->
    <polygon points="35,34 49,33 55,41 48,49 33,45" fill="#E3263A"/>
    <polygon points="35,34 49,33 45,42 33,45" fill="#F4566A" opacity="0.85"/>
    <!-- 右下背光暗刻面与内反光刻面 -->
    <polygon points="55,41 66,35 58,56 48,49" fill="#A8172A"/>
    <polygon points="33,45 48,49 58,56 36,58 24,42" fill="#6B0E1C"/>
    <polygon points="48,49 58,56 44,57" fill="#F4566A" opacity="0.75"/>
    <!-- 刻面之间的细高光色棱线（#FFA3AB，0.65粗） -->
    <path d="M36,24 L35,34 L49,33 L56,21 M35,34 L33,45 L24,42 M49,33 L55,41 L66,35 M33,45 L48,49 L55,41 M48,49 L58,56 M33,45 L36,58" fill="none" stroke="#FFA3AB" stroke-width="0.65" stroke-linejoin="round" opacity="0.68"/>
    <!-- 左上沿白亮边 -->
    <path d="M25.5,41.5 L36.8,25.2 L54.5,22.4 L54,24.4 L38,27 L27.2,42.2 Z" fill="#F4F1FF" opacity="0.9"/>
    <!-- 石皮压在宝石左上沿的薄暗影 -->
    <path d="M36,24 L56,21 L66,35 L63.5,35.8 L55,23.5 L37.2,26.2 L25.8,42.5 L24,42 Z" fill="#1C1412" opacity="0.32"/>
  </g>
  <circle cx="39" cy="31" r="2.2" fill="#F4F1FF"/>
  <circle cx="35.5" cy="35" r="1.0" fill="#F4F1FF" opacity="0.85"/>
  <path d="M36,24 L56,21 L66,35 L58,56 L36,58 L24,42 Z" fill="none" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- 右下副裂口：较小的一簇红宝石原矿 -->
  <path d="M54.8,60.5 L74.5,55.2 L78,71.2 L61.2,79 L48.2,72 Z" fill="#1C1412"/>
  <path d="M56,62 L73,57 L76,70 L61,77 L50,71 Z" fill="#A8172A"/>
  <g clip-path="url(#gem_red_rough-csub)">
    <polygon points="56,62 73,57 65,66 50,71" fill="#F4566A"/>
    <polygon points="73,57 76,70 65,66" fill="#E3263A"/>
    <polygon points="50,71 65,66 76,70 61,77" fill="#6B0E1C"/>
    <polygon points="65,66 74,69 63,75" fill="#F4566A" opacity="0.68"/>
    <path d="M56,62 L65,66 L73,57 M65,66 L50,71 M65,66 L76,70 M65,66 L61,77" fill="none" stroke="#FFA3AB" stroke-width="0.6" opacity="0.62"/>
  </g>
  <circle cx="60" cy="64.5" r="1.4" fill="#F4F1FF"/>
  <path d="M56,62 L73,57 L76,70 L61,77 L50,71 Z" fill="none" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>

  <!-- 第 7 层：石皮裂缝（收尖柳叶线/楔形线，从裂口往外延伸并带分叉） -->
  <path d="M56,21 Q59.5,16.5 61.5,13.5 Q57.8,16.2 54.5,21 Z M66,35 Q74,32.5 81.5,32.5 Q73.8,34.8 65.5,36.5 Z M73.5,33.5 Q76.5,29.5 79,28 Q75.5,31.5 73.5,33.5 Z M24,42 Q18,45.5 13.2,49.5 Q18.8,46.8 24.8,43.5 Z M36,58 Q29.5,64.5 23.5,72.5 Q31,65.8 37.5,58.8 Z M30.5,65 Q26.2,63.2 22.8,63.8 Q26.8,65.2 30.5,65 Z M58,56 Q57.5,59.2 56,62 Q55.8,59 56.5,55.8 Z M50,71 Q45.5,77.5 41.5,84.5 Q47.2,78.5 51.5,71.8 Z M76,70 Q80.5,72.5 83.5,75.5 Q79.2,73.5 75,71.2 Z" fill="#1C1412"/>

  <!-- 裂缝深处静态微弱红矿丝 -->
  <path d="M56,21 Q58.8,17.2 60.5,14.5 M66,35.5 Q73,33.5 79.5,33.2 M36.2,58.2 Q30.5,63.8 25.5,70 M57.2,56.2 L56.2,61.8 M50.2,71.2 L43.5,82" fill="none" stroke="#E3263A" stroke-width="0.9" stroke-linecap="round" opacity="0.55"/>

  <!-- 待机事件层：1200 → 1400 → 1600 石皮裂缝里透出一道暗红光（平时 opacity: 0） -->
  <g id="crack_glint" opacity="0">
    <circle cx="48" cy="48" r="35" fill="url(#gem_red_rough-glow)"/>
    <polygon points="36.5,25 55.2,22.2 64.8,35.2 57.2,55 36.5,56.8 25.2,42" fill="#F4566A" opacity="0.52"/>
    <polygon points="36,33 49,32 54,41 47,48 34,44" fill="#FFA3AB" opacity="0.78"/>
    <polygon points="56.8,62.6 72,58 74.8,69.5 61,75.8 51.2,70.5" fill="#F4566A" opacity="0.62"/>
    <path d="M56,21 Q58.8,17.2 60.8,14.2 M66,35.5 Q73.5,33.5 80.2,33.2 M24,42.5 Q18.5,45.5 14.5,48.8 M36.2,58.2 Q30.2,64.2 24.5,71.2 M57.2,56.2 L56.2,61.8 M50.2,71.2 L42.8,83 M75.8,70.2 L82.2,74.5" fill="none" stroke="#F4566A" stroke-width="2.2" stroke-linecap="round" opacity="0.92"/>
    <path d="M56,21 Q58.8,17.2 60.8,14.2 M66,35.5 Q73.5,33.5 80.2,33.2 M36.2,58.2 Q30.2,64.2 24.5,71.2 M57.2,56.2 L56.2,61.8" fill="none" stroke="#F4F1FF" stroke-width="1.0" stroke-linecap="round" opacity="0.95"/>
    <path d="M44,27 Q45,31.5 49.5,32.5 Q45,33.5 44,38 Q43,33.5 38.5,32.5 Q43,31.5 44,27 Z" fill="#F4F1FF" opacity="0.92"/>
  </g>
</g>
</svg>
