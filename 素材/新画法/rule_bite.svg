<svg xmlns="http://www.w3.org/2000/svg" class="svg-rule_bite" viewBox="0 0 64 64" width="64" height="64">
<title>规矩图标 · 咬手</title>
<style>
.svg-rule_bite g { transform-box: view-box; }
.svg-rule_bite #teeth_top { transform-origin: 32px 10px; }
.svg-rule_bite #teeth_bottom { transform-origin: 32px 54px; }
@keyframes svg-rule_bite-idle-t {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,1.5px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-rule_bite-idle-b {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,-1.5px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-rule_bite:not([data-anim]) #teeth_top,
.svg-rule_bite[data-anim="idle"] #teeth_top { animation: svg-rule_bite-idle-t 3s infinite; }
.svg-rule_bite:not([data-anim]) #teeth_bottom,
.svg-rule_bite[data-anim="idle"] #teeth_bottom { animation: svg-rule_bite-idle-b 3s infinite; }
</style>
<g id="root">
  <!-- 暗紫衬底口腔背板 -->
  <rect x="6" y="6" width="52" height="52" rx="8" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5.2"/>
  <rect x="6" y="6" width="52" height="52" rx="8" fill="#161221"/>
  <path d="M54,14 V50 A6,6 0 0,1 48,56 H16" fill="none" stroke="#62577D" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>

  <!-- 正中被咬住的切角绿方宝石（严格按返修后切角绿方宝石绘制） -->
  <g id="gem_green">
    
      <clipPath id="rule_bite-cgem"><polygon points="20.5,16.0 43.5,16.0 48.0,20.5 48.0,43.5 43.5,48.0 20.5,48.0 16.0,43.5 16.0,20.5"/></clipPath>
      <polygon points="20.5,16.0 43.5,16.0 48.0,20.5 48.0,43.5 43.5,48.0 20.5,48.0 16.0,43.5 16.0,20.5" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5.2" stroke-linejoin="round"/>
      <polygon points="20.5,16.0 43.5,16.0 48.0,20.5 48.0,43.5 43.5,48.0 20.5,48.0 16.0,43.5 16.0,20.5" fill="#128A43"/>
      <g clip-path="url(#rule_bite-cgem)">
        <!-- 左上亮梯形刻面 -->
        <polygon points="16.0,43.5 16.0,20.5 20.5,16.0 43.5,16.0 38.3,23.7 25.7,23.7 23.7,25.7 23.7,38.3" fill="#4FDB85"/>
        <!-- 右下最暗刻面与内反光 -->
        <polygon points="43.5,16.0 48.0,20.5 48.0,43.5 43.5,48.0 20.5,48.0 25.7,40.3 38.3,40.3 40.3,38.3 40.3,25.7" fill="#0A5A2B"/>
        <polygon points="25.7,40.3 38.3,40.3 43.5,48.0 20.5,48.0" fill="#1DBF5E" opacity=".75"/>
        <!-- 中央切角方台面 -->
        <polygon points="25.7,23.7 38.3,23.7 40.3,25.7 40.3,38.3 38.3,40.3 25.7,40.3 23.7,38.3 23.7,25.7" fill="#1DBF5E"/>
        <polygon points="25.7,23.7 38.3,23.7 35.3,32.8 23.7,34.5 23.7,25.7" fill="#4FDB85" opacity=".65"/>
        <!-- 刻面高光色细棱线 -->
        <path d="M25.7,23.7 L20.5,16.0 M38.3,23.7 L43.5,16.0 M40.3,38.3 L48.0,43.5 M23.7,38.3 L16.0,43.5" stroke="#A6F5C6" stroke-width="0.75" opacity=".75"/>
        <polygon points="25.7,23.7 38.3,23.7 40.3,25.7 40.3,38.3 38.3,40.3 25.7,40.3 23.7,38.3 23.7,25.7" fill="none" stroke="#A6F5C6" stroke-width="0.75" opacity=".8"/>
        <!-- 左上白亮边 -->
        <polyline points="17.4,36.8 17.4,21.1 21.1,17.4 37.6,17.4" fill="none" stroke="#F4F1FF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
      </g>
      <circle cx="28.3" cy="28.3" r="2.1" fill="#F4F1FF"/>
    
  </g>

  <!-- 上排三颗尖牙（旧纸骨色七层：左亮右暗、环纹收尖线） -->
  <g id="teeth_top">
    <path d="M9,8 H23 C21,14 18,19 15.5,23 C13,19 10.5,14 9,8 Z M24.5,8 H39.5 C37.5,13.5 34.5,18 32,21.5 C29.5,18 26.5,13.5 24.5,8 Z M41,8 H55 C53.5,14 51,19 48.5,23 C46,19 43,14 41,8 Z" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5" stroke-linejoin="round"/>
    <path d="M9,8 H23 C21,14 18,19 15.5,23 C13,19 10.5,14 9,8 Z M24.5,8 H39.5 C37.5,13.5 34.5,18 32,21.5 C29.5,18 26.5,13.5 24.5,8 Z M41,8 H55 C53.5,14 51,19 48.5,23 C46,19 43,14 41,8 Z" fill="#C8B894"/>
    <path d="M15.5,8 H23 C21,14 18,19 15.5,23 Z M32,8 H39.5 C37.5,13.5 34.5,18 32,21.5 Z M48.5,8 H55 C53.5,14 51,19 48.5,23 Z" fill="#9A8968"/>
    <path d="M10.5,9.5 H15 L14.5,17 Z M26,9.5 H31 L30.5,16.5 Z M42.5,9.5 H47 L46.5,17 Z" fill="#E2D6BA"/>
    <!-- 牙根环纹收尖线 -->
    <path d="M11,12 Q16,14 21,12 Q16,13 11,12 Z M26.5,12 Q32,14 37.5,12 Q32,13 26.5,12 Z" fill="#524531"/>
  </g>

  <!-- 下排三颗尖牙 -->
  <g id="teeth_bottom">
    <path d="M9,56 H23 C21,50 18,45 15.5,41 C13,45 10.5,50 9,56 Z M24.5,56 H39.5 C37.5,50.5 34.5,46 32,42.5 C29.5,46 26.5,50.5 24.5,56 Z M41,56 H55 C53.5,50 51,45 48.5,41 C46,45 43,50 41,56 Z" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5" stroke-linejoin="round"/>
    <path d="M9,56 H23 C21,50 18,45 15.5,41 C13,45 10.5,50 9,56 Z M24.5,56 H39.5 C37.5,50.5 34.5,46 32,42.5 C29.5,46 26.5,50.5 24.5,56 Z M41,56 H55 C53.5,50 51,45 48.5,41 C46,45 43,50 41,56 Z" fill="#C8B894"/>
    <path d="M15.5,56 H23 C21,50 18,45 15.5,41 Z M32,56 H39.5 C37.5,50.5 34.5,46 32,42.5 Z M48.5,56 H55 C53.5,50 51,45 48.5,41 Z" fill="#9A8968"/>
    <path d="M10.5,54.5 H15 L14.5,47 Z M26,54.5 H31 L30.5,47.5 Z M42.5,54.5 H47 L46.5,47 Z" fill="#E2D6BA"/>
  </g>
</g>
</svg>
