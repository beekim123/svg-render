<svg xmlns="http://www.w3.org/2000/svg" class="svg-ui_node_fight" viewBox="0 0 64 64" width="64" height="64">
<title>进度节点 · 普通仗</title>
<style>
.svg-ui_node_fight g { transform-box: view-box; }
.svg-ui_node_fight #root { transform-origin: 32px 32px; }
.svg-ui_node_fight #sword { transform-origin: 32px 32px; }
.svg-ui_node_fight #sheen { opacity: 0; }

/* idle 3000ms: 0 -> 1500 -> 3000 */
@keyframes svg-ui_node_fight-idle-sword {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0.6px,-0.6px) rotate(1.6deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-ui_node_fight-idle-sheen {
  0% { opacity: 0; animation-timing-function: ease-in-out; }
  50% { opacity: 0.85; animation-timing-function: ease-in-out; }
  100% { opacity: 0; }
}
.svg-ui_node_fight:not([data-anim]) #sword,
.svg-ui_node_fight[data-anim="idle"] #sword {
  animation: svg-ui_node_fight-idle-sword 3s infinite;
}
.svg-ui_node_fight:not([data-anim]) #sheen,
.svg-ui_node_fight[data-anim="idle"] #sheen {
  animation: svg-ui_node_fight-idle-sheen 3s infinite;
}
</style>
<defs>
  <clipPath id="ui_node_fight-cbase">
    <path d="M32,7 C46,7 57,18 57,32 C57,46 46,57 32,57 C18,57 7,46 7,32 C7,18 18,7 32,7 Z"/>
  </clipPath>
</defs>
<g id="root">
  <!-- 统一规格暗色小圆底（七层画法，中心 32,32，半径 25） -->
  <!-- 第1层：墨色垫底 -->
  <path d="M32,7 C46,7 57,18 57,32 C57,46 46,57 32,57 C18,57 7,46 7,32 C7,18 18,7 32,7 Z" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5.6" stroke-linejoin="round"/>
  <!-- 第2层：铺旧铜“暗”一档 -->
  <path d="M32,7 C46,7 57,18 57,32 C57,46 46,57 32,57 C18,57 7,46 7,32 C7,18 18,7 32,7 Z" fill="#6E542B"/>
  <g clip-path="url(#ui_node_fight-cbase)">
    <!-- 第3层：错位亮面 -->
    <path d="M32,7 C46,7 57,18 57,32 C57,46 46,57 32,57 C18,57 7,46 7,32 C7,18 18,7 32,7 Z" transform="translate(-3 -3)" fill="#9A7B46"/>
    <!-- 第4层：右下加深 -->
    <path d="M57,28 C57,45 45,57 28,57 C43,53 53,43 57,28 Z" fill="#3B2B14" opacity="0.8"/>
    <!-- 第5层：左上受光边与右下冷色轮廓光 -->
    <path d="M9.2,27 C11.2,15.5 20.5,8.8 31,8.5 C21.5,11 13.5,17.5 9.2,27 Z" fill="#C2A670"/>
    <path d="M54.8,37 C52.8,47.5 44,54.5 34,55.5 C43,52.8 50.8,46.2 54.8,37 Z" fill="#8CAAB5" opacity="0.82"/>
    <!-- 第6层：高光点与铜绿 -->
    <circle cx="17" cy="15" r="1.4" fill="#DDCB9A"/>
    <path d="M44,50 C48,48 51,44 52.5,40" fill="none" stroke="#5F8272" stroke-width="2" stroke-linecap="round" opacity="0.52"/>
  </g>
  <!-- 外圈磕痕 -->
  <path d="M18,8.5 Q19.2,11.2 20.8,8.2 Q19.2,9.4 18,8.5 Z" fill="#1C1412"/>

  <!-- 内部暗夜紫凹盘 -->
  <circle cx="32" cy="32" r="18.8" fill="#161221" stroke="#1C1412" stroke-width="2.4"/>
  <path d="M16,40 A18,18 0 0 1 40,16 A17.5,16.5 0 0 0 16,40 Z" fill="#0D111C" opacity="0.82"/>
  <path d="M20,44.5 A17,17 0 0 0 44.5,20" fill="none" stroke="#3A324D" stroke-width="1.3" stroke-linecap="round"/>

  <!-- 四方铆钉 -->
  <circle cx="32.3" cy="10.4" r="2.1" fill="#1C1412"/><circle cx="32" cy="10" r="1.4" fill="#C2A670"/><circle cx="31.5" cy="9.5" r="0.55" fill="#DDCB9A"/>
  <circle cx="54.3" cy="32.4" r="2.1" fill="#1C1412"/><circle cx="54" cy="32" r="1.4" fill="#9A7B46"/>
  <circle cx="32.3" cy="54.4" r="2.1" fill="#1C1412"/><circle cx="32" cy="54" r="1.4" fill="#6E542B"/>
  <circle cx="10.3" cy="32.4" r="2.1" fill="#1C1412"/><circle cx="10" cy="32" r="1.4" fill="#C2A670"/>

  <!-- 中央图案：斜置哥特阔刃小剑（曲面轮廓 + 粗外框 + 一层暗面 + 一道亮边 + 收尖血槽线） -->
  <g id="sword">
    <!-- 剑整体墨色垫底 -->
    <path d="M46.5,15.5 C46,21 44.2,26.8 41.5,30.5 L30.2,41.8 L34,45.6 L32.2,47.8 L26.5,43.5 L21.5,48.5 L19.5,51 L15,49 L17.5,44.5 L22.5,39.5 L18.2,33.8 L20.4,32 L24.2,35.8 L35.5,24.5 C39.2,21.8 43,18 46.5,15.5 Z" transform="translate(.4 .6)" fill="#1C1412" stroke="#1C1412" stroke-width="4.8" stroke-linejoin="round"/>
    <!-- 剑身（冷铁骨白 + 右下冷灰暗面） -->
    <path d="M46.5,15.5 C45.8,21.2 43.8,26.8 41,30.2 L29.2,41.2 L24.8,36.8 L35.8,25 C39.2,22.2 43.2,18.2 46.5,15.5 Z" fill="#C8B894" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M46.5,15.5 C45.8,21.2 43.8,26.8 41,30.2 L29.2,41.2 L27,39 L46.5,15.5 Z" fill="#6E6A63"/>
    <path d="M26.2,35.8 C31.5,30.2 37.5,24.2 44.5,17.5" fill="none" stroke="#E2D6BA" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 剑身收尖血槽线 -->
    <path d="M27.5,38.5 Q35.2,31.2 42.5,22.5 Q35.8,31.8 27.5,38.5 Z" fill="#1C1412"/>
    <!-- 折角旧铜护手 -->
    <path d="M18.2,33.8 C20.5,32.2 22.2,33.5 25.5,36.8 L29.2,40.5 C32.5,43.8 33.8,45.5 32.2,47.8 C29.8,46.2 27.5,44.2 24.5,41.2 C21.5,38.2 19.8,36.2 18.2,33.8 Z" fill="#9A7B46" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M25.5,38.5 L32.2,47.8 C29.8,46.2 27.5,44.2 24.5,41.2 Z" fill="#6E542B"/>
    <circle cx="25.2" cy="40.8" r="1.4" fill="#DDCB9A"/>
    <!-- 酒红剑柄与旧铜配重球 -->
    <path d="M21.8,39.2 L26.8,44.2 L21.2,49.2 L16.8,44.8 Z" fill="#8C3B45" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <path d="M14.8,46.5 C14.8,44.2 16.8,43.2 19,44.5 C20.8,46.2 19.8,49.2 17.5,49.2 C15.5,49.2 14.8,48 14.8,46.5 Z" fill="#9A7B46" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="16.8" cy="46.2" r="0.9" fill="#DDCB9A"/>
  </g>

  <!-- 待机独立冷光层 -->
  <path id="sheen" opacity="0" d="M10.5,26 A22,22 0 0 1 30,9.5" fill="none" stroke="#DDCB9A" stroke-width="1.6" stroke-linecap="round"/>
</g>
</svg>
