<svg xmlns="http://www.w3.org/2000/svg" class="svg-card_frame" viewBox="0 0 200 300" width="200" height="300">
<title>基础牌牌框</title>
<style>
.svg-card_frame g { transform-box: view-box; }
.svg-card_frame #sheen { opacity: 0; }

/* 待机 3000：0 静止 → 1500 金边上的冷色亮光最亮 → 3000 回到静止。只动一层 opacity */
@keyframes svg-card_frame-idle-1 {
  0% { opacity: 0; animation-timing-function: ease-in-out; }
  50% { opacity: 1; animation-timing-function: ease-in-out; }
  100% { opacity: 0; }
}
.svg-card_frame:not([data-anim]) #sheen,
.svg-card_frame[data-anim="idle"] #sheen { animation: svg-card_frame-idle-1 3s infinite; }
</style>
<defs>

<linearGradient id="card_frame-board" x1="0" y1="0" x2="200" y2="300" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3A324D"/><stop offset=".5" stop-color="#2A2338"/><stop offset="1" stop-color="#1B1628"/></linearGradient>
<linearGradient id="card_frame-sheen" x1="6" y1="6" x2="170" y2="170" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#B7CDD4" stop-opacity="0"/><stop offset=".22" stop-color="#B7CDD4" stop-opacity=".95"/><stop offset=".55" stop-color="#8CAAB5" stop-opacity="0"/></linearGradient>
<pattern id="card_frame-grain" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><line x1="0" y1="0" x2="0" y2="5" stroke="#8C82A6" stroke-width=".5"/><line x1="0" y1="2.5" x2="5" y2="2.5" stroke="#161221" stroke-width=".6"/></pattern>
</defs>

<g id="root">
