<svg xmlns="http://www.w3.org/2000/svg" class="svg-ui_reward_shop" viewBox="0 0 64 64" width="64" height="64">
<title>奖励图标 · 工坊</title>
<style>
.svg-ui_reward_shop g { transform-box: view-box; }
.svg-ui_reward_shop #scissors { transform-origin: 30px 31px; }
.svg-ui_reward_shop #quill { transform-origin: 30px 31px; }
@keyframes svg-ui_reward_shop-idle-s {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,0px) rotate(2.4deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-ui_reward_shop-idle-q {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,-1px) rotate(-2.4deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-ui_reward_shop:not([data-anim]) #scissors,
.svg-ui_reward_shop[data-anim="idle"] #scissors { animation: svg-ui_reward_shop-idle-s 3s infinite; }
.svg-ui_reward_shop:not([data-anim]) #quill,
.svg-ui_reward_shop[data-anim="idle"] #quill { animation: svg-ui_reward_shop-idle-q 3s infinite; }
</style>
<g id="root">
  <!-- 1. 下层：旧剪刀（左上张开铁双刃，右下双圆旧铜指环，代表扔牌） -->
  <g id="scissors">
    <!-- 竖向与横向张开铁刀刃 -->
    <polygon points="15,8 23,11 34,36 27,38" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5.2" stroke-linejoin="round"/>
    <polygon points="15,8 23,11 34,36 27,38" fill="#6E6A63"/>
    <polyline points="16.5,10 21.5,12 31,34" fill="none" stroke="#948F86" stroke-width="1.8" stroke-linecap="round"/>

    <polygon points="8,19 12,12 37,27 34,34" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5.2" stroke-linejoin="round"/>
    <polygon points="8,19 12,12 37,27 34,34" fill="#4A4742"/>
    <polyline points="10,18 12.5,14 34,27" fill="none" stroke="#948F86" stroke-width="1.6" stroke-linecap="round"/>

    <!-- 剪刀两根旧铜柄杆与双圆指环 -->
    <path d="M30,33 L42,46 M33,29 L48,38" fill="none" stroke="#1C1412" stroke-width="6.8" stroke-linecap="round"/>
    <path d="M30,33 L42,46 M33,29 L48,38" fill="none" stroke="#9A7B46" stroke-width="3.2" stroke-linecap="round"/>

    <path d="M35.5,50 A7.5,7.5 0 1,1 50.5,50 A7.5,7.5 0 1,1 35.5,50 Z M39.2,50 A3.8,3.8 0 1,0 46.8,50 A3.8,3.8 0 1,0 39.2,50 Z" transform="translate(.5 .7)" fill="#1C1412" fill-rule="evenodd" stroke="#1C1412" stroke-width="4.8"/>
    <path d="M35.5,50 A7.5,7.5 0 1,1 50.5,50 A7.5,7.5 0 1,1 35.5,50 Z M39.2,50 A3.8,3.8 0 1,0 46.8,50 A3.8,3.8 0 1,0 39.2,50 Z" fill="#9A7B46" fill-rule="evenodd"/>
    <path d="M38,45 A6.5,6.5 0 0,1 47,44.5" fill="none" stroke="#C2A670" stroke-width="1.5" stroke-linecap="round"/>

    <path d="M43.8,39 A7.2,7.2 0 1,1 58.2,39 A7.2,7.2 0 1,1 43.8,39 Z M47.4,39 A3.6,3.6 0 1,0 54.6,39 A3.6,3.6 0 1,0 47.4,39 Z" transform="translate(.5 .7)" fill="#1C1412" fill-rule="evenodd" stroke="#1C1412" stroke-width="4.8"/>
    <path d="M43.8,39 A7.2,7.2 0 1,1 58.2,39 A7.2,7.2 0 1,1 43.8,39 Z M47.4,39 A3.6,3.6 0 1,0 54.6,39 A3.6,3.6 0 1,0 47.4,39 Z" fill="#6E542B" fill-rule="evenodd"/>
    <path d="M55,44 A6.5,6.5 0 0,1 47,44.5" fill="none" stroke="#8CAAB5" stroke-width="1.4" stroke-linecap="round" opacity=".82"/>

    <circle cx="30" cy="31" r="3.4" fill="#C2A670" stroke="#1C1412" stroke-width="2"/>
  </g>

  <!-- 2. 上层：交叉的羽毛笔（右上旧纸白羽翎 -> 左下铁笔尖，代表抄牌） -->
  <g id="quill">
    <path d="M55,8 C45,8 36,12 31,19 L35,19 L28,24 C25,26 24,28 23,29 L28,34 C35,31 42,27 47,21 L43,21 L50,16 C53,13 54,10 55,8 Z" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5.2" stroke-linejoin="round"/>
    <path d="M55,8 C45,8 36,12 31,19 L35,19 L28,24 C25,26 24,28 23,29 L28,34 C35,31 42,27 47,21 L43,21 L50,16 C53,13 54,10 55,8 Z" fill="#C8B894"/>
    <path d="M55,8 C54,10 53,13 50,16 L43,21 L47,21 C42,27 35,31 28,34 L25.5,31.5 L55,8 Z" fill="#9A8968"/>
    <path d="M52,9.5 C42,10.5 34,15 29,21" fill="none" stroke="#E2D6BA" stroke-width="2" stroke-linecap="round"/>
    <!-- 羽管轴线 -->
    <path d="M52.5,10.5 L21,42" fill="none" stroke="#1C1412" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 旧铜笔箍 -->
    <polygon points="23,31 30,38 25,43 18,36" fill="#9A7B46" stroke="#1C1412" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- 钢笔尖 -->
    <polygon points="18,36 25,43 19,52 9,55 12,45" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="18,36 25,43 19,52 9,55 12,45" fill="#5A7682"/>
    <polygon points="21.5,39.5 25,43 19,52 9,55" fill="#3B515C"/>
    <line x1="9.5" y1="54.5" x2="17" y2="47" stroke="#1C1412" stroke-width="2" stroke-linecap="round"/>
    <circle cx="17.5" cy="46.5" r="1.6" fill="#1C1412"/>
  </g>
</g>
</svg>
