<svg xmlns="http://www.w3.org/2000/svg" class="svg-relic_first2" viewBox="0 0 96 96" width="96" height="96">
<title>宝物 · 开打多摸两张</title>
<style>
.svg-relic_first2 g { transform-box: view-box; }
.svg-relic_first2 #card_back_1 { transform-origin: 36px 52px; }
.svg-relic_first2 #card_back_2 { transform-origin: 54px 52px; }
.svg-relic_first2 #glove { transform-origin: 42px 72px; }
@keyframes svg-relic_first2-idle-c1 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(-1.2px,-1.4px) rotate(-2.5deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-relic_first2-idle-c2 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(1.2px,-1.4px) rotate(2.5deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-relic_first2-idle-g {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,-0.8px) rotate(1deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-relic_first2:not([data-anim]) #card_back_1,
.svg-relic_first2[data-anim="idle"] #card_back_1 { animation: svg-relic_first2-idle-c1 3s infinite; }
.svg-relic_first2:not([data-anim]) #card_back_2,
.svg-relic_first2[data-anim="idle"] #card_back_2 { animation: svg-relic_first2-idle-c2 3s infinite; }
.svg-relic_first2:not([data-anim]) #glove,
.svg-relic_first2[data-anim="idle"] #glove { animation: svg-relic_first2-idle-g 3s infinite; }
</style>
<defs>
  <clipPath id="relic_first2-cpalm">
    <path d="M22,60 C22,48 34,44 48,46 L68,50 C76,52 78,64 70,74 L58,82 L24,80 Z"/>
  </clipPath>
  <clipPath id="relic_first2-cfinger">
    <path d="M24,54 L56,40 C62,38 66,43 62,48 L36,62 Z"/>
  </clipPath>
</defs>
<g id="root">
  <!-- 后方中指指尖（在两张牌后面托住，体现“食指与中指之间夹着”） -->
  <path d="M36,42 L58,31 C63,29 67,33 64,38 L44,49 Z" fill="#3D2212" stroke="#1C1412" stroke-width="5.2" stroke-linejoin="round"/>
  <path d="M36,42 L58,31 C63,29 67,33 64,38 L44,49 Z" fill="#704122"/>

  <!-- 第一张牌背（左上错开） -->
  <g id="card_back_1"><g transform="translate(35 34) rotate(-16)">
    
        <clipPath id="relic_first2-cc1"><rect x="-17" y="-23" width="34" height="46" rx="4"/></clipPath>
        <rect x="-17" y="-23" width="34" height="46" rx="4" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5.2"/>
        <rect x="-17" y="-23" width="34" height="46" rx="4" fill="#161221"/>
        <g clip-path="url(#relic_first2-cc1)">
          <rect x="-20" y="-26" width="34" height="46" rx="4" fill="#262036"/>
          <path d="M-15,16 V-20 H10 Q-8,-18 -12,-14 Z" fill="#3A324D"/>
        </g>
        <rect x="-13" y="-19" width="26" height="38" rx="2" fill="none" stroke="#9A7B46" stroke-width="1.8"/>
        <polygon points="0,-13 9,-3 0,9 -9,-3" fill="#6E542B" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
        <circle cx="0" cy="-5.5" r="3.4" fill="#E3263A" stroke="#1C1412" stroke-width="1.2"/>
        <rect x="-6" y="-0.5" width="5" height="5" fill="#1DBF5E" stroke="#1C1412" stroke-width="1.2"/>
        <polygon points="3.5,-0.5 7.5,5 -0.5,5" fill="#2E66F0" stroke="#1C1412" stroke-width="1.2" stroke-linejoin="round"/>
        
  </g></g>

  <!-- 第二张牌背（右上错开） -->
  <g id="card_back_2"><g transform="translate(57 36) rotate(12)">
    
        <clipPath id="relic_first2-cc2"><rect x="-17" y="-23" width="34" height="46" rx="4"/></clipPath>
        <rect x="-17" y="-23" width="34" height="46" rx="4" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5.2"/>
        <rect x="-17" y="-23" width="34" height="46" rx="4" fill="#161221"/>
        <g clip-path="url(#relic_first2-cc2)">
          <rect x="-20" y="-26" width="34" height="46" rx="4" fill="#262036"/>
          <path d="M-15,16 V-20 H10 Q-8,-18 -12,-14 Z" fill="#3A324D"/>
        </g>
        <rect x="-13" y="-19" width="26" height="38" rx="2" fill="none" stroke="#9A7B46" stroke-width="1.8"/>
        <polygon points="0,-13 9,-3 0,9 -9,-3" fill="#6E542B" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
        <circle cx="0" cy="-5.5" r="3.4" fill="#E3263A" stroke="#1C1412" stroke-width="1.2"/>
        <rect x="-6" y="-0.5" width="5" height="5" fill="#1DBF5E" stroke="#1C1412" stroke-width="1.2"/>
        <polygon points="3.5,-0.5 7.5,5 -0.5,5" fill="#2E66F0" stroke="#1C1412" stroke-width="1.2" stroke-linejoin="round"/>
        
  </g></g>

  <!-- 旧皮手套主体（七层画法） -->
  <g id="glove">
    <!-- 手掌与弯曲手指 -->
    <path d="M22,60 C22,48 34,44 48,46 L68,50 C76,52 78,64 70,74 L58,82 L24,80 Z" transform="translate(.6 .9)" fill="#1C1412" stroke="#1C1412" stroke-width="5.6" stroke-linejoin="round"/>
    <path d="M22,60 C22,48 34,44 48,46 L68,50 C76,52 78,64 70,74 L58,82 L24,80 Z" fill="#704122"/>
    <g clip-path="url(#relic_first2-cpalm)">
      <path d="M22,60 C22,48 34,44 48,46 L68,50 C76,52 78,64 70,74 L58,82 L24,80 Z" transform="translate(-4 -3)" fill="#9E6238"/>
      <path d="M52,47 L68,50 C76,52 78,64 70,74 L58,82 H46 C54,72 56,58 52,47 Z" fill="#3D2212" opacity=".78"/>
      <path d="M73.5,58 Q75,66 68.5,73.5 Q62,79 56,80.5 Q65,75 70,69.5 Q73.5,64 73.5,58 Z" fill="#8CAAB5" opacity=".8"/>
    </g>

    <!-- 前方夹牌的食指（横跨牌面，圆管错位） -->
    <path d="M24,54 L56,40 C62,38 66,43 62,48 L36,62 Z" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5.4" stroke-linejoin="round"/>
    <path d="M24,54 L56,40 C62,38 66,43 62,48 L36,62 Z" fill="#704122"/>
    <g clip-path="url(#relic_first2-cfinger)">
      <path d="M24,54 L56,40 C62,38 66,43 62,48 L36,62 Z" transform="translate(-2 -2.4)" fill="#9E6238"/>
      <path d="M27,52.5 L55,40.5 Q42,47 28,54.5 Z" fill="#C48A5C"/>
    </g>

    <!-- 拇指 -->
    <path d="M18,58 C16,48 26,44 36,49 L42,56 C44,61 38,66 30,65 Z" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5.4" stroke-linejoin="round"/>
    <path d="M18,58 C16,48 26,44 36,49 L42,56 C44,61 38,66 30,65 Z" fill="#9E6238"/>
    <path d="M21,54 C21,49 27,47 34,50" fill="none" stroke="#C48A5C" stroke-width="2" stroke-linecap="round"/>

    <!-- 手套翻边护腕与缝线、旧铜扣 -->
    <path d="M15,74 L64,75 L67,86 L13,85 Z" transform="translate(.6 .9)" fill="#1C1412" stroke="#1C1412" stroke-width="5.6" stroke-linejoin="round"/>
    <path d="M15,74 L64,75 L67,86 L13,85 Z" fill="#3D2212"/>
    <path d="M15,74 L48,74.6 L46,82 L14,82 Z" fill="#704122"/>
    <path d="M19,78.5 L59,79.5" stroke="#C8B894" stroke-width="1.8" stroke-dasharray="4.5 3.5" stroke-linecap="round"/>
    <!-- 护腕旧铜扣 -->
    <rect x="34" y="73.5" width="12" height="12" rx="2.5" fill="#9A7B46" stroke="#1C1412" stroke-width="2.6"/>
    <circle cx="37.5" cy="77" r="1.3" fill="#DDCB9A"/>
  </g>
</g>
</svg>
