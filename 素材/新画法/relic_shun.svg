<svg xmlns="http://www.w3.org/2000/svg" class="svg-relic_shun" viewBox="0 0 96 96" width="96" height="96">
<title>宝物 · 顺色 ×3</title>
<style>
.svg-relic_shun g { transform-box: view-box; }
.svg-relic_shun #three_prong_hook { transform-origin: 63px 56px; }
.svg-relic_shun #gem_1_red { transform-origin: 22px 27px; }
.svg-relic_shun #gem_2_green { transform-origin: 45px 36px; }
.svg-relic_shun #gem_3_blue { transform-origin: 71px 28px; }
@keyframes svg-relic_shun-idle-h {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,-1.2px) rotate(2.8deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-relic_shun-idle-g {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,-1px) rotate(-1.2deg) scale(1.02,1.02); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-relic_shun:not([data-anim]) #three_prong_hook,
.svg-relic_shun[data-anim="idle"] #three_prong_hook { animation: svg-relic_shun-idle-h 3s infinite; }
.svg-relic_shun:not([data-anim]) #gem_1_red,
.svg-relic_shun[data-anim="idle"] #gem_1_red,
.svg-relic_shun:not([data-anim]) #gem_2_green,
.svg-relic_shun[data-anim="idle"] #gem_2_green,
.svg-relic_shun:not([data-anim]) #gem_3_blue,
.svg-relic_shun[data-anim="idle"] #gem_3_blue { animation: svg-relic_shun-idle-g 3s infinite; }
</style>
<defs>
  <clipPath id="relic_shun-chook">
    <path d="M51,55 H75 C77.5,55 79,57 79,59.5 C79,61.5 77.5,63 75.5,63.5 C79,71 84.5,73.5 86.5,68.5 C88,65.5 85,62 82,64.5 L80.5,67.5 C78.5,67.5 76.5,65 75,62 H67 C66.5,74 60,85 50.5,86 C45,86 43,80.5 47.5,77 L52,79.5 C56,79.5 58.5,73 59,63 H54.5 C51.5,71.5 42,77.5 33.5,75.5 C28.5,74.5 27,69 31.5,66 L36,69.5 C40.5,70.5 45.5,67.5 47.5,62 C46,61 45,59.5 45,58 C45,56 47,55 51,55 Z"/>
  </clipPath>
</defs>
<g id="root">
  <!-- 短项链连接链环（圆管错位明暗） -->
  <g id="short_chain">
    <circle cx="13.5" cy="15.5" r="6.2" fill="#1C1412"/><circle cx="13" cy="15" r="4.2" fill="#9A7B46"/><circle cx="13" cy="15" r="1.8" fill="#1C1412"/>
    <path d="M16,18 L21,23" stroke="#1C1412" stroke-width="6.4" stroke-linecap="round"/>
    <path d="M16,18 L21,23" stroke="#9A7B46" stroke-width="2.8" stroke-linecap="round"/>
    <g transform="translate(33.5 31) rotate(18)">
      <ellipse cx="0.5" cy="0.7" rx="7" ry="4.2" fill="#1C1412" stroke="#1C1412" stroke-width="4.4"/>
      <ellipse cx="0" cy="0" rx="7" ry="4.2" fill="#9A7B46"/>
      <ellipse cx="0" cy="0" rx="3.2" ry="1.6" fill="#1C1412"/>
    </g>
    <g transform="translate(56.5 33) rotate(-14)">
      <ellipse cx="0.5" cy="0.7" rx="7" ry="4.2" fill="#1C1412" stroke="#1C1412" stroke-width="4.4"/>
      <ellipse cx="0" cy="0" rx="7" ry="4.2" fill="#6E542B"/>
      <ellipse cx="0" cy="0" rx="3.2" ry="1.6" fill="#1C1412"/>
    </g>
    <g transform="translate(69 45) rotate(68)">
      <ellipse cx="0.5" cy="0.7" rx="6.8" ry="4" fill="#1C1412" stroke="#1C1412" stroke-width="4.4"/>
      <ellipse cx="0" cy="0" rx="6.8" ry="4" fill="#9A7B46"/>
      <ellipse cx="0" cy="0" rx="3" ry="1.5" fill="#1C1412"/>
    </g>
    <g transform="translate(66 53.5) rotate(82)">
      <ellipse cx="0.5" cy="0.7" rx="6.5" ry="4" fill="#1C1412" stroke="#1C1412" stroke-width="4.4"/>
      <ellipse cx="0" cy="0" rx="6.5" ry="4" fill="#6E542B"/>
      <ellipse cx="0" cy="0" rx="2.8" ry="1.4" fill="#1C1412"/>
    </g>
  </g>

  <!-- 1. 红圆宝石 (22, 27) -->
  <g id="gem_1_red">
    
      <clipPath id="relic_shun-cg1"><circle cx="22" cy="27" r="11.8"/></clipPath>
      <circle cx="22.5" cy="27.7" r="14.4" fill="#1C1412"/>
      <circle cx="22" cy="27" r="11.8" fill="#A8172A"/>
      <g clip-path="url(#relic_shun-cg1)">
        <circle cx="19.9" cy="24.9" r="11.8" fill="#E3263A"/>
        <!-- 背光最暗与右下内反光刻面 -->
        <path d="M23.2,29.4 L33.8,24.6 L33.8,38.8 L18.5,38.8 Z" fill="#6B0E1C"/>
        <polygon points="23.8,33.5 30.5,29.6 27.7,36.7" fill="#E3263A"/>
        <!-- 左上受光亮刻面 -->
        <polygon points="11.1,28.2 14.7,19.0 22.0,15.8 28.1,19.0 22.0,22.5 16.7,24.9" fill="#F4566A"/>
        <!-- 中央八角台面 -->
        <polygon points="16.3,24.6 22.0,21.7 27.7,24.6 28.1,30.3 22.0,33.1 16.3,30.3" fill="#E3263A"/>
        <polygon points="16.3,24.6 22.0,21.7 26.1,23.9 20.6,28.8" fill="#F4566A" opacity=".65"/>
        <!-- 刻面高光色细棱线（不用墨线） -->
        <path d="M16.3,24.6 L22.0,21.7 L27.7,24.6 L28.1,30.3 L22.0,33.1 L16.3,30.3 Z M22.0,21.7 L22.0,15.8 M27.7,24.6 L32.6,22.9 M16.3,24.6 L11.4,24.1 M22.0,33.1 L22.0,38.2" fill="none" stroke="#FFA3AB" stroke-width="0.75" stroke-linecap="round" opacity=".75"/>
        <!-- 左上白亮边 -->
        <path d="M12.0,26.4 Q13.1,17.8 24.9,16.9 Q15.2,19.7 12.0,26.4 Z" fill="#F4F1FF" opacity=".9"/>
      </g>
      <circle cx="17.9" cy="22.0" r="1.7" fill="#F4F1FF"/>
    
  </g>
  <!-- 2. 绿方宝石 (45, 36) -->
  <g id="gem_2_green">
    
      <clipPath id="relic_shun-cg2"><polygon points="37.2,25.2 52.8,25.2 55.8,28.2 55.8,43.8 52.8,46.8 37.2,46.8 34.2,43.8 34.2,28.2"/></clipPath>
      <polygon points="37.2,25.2 52.8,25.2 55.8,28.2 55.8,43.8 52.8,46.8 37.2,46.8 34.2,43.8 34.2,28.2" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5.2" stroke-linejoin="round"/>
      <polygon points="37.2,25.2 52.8,25.2 55.8,28.2 55.8,43.8 52.8,46.8 37.2,46.8 34.2,43.8 34.2,28.2" fill="#128A43"/>
      <g clip-path="url(#relic_shun-cg2)">
        <!-- 左上亮梯形刻面 -->
        <polygon points="34.2,43.8 34.2,28.2 37.2,25.2 52.8,25.2 49.3,30.4 40.7,30.4 39.4,31.7 39.4,40.3" fill="#4FDB85"/>
        <!-- 右下最暗刻面与内反光 -->
        <polygon points="52.8,25.2 55.8,28.2 55.8,43.8 52.8,46.8 37.2,46.8 40.7,41.6 49.3,41.6 50.6,40.3 50.6,31.7" fill="#0A5A2B"/>
        <polygon points="40.7,41.6 49.3,41.6 52.8,46.8 37.2,46.8" fill="#1DBF5E" opacity=".75"/>
        <!-- 中央切角方台面 -->
        <polygon points="40.7,30.4 49.3,30.4 50.6,31.7 50.6,40.3 49.3,41.6 40.7,41.6 39.4,40.3 39.4,31.7" fill="#1DBF5E"/>
        <polygon points="40.7,30.4 49.3,30.4 47.2,36.6 39.4,37.7 39.4,31.7" fill="#4FDB85" opacity=".65"/>
        <!-- 刻面高光色细棱线 -->
        <path d="M40.7,30.4 L37.2,25.2 M49.3,30.4 L52.8,25.2 M50.6,40.3 L55.8,43.8 M39.4,40.3 L34.2,43.8" stroke="#A6F5C6" stroke-width="0.75" opacity=".75"/>
        <polygon points="40.7,30.4 49.3,30.4 50.6,31.7 50.6,40.3 49.3,41.6 40.7,41.6 39.4,40.3 39.4,31.7" fill="none" stroke="#A6F5C6" stroke-width="0.75" opacity=".8"/>
        <!-- 左上白亮边 -->
        <polyline points="35.6,39.2 35.6,28.8 37.8,26.6 48.8,26.6" fill="none" stroke="#F4F1FF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
      </g>
      <circle cx="42.5" cy="33.5" r="1.5" fill="#F4F1FF"/>
    
  </g>
  <!-- 3. 蓝三角宝石 (71, 13..39) -->
  <g id="gem_3_blue">
    
      <clipPath id="relic_shun-cg3"><polygon points="71.0,12.5 85.5,39.0 56.5,39.0"/></clipPath>
      <polygon points="71.0,12.5 85.5,39.0 56.5,39.0" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5.2" stroke-linejoin="round"/>
      <polygon points="71.0,12.5 85.5,39.0 56.5,39.0" fill="#1D45B8"/>
      <g clip-path="url(#relic_shun-cg3)">
        <!-- 左侧受光亮刻面 -->
        <polygon points="71.0,12.5 56.5,39.0 63.5,35.3 71.0,20.4" fill="#6A93F8"/>
        <!-- 右侧背光最暗刻面与底边内反光 -->
        <polygon points="71.0,12.5 85.5,39.0 78.5,35.3 71.0,20.4" fill="#122A78"/>
        <polygon points="56.5,39.0 85.5,39.0 78.5,35.3 63.5,35.3" fill="#1D45B8"/>
        <polygon points="71.0,35.3 78.5,35.3 80.4,39.0 69.5,39.0" fill="#2E66F0"/>
        <!-- 中央三角台面 -->
        <polygon points="71.0,20.4 78.5,35.3 63.5,35.3" fill="#2E66F0"/>
        <polygon points="71.0,20.4 73.6,33.3 63.5,35.3" fill="#6A93F8" opacity=".65"/>
        <!-- 刻面高光色细棱线 -->
        <path d="M71.0,12.5 L71.0,20.4 M56.5,39.0 L63.5,35.3 M85.5,39.0 L78.5,35.3" stroke="#B4C8FF" stroke-width="0.75" opacity=".8"/>
        <polygon points="71.0,20.4 78.5,35.3 63.5,35.3" fill="none" stroke="#B4C8FF" stroke-width="0.75" opacity=".85"/>
        <!-- 左上白亮边 -->
        <path d="M69.8,15.0 L59.3,36.5" stroke="#F4F1FF" stroke-width="1.3" stroke-linecap="round" opacity=".9"/>
      </g>
      <circle cx="68.6" cy="26.7" r="1.5" fill="#F4F1FF"/>
    
  </g>

  <!-- 链子末端的三齿旧铜小钩（七层画法） -->
  <g id="three_prong_hook">
    <path d="M51,55 H75 C77.5,55 79,57 79,59.5 C79,61.5 77.5,63 75.5,63.5 C79,71 84.5,73.5 86.5,68.5 C88,65.5 85,62 82,64.5 L80.5,67.5 C78.5,67.5 76.5,65 75,62 H67 C66.5,74 60,85 50.5,86 C45,86 43,80.5 47.5,77 L52,79.5 C56,79.5 58.5,73 59,63 H54.5 C51.5,71.5 42,77.5 33.5,75.5 C28.5,74.5 27,69 31.5,66 L36,69.5 C40.5,70.5 45.5,67.5 47.5,62 C46,61 45,59.5 45,58 C45,56 47,55 51,55 Z" transform="translate(.6 .9)" fill="#1C1412" stroke="#1C1412" stroke-width="5.6" stroke-linejoin="round"/>
    <path d="M51,55 H75 C77.5,55 79,57 79,59.5 C79,61.5 77.5,63 75.5,63.5 C79,71 84.5,73.5 86.5,68.5 C88,65.5 85,62 82,64.5 L80.5,67.5 C78.5,67.5 76.5,65 75,62 H67 C66.5,74 60,85 50.5,86 C45,86 43,80.5 47.5,77 L52,79.5 C56,79.5 58.5,73 59,63 H54.5 C51.5,71.5 42,77.5 33.5,75.5 C28.5,74.5 27,69 31.5,66 L36,69.5 C40.5,70.5 45.5,67.5 47.5,62 C46,61 45,59.5 45,58 C45,56 47,55 51,55 Z" fill="#6E542B"/>
    <g clip-path="url(#relic_shun-chook)">
      <path d="M51,55 H75 C77.5,55 79,57 79,59.5 C79,61.5 77.5,63 75.5,63.5 C79,71 84.5,73.5 86.5,68.5 C88,65.5 85,62 82,64.5 L80.5,67.5 C78.5,67.5 76.5,65 75,62 H67 C66.5,74 60,85 50.5,86 C45,86 43,80.5 47.5,77 L52,79.5 C56,79.5 58.5,73 59,63 H54.5 C51.5,71.5 42,77.5 33.5,75.5 C28.5,74.5 27,69 31.5,66 L36,69.5 C40.5,70.5 45.5,67.5 47.5,62 C46,61 45,59.5 45,58 C45,56 47,55 51,55 Z" transform="translate(-2.4 -2)" fill="#9A7B46"/>
      <path d="M68,55 H89 V88 H58 C65,78 68,66 68,55 Z" fill="#3B2B14" opacity=".68"/>
      <path d="M47,57 H68 Q56,59 47,59.5 Z" fill="#C2A670"/>
      <path d="M64.5,66 Q61,81 51,84.5 Q59,80 62.5,66 Z" fill="#8CAAB5" opacity=".82"/>
    </g>
    <circle cx="63" cy="59" r="2.6" fill="#1C1412"/><circle cx="62.6" cy="58.6" r="1.6" fill="#DDCB9A"/>
  </g>
</g>
</svg>
