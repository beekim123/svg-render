<svg xmlns="http://www.w3.org/2000/svg" class="svg-card_art_lens" viewBox="0 0 176 188" width="176" height="188">
<title>额外牌原画 · 放大镜</title>
<style>
.svg-card_art_lens g { transform-box: view-box; }
.svg-card_art_lens #magnifier { transform-origin: 96px 96px; }
.svg-card_art_lens #lens_bulge { transform-origin: 88px 78px; }
.svg-card_art_lens #sweep_band { transform-origin: 88px 78px; opacity: 0.55; }
.svg-card_art_lens #ripple_1,
.svg-card_art_lens #ripple_2 { transform-origin: 88px 78px; opacity: 0; }

/* 待机 3000ms：0 静止/低位 → 1500 轻变化最大/高位 → 3000 与0帧一致 */
@keyframes svg-card_art_lens-idle-mag {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,-2px) rotate(-2deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-card_art_lens-idle-sweep {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0.55; animation-timing-function: ease-in-out; }
  50% { transform: translate(8px,8px) rotate(0deg) scale(1,1); opacity: 0.95; animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0.55; }
}
.svg-card_art_lens:not([data-anim]) #magnifier,
.svg-card_art_lens[data-anim="idle"] #magnifier { animation: svg-card_art_lens-idle-mag 3s infinite; }
.svg-card_art_lens:not([data-anim]) #sweep_band,
.svg-card_art_lens[data-anim="idle"] #sweep_band { animation: svg-card_art_lens-idle-sweep 3s infinite; }

/* play 600ms：0(0%) 静止 → 100(16.67%) 起手内缩 → 250(41.67%) 镜片鼓起、荡出两圈环 → 400(66.67%) 停住 → 600(100%) 静止 */
@keyframes svg-card_art_lens-play-mag {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  16.67% { transform: translate(2px,2px) rotate(3deg) scale(0.96,0.96); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  41.67% { transform: translate(-1px,-2px) rotate(-2deg) scale(1.02,1.02); animation-timing-function: linear; }
  66.67% { transform: translate(-1px,-2px) rotate(-2deg) scale(1.02,1.02); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-card_art_lens-play-bulge {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  16.67% { transform: translate(0px,0px) rotate(0deg) scale(0.91,0.91); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  41.67% { transform: translate(0px,0px) rotate(0deg) scale(1.18,1.18); animation-timing-function: linear; }
  66.67% { transform: translate(0px,0px) rotate(0deg) scale(1.16,1.16); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-card_art_lens-play-r1 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  16.67% { transform: translate(0px,0px) rotate(0deg) scale(0.88,0.88); opacity: 0.45; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  41.67% { transform: translate(0px,0px) rotate(0deg) scale(1.18,1.18); opacity: 1; animation-timing-function: linear; }
  66.67% { transform: translate(0px,0px) rotate(0deg) scale(1.24,1.24); opacity: 0.85; animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; }
}
@keyframes svg-card_art_lens-play-r2 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  16.67% { transform: translate(0px,0px) rotate(0deg) scale(0.8,0.8); opacity: 0.2; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  41.67% { transform: translate(0px,0px) rotate(0deg) scale(1.06,1.06); opacity: 0.95; animation-timing-function: linear; }
  66.67% { transform: translate(0px,0px) rotate(0deg) scale(1.14,1.14); opacity: 0.82; animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; }
}
.svg-card_art_lens[data-anim="play"] #magnifier { animation: svg-card_art_lens-play-mag 0.6s both; }
.svg-card_art_lens[data-anim="play"] #lens_bulge { animation: svg-card_art_lens-play-bulge 0.6s both; }
.svg-card_art_lens[data-anim="play"] #ripple_1 { animation: svg-card_art_lens-play-r1 0.6s both; }
.svg-card_art_lens[data-anim="play"] #ripple_2 { animation: svg-card_art_lens-play-r2 0.6s both; }
</style>
<defs>
  <clipPath id="card_art_lens-cframe">
    <path d="M52,78 A36,36 0 1 1 124,78 A36,36 0 1 1 52,78 Z M60,78 A28,28 0 1 0 116,78 A28,28 0 1 0 60,78 Z" clip-rule="evenodd"/>
  </clipPath>
  <clipPath id="card_art_lens-clip">
    <circle cx="88" cy="78" r="28"/>
  </clipPath>
  <clipPath id="card_art_lens-chandle">
    <path d="M110,108 L122,98 C132,110 142,123 151,136 L137,147 C128,134 119,121 110,108 Z"/>
  </clipPath>
  <clipPath id="card_art_lens-cneck">
    <path d="M104,102 Q112,99 116,90 C120,94 123.5,98.5 127,102.5 Q121.5,110 112.5,113.5 C109.5,109.5 106.5,105.5 104,102 Z"/>
  </clipPath>
  <clipPath id="card_art_lens-cw1">
    <path d="M113,115.2 Q122,112 126.2,104 C128,105.8 129.4,107.6 130.6,109.5 Q125.5,117.5 117.2,120.6 C115.6,118.8 114.2,117 113,115.2 Z"/>
  </clipPath>
  <clipPath id="card_art_lens-cw2">
    <path d="M119.2,123 Q128.2,119.8 132.4,111.8 C134.2,113.6 135.6,115.4 136.8,117.3 Q131.7,125.3 123.4,128.4 C121.8,126.6 120.4,124.8 119.2,123 Z"/>
  </clipPath>
  <clipPath id="card_art_lens-cw3">
    <path d="M125.4,130.8 Q134.4,127.6 138.6,119.6 C140.4,121.4 141.8,123.2 143,125.1 Q137.9,133.1 129.6,136.2 C128,134.4 126.6,132.6 125.4,130.8 Z"/>
  </clipPath>
  <clipPath id="card_art_lens-cmount">
    <path d="M131,143 C138,137 146,132.5 153,130.5 C158.8,138 162.5,147.2 163.5,156.5 C155.5,161.8 146,164.5 137,163.8 C133.2,157.5 131.2,150.2 131,143 Z"/>
  </clipPath>
  <clipPath id="card_art_lens-ccollar">
    <path d="M129.2,139.8 Q140.5,136.2 149.8,127.2 C151.8,129.4 153.2,131.8 154,134.2 Q143.8,143.2 132.2,146.8 C130.6,144.6 129.6,142.2 129.2,139.8 Z"/>
  </clipPath>
  <radialGradient id="card_art_lens-glass" cx="78" cy="68" r="32" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#8CAAB5" stop-opacity="0.52"/>
    <stop offset="0.65" stop-color="#3B515C" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#1E2C33" stop-opacity="0.72"/>
  </radialGradient>
</defs>

<g id="root">
  <!-- 左上角 x:0..30, y:0..90 严格留空 -->
  <ellipse cx="104" cy="170" rx="44" ry="7" fill="#0D111C" opacity="0.58"/>

  <g id="magnifier">
    <!-- 1. 木柄主体（圆管错位法做左亮右暗，两头分别藏进颈箍与柄尾箍下） -->
    <path d="M110,108 L122,98 C132,110 142,123 151,136 L137,147 C128,134 119,121 110,108 Z" transform="translate(.5 .8)" fill="#1C1412" stroke="#1C1412" stroke-width="5" stroke-linejoin="round"/>
    <path d="M110,108 L122,98 C132,110 142,123 151,136 L137,147 C128,134 119,121 110,108 Z" fill="#3D2212"/>
    <g clip-path="url(#card_art_lens-chandle)">
      <path d="M110,108 L122,98 C132,110 142,123 151,136 L137,147 C128,134 119,121 110,108 Z" transform="translate(-3.4 -2.2)" fill="#704122"/>
      <path d="M110,108 L117,102 L144,138 L137,147 Z" transform="translate(-1.2 -0.8)" fill="#9E6238"/>
      <path d="M113,110 L137,142" stroke="#C48A5C" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- 2. 旧铜颈箍（往下弓的弧形箍 + 错位法明暗，盖住手柄上端接口） -->
    <path d="M104,102 Q112,99 116,90 C120,94 123.5,98.5 127,102.5 Q121.5,110 112.5,113.5 C109.5,109.5 106.5,105.5 104,102 Z" transform="translate(.5 .8)" fill="#1C1412" stroke="#1C1412" stroke-width="4.6" stroke-linejoin="round"/>
    <path d="M104,102 Q112,99 116,90 C120,94 123.5,98.5 127,102.5 Q121.5,110 112.5,113.5 C109.5,109.5 106.5,105.5 104,102 Z" fill="#6E542B"/>
    <g clip-path="url(#card_art_lens-cneck)">
      <path d="M104,102 Q112,99 116,90 C120,94 123.5,98.5 127,102.5 Q121.5,110 112.5,113.5 C109.5,109.5 106.5,105.5 104,102 Z" transform="translate(-2.8 -2)" fill="#9A7B46"/>
      <path d="M118,93 L127,102.5 L118,112 C120,106 120,99 118,93 Z" fill="#3B2B14" opacity="0.72"/>
      <path d="M106.5,103.5 L113,111" stroke="#C2A670" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- 3. 手柄三道缠皮箍（照 3.9 节代码③：每圈上下沿顺手柄往下弓、两头比手柄宽出一点、错位左亮右暗、缝用最暗） -->
    <!-- 第 1 圈缠皮箍 -->
    <path d="M113,115.2 Q122,112 126.2,104 C128,105.8 129.4,107.6 130.6,109.5 Q125.5,117.5 117.2,120.6 C115.6,118.8 114.2,117 113,115.2 Z" transform="translate(.5 .8)" fill="#1C1412" stroke="#1C1412" stroke-width="4.2" stroke-linejoin="round"/>
    <path d="M113,115.2 Q122,112 126.2,104 C128,105.8 129.4,107.6 130.6,109.5 Q125.5,117.5 117.2,120.6 C115.6,118.8 114.2,117 113,115.2 Z" fill="#3B2B14"/>
    <g clip-path="url(#card_art_lens-cw1)">
      <path d="M113,115.2 Q122,112 126.2,104 C128,105.8 129.4,107.6 130.6,109.5 Q125.5,117.5 117.2,120.6 C115.6,118.8 114.2,117 113,115.2 Z" transform="translate(-2.6 -1.8)" fill="#6E542B"/>
      <path d="M113,115.2 Q119,113 123,108 L126.5,112.5 Q122,117.5 117.2,120.6 Z" transform="translate(-1 -0.8)" fill="#9A7B46"/>
    </g>
    <path d="M115.2,116.2 Q119.5,114.6 122.5,112" fill="none" stroke="#C2A670" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 第 2 圈缠皮箍 -->
    <path d="M119.2,123 Q128.2,119.8 132.4,111.8 C134.2,113.6 135.6,115.4 136.8,117.3 Q131.7,125.3 123.4,128.4 C121.8,126.6 120.4,124.8 119.2,123 Z" transform="translate(.5 .8)" fill="#1C1412" stroke="#1C1412" stroke-width="4.2" stroke-linejoin="round"/>
    <path d="M119.2,123 Q128.2,119.8 132.4,111.8 C134.2,113.6 135.6,115.4 136.8,117.3 Q131.7,125.3 123.4,128.4 C121.8,126.6 120.4,124.8 119.2,123 Z" fill="#3B2B14"/>
    <g clip-path="url(#card_art_lens-cw2)">
      <path d="M119.2,123 Q128.2,119.8 132.4,111.8 C134.2,113.6 135.6,115.4 136.8,117.3 Q131.7,125.3 123.4,128.4 C121.8,126.6 120.4,124.8 119.2,123 Z" transform="translate(-2.6 -1.8)" fill="#6E542B"/>
      <path d="M119.2,123 Q125.2,120.8 129.2,115.8 L132.7,120.3 Q128.2,125.3 123.4,128.4 Z" transform="translate(-1 -0.8)" fill="#9A7B46"/>
    </g>
    <path d="M121.4,124 Q125.7,122.4 128.7,119.8" fill="none" stroke="#C2A670" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 第 3 圈缠皮箍 -->
    <path d="M125.4,130.8 Q134.4,127.6 138.6,119.6 C140.4,121.4 141.8,123.2 143,125.1 Q137.9,133.1 129.6,136.2 C128,134.4 126.6,132.6 125.4,130.8 Z" transform="translate(.5 .8)" fill="#1C1412" stroke="#1C1412" stroke-width="4.2" stroke-linejoin="round"/>
    <path d="M125.4,130.8 Q134.4,127.6 138.6,119.6 C140.4,121.4 141.8,123.2 143,125.1 Q137.9,133.1 129.6,136.2 C128,134.4 126.6,132.6 125.4,130.8 Z" fill="#3B2B14"/>
    <g clip-path="url(#card_art_lens-cw3)">
      <path d="M125.4,130.8 Q134.4,127.6 138.6,119.6 C140.4,121.4 141.8,123.2 143,125.1 Q137.9,133.1 129.6,136.2 C128,134.4 126.6,132.6 125.4,130.8 Z" transform="translate(-2.6 -1.8)" fill="#6E542B"/>
      <path d="M125.4,130.8 Q131.4,128.6 135.4,123.6 L138.9,128.1 Q134.4,133.1 129.6,136.2 Z" transform="translate(-1 -0.8)" fill="#9A7B46"/>
    </g>
    <path d="M127.6,131.8 Q131.9,130.2 134.9,127.6" fill="none" stroke="#C2A670" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 4. 柄尾旧铜宝石托（曲线轮廓 + 错位明暗 + 托与手柄之间的弧形箍 + 蓝宝石底垫最暗托座） -->
    <path d="M131,143 C138,137 146,132.5 153,130.5 C158.8,138 162.5,147.2 163.5,156.5 C155.5,161.8 146,164.5 137,163.8 C133.2,157.5 131.2,150.2 131,143 Z" transform="translate(.5 .8)" fill="#1C1412" stroke="#1C1412" stroke-width="4.8" stroke-linejoin="round"/>
    <path d="M131,143 C138,137 146,132.5 153,130.5 C158.8,138 162.5,147.2 163.5,156.5 C155.5,161.8 146,164.5 137,163.8 C133.2,157.5 131.2,150.2 131,143 Z" fill="#6E542B"/>
    <g clip-path="url(#card_art_lens-cmount)">
      <path d="M131,143 C138,137 146,132.5 153,130.5 C158.8,138 162.5,147.2 163.5,156.5 C155.5,161.8 146,164.5 137,163.8 C133.2,157.5 131.2,150.2 131,143 Z" transform="translate(-3.4 -2.6)" fill="#9A7B46"/>
      <path d="M153,130.5 C158.8,138 162.5,147.2 163.5,156.5 C155.5,161.8 146,164.5 137,163.8 L149,154 C153,146 154,138 153,130.5 Z" fill="#3B2B14" opacity="0.78"/>
      <path d="M133,145.5 Q134.8,153.5 138,160.5 Q136,153 135,145 Z" fill="#C2A670"/>
      <path d="M161.2,143 Q162.2,150 161.5,155.5 Q155,159.8 148,161.5" fill="none" stroke="#8CAAB5" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- 托和手柄之间的旧铜箍（盖住接口） -->
    <path d="M129.2,139.8 Q140.5,136.2 149.8,127.2 C151.8,129.4 153.2,131.8 154,134.2 Q143.8,143.2 132.2,146.8 C130.6,144.6 129.6,142.2 129.2,139.8 Z" transform="translate(.5 .8)" fill="#1C1412" stroke="#1C1412" stroke-width="4.4" stroke-linejoin="round"/>
    <path d="M129.2,139.8 Q140.5,136.2 149.8,127.2 C151.8,129.4 153.2,131.8 154,134.2 Q143.8,143.2 132.2,146.8 C130.6,144.6 129.6,142.2 129.2,139.8 Z" fill="#6E542B"/>
    <g clip-path="url(#card_art_lens-ccollar)">
      <path d="M129.2,139.8 Q140.5,136.2 149.8,127.2 C151.8,129.4 153.2,131.8 154,134.2 Q143.8,143.2 132.2,146.8 C130.6,144.6 129.6,142.2 129.2,139.8 Z" transform="translate(-2.8 -1.8)" fill="#9A7B46"/>
      <path d="M145,130 L154,134.2 L144,142.5 C146,138 146,134 145,130 Z" fill="#3B2B14" opacity="0.75"/>
    </g>
    <path d="M131.5,141.2 Q137.5,139.2 142.5,135.2" fill="none" stroke="#C2A670" stroke-width="1.3" stroke-linecap="round"/>

    <!-- 蓝宝石嵌进托里：底下先垫一圈“最暗”档 (#3B2B14 / #161221) 凹槽托座 -->
    <path d="M143.5,135.5 C150,144 155.8,152 160.2,159.5 C151.2,160.8 142.2,160.8 134,159.5 C137,151.2 140.2,143.2 143.5,135.5 Z" fill="#3B2B14" stroke="#1C1412" stroke-width="2.4" stroke-linejoin="round"/>
    <polygon points="143.5,137 158.8,158.5 135.2,158.5" fill="#161221"/>
    <!-- 蓝色三角宝石（平色刻面+亮棱） -->
    <polygon points="143.5,138 157.8,158 136,158" fill="#1C1412" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
    <polygon points="143.5,138.8 156.8,157.4 136.8,157.4" fill="#2E66F0"/>
    <polygon points="143.5,138.8 145.5,149.5 136.8,157.4" fill="#B4C8FF"/>
    <polygon points="143.5,138.8 156.8,157.4 145.5,149.5" fill="#1D45B8"/>
    <polygon points="136.8,157.4 145.5,149.5 156.8,157.4" fill="#122A78"/>
    <polygon points="143.5,144.8 151,154.8 140,154.8" fill="#6A93F8"/>
    <path d="M143.5,144.8 L151,154.8 H140 Z M143.5,138.8 V144.8 M136.8,157.4 L140,154.8 M156.8,157.4 L151,154.8" fill="none" stroke="#B4C8FF" stroke-width="0.55" opacity="0.65"/>
    <circle cx="142.5" cy="146.5" r="1.5" fill="#F4F1FF"/>

    <!-- 镜框与镜片组 lens_bulge（中心 88,78） -->
    <g id="lens_bulge">
      <!-- 1 墨色垫底（带外圈哥特尖耳与手柄连接座） -->
      <path d="M88,37 L93,43 H83 Z M47,78 L53,73 V83 Z M129,78 L123,73 V83 Z" transform="translate(.5 .8)" fill="#1C1412" stroke="#1C1412" stroke-width="4.2" stroke-linejoin="round"/>
      <circle cx="88.6" cy="78.9" r="36" fill="#1C1412" stroke="#1C1412" stroke-width="5.6"/>
      <!-- 2 旧铜镜框暗底 -->
      <path d="M52,78 A36,36 0 1 1 124,78 A36,36 0 1 1 52,78 Z M60,78 A28,28 0 1 0 116,78 A28,28 0 1 0 60,78 Z" fill="#6E542B" fill-rule="evenodd"/>
      <g clip-path="url(#card_art_lens-cframe)">
        <!-- 3 错位亮面 -->
        <path d="M52,78 A36,36 0 1 1 124,78 A36,36 0 1 1 52,78 Z M60,78 A28,28 0 1 0 116,78 A28,28 0 1 0 60,78 Z" transform="translate(-3 -3)" fill="#9A7B46" fill-rule="evenodd"/>
        <!-- 4 右下加深 -->
        <path d="M124,70 C124,100 106,114 80,114 L96,78 Z" fill="#3B2B14" opacity="0.78"/>
        <!-- 5 左上受光亮边与右下冷轮廓光 -->
        <path d="M54.5,86 A34,34 0 0 1 98,45.5 A35,35 0 0 0 56.8,86 Z" fill="#C2A670"/>
        <path d="M121.8,84 A34,34 0 0 1 98,110.5 A35,35 0 0 0 119.8,83.5 Z" fill="#8CAAB5" opacity="0.82"/>
        <!-- 6 铜绿与磕痕 -->
        <path d="M108,102 C112,99 115,95 117,90" fill="none" stroke="#5F8272" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
      </g>
      <!-- 镜框内圈珠边（36颗小铜珠） -->
      <circle cx="88" cy="78" r="30.2" fill="none" stroke="#3B2B14" stroke-width="2.6" stroke-dasharray="0.1 5.8297" stroke-linecap="round"/>
      <circle cx="87.6" cy="77.6" r="30.2" fill="none" stroke="#C2A670" stroke-width="1.8" stroke-dasharray="0.1 5.8297" stroke-linecap="round"/>
      <!-- 三处哥特尖耳铆钉 -->
      <polygon points="88,37 93,43 83,43" fill="#9A7B46" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round"/>
      <polygon points="47,78 53,73 53,83" fill="#C2A670" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round"/>
      <polygon points="129,78 123,73 123,83" fill="#6E542B" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="72" cy="48" r="2" fill="#DDCB9A"/>

      <!-- 冷灰青玻璃镜片 -->
      <circle cx="88" cy="78" r="28" fill="url(#card_art_lens-glass)" stroke="#1C1412" stroke-width="2.2"/>
      <g clip-path="url(#card_art_lens-clip)">
