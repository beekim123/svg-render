<style>
.svg-gem_red_shine g { transform-box: view-box; }
.svg-gem_red_shine .st1 { transform-origin: 26.5px 26.5px; }
.svg-gem_red_shine .st2 { transform-origin: 79.5px 33px; }
.svg-gem_red_shine .st3 { transform-origin: 38.5px 82px; }
.svg-gem_red_shine #halo { transform-origin: 50px 50px; }

/* 待机 3000：0 → 500 第一颗星最亮 → 1000 第二颗 → 1500 第三颗、外圈淡光最亮 → 2000 → 3000 回到第 0 帧。宝石本体不动 */
@keyframes svg-gem_red_shine-idle-1 {
  0% { transform: translate(0px,0px) rotate(4deg) scale(0.8,0.8); opacity: 0.75; animation-timing-function: ease-in-out; }
  16.67% { transform: translate(0px,0px) rotate(14deg) scale(1.12,1.12); opacity: 1; animation-timing-function: ease-in-out; }
  33.33% { transform: translate(0px,0px) rotate(0deg) scale(0.62,0.62); opacity: 0.5; animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,0px) rotate(0deg) scale(0.62,0.62); opacity: 0.5; animation-timing-function: ease-in-out; }
  66.67% { transform: translate(0px,0px) rotate(0deg) scale(0.62,0.62); opacity: 0.5; animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(4deg) scale(0.8,0.8); opacity: 0.75; }
}
.svg-gem_red_shine:not([data-anim]) .st1,
.svg-gem_red_shine[data-anim="idle"] .st1 { animation: svg-gem_red_shine-idle-1 3s infinite; }
