        <polygon points="43.9,68.5 52.1,68.5 53.5,69.9 53.5,78.1 52.1,79.5 43.9,79.5 42.5,78.1 42.5,69.9" fill="none" stroke="#A6F5C6" stroke-width="0.75" opacity=".8"/>
        <!-- 左上白亮边 -->
