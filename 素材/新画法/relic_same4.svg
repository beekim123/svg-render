    <circle cx="48" cy="48" r="4.5" fill="#1C1412"/><circle cx="47.6" cy="47.6" r="3" fill="#E2D6BA"/><circle cx="46.6" cy="46.6" r="1.1" fill="#FFFFFF"/>
