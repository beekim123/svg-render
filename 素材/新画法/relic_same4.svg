    <polygon points="48,30 76,19 66,48 76,77 48,66 20,77 30,48 20,19" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5.2" stroke-linejoin="round"/>
    <polygon points="48,30 76,19 66,48 76,77 48,66 20,77 30,48 20,19" fill="#1E2C33"/>
    <!-- 四瓣花托主盘 -->
