        <polygon points="37.5,81.6 37.5,66.4 40.4,63.5 55.6,63.5 52.1,68.5 43.9,68.5 42.5,69.9 42.5,78.1" fill="#4FDB85"/>
        <!-- 右下最暗刻面与内反光 -->
