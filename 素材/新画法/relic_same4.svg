<svg xmlns="http://www.w3.org/2000/svg" class="svg-relic_same4" viewBox="0 0 96 96" width="96" height="96">
<title>宝物 · 同色 ×4</title>
<style>
.svg-relic_same4 g { transform-box: view-box; }
.svg-relic_same4 #root { transform-origin: 48px 48px; }
.svg-relic_same4 #brooch_center { transform-origin: 48px 48px; }
@keyframes svg-relic_same4-idle-r {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,-1px) rotate(1.8deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-relic_same4-idle-c {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,0px) rotate(-3deg) scale(1.04,1.04); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-relic_same4:not([data-anim]) #root,
.svg-relic_same4[data-anim="idle"] #root { animation: svg-relic_same4-idle-r 3s infinite; }
.svg-relic_same4:not([data-anim]) #brooch_center,
.svg-relic_same4[data-anim="idle"] #brooch_center { animation: svg-relic_same4-idle-c 3s infinite; }
</style>
<defs>
  <clipPath id="relic_same4-cbase">
