  <!-- 胸针中心旧银花心铆扣座 -->
  <g id="brooch_center">
    <polygon points="48,36.5 59.5,48 48,59.5 36.5,48" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5" stroke-linejoin="round"/>
