<svg xmlns="http://www.w3.org/2000/svg" class="svg-card_art_shadow" viewBox="0 0 176 188" width="176" height="188">
<title>额外牌原画 · 影子</title>
<style>
.svg-card_art_shadow g { transform-box: view-box; }
.svg-card_art_shadow #ground_shadow { transform-origin: 96px 148px; }
.svg-card_art_shadow #main_card { transform-origin: 76px 146px; }
.svg-card_art_shadow #shadow_card { transform-origin: 126px 146px; opacity: 0; }

/* 待机 3000ms：0(0%) 静止/低位 → 1500(50%) 黑影像烛光下轻轻晃 → 3000(100%) 与0帧一致 */
@keyframes svg-card_art_shadow-idle-gsh {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(3px,-1.5px) rotate(-2.5deg) scale(1.04,0.96); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-card_art_shadow-idle-main {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,-2px) rotate(-1deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-card_art_shadow:not([data-anim]) #ground_shadow,
.svg-card_art_shadow[data-anim="idle"] #ground_shadow { animation: svg-card_art_shadow-idle-gsh 3s infinite; }
.svg-card_art_shadow:not([data-anim]) #main_card,
.svg-card_art_shadow[data-anim="idle"] #main_card { animation: svg-card_art_shadow-idle-main 3s infinite; }

/* play 600ms：0(0%) 静止 → 100(16.67%) 黑影从地上立起来 → 250(41.67%) 变成第二张一模一样的牌并排 → 400(66.67%) 停住 → 600(100%) 躺回地上 */
@keyframes svg-card_art_shadow-play-gsh {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 1; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  16.67% { transform: translate(10px,-18px) rotate(-14deg) scale(0.85,1.25); opacity: 0.82; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  41.67% { transform: translate(18px,-4px) rotate(0deg) scale(0.68,0.48); opacity: 0.25; animation-timing-function: linear; }
  66.67% { transform: translate(18px,-4px) rotate(0deg) scale(0.68,0.48); opacity: 0.25; animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 1; }
}
@keyframes svg-card_art_shadow-play-main {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  16.67% { transform: translate(-5px,1px) rotate(-2deg) scale(1.01,0.99); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  41.67% { transform: translate(-8px,-3px) rotate(-1.5deg) scale(1,1); animation-timing-function: linear; }
  66.67% { transform: translate(-8px,-3px) rotate(-1.5deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-card_art_shadow-play-scard {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  16.67% { transform: translate(-5px,6px) rotate(8deg) scale(0.95,0.8); opacity: 0.78; animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  41.67% { transform: translate(0px,-3px) rotate(1.5deg) scale(1,1); opacity: 1; animation-timing-function: linear; }
  66.67% { transform: translate(0px,-3px) rotate(1.5deg) scale(1,1); opacity: 1; animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; }
}
.svg-card_art_shadow[data-anim="play"] #ground_shadow { animation: svg-card_art_shadow-play-gsh 0.6s both; }
.svg-card_art_shadow[data-anim="play"] #main_card { animation: svg-card_art_shadow-play-main 0.6s both; }
.svg-card_art_shadow[data-anim="play"] #shadow_card { animation: svg-card_art_shadow-play-scard 0.6s both; }
</style>

<g id="root">
  <!-- 左上角 x:0..30, y:0..90 严格留空（main_card 左缘 x=46，左移 -8px 后 x=38 > 30） -->
  <ellipse cx="96" cy="158" rx="56" ry="9" fill="#0D111C" opacity="0.6"/>

  <!-- 1. 身后地上拖着的同形暗冷灰黑影 ground_shadow（用 #1E2C33 / #161221 / #3B515C，绝不用纯黑） -->
  <g id="ground_shadow">
    <polygon points="62,146 112,106 164,116 116,160" fill="#1E2C33" stroke="#1C1412" stroke-width="2.6" stroke-linejoin="round"/>
    <polygon points="68,144 113,110 156,118 114,155" fill="#161221" stroke="#3B515C" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M72,142 L76,139 M112,113 L117,114 M150,120 L146,123 M114,152 L109,150" stroke="#5A7682" stroke-width="1.4" stroke-linecap="round"/>
    <polygon points="113,120 128,125 126,138 111,146 98,139 100,126" fill="#262036" stroke="#3B515C" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="115" cy="128" r="4" fill="#3B515C"/>
    <polygon points="104,134 111,135 109,141 102,140" fill="#3B515C"/>
    <polygon points="119,134 124,141 115,141" fill="#3B515C"/>
    <path d="M122,154 L158,122" stroke="#8CAAB5" stroke-width="1.3" stroke-linecap="round" opacity="0.72"/>
  </g>

  <!-- 2. play 时黑影立起来变成的第二张一模一样的牌 shadow_card（沿新画法牌背范例绘制，平时 opacity: 0） -->
  <g id="shadow_card" opacity="0">
    <rect x="96" y="56" width="58" height="88" rx="5" transform="translate(.5 .8)" fill="#1C1412" stroke="#1C1412" stroke-width="4.6" stroke-linejoin="round"/>
    <rect x="96" y="56" width="58" height="88" rx="5" fill="#262036"/>
    <rect x="99.5" y="59.5" width="51" height="81" rx="3.5" fill="#161221" stroke="#9A7B46" stroke-width="1.6"/>
    <rect x="101.5" y="61.5" width="47" height="77" rx="2.5" fill="none" stroke="#9A7B46" stroke-width="1.3" stroke-dasharray="0.1 5.9927" stroke-linecap="round"/>
    <!-- 哥特 L 形铜角花与顶饰 -->
    <path d="M98,68 V58 H108 M142,58 H152 V68 M98,132 V142 H108 M142,142 H152 V132" fill="none" stroke="#C2A670" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="125,58 129,62 125,66 121,62" fill="#9A7B46" stroke="#1C1412" stroke-width="1"/>
    <polygon points="125,65 145,100 125,135 105,100" fill="none" stroke="#3A324D" stroke-width="1.1"/>
    <!-- 八角旧铜纹章盾 -->
    <polygon points="125,75 141,87 143,104 136,118 125,124 114,118 107,104 109,87" fill="#6E542B" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="125,79 137,89 138,103 132,114 125,119 118,114 112,103 113,89" fill="#161221" stroke="#9A7B46" stroke-width="1.1"/>
    <!-- 三颗带刻面宝石：红圆、绿切角方、蓝三角 -->
    <circle cx="125" cy="91" r="5.5" fill="#E3263A" stroke="#1C1412" stroke-width="1.4"/>
    <path d="M125,85.5 A5.5,5.5 0 0 0 119.5,91 L125,91 Z" fill="#FFA3AB"/>
    <circle cx="123.5" cy="89.5" r="1.4" fill="#F4F1FF"/>
    <rect x="114" y="100" width="9" height="9" rx="1.2" fill="#1DBF5E" stroke="#1C1412" stroke-width="1.4"/>
    <polygon points="114,100 123,100 118.5,104.5 114,104.5" fill="#A6F5C6"/>
    <polygon points="131.5,99 137.5,109.5 125.5,109.5" fill="#2E66F0" stroke="#1C1412" stroke-width="1.4" stroke-linejoin="round"/>
    <polygon points="131.5,99 131.5,106 125.5,109.5" fill="#B4C8FF"/>
    <!-- 幽冷轮廓光体现影牌身份 -->
    <rect x="96" y="56" width="58" height="88" rx="5" fill="none" stroke="#8CAAB5" stroke-width="1.6" opacity="0.75"/>
  </g>

  <!-- 3. 前方立着的旧牌 main_card（沿新画法牌背范例七层重绘） -->
  <g id="main_card">
    <rect x="46" y="56" width="58" height="88" rx="5" transform="translate(.5 .8)" fill="#1C1412" stroke="#1C1412" stroke-width="4.6" stroke-linejoin="round"/>
    <rect x="46" y="56" width="58" height="88" rx="5" fill="#262036"/>
    <path d="M47.5,72 V60 A3,3 0 0 1 50.5,57 H86" fill="none" stroke="#62577D" stroke-width="1.6"/>
    <rect x="49.5" y="59.5" width="51" height="81" rx="3.5" fill="#161221" stroke="#9A7B46" stroke-width="1.6"/>
    <rect x="51.5" y="61.5" width="47" height="77" rx="2.5" fill="none" stroke="#9A7B46" stroke-width="1.3" stroke-dasharray="0.1 5.9927" stroke-linecap="round"/>
    <!-- 哥特 L 形铜角花与顶饰 -->
    <path d="M48,68 V58 H58 M92,58 H102 V68 M48,132 V142 H58 M92,142 H102 V132" fill="none" stroke="#C2A670" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="75,58 79,62 75,66 71,62" fill="#9A7B46" stroke="#1C1412" stroke-width="1"/>
    <polygon points="75,134 79,138 75,142 71,138" fill="#6E542B" stroke="#1C1412" stroke-width="1"/>
    <polygon points="75,65 95,100 75,135 55,100" fill="none" stroke="#3A324D" stroke-width="1.1"/>
    <!-- 八角旧铜纹章盾 -->
    <polygon points="75,75 91,87 93,104 86,118 75,124 64,118 57,104 59,87" fill="#6E542B" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <path d="M59,103 L61,88 L75,77" fill="none" stroke="#C2A670" stroke-width="1.4" stroke-linecap="round"/>
    <polygon points="75,79 87,89 88,103 82,114 75,119 68,114 62,103 63,89" fill="#161221" stroke="#9A7B46" stroke-width="1.1"/>
    <!-- 三颗带刻面宝石：红圆、绿切角方、蓝三角 -->
    <circle cx="75" cy="91" r="5.5" fill="#E3263A" stroke="#1C1412" stroke-width="1.4"/>
    <path d="M75,85.5 A5.5,5.5 0 0 0 69.5,91 L75,91 Z" fill="#FFA3AB"/>
    <circle cx="73.5" cy="89.5" r="1.4" fill="#F4F1FF"/>
    <rect x="64" y="100" width="9" height="9" rx="1.2" fill="#1DBF5E" stroke="#1C1412" stroke-width="1.4"/>
    <polygon points="64,100 73,100 68.5,104.5 64,104.5" fill="#A6F5C6"/>
    <polygon points="81.5,99 87.5,109.5 75.5,109.5" fill="#2E66F0" stroke="#1C1412" stroke-width="1.4" stroke-linejoin="round"/>
    <polygon points="81.5,99 81.5,106 75.5,109.5" fill="#B4C8FF"/>
  </g>
</g>
</svg>
