<svg xmlns="http://www.w3.org/2000/svg" class="svg-card_art_potion" viewBox="0 0 176 188" width="176" height="188">
<title>额外牌原画 · 药水</title>
<style>
.svg-card_art_potion g { transform-box: view-box; }
.svg-card_art_potion #bottle_unit { transform-origin: 96px 124px; }
.svg-card_art_potion #ruby_liquid { transform-origin: 96px 136px; }
.svg-card_art_potion #cork { transform-origin: 96px 52px; }
.svg-card_art_potion #wood_tag { transform-origin: 116px 74px; }
.svg-card_art_potion #heart_light { transform-origin: 96px 56px; opacity: 0; }

/* 待机 3000ms：0(0%) 静止/低位 → 1500(50%) 液面轻轻晃，木牌微摆 → 3000(100%) 与0帧一致 */
@keyframes svg-card_art_potion-idle-liq {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,0px) rotate(-3.5deg) scale(1.02,0.98); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-card_art_potion-idle-tag {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,0px) rotate(4deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-card_art_potion:not([data-anim]) #ruby_liquid,
.svg-card_art_potion[data-anim="idle"] #ruby_liquid { animation: svg-card_art_potion-idle-liq 3s infinite; }
.svg-card_art_potion:not([data-anim]) #wood_tag,
.svg-card_art_potion[data-anim="idle"] #wood_tag { animation: svg-card_art_potion-idle-tag 3s infinite; }

/* play 600ms：0(0%) 静止 → 100(16.67%) 塞子啵地弹起 → 250(41.67%) 红心光冒出上飘、液面降到瓶底 → 400(66.67%) 停住/心形淡出 → 600(100%) 回到满瓶 */
@keyframes svg-card_art_potion-play-bottle {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  16.67% { transform: translate(0px,4px) rotate(0deg) scale(1.04,0.95); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  41.67% { transform: translate(0px,-2px) rotate(0deg) scale(0.98,1.02); animation-timing-function: linear; }
  66.67% { transform: translate(0px,-1px) rotate(0deg) scale(0.99,1.01); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-card_art_potion-play-cork {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  16.67% { transform: translate(-8px,-24px) rotate(-18deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  41.67% { transform: translate(-12px,-28px) rotate(-24deg) scale(1,1); animation-timing-function: linear; }
  66.67% { transform: translate(-10px,-22px) rotate(-16deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-card_art_potion-play-liq {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  16.67% { transform: translate(0px,2px) rotate(2deg) scale(1.02,0.92); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  41.67% { transform: translate(0px,24px) rotate(0deg) scale(0.84,0.32); animation-timing-function: linear; }
  66.67% { transform: translate(0px,24px) rotate(0deg) scale(0.84,0.32); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-card_art_potion-play-tag {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  16.67% { transform: translate(2px,3px) rotate(12deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  41.67% { transform: translate(0px,-2px) rotate(-10deg) scale(1,1); animation-timing-function: linear; }
  66.67% { transform: translate(0px,-1px) rotate(-6deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-card_art_potion-play-heart {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  16.67% { transform: translate(0px,-4px) rotate(0deg) scale(0.85,0.85); opacity: 0.9; animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  41.67% { transform: translate(0px,-20px) rotate(0deg) scale(1.08,1.08); opacity: 1; animation-timing-function: linear; }
  66.67% { transform: translate(0px,-24px) rotate(0deg) scale(0.95,0.95); opacity: 0.4; animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; }
}
.svg-card_art_potion[data-anim="play"] #bottle_unit { animation: svg-card_art_potion-play-bottle 0.6s both; }
.svg-card_art_potion[data-anim="play"] #cork { animation: svg-card_art_potion-play-cork 0.6s both; }
.svg-card_art_potion[data-anim="play"] #ruby_liquid { animation: svg-card_art_potion-play-liq 0.6s both; }
.svg-card_art_potion[data-anim="play"] #wood_tag { animation: svg-card_art_potion-play-tag 0.6s both; }
.svg-card_art_potion[data-anim="play"] #heart_light { animation: svg-card_art_potion-play-heart 0.6s both; }
</style>
<defs>
  <clipPath id="card_art_potion-cflask">
    <circle cx="96" cy="124" r="36"/>
  </clipPath>
  <radialGradient id="card_art_potion-hglow" cx="96" cy="52" r="22" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFA3AB" stop-opacity="0.72"/>
    <stop offset="0.6" stop-color="#E3263A" stop-opacity="0.28"/>
    <stop offset="1" stop-color="#6B0E1C" stop-opacity="0"/>
  </radialGradient>
</defs>

<g id="root">
  <!-- 左上角 x:0..30, y:0..90 严格留空（塞子弹起后最高 y=14，左缘 x=70 > 30） -->
  <ellipse cx="96" cy="168" rx="44" ry="8" fill="#0D111C" opacity="0.6"/>

  <!-- 1. 圆肚旧玻璃药瓶与内部红宝石色药液 bottle_unit -->
  <g id="bottle_unit">
    <!-- 瓶身七层旧玻璃外轮廓（墨色垫底 + 冷灰蓝暗玻璃底） -->
    <path d="M84,56 H108 V78 C126,84 138,102 138,124 C138,148 119,166 96,166 C73,166 54,148 54,124 C54,102 66,84 84,78 Z" transform="translate(.6 .9)" fill="#1C1412" stroke="#1C1412" stroke-width="5.6" stroke-linejoin="round"/>
    <path d="M84,56 H108 V78 C126,84 138,102 138,124 C138,148 119,166 96,166 C73,166 54,148 54,124 C54,102 66,84 84,78 Z" fill="#1E2C33"/>
    <!-- 玻璃内腔深底 -->
    <circle cx="96" cy="124" r="36" fill="#161221"/>

    <!-- 瓶内红宝石色液体 ruby_liquid（唯一鲜艳处，带液面椭圆与宝石能量内反光） -->
    <g clip-path="url(#card_art_potion-cflask)">
      <g id="ruby_liquid">
        <path d="M62,104 Q78,100 96,104 Q114,108 130,104 C132,112 132,120 131,126 C128,146 113,159 96,159 C79,159 64,146 61,126 C60,120 60,112 62,104 Z" fill="#E3263A"/>
        <path d="M98,104 Q114,108 130,104 C132,116 131,128 126,140 C120,152 108,159 96,159 Z" fill="#A8172A" opacity="0.82"/>
        <path d="M131,124 C129,144 114,158 96,159 L78,156 C106,154 122,143 128,122 Z" fill="#6B0E1C" opacity="0.85"/>
        <!-- 左上受光亮面与右下内反光 -->
        <path d="M63,106 Q78,103 92,106 C86,125 78,140 65,146 C60,134 60,118 63,106 Z" fill="#F4566A" opacity="0.85"/>
        <path d="M124,135 C120,147 109,154 96,155 C107,151 117,144 121,133 Z" fill="#FFA3AB" opacity="0.65"/>
        <!-- 液面椭圆（亮粉红边与墨线） -->
        <ellipse cx="96" cy="104" rx="33.5" ry="6.2" fill="#F4566A" stroke="#1C1412" stroke-width="2"/>
        <path d="M67,103 Q82,99.5 104,101.5" fill="none" stroke="#FFA3AB" stroke-width="2" stroke-linecap="round"/>
        <!-- 药液内悬浮的三颗微小宝石光泡 -->
        <circle cx="80" cy="126" r="3" fill="#FFA3AB" opacity="0.88"/>
        <circle cx="106" cy="136" r="2.2" fill="#F4F1FF" opacity="0.85"/>
        <circle cx="88" cy="144" r="1.8" fill="#FFA3AB" opacity="0.8"/>
      </g>
    </g>

    <!-- 玻璃瓶身表面斜反光带、左亮弧、右冷光、划痕与崩角（压在药液之上） -->
    <path d="M60,124 A36,36 0 0 1 82,91" fill="none" stroke="#8CAAB5" stroke-width="3.6" stroke-linecap="round" opacity="0.72"/>
    <circle cx="62" cy="136" r="2.4" fill="#F4F1FF" opacity="0.82"/>
    <path d="M132,126 A36,36 0 0 1 106,158" fill="none" stroke="#8CAAB5" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <!-- 玻璃划痕与小崩角 -->
    <path d="M112,98 Q119,106 123,115 Q117,107 112,98 Z" fill="#E2D6BA" opacity="0.7"/>
    <polygon points="54,120 58,118 57,123" fill="#1C1412"/>
    <!-- 瓶口厚玻璃唇边 -->
    <rect x="80" y="54" width="32" height="9" rx="3.5" fill="#3B515C" stroke="#1C1412" stroke-width="2.6"/>
    <path d="M83,56.5 H106" stroke="#8CAAB5" stroke-width="1.6" stroke-linecap="round"/>

    <!-- 瓶颈麻绳与空白小木牌 wood_tag（按需求：不写字） -->
    <path d="M83,70 Q96,74 110,70" fill="none" stroke="#1C1412" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M83,70 Q96,74 110,70" fill="none" stroke="#9A8968" stroke-width="2" stroke-dasharray="3.5 2.5" stroke-linecap="round"/>
    <g id="wood_tag">
      <line x1="110" y1="70" x2="122" y2="82" stroke="#1C1412" stroke-width="3.6" stroke-linecap="round"/>
      <line x1="110" y1="70" x2="122" y2="82" stroke="#9A8968" stroke-width="1.6" stroke-linecap="round"/>
      <polygon points="116,80 138,76 144,104 120,108" transform="translate(.4 .6)" fill="#1C1412" stroke="#1C1412" stroke-width="4" stroke-linejoin="round"/>
      <polygon points="116,80 138,76 144,104 120,108" fill="#704122"/>
      <polygon points="116,80 132,77 136,96 118,99" fill="#9E6238"/>
      <path d="M118,82 L135,79" stroke="#C48A5C" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="123" cy="84" r="1.8" fill="#1C1412"/>
    </g>
  </g>

  <!-- 2. 软木塞 cork（七层浅木/旧纸色阶，带气孔与裂纹） -->
  <g id="cork">
    <polygon points="84,38 108,38 105,56 87,56" transform="translate(.4 .6)" fill="#1C1412" stroke="#1C1412" stroke-width="4.2" stroke-linejoin="round"/>
    <polygon points="84,38 108,38 105,56 87,56" fill="#9A8968"/>
    <polygon points="84,38 101,38 99,56 87,56" fill="#C8B894"/>
    <polygon points="101,38 108,38 105,56 99,56" fill="#524531" opacity="0.8"/>
    <path d="M86,40.5 H102" stroke="#E2D6BA" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="91" cy="46" r="1.2" fill="#524531"/>
    <circle cx="98" cy="50" r="1" fill="#524531"/>
    <path d="M95,38 L94,44" stroke="#1C1412" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- 3. play 时从瓶口冒出来往上飘的红宝石心形光 heart_light（参照 ui_heart 刻面心形，上飘 -24px 后顶缘 y=14 >= 0） -->
  <g id="heart_light" opacity="0">
    <circle cx="96" cy="52" r="22" fill="url(#card_art_potion-hglow)"/>
    <path d="M96,68 C84,58 76,50 76,42 C76,36 81,32 87,32 C91,32 94,34 96,38 C98,34 101,32 105,32 C111,32 116,36 116,42 C116,50 108,58 96,68 Z" fill="#E3263A" stroke="#1C1412" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M96,38 C94,34 91,32 87,32 C81,32 76,36 76,42 C76,48 82,54 90,61 L96,50 Z" fill="#FFA3AB"/>
    <polygon points="96,40 106,42 104,53 96,60 88,53 86,42" fill="#F4566A"/>
    <circle cx="85" cy="39" r="2.2" fill="#F4F1FF"/>
  </g>
</g>
</svg>
