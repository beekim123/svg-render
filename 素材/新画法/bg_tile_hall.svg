<svg xmlns="http://www.w3.org/2000/svg" class="svg-bg_tile_hall" viewBox="0 0 512 512" width="512" height="512">
<title>整屏背景 · 长廊旧壁纸</title>
<style>
.svg-bg_tile_hall g { transform-box: view-box; }
.svg-bg_tile_hall #sheen { opacity: 0; }

/* 待机 3000：0 静止 → 1500 壁纸暗花丝绒微光最亮 → 3000 回到静止。平铺边与条纹完全固定 */
@keyframes svg-bg_tile_hall-idle-1 {
  0% { opacity: 0; animation-timing-function: ease-in-out; }
  50% { opacity: 1; animation-timing-function: ease-in-out; }
  100% { opacity: 0; }
}
.svg-bg_tile_hall:not([data-anim]) #sheen,
.svg-bg_tile_hall[data-anim="idle"] #sheen { animation: svg-bg_tile_hall-idle-1 3s infinite; }
</style>
