<svg xmlns="http://www.w3.org/2000/svg" class="svg-fx_attack" viewBox="0 0 320 320" width="320" height="320">
<title>特效 · 怪出手打到你</title>
<style>
.svg-fx_attack g { transform-box: view-box; }
.svg-fx_attack #claw_1 { transform-origin: 140px 120px; opacity: 0; }
.svg-fx_attack #claw_2 { transform-origin: 160px 160px; opacity: 0; }
.svg-fx_attack #claw_3 { transform-origin: 180px 200px; opacity: 0; }
.svg-fx_attack #slash_sparks { transform-origin: 160px 160px; opacity: 0; }

/* play 500ms：0(0%) 全透明 → 60(12%) 快速横扫显形 → 160(32%) 三爪峰值到位 → 300(60%) 划痕拉伸衰减 → 500(100%) 全透明 */
@keyframes svg-fx_attack-play-c1 {
  0% { transform: translate(24px,-20px) rotate(-3deg) scale(0.68,0.68); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  12% { transform: translate(2px,-2px) rotate(0deg) scale(1.03,1.03); opacity: 1; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  32% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 1; animation-timing-function: ease-in-out; }
  60% { transform: translate(-6px,5px) rotate(1deg) scale(0.97,0.97); opacity: 0.78; animation-timing-function: linear; }
  100% { transform: translate(-12px,10px) rotate(2deg) scale(0.92,0.92); opacity: 0; }
}
.svg-fx_attack[data-anim="play"] #claw_1 { animation: svg-fx_attack-play-c1 0.5s both; }

@keyframes svg-fx_attack-play-c2 {
  0% { transform: translate(28px,-24px) rotate(-4deg) scale(0.65,0.65); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  12% { transform: translate(4px,-3px) rotate(0deg) scale(0.96,0.96); opacity: 0.95; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  32% { transform: translate(0px,0px) rotate(0deg) scale(1.04,1.04); opacity: 1; animation-timing-function: ease-in-out; }
  60% { transform: translate(-8px,6px) rotate(1deg) scale(0.98,0.98); opacity: 0.82; animation-timing-function: linear; }
  100% { transform: translate(-14px,12px) rotate(2deg) scale(0.92,0.92); opacity: 0; }
}
.svg-fx_attack[data-anim="play"] #claw_2 { animation: svg-fx_attack-play-c2 0.5s both; }

@keyframes svg-fx_attack-play-c3 {
  0% { transform: translate(24px,-20px) rotate(-3deg) scale(0.68,0.68); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  12% { transform: translate(6px,-5px) rotate(0deg) scale(0.92,0.92); opacity: 0.88; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  32% { transform: translate(0px,0px) rotate(0deg) scale(1.02,1.02); opacity: 1; animation-timing-function: ease-in-out; }
  60% { transform: translate(-6px,5px) rotate(1deg) scale(0.97,0.97); opacity: 0.8; animation-timing-function: linear; }
  100% { transform: translate(-12px,10px) rotate(2deg) scale(0.92,0.92); opacity: 0; }
}
.svg-fx_attack[data-anim="play"] #claw_3 { animation: svg-fx_attack-play-c3 0.5s both; }

@keyframes svg-fx_attack-play-sparks {
  0% { transform: translate(12px,-10px) rotate(0deg) scale(0.55,0.55); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  12% { transform: translate(3px,-2px) rotate(0deg) scale(0.92,0.92); opacity: 0.9; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  32% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 1; animation-timing-function: ease-in-out; }
  60% { transform: translate(-6px,5px) rotate(0deg) scale(1.06,1.06); opacity: 0.72; animation-timing-function: linear; }
  100% { transform: translate(-10px,8px) rotate(0deg) scale(1.1,1.1); opacity: 0; }
}
.svg-fx_attack[data-anim="play"] #slash_sparks { animation: svg-fx_attack-play-sparks 0.5s both; }
</style>
<g id="root">
  <!-- 第 1 道爪痕 (#claw_1，左上侧：曲线收尖柳叶形 + 旧纸浅边 + 冷光棱，无血无红) -->
  <g id="claw_1">
    <!-- 浅色外薄边 (#E2D6BA) 与墨色轮廓 -->
    <path d="M236,36 C192,62 142,102 98,144 L92,139 L78,159 C62,175 47,194 34,214 C56,198 80,178 104,156 L111,161 L126,141 C166,104 204,68 236,36 Z" fill="#E2D6BA" stroke="#1C1412" stroke-width="2.4" stroke-linejoin="round"/>
    <!-- 焦茶近黑核心深爪痕（两头收尖） -->
    <path d="M230,41 C188,68 140,108 98,148 L93,144 L81,161 C66,176 52,193 41,208 C61,192 84,172 105,152 L110,156 L123,139 C162,103 198,70 230,41 Z" fill="#1C1412"/>
    <!-- 左上冷灰青锋利刮痕亮线 -->
    <path d="M216,49 Q152,98 84,162 Q150,95 216,49 Z" fill="#8CAAB5" opacity="0.85"/>
  </g>

  <!-- 第 2 道主爪痕 (#claw_2，正中最长最猛：带两处撕裂缺口与分层浅边) -->
  <g id="claw_2">
    <path d="M276,44 C228,78 182,118 146,148 L138,142 L120,168 C90,196 58,228 30,264 C62,238 98,208 134,176 L142,182 L162,156 C204,120 244,82 276,44 Z" fill="#E6DEC8" stroke="#1C1412" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M268,51 C222,85 178,123 144,152 L137,147 L121,170 C93,196 64,225 39,255 C69,230 102,202 135,172 L142,177 L159,153 C199,119 238,84 268,51 Z" fill="#1C1412"/>
    <path d="M252,61 Q174,126 90,204 Q171,123 252,61 Z" fill="#8CAAB5" opacity="0.88"/>
  </g>

  <!-- 第 3 道爪痕 (#claw_3，右下侧) -->
  <g id="claw_3">
    <path d="M284,100 C244,132 198,170 154,210 L148,205 L134,224 C114,244 95,264 78,284 C102,266 128,244 156,220 L162,225 L177,206 C216,171 254,136 284,100 Z" fill="#E2D6BA" stroke="#1C1412" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M276,107 C238,138 194,175 153,213 L148,209 L136,225 C118,243 101,260 86,277 C108,259 132,239 157,217 L162,221 L175,204 C212,171 248,138 276,107 Z" fill="#1C1412"/>
    <path d="M262,117 Q194,175 124,240 Q191,172 262,117 Z" fill="#8CAAB5" opacity="0.85"/>
  </g>

  <!-- 划击迸出的墨色尖刺与浅木/旧纸刮屑 (#slash_sparks，无星爆、无红血) -->
  <g id="slash_sparks">
    <polygon points="154,142 130,125 143,152" fill="#E2D6BA" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
    <polygon points="178,168 203,183 189,157" fill="#8CAAB5" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
    <polygon points="114,188 91,175 104,200" fill="#1C1412" stroke="#E2D6BA" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="208,118 229,131 218,107" fill="#1C1412" stroke="#E2D6BA" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- 四道收尖飞溅划丝 -->
    <path d="M102,120 Q88,110 74,102 Q89,114 102,120 Z M222,196 Q236,206 250,214 Q235,202 222,196 Z M138,226 Q128,240 120,254 Q132,240 138,226 Z M190,88 Q200,74 208,62 Q196,74 190,88 Z" fill="#E2D6BA" stroke="#1C1412" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
</g>
</svg>
