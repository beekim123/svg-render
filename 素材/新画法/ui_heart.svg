<svg xmlns="http://www.w3.org/2000/svg" class="svg-ui_heart" viewBox="0 0 64 64" width="64" height="64">
<title>心</title>
<style>
.svg-ui_heart g { transform-box: view-box; }
.svg-ui_heart #root { transform-origin: 32px 34px; }
.svg-ui_heart #gem_intact { transform-origin: 32px 35px; }
.svg-ui_heart #dark_overlay,
.svg-ui_heart #shards_fall,
.svg-ui_heart #gain_flash { transform-origin: 32px 35px; opacity: 0; }
.svg-ui_heart .sh1 { transform-origin: 25px 34px; }
.svg-ui_heart .sh2 { transform-origin: 39px 35px; }
.svg-ui_heart .sh3 { transform-origin: 32px 42px; }

/* 待机 3000：0 静止 → 1400 静止 → 1500 宝石胀 4%（很轻的一下心跳）→ 1650 回到原样 → 3000 */
@keyframes svg-ui_heart-idle-1 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: linear; }
  46.67% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  50% { transform: translate(0px,0px) rotate(0deg) scale(1.04,1.04); animation-timing-function: ease-in-out; }
  55% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: linear; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-ui_heart:not([data-anim]) #gem_intact,
.svg-ui_heart[data-anim="idle"] #gem_intact { animation: svg-ui_heart-idle-1 3s infinite; }

/* lose 600：0 原样 → 80 宝石裂开到位 → 200 停住，碎片开始往下掉 → 450 碎片落下，挂坠整个暗掉 → 600 全透明 */
@keyframes svg-ui_heart-lose-1 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 1; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  13.33% { transform: translate(-2px,0.5px) rotate(-3deg) scale(1.03,0.96); opacity: 1; animation-timing-function: linear; }
  33.33% { transform: translate(-2px,0.5px) rotate(-3deg) scale(1.03,0.96); opacity: 1; animation-timing-function: ease-in-out; }
  75% { transform: translate(0px,2.5px) rotate(1deg) scale(0.97,0.97); opacity: 0.75; animation-timing-function: linear; }
  100% { transform: translate(0px,3.5px) rotate(0deg) scale(0.95,0.95); opacity: 0; }
}
.svg-ui_heart[data-anim="lose"] #root { animation: svg-ui_heart-lose-1 0.6s both; }
@keyframes svg-ui_heart-lose-2 {
  0% { opacity: 1; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  13.33% { opacity: 0.35; animation-timing-function: linear; }
  33.33% { opacity: 0.25; animation-timing-function: ease-in-out; }
  75% { opacity: 0; animation-timing-function: linear; }
  100% { opacity: 0; }
}
.svg-ui_heart[data-anim="lose"] #gem_intact { animation: svg-ui_heart-lose-2 0.6s both; }
@keyframes svg-ui_heart-lose-3 {
  0% { opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  13.33% { opacity: 0.85; animation-timing-function: linear; }
  33.33% { opacity: 0.9; animation-timing-function: ease-in-out; }
  75% { opacity: 1; animation-timing-function: linear; }
  100% { opacity: 1; }
}
.svg-ui_heart[data-anim="lose"] #dark_overlay { animation: svg-ui_heart-lose-3 0.6s both; }
@keyframes svg-ui_heart-lose-4 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(0.9,0.9); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  13.33% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 1; animation-timing-function: linear; }
  33.33% { transform: translate(0px,1px) rotate(0deg) scale(1,1); opacity: 1; animation-timing-function: ease-in-out; }
  75% { transform: translate(0px,8px) rotate(0deg) scale(0.92,0.92); opacity: 0.85; animation-timing-function: linear; }
  100% { transform: translate(0px,10px) rotate(0deg) scale(0.85,0.85); opacity: 0; }
}
.svg-ui_heart[data-anim="lose"] #shards_fall { animation: svg-ui_heart-lose-4 0.6s both; }
@keyframes svg-ui_heart-lose-5 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  13.33% { transform: translate(-1.5px,-0.5px) rotate(-6deg) scale(1,1); animation-timing-function: linear; }
  33.33% { transform: translate(-1.5px,0px) rotate(-6deg) scale(1,1); animation-timing-function: ease-in-out; }
  75% { transform: translate(-4px,4px) rotate(-18deg) scale(0.9,0.9); animation-timing-function: linear; }
  100% { transform: translate(-5px,5px) rotate(-22deg) scale(0.85,0.85); }
}
.svg-ui_heart[data-anim="lose"] .sh1 { animation: svg-ui_heart-lose-5 0.6s both; }
@keyframes svg-ui_heart-lose-6 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  13.33% { transform: translate(1.5px,-0.5px) rotate(6deg) scale(1,1); animation-timing-function: linear; }
  33.33% { transform: translate(1.5px,0px) rotate(6deg) scale(1,1); animation-timing-function: ease-in-out; }
  75% { transform: translate(4px,4px) rotate(18deg) scale(0.9,0.9); animation-timing-function: linear; }
  100% { transform: translate(5px,5px) rotate(22deg) scale(0.85,0.85); }
}
.svg-ui_heart[data-anim="lose"] .sh2 { animation: svg-ui_heart-lose-6 0.6s both; }
@keyframes svg-ui_heart-lose-7 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  13.33% { transform: translate(0px,1px) rotate(2deg) scale(1,1); animation-timing-function: linear; }
  33.33% { transform: translate(0px,1.5px) rotate(2deg) scale(1,1); animation-timing-function: ease-in-out; }
  75% { transform: translate(0px,5px) rotate(-10deg) scale(0.9,0.9); animation-timing-function: linear; }
  100% { transform: translate(0px,6px) rotate(-14deg) scale(0.85,0.85); }
}
.svg-ui_heart[data-anim="lose"] .sh3 { animation: svg-ui_heart-lose-7 0.6s both; }

/* gain 500：0 缩到 0 → 150 弹出来（比原样大 15%，宝石闪一下）→ 250 停住 → 500 回到原样 */
@keyframes svg-ui_heart-gain-8 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(0,0); opacity: 0; animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  30% { transform: translate(0px,0px) rotate(0deg) scale(1.08,1.08); opacity: 1; animation-timing-function: linear; }
  50% { transform: translate(0px,0px) rotate(0deg) scale(1.08,1.08); opacity: 1; animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 1; }
}
.svg-ui_heart[data-anim="gain"] #root { animation: svg-ui_heart-gain-8 0.5s both; }
@keyframes svg-ui_heart-gain-9 {
  0% { opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  30% { opacity: 1; animation-timing-function: linear; }
  50% { opacity: 0.75; animation-timing-function: ease-in-out; }
  100% { opacity: 0; }
}
.svg-ui_heart[data-anim="gain"] #gain_flash { animation: svg-ui_heart-gain-9 0.5s both; }
</style>
<defs>
<clipPath id="ui_heart-cframe">
  <path d="M32,18.5 C27.5,12.5 18.5,11.5 12.5,16.5 C6.8,21.5 6.8,31.5 12.5,38.5 C18.5,45.8 26.5,52 32,57.5 C37.5,52 45.5,45.8 51.5,38.5 C57.2,31.5 57.2,21.5 51.5,16.5 C45.5,11.5 36.5,12.5 32,18.5 Z"/>
</clipPath>
<clipPath id="ui_heart-cgem">
  <path d="M32,22.5 C28.5,17.5 21,16.8 16.5,20.8 C12,24.8 12.2,32.2 16.8,37.5 C21.5,43 27.8,47.8 32,52 C36.2,47.8 42.5,43 47.2,37.5 C51.8,32.2 52,24.8 47.5,20.8 C43,16.8 35.5,17.5 32,22.5 Z"/>
</clipPath>
</defs>

<g id="root">
  <!-- 顶上旧铜小挂环与环座 -->
  <path d="M26.5,9.5 A5.5,5.5 0 1 1 37.5,9.5 A5.5,5.5 0 1 1 26.5,9.5 Z M29.5,9.5 A2.5,2.5 0 1 0 34.5,9.5 A2.5,2.5 0 1 0 29.5,9.5 Z" transform="translate(.4 .6)" fill="#1C1412" fill-rule="evenodd" stroke="#1C1412" stroke-width="4.4"/>
  <path d="M26.5,9.5 A5.5,5.5 0 1 1 37.5,9.5 A5.5,5.5 0 1 1 26.5,9.5 Z M29.5,9.5 A2.5,2.5 0 1 0 34.5,9.5 A2.5,2.5 0 1 0 29.5,9.5 Z" fill="#9A7B46" fill-rule="evenodd"/>
  <path d="M28,6.5 A4.5,4.5 0 0 1 34,5.2" fill="none" stroke="#DDCB9A" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M28.5,13.2 H35.5 L36.2,17.8 H27.8 Z" fill="#6E542B" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M29.4,14 H32.2 V16.8 H29 Z" fill="#C2A670"/>

  <!-- 旧铜心形挂坠外框（七层画法） -->
  <!-- 第 1 层：墨色垫底 -->
  <path d="M32,18.5 C27.5,12.5 18.5,11.5 12.5,16.5 C6.8,21.5 6.8,31.5 12.5,38.5 C18.5,45.8 26.5,52 32,57.5 C37.5,52 45.5,45.8 51.5,38.5 C57.2,31.5 57.2,21.5 51.5,16.5 C45.5,11.5 36.5,12.5 32,18.5 Z" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5.6" stroke-linejoin="round"/>
  <!-- 第 2 层：铺旧铜“暗”一档 -->
  <path d="M32,18.5 C27.5,12.5 18.5,11.5 12.5,16.5 C6.8,21.5 6.8,31.5 12.5,38.5 C18.5,45.8 26.5,52 32,57.5 C37.5,52 45.5,45.8 51.5,38.5 C57.2,31.5 57.2,21.5 51.5,16.5 C45.5,11.5 36.5,12.5 32,18.5 Z" fill="#6E542B"/>

  <g clip-path="url(#ui_heart-cframe)">
    <!-- 第 3 层：错位亮面 -->
    <path d="M32,18.5 C27.5,12.5 18.5,11.5 12.5,16.5 C6.8,21.5 6.8,31.5 12.5,38.5 C18.5,45.8 26.5,52 32,57.5 C37.5,52 45.5,45.8 51.5,38.5 C57.2,31.5 57.2,21.5 51.5,16.5 C45.5,11.5 36.5,12.5 32,18.5 Z" transform="translate(-3 -3)" fill="#9A7B46"/>
    <!-- 第 4 层：右下加深 -->
    <path d="M56,24 C57,33 50,43 32,57.5 L57,58 Z" fill="#3B2B14" opacity="0.8"/>
    <!-- 第 5 层：左上受光边与右下冷色轮廓光 -->
    <path d="M9.6,31 C8.5,24.5 11.2,18.5 16.5,15.5 C21,13.2 26,14.2 29.8,17.8 C25.5,15.8 20.8,15.5 17,17.5 C12.5,20 10.5,25.2 9.6,31 Z" fill="#C2A670"/>
    <path d="M53.8,29.5 C53.2,34.5 49.8,39.5 43.5,45.5 C48.5,39.5 51.6,34.5 53.8,29.5 Z" fill="#8CAAB5" opacity="0.82"/>
    <!-- 第 6 层：高光点、一处铜绿与细铸纹珠边 -->
    <circle cx="15.5" cy="17.2" r="1.5" fill="#DDCB9A"/>
    <path d="M44,43 C47,40 50,36 51,32" fill="none" stroke="#5F8272" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    <!-- 铜边一圈细铸纹珠点 -->
    <path d="M32,20.2 C28,14.8 19.8,14 14.5,18.5 C9.5,22.8 9.5,31.2 14.5,37.2 C19.8,43.5 27,49 32,54.2 C37,49 44.2,43.5 49.5,37.2 C54.5,31.2 54.5,22.8 49.5,18.5 C44.2,14 36,14.8 32,20.2 Z" fill="none" stroke="#3B2B14" stroke-width="2.1" stroke-dasharray="0.1 4.2" stroke-linecap="round"/>
    <path d="M32,20.2 C28,14.8 19.8,14 14.5,18.5 C9.5,22.8 9.5,31.2 14.5,37.2 C19.8,43.5 27,49 32,54.2 C37,49 44.2,43.5 49.5,37.2 C54.5,31.2 54.5,22.8 49.5,18.5 C44.2,14 36,14.8 32,20.2 Z" fill="none" stroke="#C2A670" stroke-width="1.3" stroke-dasharray="0.1 4.2" stroke-linecap="round"/>
  </g>

  <!-- 镶嵌空槽暗底（lose 时露出） -->
  <path d="M32,22.5 C28.5,17.5 21,16.8 16.5,20.8 C12,24.8 12.2,32.2 16.8,37.5 C21.5,43 27.8,47.8 32,52 C36.2,47.8 42.5,43 47.2,37.5 C51.8,32.2 52,24.8 47.5,20.8 C43,16.8 35.5,17.5 32,22.5 Z" fill="#161221" stroke="#1C1412" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- 嵌在里面的心形红宝石 gem_intact（平色多边形刻面 + #FFA3AB 细棱，无墨线棱） -->
  <g id="gem_intact">
    <path d="M32,22.5 C28.5,17.5 21,16.8 16.5,20.8 C12,24.8 12.2,32.2 16.8,37.5 C21.5,43 27.8,47.8 32,52 C36.2,47.8 42.5,43 47.2,37.5 C51.8,32.2 52,24.8 47.5,20.8 C43,16.8 35.5,17.5 32,22.5 Z" fill="#E3263A"/>
    <g clip-path="url(#ui_heart-cgem)">
      <!-- 左上受光刻面群 -->
      <polygon points="32,22.5 24,17 15,21 22.5,27 32,28.5" fill="#F4566A"/>
      <polygon points="15,21 12,28.5 16.8,37.5 22,35.5 22.5,27" fill="#F4566A"/>
      <polygon points="24,17 15,21 22.5,27" fill="#FFA3AB"/>
      <!-- 右上与右侧刻面群 -->
      <polygon points="32,22.5 40,17 49,21 41.5,27 32,28.5" fill="#E3263A"/>
      <polygon points="49,21 52,28.5 47.2,37.5 42,35.5 41.5,27" fill="#A8172A"/>
      <!-- 下半截暗部刻面群与右下内反光 -->
      <polygon points="16.8,37.5 22,35.5 32,43.5 32,52" fill="#A8172A"/>
      <polygon points="47.2,37.5 42,35.5 32,43.5 32,52" fill="#6B0E1C"/>
      <polygon points="45.5,39 36,48.5 32,43.5 42,35.5" fill="#F4566A" opacity="0.55"/>
      <!-- 中央心形台面与左上亮区 -->
      <polygon points="32,28.5 22.5,25.5 20.5,31.5 22,35.5 32,43.5 42,35.5 43.5,31.5 41.5,25.5" fill="#E3263A"/>
      <polygon points="32,28.5 22.5,25.5 20.5,31.5 22,35.5 29,34.5" fill="#F4566A" opacity="0.72"/>
      <!-- 刻面之间的高光细棱线（#FFA3AB） -->
      <path d="M32,28.5 L22.5,25.5 L20.5,31.5 L22,35.5 L32,43.5 L42,35.5 L43.5,31.5 L41.5,25.5 Z M32,22.5 L32,28.5 M24,17.5 L22.5,25.5 M15,21 L20.5,31.5 M16.8,37.5 L22,35.5 M32,52 L32,43.5 M47.2,37.5 L42,35.5 M49,21 L43.5,31.5 M40,17.5 L41.5,25.5" fill="none" stroke="#FFA3AB" stroke-width="0.65" stroke-linejoin="round" opacity="0.65"/>
      <!-- 左上沿白亮边 -->
      <path d="M14,29 C13.8,24.2 17,20 22.5,18.8 C25.5,18.2 28.2,19.2 30.5,21.5 C27.8,20.2 25,19.8 22.5,20.4 C17.8,21.5 15.2,24.8 14,29 Z" fill="#F4F1FF" opacity="0.92"/>
    </g>
    <!-- 宝石外圈墨线与高光点 -->
    <path d="M32,22.5 C28.5,17.5 21,16.8 16.5,20.8 C12,24.8 12.2,32.2 16.8,37.5 C21.5,43 27.8,47.8 32,52 C36.2,47.8 42.5,43 47.2,37.5 C51.8,32.2 52,24.8 47.5,20.8 C43,16.8 35.5,17.5 32,22.5 Z" fill="none" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="21.5" cy="24.2" r="2.2" fill="#F4F1FF"/>
    <circle cx="25.2" cy="27.5" r="1" fill="#F4F1FF" opacity="0.85"/>
  </g>

  <!-- 三个包边旧铜爪托 -->
  <g stroke="#1C1412" stroke-width="1.5" stroke-linejoin="round">
    <polygon points="11.5,26.5 16.2,25.5 16.2,29.5 11.5,29.5" fill="#C2A670"/>
    <polygon points="52.5,26.5 47.8,25.5 47.8,29.5 52.5,29.5" fill="#9A7B46"/>
    <polygon points="29.5,53 32,49.2 34.5,53 32,56.5" fill="#9A7B46"/>
  </g>

  <!-- lose 状态：变暗遮罩与裂纹（平时 opacity: 0） -->
  <g id="dark_overlay">
    <path d="M32,18.5 C27.5,12.5 18.5,11.5 12.5,16.5 C6.8,21.5 6.8,31.5 12.5,38.5 C18.5,45.8 26.5,52 32,57.5 C37.5,52 45.5,45.8 51.5,38.5 C57.2,31.5 57.2,21.5 51.5,16.5 C45.5,11.5 36.5,12.5 32,18.5 Z" fill="#161221" opacity="0.72"/>
    <path d="M24,19 L33.5,30.5 L26.5,37.5 L34.5,49 M33.5,30.5 L45.5,26.5 M26.5,37.5 L17,34" fill="none" stroke="#1C1412" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- lose 状态：往下掉落的三片带刻面红宝石碎片（平时 opacity: 0，落点严格在画框内） -->
  <g id="shards_fall">
    <g class="sh1">
      <polygon points="19,31 28,28.5 29.5,36.5 21,38" fill="#E3263A" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
      <polygon points="19.8,31.5 27.2,29.5 24.5,34.5" fill="#F4566A"/>
    </g>
    <g class="sh2">
      <polygon points="34.5,31.5 43.5,29.5 42,38.5 34,37.5" fill="#A8172A" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
      <polygon points="35.2,32 42.5,30.5 38.5,35" fill="#E3263A"/>
    </g>
    <g class="sh3">
      <polygon points="26.5,39.5 36.5,39 32,48.5" fill="#6B0E1C" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
      <polygon points="27.5,40.2 33.5,40 31.5,45.5" fill="#E3263A"/>
    </g>
  </g>

  <!-- gain 状态：弹出来时宝石闪一下（平时 opacity: 0） -->
  <g id="gain_flash">
    <path d="M32,22.5 C28.5,17.5 21,16.8 16.5,20.8 C12,24.8 12.2,32.2 16.8,37.5 C21.5,43 27.8,47.8 32,52 C36.2,47.8 42.5,43 47.2,37.5 C51.8,32.2 52,24.8 47.5,20.8 C43,16.8 35.5,17.5 32,22.5 Z" fill="#F4F1FF" opacity="0.7"/>
    <path d="M21,14 Q22.2,19.8 28,21 Q22.2,22.2 21,28 Q19.8,22.2 14,21 Q19.8,19.8 21,14 Z M45,35 Q45.8,38.8 49.5,39.5 Q45.8,40.2 45,44 Q44.2,40.2 40.5,39.5 Q44.2,38.8 45,35 Z" fill="#F4F1FF"/>
  </g>
</g>
</svg>
