<svg xmlns="http://www.w3.org/2000/svg" class="svg-ui_node_door" viewBox="0 0 64 64" width="64" height="64">
<title>进度节点 · 挑门</title>
<style>
.svg-ui_node_door g { transform-box: view-box; }
.svg-ui_node_door #root { transform-origin: 32px 32px; }
.svg-ui_node_door #arch_door { transform-origin: 32px 32px; }
.svg-ui_node_door #sheen { opacity: 0; }

/* idle 3000ms: 0 -> 1500 -> 3000 */
@keyframes svg-ui_node_door-idle-door {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,-0.5px) rotate(0deg) scale(1.02,1.02); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-ui_node_door-idle-sheen {
  0% { opacity: 0; animation-timing-function: ease-in-out; }
  50% { opacity: 0.85; animation-timing-function: ease-in-out; }
  100% { opacity: 0; }
}
.svg-ui_node_door:not([data-anim]) #arch_door,
.svg-ui_node_door[data-anim="idle"] #arch_door {
  animation: svg-ui_node_door-idle-door 3s infinite;
}
.svg-ui_node_door:not([data-anim]) #sheen,
.svg-ui_node_door[data-anim="idle"] #sheen {
  animation: svg-ui_node_door-idle-sheen 3s infinite;
}
</style>
<defs>
  <clipPath id="ui_node_door-cbase">
    <path d="M32,7 C46,7 57,18 57,32 C57,46 46,57 32,57 C18,57 7,46 7,32 C7,18 18,7 32,7 Z"/>
  </clipPath>
</defs>
<g id="root">
  <!-- 统一规格暗色小圆底（七层画法，与 ui_node_fight、ui_node_elite 完全同款同粗线宽） -->
  <path d="M32,7 C46,7 57,18 57,32 C57,46 46,57 32,57 C18,57 7,46 7,32 C7,18 18,7 32,7 Z" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5.6" stroke-linejoin="round"/>
  <path d="M32,7 C46,7 57,18 57,32 C57,46 46,57 32,57 C18,57 7,46 7,32 C7,18 18,7 32,7 Z" fill="#6E542B"/>
  <g clip-path="url(#ui_node_door-cbase)">
    <path d="M32,7 C46,7 57,18 57,32 C57,46 46,57 32,57 C18,57 7,46 7,32 C7,18 18,7 32,7 Z" transform="translate(-3 -3)" fill="#9A7B46"/>
    <path d="M57,28 C57,45 45,57 28,57 C43,53 53,43 57,28 Z" fill="#3B2B14" opacity="0.8"/>
    <path d="M9.2,27 C11.2,15.5 20.5,8.8 31,8.5 C21.5,11 13.5,17.5 9.2,27 Z" fill="#C2A670"/>
    <path d="M54.8,37 C52.8,47.5 44,54.5 34,55.5 C43,52.8 50.8,46.2 54.8,37 Z" fill="#8CAAB5" opacity="0.82"/>
    <circle cx="17" cy="15" r="1.4" fill="#DDCB9A"/>
    <path d="M44,50 C48,48 51,44 52.5,40" fill="none" stroke="#5F8272" stroke-width="2" stroke-linecap="round" opacity="0.52"/>
  </g>
  <path d="M16,50.5 Q17.5,48.2 19,51.2 Q17.5,49.8 16,50.5 Z" fill="#1C1412"/>

  <!-- 内部暗夜紫凹盘 -->
  <circle cx="32" cy="32" r="18.8" fill="#161221" stroke="#1C1412" stroke-width="2.4"/>
  <path d="M16,40 A18,18 0 0 1 40,16 A17.5,16.5 0 0 0 16,40 Z" fill="#0D111C" opacity="0.82"/>

  <!-- 四方铆钉 -->
  <circle cx="32.3" cy="10.4" r="2.1" fill="#1C1412"/><circle cx="32" cy="10" r="1.4" fill="#C2A670"/><circle cx="31.5" cy="9.5" r="0.55" fill="#DDCB9A"/>
  <circle cx="54.3" cy="32.4" r="2.1" fill="#1C1412"/><circle cx="54" cy="32" r="1.4" fill="#9A7B46"/>
  <circle cx="32.3" cy="54.4" r="2.1" fill="#1C1412"/><circle cx="32" cy="54" r="1.4" fill="#6E542B"/>
  <circle cx="10.3" cy="32.4" r="2.1" fill="#1C1412"/><circle cx="10" cy="32" r="1.4" fill="#C2A670"/>

  <!-- 中央图案：小尖拱门 arch_door（石拱门框 + 半开旧木门扇 + 右侧深暗门缝） -->
  <g id="arch_door">
    <!-- 墨色垫底 -->
    <path d="M19.5,46 V28 C19.5,19.8 25.5,14.5 32,13.5 C38.5,14.5 44.5,19.8 44.5,28 V46 Z" transform="translate(.4 .6)" fill="#1C1412" stroke="#1C1412" stroke-width="4.6" stroke-linejoin="round"/>
    <!-- 尖拱冷石门框外沿 -->
    <path d="M19.5,46 V28 C19.5,19.8 25.5,14.5 32,13.5 C38.5,14.5 44.5,19.8 44.5,28 V46 Z" fill="#5A7682" stroke="#1C1412" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M32,13.5 C38.5,14.5 44.5,19.8 44.5,28 V46 H32 Z" fill="#3B515C"/>
    <path d="M21.2,44 V28 C21.2,21 26.2,16.2 31.8,15.2" fill="none" stroke="#8CAAB5" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 门洞深处的一点暗（右侧半开的门缝） -->
    <path d="M23,45 V28.2 C23,22 27.2,17.8 32,16.8 C36.8,17.8 41,22 41,28.2 V45 Z" fill="#0D111C" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <!-- 半开的旧木门扇（绕左合页向内偏转，右边露出明显暗门缝） -->
    <path d="M23,45 V28.2 C23,22 27.2,17.8 32,16.8 L35.2,19.8 V42.8 L23,45 Z" fill="#704122" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M23,45 V28.2 C23,22 27.2,17.8 32,16.8 L32,43.4 Z" fill="#9E6238"/>
    <path d="M24.8,43 V28.2 C24.8,23.5 27.8,19.8 31.8,18.6" fill="none" stroke="#C48A5C" stroke-width="1.4" stroke-linecap="round"/>
    <!-- 门扇竖缝收尖线与小铜门环 -->
    <path d="M29,19.5 Q29.6,31 29,43.2 Q28.4,31 29,19.5 Z" fill="#1C1412"/>
    <circle cx="31.5" cy="31.8" r="2.1" fill="#C2A670" stroke="#1C1412" stroke-width="1.3"/>
  </g>

  <!-- 待机独立冷光层 -->
  <path id="sheen" opacity="0" d="M10.5,26 A22,22 0 0 1 30,9.5" fill="none" stroke="#DDCB9A" stroke-width="1.6" stroke-linecap="round"/>
</g>
</svg>
