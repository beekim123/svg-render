<svg xmlns="http://www.w3.org/2000/svg" class="svg-ui_btn_primary" viewBox="0 0 192 96" width="192" height="96">
<title>主按钮底</title>
<style>
.svg-ui_btn_primary g { transform-box: view-box; }
.svg-ui_btn_primary #sheen { opacity: 0; }

/* idle 3000ms: 0 -> 1500 -> 3000 */
@keyframes svg-ui_btn_primary-idle-sheen {
  0% { opacity: 0; animation-timing-function: ease-in-out; }
  50% { opacity: 0.88; animation-timing-function: ease-in-out; }
  100% { opacity: 0; }
}
.svg-ui_btn_primary:not([data-anim]) #sheen,
.svg-ui_btn_primary[data-anim="idle"] #sheen {
  animation: svg-ui_btn_primary-idle-sheen 3s infinite;
}
</style>
<defs>
  <linearGradient id="ui_btn_primary-sheen-grad" x1="8" y1="6" x2="184" y2="90" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#DDCB9A" stop-opacity="0"/>
    <stop offset="0.32" stop-color="#DDCB9A" stop-opacity="0.92"/>
    <stop offset="0.68" stop-color="#8CAAB5" stop-opacity="0"/>
  </linearGradient>
</defs>
<g id="root">
  <!-- 九宫格 [32,32,32,32]：主按钮（结束回合），比 ui_btn 醒目的厚重旧铜色，角饰严格在 32×32 内 -->
  <!-- 外框厚重旧铜主底 -->
  <rect x="3" y="3" width="186" height="90" rx="11" fill="#9A7B46" stroke="#1C1412" stroke-width="3.2"/>
  <!-- 下半暗铜面与底沿深暗厚度（顺水平拉伸方向直线） -->
  <path d="M4.5,52 H187.5 V83 A8.5,8.5 0 0 1 179,91.5 H13 A8.5,8.5 0 0 1 4.5,83 Z" fill="#6E542B"/>
  <path d="M4.5,75 H187.5 V83 A8.5,8.5 0 0 1 179,91.5 H13 A8.5,8.5 0 0 1 4.5,83 Z" fill="#3B2B14" opacity="0.88"/>
  <!-- 顶部磨亮高光铜边与底沿冷轮廓光 -->
  <line x1="14" y1="6.2" x2="178" y2="6.2" stroke="#DDCB9A" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="14" y1="8.2" x2="178" y2="8.2" stroke="#C2A670" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="32" y1="90.8" x2="160" y2="90.8" stroke="#8CAAB5" stroke-width="1.3" opacity="0.78"/>

  <!-- 内层旧铜浮雕线框（中央平整醒目供写字） -->
  <rect x="9" y="9" width="174" height="78" rx="7" fill="#6E542B" stroke="#1C1412" stroke-width="2"/>
  <path d="M10.5,48 V16 A5.5,5.5 0 0 1 16,10.5 H176 A5.5,5.5 0 0 1 181.5,16 V48 Z" fill="#9A7B46" opacity="0.65"/>
  <rect x="11" y="11" width="170" height="74" rx="5.5" fill="none" stroke="#C2A670" stroke-width="1.5" opacity="0.9"/>

  <!-- 四角华丽旧金铜包角与菱形浮雕钉（严格在 32×32 角区内：x<=30 或 x>=162，y<=30 或 y>=66） -->
  <!-- 左上角 -->
  <g>
    <path d="M3.5,11 C3.5,6.5 6.5,3.5 11,3.5 H29.5 L24,10.5 H11.5 V24 L3.5,29.5 Z" fill="#C2A670" stroke="#1C1412" stroke-width="1.9" stroke-linejoin="round"/>
    <path d="M5.2,26 V11 C5.2,7.8 7.8,5.2 11,5.2 H26" fill="none" stroke="#DDCB9A" stroke-width="1.4" stroke-linecap="round"/>
    <polygon points="15,11 19,15 15,19 11,15" fill="#DDCB9A" stroke="#1C1412" stroke-width="1.3" stroke-linejoin="round"/>
  </g>
  <!-- 右上角 -->
  <g>
    <path d="M188.5,11 C188.5,6.5 185.5,3.5 181,3.5 H162.5 L168,10.5 H180.5 V24 L188.5,29.5 Z" fill="#C2A670" stroke="#1C1412" stroke-width="1.9" stroke-linejoin="round"/>
    <path d="M180.5,10.5 H187.2 V27.5 L180.5,23 Z" fill="#9A7B46"/>
    <path d="M165,5.2 H181 C184,5.2 186.2,7 186.8,10" fill="none" stroke="#DDCB9A" stroke-width="1.2" stroke-linecap="round"/>
    <polygon points="177,11 181,15 177,19 173,15" fill="#C2A670" stroke="#1C1412" stroke-width="1.3" stroke-linejoin="round"/>
  </g>
  <!-- 左下角 -->
  <g>
    <path d="M3.5,85 C3.5,89.5 6.5,92.5 11,92.5 H29.5 L24,85.5 H11.5 V72 L3.5,66.5 Z" fill="#9A7B46" stroke="#1C1412" stroke-width="1.9" stroke-linejoin="round"/>
    <path d="M11.5,85.5 H25 L28,91.2 H11 C7.5,91.2 5,88.8 4.8,85.2 Z" fill="#6E542B"/>
    <polygon points="15,77 19,81 15,85 11,81" fill="#C2A670" stroke="#1C1412" stroke-width="1.3" stroke-linejoin="round"/>
  </g>
  <!-- 右下角 -->
  <g>
    <path d="M188.5,85 C188.5,89.5 185.5,92.5 181,92.5 H162.5 L168,85.5 H180.5 V72 L188.5,66.5 Z" fill="#9A7B46" stroke="#1C1412" stroke-width="1.9" stroke-linejoin="round"/>
    <path d="M187.2,68.5 V85 C187.2,88.8 184.5,91.2 181,91.2 H164.5 L168,85.5 H180.5 V72 Z" fill="#3B2B14" opacity="0.82"/>
    <polygon points="177,77 181,81 177,85 173,81" fill="#9A7B46" stroke="#1C1412" stroke-width="1.3" stroke-linejoin="round"/>
  </g>

  <!-- 待机独立磨亮光泽层 -->
  <rect id="sheen" opacity="0" x="11" y="11" width="170" height="74" rx="5.5" fill="none" stroke="url(#ui_btn_primary-sheen-grad)" stroke-width="2.2"/>
</g>
</svg>
