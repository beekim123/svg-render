<svg xmlns="http://www.w3.org/2000/svg" class="svg-fx_overkill" viewBox="0 0 480 240" width="480" height="240">
<title>特效 · 超杀</title>
<style>
.svg-fx_overkill g { transform-box: view-box; }
.svg-fx_overkill #burst_outer,
.svg-fx_overkill #burst_inner,
.svg-fx_overkill #gem_shards_a,
.svg-fx_overkill #gem_shards_b {
  opacity: 0;
  transform-origin: 240px 120px;
}

/* play 1000ms：0(0%) 全透明 → 100(10%) 快速显形炸开 → 300(30%) 峰值保持 → 600(60%) 扩散衰减 → 1000(100%) 全透明 */
@keyframes svg-fx_overkill-play-outer {
  0% { transform: translate(0px,0px) rotate(-4deg) scale(0.35,0.35); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  10% { transform: translate(0px,0px) rotate(1deg) scale(1.02,1.02); opacity: 1; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  30% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 1; animation-timing-function: ease-in-out; }
  60% { transform: translate(0px,0px) rotate(1deg) scale(1.03,1.03); opacity: 0.78; animation-timing-function: linear; }
  100% { transform: translate(0px,0px) rotate(2deg) scale(1.04,1.04); opacity: 0; }
}
.svg-fx_overkill[data-anim="play"] #burst_outer { animation: svg-fx_overkill-play-outer 1s both; }

@keyframes svg-fx_overkill-play-inner {
  0% { transform: translate(0px,0px) rotate(0deg) scale(0.4,0.4); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  10% { transform: translate(0px,0px) rotate(0deg) scale(1.02,1.02); opacity: 1; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  30% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 1; animation-timing-function: ease-in-out; }
  60% { transform: translate(0px,0px) rotate(0deg) scale(1.02,1.02); opacity: 0.82; animation-timing-function: linear; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1.03,1.03); opacity: 0; }
}
.svg-fx_overkill[data-anim="play"] #burst_inner { animation: svg-fx_overkill-play-inner 1s both; }

@keyframes svg-fx_overkill-play-shards-a {
  0% { transform: translate(0px,0px) rotate(-6deg) scale(0.42,0.42); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  10% { transform: translate(0px,0px) rotate(-1deg) scale(0.95,0.95); opacity: 0.96; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  30% { transform: translate(0px,0px) rotate(1deg) scale(1.01,1.01); opacity: 1; animation-timing-function: ease-in-out; }
  60% { transform: translate(0px,0px) rotate(3deg) scale(1.04,1.04); opacity: 0.75; animation-timing-function: linear; }
  100% { transform: translate(0px,0px) rotate(5deg) scale(1.05,1.05); opacity: 0; }
}
.svg-fx_overkill[data-anim="play"] #gem_shards_a { animation: svg-fx_overkill-play-shards-a 1s both; }

@keyframes svg-fx_overkill-play-shards-b {
  0% { transform: translate(0px,0px) rotate(6deg) scale(0.45,0.45); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  10% { transform: translate(0px,0px) rotate(1deg) scale(0.94,0.94); opacity: 0.94; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  30% { transform: translate(0px,0px) rotate(-1deg) scale(1,1); opacity: 1; animation-timing-function: ease-in-out; }
  60% { transform: translate(0px,0px) rotate(-3deg) scale(1.03,1.03); opacity: 0.72; animation-timing-function: linear; }
  100% { transform: translate(0px,0px) rotate(-5deg) scale(1.05,1.05); opacity: 0; }
}
.svg-fx_overkill[data-anim="play"] #gem_shards_b { animation: svg-fx_overkill-play-shards-b 1s both; }
</style>
<g id="root">
  <!-- 1. 外层巨型哥特锯齿星爆 (#burst_outer，控制在 x:24..456, y:18..222，放大 1.04 后严格在 480×240 内) -->
  <g id="burst_outer">
    <!-- 第 1 层：墨色错位垫底 -->
    <polygon points="240,18 266,64 318,24 312,72 396,34 358,84 452,68 386,108 456,124 384,142 446,182 356,162 392,212 310,174 316,220 264,178 240,222 216,178 164,220 170,174 88,212 124,162 34,182 96,142 24,124 94,108 28,68 122,84 84,34 168,72 162,24 214,64" transform="translate(.7 .9)" fill="#1C1412" stroke="#1C1412" stroke-width="5.2" stroke-linejoin="round"/>
    <!-- 第 2-3 层：暗酒红锯齿主芒（左上亮 #8C3B45 / #B5626C，右下暗 #5E242C / #381318） -->
    <polygon points="240,18 266,64 318,24 312,72 396,34 358,84 452,68 386,108 456,124 384,142 446,182 356,162 392,212 310,174 316,220 264,178 240,222 216,178 164,220 170,174 88,212 124,162 34,182 96,142 24,124 94,108 28,68 122,84 84,34 168,72 162,24 214,64" fill="#5E242C"/>
    <polygon points="240,18 266,64 318,24 312,72 240,120 24,124 94,108 28,68 122,84 84,34 168,72 162,24 214,64" fill="#8C3B45"/>
    <!-- 次级旧铜锋利折角芒 -->
    <polygon points="240,34 258,72 298,44 296,80 368,54 342,92 422,84 368,114 426,136 364,148 410,186 336,164 354,202 292,172 284,208 248,176 216,208 188,172 126,202 144,164 70,186 116,148 54,136 112,114 58,84 138,92 112,54 184,80 182,44 222,72" fill="#6E542B" stroke="#1C1412" stroke-width="2.6" stroke-linejoin="round"/>
    <polygon points="240,34 258,72 298,44 296,80 240,120 54,136 112,114 58,84 138,92 112,54 184,80 182,44 222,72" fill="#9A7B46"/>
  </g>

  <!-- 2. 内层深暗哥特护字底盘 (#burst_inner，中央 x:104..376, y:62..178 低亮度深暗，不画任何文字，留给代码写「超杀 ×37」) -->
  <g id="burst_inner">
    <polygon points="240,48 256,74 288,56 286,80 344,64 328,92 388,88 352,114 394,130 348,144 378,172 322,158 330,188 282,168 266,194 240,172 214,194 198,168 150,188 158,158 102,172 132,144 86,130 128,114 92,88 152,92 136,64 194,80 192,56 224,74" fill="#C2A670" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- 中心深暗哥特护字盾底 -->
    <polygon points="240,62 272,72 316,66 334,86 376,96 362,120 376,144 334,154 316,174 272,168 240,178 208,168 164,174 146,154 104,144 118,120 104,96 146,86 164,66 208,72" fill="#161221" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
    <polygon points="240,68 270,77 312,72 328,90 364,99 352,120 364,141 328,150 312,168 270,163 240,172 210,163 168,168 152,150 116,141 128,120 116,99 152,90 168,72 210,77" fill="#0D111C" stroke="#6E542B" stroke-width="1.4" stroke-linejoin="round"/>
  </g>

  <!-- 3. 第一波外围三色刻面宝石碎片 (#gem_shards_a：红圆/八角、绿切角方、蓝三角，环绕外圈不遮挡中间字区) -->
  <g id="gem_shards_a">
    <!-- 红宝石碎片（圆形/八边形切面） -->
    <g>
      <polygon points="62,44 82,38 88,54 74,64 58,56" fill="#1C1412" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
      <polygon points="62,44 82,38 88,54 74,64 58,56" fill="#E3263A"/>
      <polygon points="62,44 82,38 74,52 58,56" fill="#F4566A"/>
      <circle cx="68" cy="46" r="1.6" fill="#F4F1FF"/>

      <polygon points="400,46 420,54 412,70 392,62" fill="#1C1412" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
      <polygon points="400,46 420,54 412,70 392,62" fill="#E3263A"/>
      <polygon points="400,46 420,54 405,58 392,62" fill="#F4566A"/>
      <circle cx="402" cy="51" r="1.6" fill="#F4F1FF"/>

      <circle cx="202" cy="28" r="9.5" fill="#1C1412"/><circle cx="202" cy="28" r="7.5" fill="#E3263A"/><path d="M196,24 A6.5,6.5 0 0,1 207,23 L202,28 Z" fill="#FFA3AB"/>
      <circle cx="282" cy="208" r="9.5" fill="#1C1412"/><circle cx="282" cy="208" r="7.5" fill="#E3263A"/><path d="M276,204 A6.5,6.5 0 0,1 287,203 L282,208 Z" fill="#F4566A"/>
    </g>

    <!-- 绿宝石碎片（切角方形） -->
    <g>
      <polygon points="42,98 62,92 66,112 46,118" fill="#1C1412" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
      <polygon points="42,98 62,92 66,112 46,118" fill="#1DBF5E"/>
      <polygon points="42,98 62,92 54,106 46,118" fill="#4FDB85"/>
      <circle cx="48" cy="100" r="1.6" fill="#F4F1FF"/>

      <polygon points="416,142 436,136 440,156 420,162" fill="#1C1412" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
      <polygon points="416,142 436,136 440,156 420,162" fill="#1DBF5E"/>
      <polygon points="416,142 436,136 428,149 420,162" fill="#4FDB85"/>
      <circle cx="422" cy="144" r="1.6" fill="#F4F1FF"/>

      <rect x="122" y="190" width="18" height="18" rx="2" transform="rotate(-15 131 199)" fill="#1C1412"/>
      <rect x="124" y="192" width="14" height="14" rx="1.5" transform="rotate(-15 131 199)" fill="#1DBF5E"/>
      <polygon points="124,192 138,192 124,206" transform="rotate(-15 131 199)" fill="#A6F5C6"/>

      <rect x="340" y="22" width="18" height="18" rx="2" transform="rotate(18 349 31)" fill="#1C1412"/>
      <rect x="342" y="24" width="14" height="14" rx="1.5" transform="rotate(18 349 31)" fill="#1DBF5E"/>
      <polygon points="342,24 356,24 342,38" transform="rotate(18 349 31)" fill="#4FDB85"/>
    </g>

    <!-- 蓝宝石碎片（三角形） -->
    <g>
      <polygon points="132,22 154,36 126,44" fill="#1C1412" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
      <polygon points="132,22 154,36 126,44" fill="#2E66F0"/>
      <polygon points="132,22 138,36 126,44" fill="#6A93F8"/>
      <circle cx="132" cy="29" r="1.6" fill="#F4F1FF"/>

      <polygon points="424,90 446,104 420,114" fill="#1C1412" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
      <polygon points="424,90 446,104 420,114" fill="#2E66F0"/>
      <polygon points="424,90 431,104 420,114" fill="#B4C8FF"/>

      <polygon points="56,154 78,166 56,178" fill="#1C1412" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
      <polygon points="56,154 78,166 56,178" fill="#2E66F0"/>
      <polygon points="56,154 65,166 56,178" fill="#6A93F8"/>

      <polygon points="350,190 372,202 350,214" fill="#1C1412" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
      <polygon points="350,190 372,202 350,214" fill="#1D45B8"/>
      <polygon points="350,190 359,202 350,214" fill="#6A93F8"/>
    </g>
  </g>

  <!-- 4. 第二波四角尖星与宝石微晶 (#gem_shards_b) -->
  <g id="gem_shards_b">
    <path d="M96,64 L99.5,73.5 L109,77 L99.5,80.5 L96,90 L92.5,80.5 L83,77 L92.5,73.5 Z M384,66 L387.5,75.5 L397,79 L387.5,82.5 L384,92 L380.5,82.5 L371,79 L380.5,75.5 Z" fill="#F4F1FF" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M92,150 L95,158 L103,161 L95,164 L92,172 L89,164 L81,161 L89,158 Z" fill="#FFA3AB" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M388,152 L391,160 L399,163 L391,166 L388,174 L385,166 L377,163 L385,160 Z" fill="#A6F5C6" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M240,22 L243,30 L251,33 L243,36 L240,44 L237,36 L229,33 L237,30 Z" fill="#B4C8FF" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M204,196 L207,204 L215,207 L207,210 L204,218 L201,210 L193,207 L201,204 Z" fill="#F4F1FF" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
</g>
</svg>
