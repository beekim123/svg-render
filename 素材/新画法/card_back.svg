<svg xmlns="http://www.w3.org/2000/svg" class="svg-card_back" viewBox="0 0 200 300" width="200" height="300">
<title>牌背</title>
<style>
.svg-card_back g { transform-box: view-box; }
.svg-card_back #glint_red { transform-origin: 100px 104px; opacity: 0; }
.svg-card_back #glint_green { transform-origin: 73px 168px; opacity: 0; }
.svg-card_back #glint_blue { transform-origin: 127px 168px; opacity: 0; }

/* 待机 3000ms：0 静止 → 500 红宝石反光峰值 → 1000 隐藏 → 1500 绿宝石反光峰值 → 2000 隐藏 → 2500 蓝宝石反光峰值 → 3000 与0帧一致 */
@keyframes svg-card_back-idle-red {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; animation-timing-function: ease-in-out; }
  16.67% { transform: translate(0px,0px) rotate(12deg) scale(1.08,1.08); opacity: 1; animation-timing-function: ease-in-out; }
  33.33% { transform: translate(0px,0px) rotate(0deg) scale(0.6,0.6); opacity: 0; animation-timing-function: linear; }
  50% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; animation-timing-function: linear; }
  66.67% { transform: translate(0px,0px) rotate(0deg) scale(0.6,0.6); opacity: 0; animation-timing-function: linear; }
  83.33% { transform: translate(0px,0px) rotate(0deg) scale(0.6,0.6); opacity: 0; animation-timing-function: linear; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; }
}
@keyframes svg-card_back-idle-green {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; animation-timing-function: linear; }
  16.67% { transform: translate(0px,0px) rotate(0deg) scale(0.6,0.6); opacity: 0; animation-timing-function: linear; }
  33.33% { transform: translate(0px,0px) rotate(0deg) scale(0.6,0.6); opacity: 0; animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,0px) rotate(12deg) scale(1.08,1.08); opacity: 1; animation-timing-function: ease-in-out; }
  66.67% { transform: translate(0px,0px) rotate(0deg) scale(0.6,0.6); opacity: 0; animation-timing-function: linear; }
  83.33% { transform: translate(0px,0px) rotate(0deg) scale(0.6,0.6); opacity: 0; animation-timing-function: linear; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; }
}
@keyframes svg-card_back-idle-blue {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; animation-timing-function: linear; }
  16.67% { transform: translate(0px,0px) rotate(0deg) scale(0.6,0.6); opacity: 0; animation-timing-function: linear; }
  33.33% { transform: translate(0px,0px) rotate(0deg) scale(0.6,0.6); opacity: 0; animation-timing-function: linear; }
  50% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; animation-timing-function: linear; }
  66.67% { transform: translate(0px,0px) rotate(0deg) scale(0.6,0.6); opacity: 0; animation-timing-function: ease-in-out; }
  83.33% { transform: translate(0px,0px) rotate(12deg) scale(1.08,1.08); opacity: 1; animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; }
}
.svg-card_back:not([data-anim]) #glint_red,
.svg-card_back[data-anim="idle"] #glint_red { animation: svg-card_back-idle-red 3s infinite; }
.svg-card_back:not([data-anim]) #glint_green,
.svg-card_back[data-anim="idle"] #glint_green { animation: svg-card_back-idle-green 3s infinite; }
.svg-card_back:not([data-anim]) #glint_blue,
.svg-card_back[data-anim="idle"] #glint_blue { animation: svg-card_back-idle-blue 3s infinite; }
</style>
<defs>
  <linearGradient id="card_back-body" x1="0" y1="0" x2="200" y2="300" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#3A324D"/>
    <stop offset="0.5" stop-color="#262036"/>
    <stop offset="1" stop-color="#161221"/>
  </linearGradient>
  <linearGradient id="card_back-inner" x1="16" y1="16" x2="184" y2="284" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#262036"/>
    <stop offset="1" stop-color="#161221"/>
  </linearGradient>
  <pattern id="card_back-grain" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
    <line x1="0" y1="0" x2="0" y2="5" stroke="#8C82A6" stroke-width="0.5"/>
    <line x1="0" y1="2.5" x2="5" y2="2.5" stroke="#161221" stroke-width="0.6"/>
  </pattern>
  <pattern id="card_back-hatch" width="4.8" height="4.8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="4.8" stroke="#1C1412" stroke-width="0.9"/>
  </pattern>
  <clipPath id="card_back-cemblem">
    <polygon points="100,54 152,90 160,150 138,204 100,222 62,204 40,150 48,90"/>
  </clipPath>
</defs>

<g id="root">
  <!-- 牌身底板（与 card_frame 完全一致的外形与线脚语言） -->
  <path d="M12,2 H188 A10,10 0 0 1 198,12 V288 A10,10 0 0 1 188,298 H12 A10,10 0 0 1 2,288 V12 A10,10 0 0 1 12,2 Z" fill="url(#card_back-body)" stroke="#1C1412" stroke-width="3"/>
  <path d="M12,2 H188 A10,10 0 0 1 198,12 V288 A10,10 0 0 1 188,298 H12 A10,10 0 0 1 2,288 V12 A10,10 0 0 1 12,2 Z" fill="url(#card_back-grain)" opacity="0.16"/>
  <!-- 边角磨白与右下加深 -->
  <path d="M3.5,24 C3.5,10 10,3.5 24,3.5 L32,3.8 C16,5.2 6,14 4.5,32 Z M168,3.5 L186,3.5 C192,3.8 196,8 196.5,14 L196.2,24 C194,10 186,5 168,3.5 Z" fill="#62577D" opacity="0.5"/>
  <path d="M196.5,220 V288 C196.5,293 193,296.5 188,296.5 H116 C158,294 190,284 196.5,220 Z" fill="#161221" opacity="0.75"/>

  <!-- 外圈旧金细线框 -->
  <rect x="5.6" y="5.6" width="188.8" height="288.8" rx="7.4" fill="none" stroke="#3B2B14" stroke-width="2"/>
  <rect x="5.6" y="5.6" width="188.8" height="288.8" rx="7.4" fill="none" stroke="#6E542B" stroke-width="1.2" stroke-dasharray="70 3 120 2 44 5 150 3 96 2 180 4"/>
  <path d="M5.2,250 V13 A7.8,7.8 0 0 1 13,5.2 H160" fill="none" stroke="#C2A670" stroke-width="0.9" stroke-dasharray="60 6 90 4 200" opacity="0.9"/>

  <!-- 内框线脚：外凸旧金棱 + 内凹暗槽嵌小珠 -->
  <rect x="11" y="11" width="178" height="278" rx="7" fill="url(#card_back-inner)" stroke="#1C1412" stroke-width="2.4"/>
  <!-- 右下暗面 45° 细排线 -->
  <path d="M110,190 L186,150 V284 H30 Z" fill="url(#card_back-hatch)" opacity="0.34"/>
  <rect x="12.8" y="12.8" width="174.4" height="274.4" rx="6.2" fill="none" stroke="#6E542B" stroke-width="3.2"/>
  <path d="M12.2,278 V19 A6.2,6.2 0 0 1 18.4,12.2 H182" fill="none" stroke="#C2A670" stroke-width="1.2"/>
  <rect x="15.8" y="15.8" width="168.4" height="268.4" rx="5" fill="none" stroke="#161221" stroke-width="3"/>
  <rect x="15.8" y="15.8" width="168.4" height="268.4" rx="5" fill="none" stroke="#9A7B46" stroke-width="1.8" stroke-dasharray="0.1 7.9094" stroke-linecap="round"/>

  <!-- 哥特暗色几何底纹（尖拱与菱格收尖线，低对比不抢戏） -->
  <g opacity="0.72">
    <polygon points="100,26 170,150 100,274 30,150" fill="#161221" opacity="0.55" stroke="#3A324D" stroke-width="1.4"/>
    <polygon points="100,38 158,150 100,262 42,150" fill="none" stroke="#6E542B" stroke-width="1" stroke-dasharray="5 3.5"/>
    <path d="M24,62 Q62,38 100,22 Q138,38 176,62 Q138,42 100,26 Q62,42 24,62 Z M24,238 Q62,262 100,278 Q138,262 176,238 Q138,258 100,274 Q62,258 24,238 Z" fill="#3A324D"/>
    <path d="M99.2,24 H100.8 V276 H99.2 Z M24,149.2 H176 V150.8 H24 Z" fill="#3A324D" opacity="0.6"/>
  </g>

  <!-- 四角哥特 L 形尖头铜角花（与 card_frame 同系造型） -->
  <g fill="#9A7B46" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round">
    <path d="M6,6 L38,6 L33,11 L24,11 C19,11 16,13 14.5,15.5 C13,17 11,19 11,24 L11,33 L6,38 Z"/>
    <path d="M194,6 L162,6 L167,11 L176,11 C181,11 184,13 185.5,15.5 C187,17 189,19 189,24 L189,33 L194,38 Z"/>
    <path d="M6,294 L38,294 L33,289 L24,289 C19,289 16,287 14.5,284.5 C13,283 11,281 11,276 L11,267 L6,262 Z"/>
    <path d="M194,294 L162,294 L167,289 L176,289 C181,289 184,287 185.5,284.5 C187,283 189,281 189,276 L189,267 L194,262 Z"/>
    <!-- 上下尖拱顶饰与左右翼饰 -->
    <path d="M86,12 C93,12 97,9.5 100,4.5 C103,9.5 107,12 114,12 C107,14 103,17 100,21 C97,17 93,14 86,12 Z"/>
    <path d="M86,288 C93,288 97,290.5 100,295.5 C103,290.5 107,288 114,288 C107,286 103,283 100,279 C97,283 93,286 86,288 Z"/>
    <polygon points="12,150 20,141 28,150 20,159"/>
    <polygon points="188,150 180,141 172,150 180,159"/>
  </g>
  <path d="M7.5,34 V7.5 H34 M166,7.5 H192.5 M7.5,266 V292.5" fill="none" stroke="#DDCB9A" stroke-width="1" stroke-linecap="round" opacity="0.85"/>

  <!-- 正中哥特三宝石徽记座 #emblem（七层旧铜盾盘） -->
  <g id="emblem">
    <!-- 接触暗影与墨色垫底 -->
    <polygon points="100,58 155,94 163,154 140,208 100,226 60,208 37,154 45,94" fill="#0D111C" opacity="0.65"/>
    <polygon points="100,54 152,90 160,150 138,204 100,222 62,204 40,150 48,90" transform="translate(.6 .9)" fill="#1C1412" stroke="#1C1412" stroke-width="5.6" stroke-linejoin="round"/>
    <polygon points="100,54 152,90 160,150 138,204 100,222 62,204 40,150 48,90" fill="#6E542B"/>
    <g clip-path="url(#card_back-cemblem)">
      <polygon points="100,54 152,90 160,150 138,204 100,222 62,204 40,150 48,90" transform="translate(-4.5 -4.5)" fill="#9A7B46"/>
      <polygon points="100,54 152,90 160,150 138,204 100,222 100,142" fill="#3B2B14" opacity="0.75"/>
      <path d="M42.5,148 L50,92 L100,57 L98,60 L52.5,94 L45,148 Z" fill="#C2A670"/>
      <path d="M157.5,152 L136,201 L102,219 L101,216.5 L134,199 L155,151 Z" fill="#8CAAB5" opacity="0.78"/>
      <!-- 铜绿污渍 -->
      <path d="M132,192 C137,186 141,178 143,170 M64,190 C69,196 76,201 84,204" fill="none" stroke="#5F8272" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/>
    </g>

    <!-- 内层暗铁与丝绒凹盘 -->
    <polygon points="100,65 144,96 151,148 131,195 100,211 69,195 49,148 56,96" fill="#1E2C33" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
    <polygon points="100,71 138,99 144,147 126,189 100,203 74,189 56,147 62,99" fill="#161221" stroke="#9A7B46" stroke-width="1.3" stroke-linejoin="round"/>

    <!-- 中心三叉铜骨连线与四周铆钉 -->
    <path d="M100,144 L100,104 M100,144 L73,168 M100,144 L127,168" stroke="#6E542B" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M100,144 L100,104 M100,144 L73,168 M100,144 L127,168" stroke="#1C1412" stroke-width="1.4" stroke-linecap="round"/>
    <polygon points="100,135 109,144 100,153 91,144" fill="#9A7B46" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="100" cy="144" r="2.4" fill="#DDCB9A"/>
    <circle cx="100" cy="61" r="2.2" fill="#C2A670" stroke="#1C1412" stroke-width="1.1"/>
    <circle cx="147" cy="94" r="2.2" fill="#9A7B46" stroke="#1C1412" stroke-width="1.1"/>
    <circle cx="53" cy="94" r="2.2" fill="#C2A670" stroke="#1C1412" stroke-width="1.1"/>
    <circle cx="154" cy="149" r="2.2" fill="#6E542B" stroke="#1C1412" stroke-width="1.1"/>
    <circle cx="46" cy="149" r="2.2" fill="#C2A670" stroke="#1C1412" stroke-width="1.1"/>
    <circle cx="100" cy="215" r="2.2" fill="#6E542B" stroke="#1C1412" stroke-width="1.1"/>

    <!-- 1. 上方红宝石（圆形，中心 100,104, r=20，内部平色刻面+亮棱无墨线） -->
    <g id="gem_red">
      <circle cx="100" cy="104" r="23.5" fill="#3B2B14" stroke="#1C1412" stroke-width="2.2"/>
      <circle cx="100" cy="104" r="20" fill="#E3263A" stroke="#1C1412" stroke-width="2.2"/>
      <path d="M100,84 A20,20 0 0 0 80,104 L89,104 L92,92 Z" fill="#FFA3AB"/>
      <path d="M100,84 A20,20 0 0 1 120,104 L111,104 L108,92 Z" fill="#F4566A"/>
      <path d="M80,104 A20,20 0 0 0 100,124 L100,115 L89,104 Z" fill="#A8172A"/>
      <path d="M120,104 A20,20 0 0 1 100,124 L100,115 L111,104 Z" fill="#6B0E1C"/>
      <polygon points="100,123 114,117 109,112 100,115" fill="#F4566A" opacity="0.7"/>
      <polygon points="92,93 108,93 112,104 108,115 92,115 88,104" fill="#E3263A"/>
      <polygon points="92,93 108,93 100,104 88,104" fill="#FFA3AB" opacity="0.65"/>
      <path d="M92,93 L108,93 L112,104 L108,115 L92,115 L88,104 Z M100,84 L100,93 M80,104 L88,104 M120,104 L112,104 M100,124 L100,115" fill="none" stroke="#FFA3AB" stroke-width="0.6" opacity="0.68"/>
      <circle cx="93" cy="96" r="2.4" fill="#F4F1FF"/>
    </g>

    <!-- 2. 左下绿宝石（切角方形，中心 73,168，宽34） -->
    <g id="gem_green">
      <polygon points="58,148 88,148 93,153 93,183 88,188 58,188 53,183 53,153" fill="#3B2B14" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
      <polygon points="60,151 86,151 90,155 90,181 86,185 60,185 56,181 56,155" fill="#1DBF5E" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
      <polygon points="60,151 86,151 80,158 65,158" fill="#A6F5C6"/>
      <polygon points="56,155 60,151 65,158 65,178 56,181" fill="#4FDB85"/>
      <polygon points="86,151 90,155 90,181 86,185 60,185 65,178 80,178 80,158" fill="#0A5A2B"/>
      <polygon points="72,178 80,178 86,185 73,185" fill="#4FDB85" opacity="0.72"/>
      <rect x="65" y="158" width="15" height="20" rx="1" fill="#1DBF5E"/>
      <polygon points="65,158 80,158 72,168 65,170" fill="#A6F5C6" opacity="0.65"/>
      <path d="M65,158 H80 V178 H65 Z M60,151 L65,158 M86,151 L80,158 M90,181 L80,178 M56,181 L65,178" fill="none" stroke="#A6F5C6" stroke-width="0.6" opacity="0.68"/>
      <circle cx="66" cy="160" r="2.1" fill="#F4F1FF"/>
    </g>

    <!-- 3. 右下蓝宝石（三角形，中心 127,168） -->
    <g id="gem_blue">
      <polygon points="127,143 151,187 103,187" fill="#3B2B14" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
      <polygon points="127,147 147,184 107,184" fill="#2E66F0" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
      <polygon points="127,147 127,162 117,178 107,184" fill="#B4C8FF"/>
      <polygon points="127,147 147,184 137,178 127,162" fill="#1D45B8"/>
      <polygon points="107,184 117,178 137,178 147,184" fill="#122A78"/>
      <polygon points="127,178 137,178 144,184 128,184" fill="#6A93F8" opacity="0.72"/>
      <polygon points="127,158 137,178 117,178" fill="#2E66F0"/>
      <polygon points="127,158 132,168 117,178" fill="#B4C8FF" opacity="0.68"/>
      <path d="M127,147 L127,158 M107,184 L117,178 M147,184 L137,178 M127,158 L137,178 L117,178 Z" fill="none" stroke="#B4C8FF" stroke-width="0.6" opacity="0.68"/>
      <circle cx="123" cy="164" r="2" fill="#F4F1FF"/>
    </g>

    <!-- 待机轮流闪烁的四芒星反光（500ms红、1500ms绿、2500ms蓝；0ms隐藏） -->
    <g id="glint_red" opacity="0">
      <circle cx="100" cy="104" r="18" fill="#FFA3AB" opacity="0.35"/>
      <path d="M100,86 Q102,102 118,104 Q102,106 100,122 Q98,106 82,104 Q98,102 100,86 Z" fill="#F4F1FF"/>
    </g>
    <g id="glint_green" opacity="0">
      <circle cx="73" cy="168" r="16" fill="#A6F5C6" opacity="0.35"/>
      <path d="M73,152 Q74.8,166.2 89,168 Q74.8,169.8 73,184 Q71.2,169.8 57,168 Q71.2,166.2 73,152 Z" fill="#F4F1FF"/>
    </g>
    <g id="glint_blue" opacity="0">
      <circle cx="127" cy="168" r="16" fill="#B4C8FF" opacity="0.35"/>
      <path d="M127,152 Q128.8,166.2 143,168 Q128.8,169.8 127,184 Q125.2,169.8 111,168 Q125.2,166.2 127,152 Z" fill="#F4F1FF"/>
    </g>
  </g>
</g>
</svg>
