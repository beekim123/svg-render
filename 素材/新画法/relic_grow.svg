<svg xmlns="http://www.w3.org/2000/svg" class="svg-relic_grow" viewBox="0 0 96 96" width="96" height="96">
<title>宝物 · 宝石长得快</title>
<style>
.svg-relic_grow g { transform-box: view-box; }
.svg-relic_grow #brass_file { transform-origin: 72px 72px; }
.svg-relic_grow #gem_dust { transform-origin: 30px 66px; }
@keyframes svg-relic_grow-idle-f {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(-1.6px,-1.2px) rotate(-2.2deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-relic_grow-idle-d {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0.92; animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,1.2px) rotate(0deg) scale(1.03,1.03); opacity: 1; animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0.92; }
}
.svg-relic_grow:not([data-anim]) #brass_file,
.svg-relic_grow[data-anim="idle"] #brass_file { animation: svg-relic_grow-idle-f 3s infinite; }
.svg-relic_grow:not([data-anim]) #gem_dust,
.svg-relic_grow[data-anim="idle"] #gem_dust { animation: svg-relic_grow-idle-d 3s infinite; }
</style>
<defs>
  <clipPath id="relic_grow-cblade">
    <path d="M10,21 L21,10 L56,45 L45,56 Z"/>
  </clipPath>
  <clipPath id="relic_grow-chandle">
    <path d="M53,61 L61,53 L83,73 C87,77 86,83 82,86 C79,88 73,87 69,83 Z"/>
  </clipPath>
</defs>
<g id="root">
  <!-- 左下与下方：被锉下的鲜艳宝石与一缕宝石粉晶屑（与右上方锉刀明确分开） -->
  <g id="gem_dust" opacity="0.92">
    <!-- 左下角一颗正在被锉出亮粉的切角绿宝石 -->
    
      <clipPath id="relic_grow-cgem"><polygon points="14.7,56.5 31.3,56.5 34.5,59.7 34.5,76.3 31.3,79.5 14.7,79.5 11.5,76.3 11.5,59.7"/></clipPath>
      <polygon points="14.7,56.5 31.3,56.5 34.5,59.7 34.5,76.3 31.3,79.5 14.7,79.5 11.5,76.3 11.5,59.7" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5.2" stroke-linejoin="round"/>
      <polygon points="14.7,56.5 31.3,56.5 34.5,59.7 34.5,76.3 31.3,79.5 14.7,79.5 11.5,76.3 11.5,59.7" fill="#128A43"/>
      <g clip-path="url(#relic_grow-cgem)">
        <!-- 左上亮梯形刻面 -->
        <polygon points="11.5,76.3 11.5,59.7 14.7,56.5 31.3,56.5 27.5,62.0 18.5,62.0 17.0,63.5 17.0,72.5" fill="#4FDB85"/>
        <!-- 右下最暗刻面与内反光 -->
        <polygon points="31.3,56.5 34.5,59.7 34.5,76.3 31.3,79.5 14.7,79.5 18.5,74.0 27.5,74.0 29.0,72.5 29.0,63.5" fill="#0A5A2B"/>
        <polygon points="18.5,74.0 27.5,74.0 31.3,79.5 14.7,79.5" fill="#1DBF5E" opacity=".75"/>
        <!-- 中央切角方台面 -->
        <polygon points="18.5,62.0 27.5,62.0 29.0,63.5 29.0,72.5 27.5,74.0 18.5,74.0 17.0,72.5 17.0,63.5" fill="#1DBF5E"/>
        <polygon points="18.5,62.0 27.5,62.0 25.4,68.6 17.0,69.8 17.0,63.5" fill="#4FDB85" opacity=".65"/>
        <!-- 刻面高光色细棱线 -->
        <path d="M18.5,62.0 L14.7,56.5 M27.5,62.0 L31.3,56.5 M29.0,72.5 L34.5,76.3 M17.0,72.5 L11.5,76.3" stroke="#A6F5C6" stroke-width="0.75" opacity=".75"/>
        <polygon points="18.5,62.0 27.5,62.0 29.0,63.5 29.0,72.5 27.5,74.0 18.5,74.0 17.0,72.5 17.0,63.5" fill="none" stroke="#A6F5C6" stroke-width="0.75" opacity=".8"/>
        <!-- 左上白亮边 -->
        <polyline points="12.9,71.5 12.9,60.3 15.3,57.9 27.0,57.9" fill="none" stroke="#F4F1FF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
      </g>
      <circle cx="20.3" cy="65.3" r="1.5" fill="#F4F1FF"/>
    
    <!-- 散落的红、蓝、绿晶粒与星芒粉缕 -->
    <circle cx="43.5" cy="75.5" r="6.2" fill="#1C1412"/>
    <circle cx="43" cy="75" r="4.2" fill="#E3263A"/>
    <circle cx="41.8" cy="73.8" r="1.4" fill="#FFA3AB"/>
    <polygon points="36,52 42,62 30,62" fill="#1C1412" stroke="#1C1412" stroke-width="3.6" stroke-linejoin="round"/>
    <polygon points="36,52 42,62 30,62" fill="#2E66F0"/>
    <polygon points="36,52 36,62 30,62" fill="#6A93F8"/>
    <circle cx="54.5" cy="69.5" r="4.6" fill="#1C1412"/>
    <circle cx="54" cy="69" r="3" fill="#4FDB85"/>
    <!-- 飘落的四角宝石粉星芒 -->
    <polygon points="15,43 17,48 22,50 17,52 15,57 13,52 8,50 13,48" fill="#1C1412" stroke="#1C1412" stroke-width="2.6" stroke-linejoin="round"/>
    <polygon points="15,43 17,48 22,50 17,52 15,57 13,52 8,50 13,48" fill="#F4F1FF"/>
    <polygon points="48,49 49.8,53.2 54,55 49.8,56.8 48,61 46.2,56.8 42,55 46.2,53.2" fill="#1C1412" stroke="#1C1412" stroke-width="2.4" stroke-linejoin="round"/>
    <polygon points="48,49 49.8,53.2 54,55 49.8,56.8 48,61 46.2,56.8 42,55 46.2,53.2" fill="#A6F5C6"/>
  </g>

  <!-- 右上至右下：斜置的宽扁平头锉刀（齿纹清晰、长木铜柄，绝不像钥匙或剑） -->
  <g id="brass_file">
    <!-- 锉刀宽平铁锉身（七层画法） -->
    <path d="M10,21 L21,10 L56,45 L45,56 Z" transform="translate(.6 .9)" fill="#1C1412" stroke="#1C1412" stroke-width="5.8" stroke-linejoin="round"/>
    <path d="M10,21 L21,10 L56,45 L45,56 Z" fill="#4A4742"/>
    <g clip-path="url(#relic_grow-cblade)">
      <path d="M10,21 L21,10 L56,45 L45,56 Z" transform="translate(-3.2 -3.2)" fill="#6E6A63"/>
      <path d="M11,22 L21,12 L48,39 L45,42 L20,17 L13,24 Z" fill="#948F86"/>
      <!-- 醒目粗横排锉刀齿纹（26px 下依然一眼识别为锉刀） -->
      <path d="M15,26 L26,15 M22,33 L33,22 M29,40 L40,29 M36,47 L47,36 M43,54 L54,43" stroke="#948F86" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M17,28 L28,17 M24,35 L35,24 M31,42 L42,31 M38,49 L49,38" stroke="#1C1412" stroke-width="3.2" stroke-linecap="round"/>
    </g>
    <!-- 锉刀侧缘外凸锯齿点 -->
    <path d="M24,11 L26,9 M31,18 L33,16 M38,25 L40,23 M45,32 L47,30 M13,26 L11,28 M20,33 L18,35 M27,40 L25,42 M34,47 L32,49" stroke="#1C1412" stroke-width="3" stroke-linecap="round"/>

    <!-- 紧凑旧铜箍环 -->
    <polygon points="48,54 54,48 60,54 54,60" fill="#1C1412" stroke="#1C1412" stroke-width="5.2" stroke-linejoin="round"/>
    <polygon points="48,54 54,48 60,54 54,60" fill="#9A7B46"/>
    <polygon points="51,51 54,48 60,54 57,57" fill="#6E542B"/>
    <line x1="49.5" y1="53.5" x2="53.5" y2="49.5" stroke="#DDCB9A" stroke-width="1.6" stroke-linecap="round"/>

    <!-- 圆胖长柄（旧铜包木长柄，七层画法） -->
    <path d="M53,61 L61,53 L83,73 C87,77 86,83 82,86 C79,88 73,87 69,83 Z" transform="translate(.6 .9)" fill="#1C1412" stroke="#1C1412" stroke-width="5.8" stroke-linejoin="round"/>
    <path d="M53,61 L61,53 L83,73 C87,77 86,83 82,86 C79,88 73,87 69,83 Z" fill="#6E542B"/>
    <g clip-path="url(#relic_grow-chandle)">
      <path d="M53,61 L61,53 L83,73 C87,77 86,83 82,86 C79,88 73,87 69,83 Z" transform="translate(-3.2 -2.8)" fill="#9A7B46"/>
      <path d="M55,60 L60,55 L78,71 Q68,66 55,60 Z" fill="#C2A670"/>
      <path d="M84,75 Q85.5,81 81,84.8 Q76,86.5 71,83 Q78,84.5 80.5,82.5 Q83.5,79.5 84,75 Z" fill="#8CAAB5" opacity=".82"/>
    </g>
    <circle cx="77" cy="78" r="2.8" fill="#1C1412"/>
    <circle cx="62" cy="60" r="1.4" fill="#DDCB9A"/>
  </g>
</g>
</svg>
