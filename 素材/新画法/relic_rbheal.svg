<svg xmlns="http://www.w3.org/2000/svg" class="svg-relic_rbheal" viewBox="0 0 96 96" width="96" height="96">
<title>宝物 · 彩虹回心</title>
<style>
.svg-relic_rbheal g { transform-box: view-box; }
.svg-relic_rbheal .vial { transform-origin: 48px 50px; }
.svg-relic_rbheal #rainbow_stripes { transform-origin: 48px 56px; }
@keyframes svg-relic_rbheal-idle-v {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,-1.2px) rotate(1.8deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-relic_rbheal-idle-s {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,0.6px) rotate(-1.5deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-relic_rbheal:not([data-anim]) .vial,
.svg-relic_rbheal[data-anim="idle"] .vial { animation: svg-relic_rbheal-idle-v 3s infinite; }
.svg-relic_rbheal:not([data-anim]) #rainbow_stripes,
.svg-relic_rbheal[data-anim="idle"] #rainbow_stripes { animation: svg-relic_rbheal-idle-s 3s infinite; }
</style>
<defs>
  <clipPath id="relic_rbheal-couter">
    <path d="M48,32 C37,19 12,23 12,44 C12,63 31,76 48,88 C65,76 84,63 84,44 C84,23 59,19 48,32 Z"/>
  </clipPath>
  <clipPath id="relic_rbheal-heart-clip">
    <path d="M48,36 C39,25 18,28 18,45 C18,61 34,72 48,82 C62,72 78,61 78,45 C78,28 57,25 48,36 Z"/>
  </clipPath>
</defs>
<g id="root">
  <g class="vial"><g transform="rotate(-1.5 48 50)">
    <!-- 瓶口软木塞与瓶颈（低饱和木色与冷灰青玻璃） -->
    <g id="bottle_neck">
      <!-- 软木塞 -->
      <polygon points="41,9 55,9 53,19 43,19" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5" stroke-linejoin="round"/>
      <polygon points="41,9 55,9 53,19 43,19" fill="#9E6238"/>
      <polygon points="48,9 55,9 53,19 48,19" fill="#704122"/>
      <path d="M43,11 H49" stroke="#C48A5C" stroke-width="1.6" stroke-linecap="round"/>
      <!-- 玻璃瓶口折边与旧铜箍 -->
      <rect x="36" y="17.5" width="24" height="6.5" rx="3" fill="#1C1412" stroke="#1C1412" stroke-width="5"/>
      <rect x="36" y="17.5" width="24" height="6.5" rx="3" fill="#5A7682"/>
      <path d="M38,19.5 H51" stroke="#8CAAB5" stroke-width="1.8" stroke-linecap="round"/>
      <rect x="39.5" y="24" width="17" height="7" fill="#6E542B" stroke="#1C1412" stroke-width="2.8"/>
      <rect x="39.5" y="24" width="9" height="7" fill="#9A7B46"/>
    </g>

    <!-- 心形小玻璃瓶厚壁外衬（七层画法，低饱和冷灰青玻璃） -->
    <path d="M48,32 C37,19 12,23 12,44 C12,63 31,76 48,88 C65,76 84,63 84,44 C84,23 59,19 48,32 Z" transform="translate(.6 .9)" fill="#1C1412" stroke="#1C1412" stroke-width="5.8" stroke-linejoin="round"/>
    <path d="M48,32 C37,19 12,23 12,44 C12,63 31,76 48,88 C65,76 84,63 84,44 C84,23 59,19 48,32 Z" fill="#3B515C"/>
    <g clip-path="url(#relic_rbheal-couter)">
      <path d="M48,32 C37,19 12,23 12,44 C12,63 31,76 48,88 C65,76 84,63 84,44 C84,23 59,19 48,32 Z" transform="translate(-3.5 -3)" fill="#5A7682"/>
      <path d="M14,44 C14,27 32,23 44,31 C33,26 17,30 16,44 Z" fill="#8CAAB5"/>
      <path d="M82,46 C81,62 64,74 49,85 C63,73 78,61 80,46 Z" fill="#8CAAB5" opacity=".82"/>
    </g>

    <!-- 瓶内六色宝石媒质细条纹（红、黄、绿、青、蓝、品红） -->
    <g id="rainbow_stripes" clip-path="url(#relic_rbheal-heart-clip)">
      <rect x="16" y="25" width="64" height="12" fill="#E3263A"/>
      <rect x="16" y="37" width="64" height="9" fill="#FFD84A"/>
      <rect x="16" y="46" width="64" height="9" fill="#1DBF5E"/>
      <rect x="16" y="55" width="64" height="9" fill="#3FE3F0"/>
      <rect x="16" y="64" width="64" height="9" fill="#2E66F0"/>
      <rect x="16" y="73" width="64" height="12" fill="#E94FD8"/>
      <!-- 条纹间收尖暗缝 -->
      <path d="M16,37 H80 M16,46 H80 M16,55 H80 M16,64 H80 M16,73 H80" stroke="#1C1412" stroke-width="1.8"/>
      <!-- 右侧背光弧形暗面（不直切一半，用弧线跟着鼓形走） -->
      <path d="M54,25 H80 V85 H48 C60,72 64,48 54,25 Z" fill="#161221" opacity=".28"/>
      <!-- 玻璃斜向反光带与左上高光弧（指南 5.6 节玻璃做法） -->
      <polygon points="20,62 56,26 63,26 24,68" fill="#F4F1FF" opacity=".32"/>
      <path d="M22,45 C22,35 30,31 39,34" fill="none" stroke="#F4F1FF" stroke-width="3.2" stroke-linecap="round" opacity=".9"/>
    </g>

    <!-- 心形内腔描边与玻璃划痕 -->
    <path d="M48,36 C39,25 18,28 18,45 C18,61 34,72 48,82 C62,72 78,61 78,45 C78,28 57,25 48,36 Z" fill="none" stroke="#1C1412" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M62,52 Q66,48 70,46 Q66,50 62,52 Z" fill="#F4F1FF" opacity=".8"/>
    <circle cx="26" cy="36" r="2" fill="#F4F1FF"/>
  </g></g>
</g>
</svg>
