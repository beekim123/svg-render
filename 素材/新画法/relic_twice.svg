<svg xmlns="http://www.w3.org/2000/svg" class="svg-relic_twice" viewBox="0 0 96 96" width="96" height="96">
<title>宝物 · 头一张打两次</title>
<style>
.svg-relic_twice g { transform-box: view-box; }
.svg-relic_twice .bell-main { transform-origin: 25px 20px; }
.svg-relic_twice .bell-echo { transform-origin: 72px 20px; opacity: .5; }
.svg-relic_twice .clap { transform-origin: 34px 40px; }
.svg-relic_twice .waves { transform-origin: 30px 45px; }

/* 待机 3000：0 静止 → 1500 铃摆到最大（3°），回声铃亮一下 → 3000 回到静止 */
@keyframes svg-relic_twice-idle-1 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,0px) rotate(3deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-relic_twice:not([data-anim]) .bell-main,
.svg-relic_twice[data-anim="idle"] .bell-main { animation: svg-relic_twice-idle-1 3s infinite; }
@keyframes svg-relic_twice-idle-2 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0.5; animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,0px) rotate(-3deg) scale(1,1); opacity: 0.8; animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0.5; }
}
.svg-relic_twice:not([data-anim]) .bell-echo,
.svg-relic_twice[data-anim="idle"] .bell-echo { animation: svg-relic_twice-idle-2 3s infinite; }
@keyframes svg-relic_twice-idle-3 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,0px) rotate(3.5deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-relic_twice:not([data-anim]) .clap,
.svg-relic_twice[data-anim="idle"] .clap { animation: svg-relic_twice-idle-3 3s infinite; }
@keyframes svg-relic_twice-idle-4 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 1; animation-timing-function: ease-in-out; }
  50% { transform: translate(1.6px,0px) rotate(0deg) scale(1,1); opacity: 0.65; animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 1; }
}
.svg-relic_twice:not([data-anim]) .waves,
.svg-relic_twice[data-anim="idle"] .waves { animation: svg-relic_twice-idle-4 3s infinite; }
</style>
