<svg xmlns="http://www.w3.org/2000/svg" class="svg-relic_same" viewBox="0 0 96 96" width="96" height="96">
<title>宝物 · 同色也翻倍</title>
<style>
.svg-relic_same g { transform-box: view-box; }
.svg-relic_same #earring_left { transform-origin: 25px 16px; }
.svg-relic_same #earring_right { transform-origin: 65px 16px; }
.svg-relic_same .glint { opacity: 0; }
@keyframes svg-relic_same-idle-l {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,-1.2px) rotate(2.6deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-relic_same-idle-r {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,-1.2px) rotate(-2.6deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-relic_same-idle-g {
  0% { opacity: 0; animation-timing-function: ease-in-out; }
  50% { opacity: 0.85; animation-timing-function: ease-in-out; }
  100% { opacity: 0; }
}
.svg-relic_same:not([data-anim]) #earring_left,
.svg-relic_same[data-anim="idle"] #earring_left { animation: svg-relic_same-idle-l 3s infinite; }
.svg-relic_same:not([data-anim]) #earring_right,
.svg-relic_same[data-anim="idle"] #earring_right { animation: svg-relic_same-idle-r 3s infinite; }
.svg-relic_same:not([data-anim]) .glint,
.svg-relic_same[data-anim="idle"] .glint { animation: svg-relic_same-idle-g 3s infinite; }
</style>
