<svg xmlns="http://www.w3.org/2000/svg" class="svg-rule_picky" viewBox="0 0 64 64" width="64" height="64">
<title>规矩图标 · 挑食</title>
<style>
.svg-rule_picky g { transform-box: view-box; }
.svg-rule_picky #silver_fork { transform-origin: 10px 10px; }
.svg-rule_picky #gem_red { transform-origin: 45px 43px; }
@keyframes svg-rule_picky-idle-f {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(1.2px,0.8px) rotate(-2.5deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-rule_picky-idle-g {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(1.5px,0.6px) rotate(3deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-rule_picky:not([data-anim]) #silver_fork,
.svg-rule_picky[data-anim="idle"] #silver_fork { animation: svg-rule_picky-idle-f 3s infinite; }
.svg-rule_picky:not([data-anim]) #gem_red,
.svg-rule_picky[data-anim="idle"] #gem_red { animation: svg-rule_picky-idle-g 3s infinite; }
</style>
<g id="root">
  <!-- 拨开宝石的动势弧线 -->
  <path d="M24,44 Q31,52 39,51" fill="none" stroke="#1C1412" stroke-width="5.2" stroke-linecap="round"/>
  <path d="M24,44 Q31,52 39,51" fill="none" stroke="#E2D6BA" stroke-width="2.2" stroke-linecap="round"/>

  <!-- 被拨到右下角的红色圆宝石 -->
  <g id="gem_red">
    
      <clipPath id="rule_picky-cgem"><circle cx="45" cy="43" r="11.8"/></clipPath>
      <circle cx="45.5" cy="43.7" r="14.4" fill="#1C1412"/>
      <circle cx="45" cy="43" r="11.8" fill="#A8172A"/>
      <g clip-path="url(#rule_picky-cgem)">
        <circle cx="42.9" cy="40.9" r="11.8" fill="#E3263A"/>
        <!-- 背光最暗与右下内反光刻面 -->
        <path d="M46.2,45.4 L56.8,40.6 L56.8,54.8 L41.5,54.8 Z" fill="#6B0E1C"/>
        <polygon points="46.8,49.5 53.5,45.6 50.7,52.7" fill="#E3263A"/>
        <!-- 左上受光亮刻面 -->
        <polygon points="34.1,44.2 37.7,35.0 45.0,31.8 51.1,35.0 45.0,38.5 39.7,40.9" fill="#F4566A"/>
        <!-- 中央八角台面 -->
        <polygon points="39.3,40.6 45.0,37.7 50.7,40.6 51.1,46.3 45.0,49.1 39.3,46.3" fill="#E3263A"/>
        <polygon points="39.3,40.6 45.0,37.7 49.1,39.9 43.6,44.8" fill="#F4566A" opacity=".65"/>
        <!-- 刻面高光色细棱线（不用墨线） -->
        <path d="M39.3,40.6 L45.0,37.7 L50.7,40.6 L51.1,46.3 L45.0,49.1 L39.3,46.3 Z M45.0,37.7 L45.0,31.8 M50.7,40.6 L55.6,38.9 M39.3,40.6 L34.4,40.0 M45.0,49.1 L45.0,54.2" fill="none" stroke="#FFA3AB" stroke-width="0.75" stroke-linecap="round" opacity=".75"/>
        <!-- 左上白亮边 -->
        <path d="M35.0,42.4 Q36.1,33.8 48.0,32.9 Q38.2,35.7 35.0,42.4 Z" fill="#F4F1FF" opacity=".9"/>
      </g>
      <circle cx="40.9" cy="38.0" r="1.7" fill="#F4F1FF"/>
    
  </g>

  <!-- 从左上伸出的小银叉（七层冷色旧银画法） -->
  <g id="silver_fork">
    <path d="M7,11 L12,6.5 L26,22 L30,17.5 L40.5,28.5 L36.8,32.2 L29,24 L26.2,26.8 L34,35 L30.2,38.8 L22.5,30.5 L19.8,33.2 L27.5,41.5 L23.5,45.5 L15.5,31 L20.5,26.5 Z" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5.2" stroke-linejoin="round"/>
    <path d="M7,11 L12,6.5 L26,22 L30,17.5 L40.5,28.5 L36.8,32.2 L29,24 L26.2,26.8 L34,35 L30.2,38.8 L22.5,30.5 L19.8,33.2 L27.5,41.5 L23.5,45.5 L15.5,31 L20.5,26.5 Z" fill="#5A7682"/>
    <path d="M10,8.5 L12,6.5 L26,22 L30,17.5 L40.5,28.5 L36.8,32.2 L29,24 L23,24.5 Z" fill="#3B515C"/>
    <path d="M8.5,11 L21.5,25.5 M17.5,31 L24,43.5" stroke="#8CAAB5" stroke-width="2" stroke-linecap="round"/>
    <circle cx="11" cy="10.5" r="1.4" fill="#E2D6BA"/>
  </g>
</g>
</svg>
