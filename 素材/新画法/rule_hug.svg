    <path d="M16.5,28.9L16.5,29.1L16.6,27.1L17,25.3L17.5,23.5L18.3,21.8L19.2,20.2L20.4,18.7L21.7,17.4L23.2,16.2L24.8,15.3L26.5,14.5L28.3,14L30.1,13.6L32,13.5L33.9,13.6L35.7,14L37.5,14.5L37.5,14.5L35.5,14.7L33.7,14.7L32,14.8L30.3,15.1L28.7,15.5L27.1,16.1L25.6,16.9L24.2,17.7L22.9,18.7L21.7,19.9L20.6,21.1L19.6,22.5L18.7,24L18,25.5L17.3,27.2L16.5,29.1L16.5,28.9Z" fill="#F4F1FF" opacity=".9"/>
