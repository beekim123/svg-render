<svg xmlns="http://www.w3.org/2000/svg" class="svg-rule_hug" viewBox="0 0 64 64" width="64" height="64">
<title>规矩 · 抱红</title>
<style>
.svg-rule_hug g { transform-box: view-box; }
.svg-rule_hug .arm-l { transform-origin: 9px 58px; }
.svg-rule_hug .arm-r { transform-origin: 55px 56px; }

/* 待机 3000：0 静止 → 1500 两只手臂收紧一下 → 3000 回到静止 */
@keyframes svg-rule_hug-idle-1 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0.9px,-0.6px) rotate(1.6deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-rule_hug:not([data-anim]) .arm-l,
.svg-rule_hug[data-anim="idle"] .arm-l { animation: svg-rule_hug-idle-1 3s infinite; }
@keyframes svg-rule_hug-idle-2 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(-0.9px,-0.6px) rotate(-1.6deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-rule_hug:not([data-anim]) .arm-r,
.svg-rule_hug[data-anim="idle"] .arm-r { animation: svg-rule_hug-idle-2 3s infinite; }
</style>
<defs>
<clipPath id="rule_hug-cg"><circle cx="32" cy="29" r="16.5"/></clipPath><clipPath id="rule_hug-cl"><path d="M3,58 C2,47 7,39 16,38 C23,37 30,39 34,42 C37,45 36,50 32,51 C27,52 22,49 19,50 C16,51 16,55 16,58 C16,63 3,63 3,58 Z"/></clipPath><clipPath id="rule_hug-cr"><path d="M61,56 C62,45 57,37 48,36 C41,35 34,37 30,40 C27,43 28,48 32,49 C37,50 42,47 45,48 C48,49 48,53 48,56 C48,61 61,61 61,56 Z"/></clipPath>
</defs>

