    <g clip-path="url(#rule_hug-cl)"><path d="M3,58 C2,47 7,39 16,38 C23,37 30,39 34,42 C37,45 36,50 32,51 C27,52 22,49 19,50 C16,51 16,55 16,58 C16,63 3,63 3,58 Z" transform="translate(-1.2 -2.6)" fill="#C8B894"/><path d="M7,46Q12,42.4 20,39.4Q10,38.4 7,46Z" fill="#E2D6BA"/></g>
    <!-- 一道缝线 -->
    <path d="M9.6,57 C9,50 11,46 16,43.4" fill="none" stroke="#1C1412" stroke-width="1.3" stroke-dasharray="2.4 2.2" stroke-linecap="round"/>
