  <!-- 右手臂（在后） -->
  <g class="arm-r">
    <path d="M61,56 C62,45 57,37 48,36 C41,35 34,37 30,40 C27,43 28,48 32,49 C37,50 42,47 45,48 C48,49 48,53 48,56 C48,61 61,61 61,56 Z" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5.6" stroke-linejoin="round"/>
