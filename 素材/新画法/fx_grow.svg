<svg xmlns="http://www.w3.org/2000/svg" class="svg-fx_grow" viewBox="0 0 160 160" width="160" height="160" style="color:#E6DEC8">
<title>特效 · 宝石升级</title>
<style>
.svg-fx_grow g { transform-box: view-box; }
.svg-fx_grow #grow_ring,
.svg-fx_grow #grow_flash {
  opacity: 0;
  transform-origin: 80px 80px;
}

/* play 800ms：0(0%) 全透明 → 100(12.5%) 快速显形旋起 → 250(31.25%) 峰值保持 → 500(62.5%) 旋转扩散 → 800(100%) 全透明 */
@keyframes svg-fx_grow-play-ring {
  0% { transform: translate(0px,0px) rotate(-45deg) scale(0.42,0.42); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  12.5% { transform: translate(0px,0px) rotate(-8deg) scale(0.92,0.92); opacity: 1; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  31.25% { transform: translate(0px,0px) rotate(32deg) scale(1.02,1.02); opacity: 1; animation-timing-function: ease-in-out; }
  62.5% { transform: translate(0px,0px) rotate(76deg) scale(1.12,1.12); opacity: 0.74; animation-timing-function: linear; }
  100% { transform: translate(0px,0px) rotate(105deg) scale(1.18,1.18); opacity: 0; }
}
.svg-fx_grow[data-anim="play"] #grow_ring { animation: svg-fx_grow-play-ring 0.8s both; }

@keyframes svg-fx_grow-play-flash {
  0% { transform: translate(0px,0px) rotate(15deg) scale(0.3,0.3); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  12.5% { transform: translate(0px,0px) rotate(4deg) scale(0.88,0.88); opacity: 0.92; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  31.25% { transform: translate(0px,0px) rotate(-6deg) scale(1.05,1.05); opacity: 1; animation-timing-function: ease-in-out; }
  62.5% { transform: translate(0px,0px) rotate(-20deg) scale(0.78,0.78); opacity: 0.65; animation-timing-function: linear; }
  100% { transform: translate(0px,0px) rotate(-35deg) scale(0.35,0.35); opacity: 0; }
}
.svg-fx_grow[data-anim="play"] #grow_flash { animation: svg-fx_grow-play-flash 0.8s both; }
</style>
<g id="root">
  <!-- 中心升级共鸣闪光与旋流刀锋弧 (#grow_flash) -->
  <g id="grow_flash">
    <!-- 三道收尖旋流刀锋弧（替代平滑虚线圆） -->
    <path d="M40,68 C44,48 62,36 82,37 C65,42 50,53 45,70 Z M118,64 C124,83 114,104 96,113 C109,102 116,84 113,66 Z M84,122 C64,124 45,112 39,93 C49,108 65,117 83,117 Z" fill="#1C1412" stroke="#1C1412" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M40,68 C44,48 62,36 82,37 C65,42 50,53 45,70 Z M118,64 C124,83 114,104 96,113 C109,102 116,84 113,66 Z M84,122 C64,124 45,112 39,93 C49,108 65,117 83,117 Z" fill="currentColor"/>
    <!-- 中心四芒刻面星 -->
    <path d="M80,48 L87,71 L110,80 L87,89 L80,112 L73,89 L50,80 L73,71 Z" transform="translate(.4 .6)" fill="#1C1412" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M80,48 L87,71 L110,80 L87,89 L80,112 L73,89 L50,80 L73,71 Z" fill="currentColor"/>
    <path d="M80,56 L84,74 L102,80 L84,86 L80,104 L76,86 L58,80 L76,74 Z" fill="#F4F1FF"/>
  </g>

  <!-- 外圈旋转散开的六颗刻面星与六枚宝石碎晶 (#grow_ring，半径控制在 r 不超过 56，放大 1.18 后严格在 160×160 内) -->
  <g id="grow_ring">
    <!-- 1. 正上大星 (80, 26) -->
    <path d="M80,15 L83.5,22.5 L91,26 L83.5,29.5 L80,37 L76.5,29.5 L69,26 L76.5,22.5 Z" transform="translate(.4 .6)" fill="#1C1412" stroke="#1C1412" stroke-width="3" stroke-linejoin="round"/>
    <path d="M80,15 L83.5,22.5 L91,26 L83.5,29.5 L80,37 L76.5,29.5 L69,26 L76.5,22.5 Z" fill="currentColor"/>
    <path d="M80,15 L80,26 L69,26 L76.5,22.5 Z" fill="#F4F1FF" opacity="0.65"/>

    <!-- 2. 右上白星 (124, 52) -->
    <path d="M124,42 L127,48.8 L134,52 L127,55.2 L124,62 L121,55.2 L114,52 L121,48.8 Z" transform="translate(.4 .6)" fill="#1C1412" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M124,42 L127,48.8 L134,52 L127,55.2 L124,62 L121,55.2 L114,52 L121,48.8 Z" fill="#F4F1FF"/>

    <!-- 3. 右下染色星 (124, 106) -->
    <path d="M124,95 L127.5,102.5 L135,106 L127.5,109.5 L124,117 L120.5,109.5 L113,106 L120.5,102.5 Z" transform="translate(.4 .6)" fill="#1C1412" stroke="#1C1412" stroke-width="3" stroke-linejoin="round"/>
    <path d="M124,95 L127.5,102.5 L135,106 L127.5,109.5 L124,117 L120.5,109.5 L113,106 L120.5,102.5 Z" fill="currentColor"/>
    <path d="M124,95 L124,106 L113,106 L120.5,102.5 Z" fill="#F4F1FF" opacity="0.65"/>

    <!-- 4. 正下白星 (80, 134) -->
    <path d="M80,124 L83,130.8 L90,134 L83,137.2 L80,144 L77,137.2 L70,134 L77,130.8 Z" transform="translate(.4 .6)" fill="#1C1412" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M80,124 L83,130.8 L90,134 L77,137.2 L80,144 L77,137.2 L70,134 L77,130.8 Z" fill="#F4F1FF"/>

    <!-- 5. 左下染色星 (36, 106) -->
    <path d="M36,95 L39.5,102.5 L47,106 L39.5,109.5 L36,117 L32.5,109.5 L25,106 L32.5,102.5 Z" transform="translate(.4 .6)" fill="#1C1412" stroke="#1C1412" stroke-width="3" stroke-linejoin="round"/>
    <path d="M36,95 L39.5,102.5 L47,106 L39.5,109.5 L36,117 L32.5,109.5 L25,106 L32.5,102.5 Z" fill="currentColor"/>
    <path d="M36,95 L36,106 L25,106 L32.5,102.5 Z" fill="#F4F1FF" opacity="0.65"/>

    <!-- 6. 左上白星 (36, 52) -->
    <path d="M36,42 L39,48.8 L46,52 L39,55.2 L36,62 L33,55.2 L26,52 L33,48.8 Z" transform="translate(.4 .6)" fill="#1C1412" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M36,42 L39,48.8 L46,52 L39,55.2 L36,62 L33,55.2 L26,52 L33,48.8 Z" fill="#F4F1FF"/>

    <!-- 穿插在六颗星之间的六枚刻面宝石碎晶 -->
    <polygon points="103,28 111,33 107,41 99,36" fill="currentColor" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="103,28 111,33 105,35" fill="#F4F1FF" opacity="0.65"/>
    <polygon points="131,76 136,84 129,90 124,81" fill="currentColor" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="102,122 109,127 104,134 97,128" fill="currentColor" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="56,122 63,128 57,134 50,127" fill="currentColor" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="29,75 35,82 30,89 24,82" fill="currentColor" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="56,28 62,35 55,41 49,33" fill="currentColor" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
  </g>
</g>
</svg>
