<svg xmlns="http://www.w3.org/2000/svg" class="svg-fx_white" viewBox="0 0 240 240" width="240" height="240">
<title>特效 · 凑白</title>
<style>
.svg-fx_white g { transform-box: view-box; }
.svg-fx_white #w_ring,
.svg-fx_white #w_rays,
.svg-fx_white #w_core {
  opacity: 0;
  transform-origin: 120px 120px;
}

/* play 700ms：0(0%) 全透明 → 80(11.43%) 快速显形 → 200(28.57%) 峰值保持 → 400(57.14%) 扩散衰减 → 700(100%) 全透明 */
@keyframes svg-fx_white-play-core {
  0% { transform: translate(0px,0px) rotate(-14deg) scale(0.25,0.25); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  11.43% { transform: translate(0px,0px) rotate(-3deg) scale(1.05,1.05); opacity: 1; animation-timing-function: linear; }
  28.57% { transform: translate(0px,0px) rotate(3deg) scale(1,1); opacity: 1; animation-timing-function: ease-in-out; }
  57.14% { transform: translate(0px,0px) rotate(10deg) scale(0.84,0.84); opacity: 0.72; animation-timing-function: linear; }
  100% { transform: translate(0px,0px) rotate(18deg) scale(0.35,0.35); opacity: 0; }
}
.svg-fx_white[data-anim="play"] #w_core { animation: svg-fx_white-play-core 0.7s both; }

@keyframes svg-fx_white-play-rays {
  0% { transform: translate(0px,0px) rotate(10deg) scale(0.32,0.32); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  11.43% { transform: translate(0px,0px) rotate(2deg) scale(0.96,0.96); opacity: 1; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  28.57% { transform: translate(0px,0px) rotate(0deg) scale(1.03,1.03); opacity: 1; animation-timing-function: ease-in-out; }
  57.14% { transform: translate(0px,0px) rotate(-6deg) scale(1.08,1.08); opacity: 0.76; animation-timing-function: linear; }
  100% { transform: translate(0px,0px) rotate(-12deg) scale(1.12,1.12); opacity: 0; }
}
.svg-fx_white[data-anim="play"] #w_rays { animation: svg-fx_white-play-rays 0.7s both; }

@keyframes svg-fx_white-play-ring {
  0% { transform: translate(0px,0px) rotate(-10deg) scale(0.4,0.4); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  11.43% { transform: translate(0px,0px) rotate(-2deg) scale(0.92,0.92); opacity: 0.95; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  28.57% { transform: translate(0px,0px) rotate(2deg) scale(1,1); opacity: 1; animation-timing-function: ease-in-out; }
  57.14% { transform: translate(0px,0px) rotate(8deg) scale(1.1,1.1); opacity: 0.72; animation-timing-function: linear; }
  100% { transform: translate(0px,0px) rotate(15deg) scale(1.16,1.16); opacity: 0; }
}
.svg-fx_white[data-anim="play"] #w_ring { animation: svg-fx_white-play-ring 0.7s both; }
</style>
<g id="root">
  <!-- 1. 外围刀锋光弧与三色混白刻面碎晶 (#w_ring，控制在 r 不超过 94 内，放大 1.16 后严格在 240×240 内) -->
  <g id="w_ring">
    <!-- 四段收尖刀锋弧（不画平滑圆环） -->
    <path d="M52,68 C66,46 90,33 116,32 C92,38 71,50 57,71 Z M172,52 C194,66 207,90 208,116 C202,92 190,71 169,57 Z M188,172 C174,194 150,207 124,208 C148,202 169,190 183,169 Z M68,188 C46,174 33,150 32,124 C38,148 50,169 71,183 Z" fill="#1C1412" stroke="#1C1412" stroke-width="3" stroke-linejoin="round"/>
    <path d="M52,68 C66,46 90,33 116,32 C92,38 71,50 57,71 Z M172,52 C194,66 207,90 208,116 C202,92 190,71 169,57 Z M188,172 C174,194 150,207 124,208 C148,202 169,190 183,169 Z M68,188 C46,174 33,150 32,124 C38,148 50,169 71,183 Z" fill="#F4F1FF"/>

    <!-- 四角飞散的白亮刻面碎晶（带微弱红/绿/蓝三色混白内反光） -->
    <polygon points="44,44 62,48 56,62 40,56" fill="#F4F1FF" stroke="#1C1412" stroke-width="2.4" stroke-linejoin="round"/>
    <polygon points="44,44 62,48 52,54" fill="#FFA3AB"/>
    <polygon points="196,44 192,62 178,56 184,40" fill="#F4F1FF" stroke="#1C1412" stroke-width="2.4" stroke-linejoin="round"/>
    <polygon points="196,44 186,52 178,56" fill="#A6F5C6"/>
    <polygon points="196,196 178,192 184,178 200,184" fill="#F4F1FF" stroke="#1C1412" stroke-width="2.4" stroke-linejoin="round"/>
    <polygon points="196,196 186,186 184,178" fill="#B4C8FF"/>
    <polygon points="44,196 48,178 62,184 56,200" fill="#F4F1FF" stroke="#1C1412" stroke-width="2.4" stroke-linejoin="round"/>
    <polygon points="44,196 48,178 55,188" fill="#E6DEC8"/>

    <!-- 四颗外围白亮四角尖星 -->
    <path d="M120,22 L123,31 L132,34 L123,37 L120,46 L117,37 L108,34 L117,31 Z M218,120 L209,123 L206,132 L203,123 L194,120 L203,117 L206,108 L209,117 Z M120,218 L117,209 L108,206 L117,203 L120,194 L123,203 L132,206 L123,209 Z M22,120 L31,117 L34,108 L37,117 L46,120 L37,123 L34,132 L31,123 Z" fill="#F4F1FF" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- 2. 主层十六芒哥特白光星爆 (#w_rays，墨色错位垫底 + 明暗刻面分色) -->
  <g id="w_rays">
    <polygon points="120,24 133,80 186,50 156,104 216,120 156,136 186,190 133,160 120,216 107,160 54,190 84,136 24,120 84,104 54,50 107,80" transform="translate(.6 .8)" fill="#1C1412" stroke="#1C1412" stroke-width="4.4" stroke-linejoin="round"/>
    <polygon points="120,24 133,80 186,50 156,104 216,120 156,136 186,190 133,160 120,216 107,160 54,190 84,136 24,120 84,104 54,50 107,80" fill="#E6DEC8"/>
    <!-- 左上亮白刻面 -->
    <polygon points="120,24 133,80 186,50 120,120 24,120 84,104 54,50 107,80" fill="#F4F1FF"/>
    <!-- 右下冷灰青暗刻面 -->
    <polygon points="216,120 156,136 186,190 133,160 120,216 120,120" fill="#8CAAB5" opacity="0.55"/>
    <!-- 三色混白微光棱面 -->
    <polygon points="120,24 120,120 107,80" fill="#FFA3AB" opacity="0.45"/>
    <polygon points="186,50 156,104 120,120" fill="#A6F5C6" opacity="0.45"/>
    <polygon points="54,190 84,136 120,120" fill="#B4C8FF" opacity="0.45"/>
  </g>

  <!-- 3. 中心八边形刻面宝石白光核 (#w_core) -->
  <g id="w_core">
    <polygon points="120,52 135,96 186,88 146,120 186,152 135,144 120,188 105,144 54,152 94,120 54,88 105,96" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="3.6" stroke-linejoin="round"/>
    <polygon points="120,52 135,96 186,88 146,120 186,152 135,144 120,188 105,144 54,152 94,120 54,88 105,96" fill="#F4F1FF"/>
    <!-- 中心八角白晶台面 -->
    <polygon points="110,96 130,96 144,110 144,130 130,144 110,144 96,130 96,110" fill="#E6DEC8" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="110,96 130,96 138,114 114,126 96,130 96,110" fill="#F4F1FF"/>
  </g>
</g>
</svg>
