<svg xmlns="http://www.w3.org/2000/svg" class="svg-card_art_bag" viewBox="0 0 176 188" width="176" height="188">
<title>额外牌原画 · 口袋</title>
<style>
.svg-card_art_bag g { transform-box: view-box; }
.svg-card_art_bag #shadow { transform-origin: 98px 168px; }
.svg-card_art_bag #bag_back { transform-origin: 98px 156px; }
.svg-card_art_bag #card_1 { transform-origin: 82px 88px; }
.svg-card_art_bag #card_2 { transform-origin: 114px 90px; }
.svg-card_art_bag #bag_front { transform-origin: 98px 156px; }
.svg-card_art_bag #strings { transform-origin: 98px 94px; }
.svg-card_art_bag #clasp { transform-origin: 98px 122px; }
.svg-card_art_bag #pop_fx { transform-origin: 98px 54px; opacity: 0; }

/* 待机 3000ms：0 静止/低位 → 1500 轻变化最大/高位 → 3000 与0帧一致 */
@keyframes svg-card_art_bag-idle-c1 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(-1px,-4px) rotate(-1.5deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-card_art_bag-idle-c2 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(1px,-4px) rotate(1.5deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-card_art_bag-idle-bag {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,-1.5px) rotate(0deg) scale(1.01,0.99); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-card_art_bag-idle-str {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,-1.5px) rotate(2.5deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-card_art_bag-idle-clasp {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,-2px) rotate(0deg) scale(1.02,1.02); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-card_art_bag-idle-sh {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,0px) rotate(0deg) scale(0.97,0.97); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-card_art_bag:not([data-anim]) #card_1,
.svg-card_art_bag[data-anim="idle"] #card_1 { animation: svg-card_art_bag-idle-c1 3s infinite; }
.svg-card_art_bag:not([data-anim]) #card_2,
.svg-card_art_bag[data-anim="idle"] #card_2 { animation: svg-card_art_bag-idle-c2 3s infinite; }
.svg-card_art_bag:not([data-anim]) #bag_back,
.svg-card_art_bag[data-anim="idle"] #bag_back,
.svg-card_art_bag:not([data-anim]) #bag_front,
.svg-card_art_bag[data-anim="idle"] #bag_front { animation: svg-card_art_bag-idle-bag 3s infinite; }
.svg-card_art_bag:not([data-anim]) #strings,
.svg-card_art_bag[data-anim="idle"] #strings { animation: svg-card_art_bag-idle-str 3s infinite; }
.svg-card_art_bag:not([data-anim]) #clasp,
.svg-card_art_bag[data-anim="idle"] #clasp { animation: svg-card_art_bag-idle-clasp 3s infinite; }
.svg-card_art_bag:not([data-anim]) #shadow,
.svg-card_art_bag[data-anim="idle"] #shadow { animation: svg-card_art_bag-idle-sh 3s infinite; }

/* play 600ms：0(0%) 静止 → 100(16.67%) 起手下蹲蓄力 → 250(41.67%) 两张牌弹到最高 → 400(66.67%) 停住 → 600(100%) 回到袋口静止 */
@keyframes svg-card_art_bag-play-bag {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  16.67% { transform: translate(0px,4px) rotate(0deg) scale(1.06,0.92); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  41.67% { transform: translate(0px,-3px) rotate(0deg) scale(0.96,1.04); animation-timing-function: linear; }
  66.67% { transform: translate(0px,-3px) rotate(0deg) scale(0.96,1.04); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-card_art_bag-play-c1 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  16.67% { transform: translate(-1px,4px) rotate(-2deg) scale(0.97,0.95); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  41.67% { transform: translate(-4px,-26px) rotate(-4deg) scale(1.04,1.04); animation-timing-function: linear; }
  66.67% { transform: translate(-4px,-26px) rotate(-4deg) scale(1.04,1.04); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-card_art_bag-play-c2 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  16.67% { transform: translate(1px,4px) rotate(2deg) scale(0.97,0.95); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  41.67% { transform: translate(5px,-26px) rotate(5deg) scale(1.04,1.04); animation-timing-function: linear; }
  66.67% { transform: translate(5px,-26px) rotate(5deg) scale(1.04,1.04); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-card_art_bag-play-str {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  16.67% { transform: translate(0px,3px) rotate(5deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  41.67% { transform: translate(0px,-3px) rotate(-6deg) scale(1,1); animation-timing-function: linear; }
  66.67% { transform: translate(0px,-3px) rotate(-5deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-card_art_bag-play-clasp {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  16.67% { transform: translate(0px,4px) rotate(0deg) scale(1.06,0.94); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  41.67% { transform: translate(0px,-4px) rotate(0deg) scale(1.05,1.05); animation-timing-function: linear; }
  66.67% { transform: translate(0px,-4px) rotate(0deg) scale(1.05,1.05); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-card_art_bag-play-fx {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  16.67% { transform: translate(0px,4px) rotate(0deg) scale(0.85,0.85); opacity: 0.35; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  41.67% { transform: translate(0px,-6px) rotate(0deg) scale(1.04,1.04); opacity: 1; animation-timing-function: linear; }
  66.67% { transform: translate(0px,-6px) rotate(0deg) scale(1.04,1.04); opacity: 0.9; animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; }
}
@keyframes svg-card_art_bag-play-sh {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  16.67% { transform: translate(0px,0px) rotate(0deg) scale(1.06,0.94); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  41.67% { transform: translate(0px,0px) rotate(0deg) scale(0.92,0.92); animation-timing-function: linear; }
  66.67% { transform: translate(0px,0px) rotate(0deg) scale(0.92,0.92); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-card_art_bag[data-anim="play"] #bag_back,
.svg-card_art_bag[data-anim="play"] #bag_front { animation: svg-card_art_bag-play-bag 0.6s both; }
.svg-card_art_bag[data-anim="play"] #card_1 { animation: svg-card_art_bag-play-c1 0.6s both; }
.svg-card_art_bag[data-anim="play"] #card_2 { animation: svg-card_art_bag-play-c2 0.6s both; }
.svg-card_art_bag[data-anim="play"] #strings { animation: svg-card_art_bag-play-str 0.6s both; }
.svg-card_art_bag[data-anim="play"] #clasp { animation: svg-card_art_bag-play-clasp 0.6s both; }
.svg-card_art_bag[data-anim="play"] #pop_fx { animation: svg-card_art_bag-play-fx 0.6s both; }
.svg-card_art_bag[data-anim="play"] #shadow { animation: svg-card_art_bag-play-sh 0.6s both; }
</style>
<defs>
  <clipPath id="card_art_bag-cfront">
    <path d="M56,90 C70,96 126,96 140,90 C145,104 152,120 150,138 C148,154 130,164 98,164 C66,164 48,154 46,138 C44,120 51,104 56,90 Z"/>
  </clipPath>
  <radialGradient id="card_art_bag-gem-glow" cx="98" cy="122" r="24" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#4FDB85" stop-opacity="0.52"/>
    <stop offset="0.65" stop-color="#1DBF5E" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#1DBF5E" stop-opacity="0"/>
  </radialGradient>
</defs>

<g id="root">
  <!-- 左上角 x:0..30, y:0..90 严格留空 -->
  <g id="shadow">
    <ellipse cx="98" cy="168" rx="48" ry="8" fill="#0D111C" opacity="0.6"/>
  </g>

  <!-- 敞开袋口后沿与深暗内腔 -->
  <g id="bag_back">
    <path d="M53,88 C63,73 133,73 143,88 L139,104 L57,104 Z" transform="translate(.5 .8)" fill="#1C1412" stroke="#1C1412" stroke-width="5.2" stroke-linejoin="round"/>
    <path d="M53,88 C63,73 133,73 143,88 L139,104 L57,104 Z" fill="#3D2212"/>
    <path d="M57,85 C68,75 128,75 139,85" fill="none" stroke="#9E6238" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="98" cy="89" rx="41" ry="12" fill="#161221" stroke="#1C1412" stroke-width="2.4"/>
    <ellipse cx="98" cy="91" rx="35" ry="8.5" fill="#0D111C"/>
  </g>

  <!-- 第一张牌背 card_1（左侧微倾，照新 card_back 缩小，弹出 -26px 后最高 y=18，左缘 x=48 > 30） -->
  <g id="card_1">
    <g transform="rotate(-8 82 88)">
      <rect x="60" y="46" width="42" height="62" rx="4" transform="translate(.4 .6)" fill="#1C1412" stroke="#1C1412" stroke-width="4.4" stroke-linejoin="round"/>
      <rect x="60" y="46" width="42" height="62" rx="4" fill="#262036"/>
      <rect x="63" y="49" width="36" height="56" rx="2.5" fill="#161221" stroke="#9A7B46" stroke-width="1.3"/>
      <path d="M64,55 V50 H69 M93,50 H98 V55 M64,99 V104 H69 M93,104 H98 V99" fill="none" stroke="#C2A670" stroke-width="1.4" stroke-linecap="round"/>
      <polygon points="81,52 94,76 81,100 68,76" fill="none" stroke="#3A324D" stroke-width="1"/>
      <polygon points="81,56 93,64 94,76 88,86 81,90 74,86 68,76 69,64" fill="#6E542B" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round"/>
      <polygon points="81,59 90,66 91,75 86,83 81,86 76,83 71,75 72,66" fill="#161221" stroke="#9A7B46" stroke-width="0.9"/>
      <circle cx="81" cy="66" r="4.6" fill="#E3263A" stroke="#1C1412" stroke-width="1.2"/>
      <circle cx="79.8" cy="64.8" r="1.2" fill="#F4F1FF"/>
      <rect x="72" y="73" width="7.2" height="7.2" rx="1" fill="#1DBF5E" stroke="#1C1412" stroke-width="1.2"/>
      <polygon points="86,72.5 90.5,80.5 81.5,80.5" fill="#2E66F0" stroke="#1C1412" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- 第二张牌背 card_2（右侧微倾，照新 card_back 缩小） -->
  <g id="card_2">
    <g transform="rotate(8 114 90)">
      <rect x="93" y="48" width="42" height="62" rx="4" transform="translate(.4 .6)" fill="#1C1412" stroke="#1C1412" stroke-width="4.4" stroke-linejoin="round"/>
      <rect x="93" y="48" width="42" height="62" rx="4" fill="#262036"/>
      <rect x="96" y="51" width="36" height="56" rx="2.5" fill="#161221" stroke="#9A7B46" stroke-width="1.3"/>
      <path d="M97,57 V52 H102 M126,52 H131 V57 M97,101 V106 H102 M126,106 H131 V101" fill="none" stroke="#C2A670" stroke-width="1.4" stroke-linecap="round"/>
      <polygon points="114,54 127,78 114,102 101,78" fill="none" stroke="#3A324D" stroke-width="1"/>
      <polygon points="114,58 126,66 127,78 121,88 114,92 107,88 101,78 102,66" fill="#6E542B" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round"/>
      <polygon points="114,61 123,68 124,77 119,85 114,88 109,85 104,77 105,68" fill="#161221" stroke="#9A7B46" stroke-width="0.9"/>
      <circle cx="114" cy="68" r="4.6" fill="#E3263A" stroke="#1C1412" stroke-width="1.2"/>
      <circle cx="112.8" cy="66.8" r="1.2" fill="#F4F1FF"/>
      <rect x="105" y="75" width="7.2" height="7.2" rx="1" fill="#1DBF5E" stroke="#1C1412" stroke-width="1.2"/>
      <polygon points="119,74.5 123.5,82.5 114.5,82.5" fill="#2E66F0" stroke="#1C1412" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- play 弹出时的速度弧与小闪星（平时 opacity: 0） -->
  <g id="pop_fx" opacity="0">
    <path d="M68,36 Q63,24 58,20 M128,38 Q133,26 138,22 M98,30 V18" fill="none" stroke="#E2D6BA" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M54,28 Q55,32 59,33 Q55,34 54,38 Q53,34 49,33 Q53,32 54,28 Z M142,30 Q143,34 147,35 Q143,36 142,40 Q141,36 137,35 Q141,34 142,30 Z" fill="#4FDB85"/>
  </g>

  <!-- 旧皮口袋前肚 bag_front（七层画法：墨色垫底、暗底、错位亮面、加深、受光边与断续冷光、补丁与缝线、收尖褶谷） -->
  <g id="bag_front">
    <path d="M56,90 C70,96 126,96 140,90 C145,104 152,120 150,138 C148,154 130,164 98,164 C66,164 48,154 46,138 C44,120 51,104 56,90 Z" transform="translate(.6 .9)" fill="#1C1412" stroke="#1C1412" stroke-width="5.6" stroke-linejoin="round"/>
    <path d="M56,90 C70,96 126,96 140,90 C145,104 152,120 150,138 C148,154 130,164 98,164 C66,164 48,154 46,138 C44,120 51,104 56,90 Z" fill="#704122"/>
    <g clip-path="url(#card_art_bag-cfront)">
      <path d="M56,90 C70,96 126,96 140,90 C145,104 152,120 150,138 C148,154 130,164 98,164 C66,164 48,154 46,138 C44,120 51,104 56,90 Z" transform="translate(-5.5 -5)" fill="#9E6238"/>
      <!-- 右下大块弧形暗面与底部加深 -->
      <path d="M126,92 C132,118 122,144 92,156 C72,162 54,158 46,148 L56,166 L152,162 L152,92 Z" fill="#704122" opacity="0.88"/>
      <path d="M150,124 C150,150 132,164 96,164 L68,162 C110,160 138,148 144,120 Z" fill="#3D2212" opacity="0.82"/>
      <!-- 袋口压在袋肚上沿的束口暗带 -->
      <path d="M54,90 C70,98 126,98 142,90 L144,102 C126,108 70,108 52,102 Z" fill="#3D2212" opacity="0.65"/>
      <!-- 左上受光亮边与右下断续冷轮廓光 -->
      <path d="M47.8,136 C46.5,120 51.5,105 56.8,92.5 L60,94 C55,106 50.2,120 50.5,136 Z" fill="#C48A5C"/>
      <path d="M148.2,122 C148.8,133 146,143 139,150 C144,142 146.5,132 146.2,122.5 Z M131,156 C121,161 109,162.5 96,162.5 C109,160.8 120,159 129.8,154.5 Z" fill="#8CAAB5" opacity="0.82"/>
      <!-- 褶谷（最暗楔形）与褶脊（亮收尖线）汇向袋口 -->
      <path d="M74,98 Q68,120 65,142 Q71,120 76.5,98 Z M122,98 Q128,120 131,142 Q125,120 119.5,98 Z M98,132 Q98,146 97,158 Q99.5,146 98,132 Z" fill="#3D2212" opacity="0.78"/>
      <path d="M71.5,99 Q66,118 63.5,136 Q67.5,118 73,99 Z M95.5,133 Q95.5,145 94.8,154 Q96.8,145 95.5,133 Z" fill="#C48A5C" opacity="0.75"/>
      <!-- 右下旧暗紫补丁与虚线缝线 -->
      <path d="M118,132 L135,128 L139,145 L121,149 Z" fill="#3A324D" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M120,130 L137,126 M119,147 L137,143 M120,134 L123,147" fill="none" stroke="#C8B894" stroke-width="1.2" stroke-dasharray="2.4 2.2" stroke-linecap="round"/>
      <!-- 左下弧形缝线 -->
      <path d="M53,134 Q63,150 82,155" fill="none" stroke="#1C1412" stroke-width="1.5" stroke-dasharray="3.2 2.6" stroke-linecap="round"/>
    </g>
    <!-- 袋口荷叶折边 -->
    <path d="M52,92 C60,86 72,95 82,91 C92,87 104,87 114,91 C124,95 136,86 144,92 C138,99 124,101 98,101 C72,101 58,99 52,92 Z" fill="#9E6238" stroke="#1C1412" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M56,92 C64,89 73,95 82,92" fill="none" stroke="#C48A5C" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- 束口麻绳 strings -->
  <g id="strings">
    <path d="M54,97 C72,104 124,104 142,97" fill="none" stroke="#1C1412" stroke-width="5.2" stroke-linecap="round"/>
    <path d="M54,97 C72,104 124,104 142,97" fill="none" stroke="#9A8968" stroke-width="2.6" stroke-dasharray="5 3" stroke-linecap="round"/>
    <path d="M54,97 C46,105 43,115 45,125 M142,97 C150,105 153,115 151,125" fill="none" stroke="#1C1412" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M54,97 C46,105 43,115 45,125 M142,97 C150,105 153,115 151,125" fill="none" stroke="#9A8968" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="45" cy="126" r="3.4" fill="#9A8968" stroke="#1C1412" stroke-width="1.8"/>
    <circle cx="151" cy="126" r="3.4" fill="#6E6248" stroke="#1C1412" stroke-width="1.8"/>
  </g>

  <!-- 袋口绿色切角方宝石铜扣 clasp -->
  <g id="clasp">
    <circle cx="98" cy="122" r="24" fill="url(#card_art_bag-gem-glow)"/>
    <polygon points="83,104 113,104 118,109 118,135 113,140 83,140 78,135 78,109" transform="translate(.5 .8)" fill="#1C1412" stroke="#1C1412" stroke-width="4.4" stroke-linejoin="round"/>
    <polygon points="83,104 113,104 118,109 118,135 113,140 83,140 78,135 78,109" fill="#6E542B"/>
    <polygon points="83,104 113,104 108,110 84,110 84,132 78,135 78,109" fill="#C2A670"/>
    <polygon points="86,108 110,108 114,112 114,132 110,136 86,136 82,132 82,112" fill="#1C1412"/>
    <!-- 绿色切角方宝石（平色刻面+亮棱） -->
    <polygon points="87,109 109,109 112,112 112,132 109,135 87,135 84,132 84,112" fill="#1DBF5E"/>
    <polygon points="87,109 109,109 105,114 91,114" fill="#A6F5C6"/>
    <polygon points="84,112 87,109 91,114 91,130 84,132" fill="#4FDB85"/>
    <polygon points="109,109 112,112 112,132 109,135 87,135 91,130 105,130 105,114" fill="#0A5A2B"/>
    <polygon points="97,130 105,130 109,135 98,135" fill="#4FDB85" opacity="0.72"/>
    <rect x="91" y="114" width="14" height="16" rx="1" fill="#1DBF5E"/>
    <polygon points="91,114 105,114 98,122 91,124" fill="#A6F5C6" opacity="0.68"/>
    <path d="M91,114 H105 V130 H91 Z M87,109 L91,114 M109,109 L105,114 M112,132 L105,130 M84,132 L91,130" fill="none" stroke="#A6F5C6" stroke-width="0.6" opacity="0.7"/>
    <circle cx="92" cy="116" r="1.9" fill="#F4F1FF"/>
  </g>
</g>
</svg>
