<svg xmlns="http://www.w3.org/2000/svg" class="svg-gem_blue_rough" viewBox="0 0 100 100" width="100" height="100">
<title>蓝宝石 · 原石</title>
<style>
.svg-gem_blue_rough g { transform-box: view-box; }
.svg-gem_blue_rough #crack_glint { transform-origin: 50px 52px; opacity: 0; }

/* 待机 3000：0 → 1200 静止 → 1400 裂缝里透出一道暗蓝光（最亮）→ 1600 暗回去 → 3000 静止 */
@keyframes svg-gem_blue_rough-idle-1 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(0.96,0.96); opacity: 0; animation-timing-function: linear; }
  40% { transform: translate(0px,0px) rotate(0deg) scale(0.96,0.96); opacity: 0; animation-timing-function: ease-in-out; }
  46.67% { transform: translate(0px,0px) rotate(0deg) scale(1.02,1.02); opacity: 1; animation-timing-function: ease-in-out; }
  53.33% { transform: translate(0px,0px) rotate(0deg) scale(0.96,0.96); opacity: 0; animation-timing-function: linear; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(0.96,0.96); opacity: 0; }
}
.svg-gem_blue_rough:not([data-anim]) #crack_glint,
.svg-gem_blue_rough[data-anim="idle"] #crack_glint { animation: svg-gem_blue_rough-idle-1 3s infinite; }
</style>
<defs>
<clipPath id="gem_blue_rough-cstone">
  <path d="M48,11 C52,10.5 55,13 58,18 C65,30 73,44 80,57 L77.5,60.5 L81.5,63 C85,69 88,74 89,78 C89.5,82 86,85 81,85.5 C64,87 48,87.5 34,86 L31.5,83.5 L28.5,86 C21,85.5 14,84 11.5,80 C10,76 13,69 18,59 C25,45 34,29 42,16 C44,12.5 46,11.2 48,11 Z"/>
</clipPath>
<clipPath id="gem_blue_rough-cmain">
  <path d="M47.5,25 L65,56 L55,61 L30,59 L37,39 Z"/>
</clipPath>
<clipPath id="gem_blue_rough-csub">
  <path d="M56,66 L74,67.5 L68,78 L49,76 Z"/>
</clipPath>
<radialGradient id="gem_blue_rough-glow" cx="50" cy="52" r="34" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#6A93F8" stop-opacity="0.55"/>
  <stop offset="0.65" stop-color="#2E66F0" stop-opacity="0.22"/>
  <stop offset="1" stop-color="#122A78" stop-opacity="0"/>
</radialGradient>
</defs>

<g id="root">
  <!-- 第 1 层：墨色垫底（往右下错开 0.6, 0.9，外轮廓粗） -->
  <path d="M48,11 C52,10.5 55,13 58,18 C65,30 73,44 80,57 L77.5,60.5 L81.5,63 C85,69 88,74 89,78 C89.5,82 86,85 81,85.5 C64,87 48,87.5 34,86 L31.5,83.5 L28.5,86 C21,85.5 14,84 11.5,80 C10,76 13,69 18,59 C25,45 34,29 42,16 C44,12.5 46,11.2 48,11 Z" transform="translate(.6 .9)" fill="#1C1412" stroke="#1C1412" stroke-width="6.2" stroke-linejoin="round"/>

  <!-- 第 2 层：铺石皮“暗”一档 -->
  <path d="M48,11 C52,10.5 55,13 58,18 C65,30 73,44 80,57 L77.5,60.5 L81.5,63 C85,69 88,74 89,78 C89.5,82 86,85 81,85.5 C64,87 48,87.5 34,86 L31.5,83.5 L28.5,86 C21,85.5 14,84 11.5,80 C10,76 13,69 18,59 C25,45 34,29 42,16 C44,12.5 46,11.2 48,11 Z" fill="#4A4742"/>

  <!-- 第 3、4、5、6 层：裁在石皮轮廓内 -->
  <g clip-path="url(#gem_blue_rough-cstone)">
    <!-- 第 3 层：亮面错位（往左上挪 -4.5, -4） -->
    <path d="M48,11 C52,10.5 55,13 58,18 C65,30 73,44 80,57 L77.5,60.5 L81.5,63 C85,69 88,74 89,78 C89.5,82 86,85 81,85.5 C64,87 48,87.5 34,86 L31.5,83.5 L28.5,86 C21,85.5 14,84 11.5,80 C10,76 13,69 18,59 C25,45 34,29 42,16 C44,12.5 46,11.2 48,11 Z" transform="translate(-4.5 -4)" fill="#6E6A63"/>
    <!-- 右侧与右下转过去的弧形暗面 -->
    <path d="M51,12 C56,28 62,46 54,62 C44,74 28,80 14,82 L88,87 L91,74 L60,14 Z" fill="#4A4742" opacity="0.88"/>
    <!-- 第 4 层：加深（最背光右下角与石皮凹陷处） -->
    <path d="M89,68 C89,80 82,86 64,87 L36,86 C58,83 75,78 82,64 Z" fill="#2E2C28" opacity="0.85"/>
    <path d="M26,61 C31,58 38,62 36,68 C33,73 24,71 23,66 C22,63 24,62 26,61 Z M68,42 C72,40 76,44 75,49 C73,52 68,51 67,47 Z" fill="#2E2C28" opacity="0.6"/>
    <!-- 石皮上的旧褐矿斑与颗粒 -->
    <path d="M21,67 C25,65 29,67 28,71 C26,74 21,73 20,70 Z M66,33 C69,32 72,35 71,38 C69,40 66,39 65,36 Z M39,79 C43,78 46,80 45,83 C42,85 38,83 39,79 Z" fill="#524531" opacity="0.65"/>
    <circle cx="34" cy="29" r="1.6" fill="#2E2C28" opacity="0.65"/>
    <circle cx="24" cy="52" r="1.4" fill="#2E2C28" opacity="0.6"/>
    <circle cx="76" cy="56" r="1.8" fill="#2E2C28" opacity="0.65"/>
    <circle cx="79" cy="74" r="1.5" fill="#2E2C28" opacity="0.7"/>
    <circle cx="31" cy="33" r="1.1" fill="#948F86" opacity="0.75"/>
    <circle cx="20" cy="64" r="1.2" fill="#948F86" opacity="0.7"/>
    <!-- 第 5 层：左上受光边（亮一档 #948F86，两头尖的月牙） -->
    <path d="M13.5,73 Q24,49 43.5,16.5 Q46.5,12.5 50.5,12.5 Q46.5,14.5 44.2,18.5 Q26.5,49.5 15.8,73.5 Z" fill="#948F86"/>
    <!-- 第 5 层：右下冷色轮廓光（#8CAAB5，断成两截） -->
    <path d="M81.5,64.5 Q86,72 87,77.5 Q85,72.5 80.2,65.2 Z M78,83.8 Q65,85.2 51,85 Q65,83.6 77.5,82.2 Z" fill="#8CAAB5" opacity="0.82"/>
  </g>

  <!-- 主裂口：石皮凹陷托座（先垫一圈最暗，显得宝石嵌在石皮里面） -->
  <path d="M47.2,22.5 L67.5,57 L55.8,63.2 L27.5,60.8 L35,38 Z" fill="#1C1412"/>
  <path d="M47.5,25 L65,56 L55,61 L30,59 L37,39 Z" fill="#122A78"/>
  <!-- 主裂口里的蓝色刻面（平色多边形，按朝向取色，不画墨线棱） -->
  <g clip-path="url(#gem_blue_rough-cmain)">
    <!-- 左上亮刻面 -->
    <polygon points="47.5,25 49,38 37,39" fill="#6A93F8"/>
    <polygon points="37,39 49,38 42,50 30,59" fill="#2E66F0"/>
    <!-- 中央小三角台面 -->
    <polygon points="49,38 56,50 42,50" fill="#2E66F0"/>
    <polygon points="49,38 52.5,44 42,50" fill="#6A93F8" opacity="0.85"/>
    <!-- 右侧与右下暗刻面 -->
    <polygon points="47.5,25 65,56 56,50 49,38" fill="#1D45B8"/>
    <polygon points="42,50 56,50 55,61 30,59" fill="#122A78"/>
    <!-- 背光侧内反光刻面（故意画亮） -->
    <polygon points="56,50 65,56 55,61" fill="#6A93F8" opacity="0.78"/>
    <!-- 刻面之间的高光细棱线（#B4C8FF，0.6 粗） -->
    <path d="M47.5,25 L49,38 L37,39 M49,38 L56,50 L42,50 L49,38 M42,50 L30,59 M56,50 L65,56 M56,50 L55,61" fill="none" stroke="#B4C8FF" stroke-width="0.65" stroke-linejoin="round" opacity="0.65"/>
    <!-- 左上沿白亮边 -->
    <path d="M31.5,56.5 L38,39.5 L47.5,26.2 L48.3,28.5 L39.4,40.5 L33,56 Z" fill="#F4F1FF" opacity="0.9"/>
    <!-- 石皮压在宝石左上沿的一道薄暗影 -->
    <path d="M47.5,25 L65,56 L62.5,56.5 L46.8,27.5 L31.5,59 L30,59 L37,39 Z" fill="#1C1412" opacity="0.32"/>
  </g>
  <!-- 主裂口高光点与石皮内沿墨线 -->
  <circle cx="45.2" cy="36.5" r="2.1" fill="#F4F1FF"/>
  <circle cx="42.5" cy="40.5" r="0.95" fill="#F4F1FF" opacity="0.85"/>
  <path d="M47.5,25 L65,56 L55,61 L30,59 L37,39 Z" fill="none" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- 右下副裂口：较小的一块蓝宝石刻面 -->
  <path d="M55,64.5 L76,66.2 L69,79.5 L47.2,77.2 Z" fill="#1C1412"/>
  <path d="M56,66 L74,67.5 L68,78 L49,76 Z" fill="#1D45B8"/>
  <g clip-path="url(#gem_blue_rough-csub)">
    <polygon points="56,66 65,71 49,76" fill="#6A93F8"/>
    <polygon points="56,66 74,67.5 65,71" fill="#2E66F0"/>
    <polygon points="65,71 74,67.5 68,78 49,76" fill="#122A78"/>
    <polygon points="65,71 72,72.5 68,78" fill="#6A93F8" opacity="0.65"/>
    <path d="M56,66 L65,71 L74,67.5 M65,71 L49,76 M65,71 L68,78" fill="none" stroke="#B4C8FF" stroke-width="0.6" opacity="0.6"/>
  </g>
  <circle cx="57.5" cy="69.8" r="1.3" fill="#F4F1FF"/>
  <path d="M56,66 L74,67.5 L68,78 L49,76 Z" fill="none" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>

  <!-- 第 7 层：石皮裂缝（收尖线，有走向和分叉，从裂口往外延伸） -->
  <path d="M47.5,25 Q49.8,18.5 49.2,11.5 Q47.2,18.5 46.2,25 Z M48.8,18.5 Q53.2,16.2 56.5,16.8 Q52.8,18.2 48.8,18.5 Z M65,56 Q72.5,58.2 79.5,58.5 Q72,60.5 64.2,57.2 Z M71.5,58.2 Q75.2,53.5 77.5,51.2 Q74.2,55.5 71.5,58.2 Z M30,59 Q21.5,65.5 13,75.5 Q22.8,67.5 31.2,60.2 Z M22.5,66.8 Q18.2,64.2 15.2,64.5 Q19,66.2 22.5,66.8 Z M55,61 Q56.2,63.5 56,66 Q54.2,63.8 53.8,61 Z M49,76 Q45.2,80.5 41.5,85.5 Q46.8,81.2 50.5,76.5 Z M74,67.5 Q80.5,69.5 87.5,74.5 Q80,71.2 73.5,68.8 Z M37,39 Q29.5,36.2 24.5,37.5 Q30.2,38.5 36.5,40.5 Z" fill="#1C1412"/>

  <!-- 裂缝里透出的细蓝光丝（静态下极暗，体现裂缝深处有矿） -->
  <path d="M47.5,24.5 Q48.8,19.5 48.6,14.5 M65.2,56.2 Q71,58.2 76.5,58.5 M30,59.2 Q23,65 16.5,72 M54.8,61 L55.6,66 M49.2,76.2 L43.5,83" fill="none" stroke="#2E66F0" stroke-width="0.9" stroke-linecap="round" opacity="0.55"/>

  <!-- 待机事件层：1200 → 1400 → 1600 裂缝里透出一道暗蓝光（平时 opacity: 0） -->
  <g id="crack_glint">
    <circle cx="50" cy="52" r="34" fill="url(#gem_blue_rough-glow)"/>
    <!-- 两个裂口内部亮起 -->
    <polygon points="47.5,26 63.8,55.2 54.6,60 31.2,58.2 37.8,39.5" fill="#6A93F8" opacity="0.5"/>
    <polygon points="48.5,35 55,49 41,49" fill="#B4C8FF" opacity="0.75"/>
    <polygon points="56.5,66.6 72.8,68 67.5,77.2 50.2,75.4" fill="#6A93F8" opacity="0.6"/>
    <!-- 裂缝里透出的蓝亮光脉 -->
    <path d="M47.5,24.5 Q48.8,19 48.8,13 M65.2,56.2 Q71.8,58.4 78,58.6 M30,59.2 Q22.5,65.5 15,73.5 M54.8,61 L55.6,66 M49.2,76.2 L43,83.5 M74,67.8 L84.5,73 M36.8,39.2 L26.5,37.5" fill="none" stroke="#6A93F8" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
    <path d="M47.5,24.5 Q48.8,19 48.8,13 M65.2,56.2 Q71.8,58.4 78,58.6 M30,59.2 Q22.5,65.5 15,73.5 M54.8,61 L55.6,66" fill="none" stroke="#F4F1FF" stroke-width="1" stroke-linecap="round" opacity="0.95"/>
    <!-- 裂缝交汇处的一点微星芒 -->
    <path d="M46,31 Q47,35.5 51.5,36.5 Q47,37.5 46,42 Q45,37.5 40.5,36.5 Q45,35.5 46,31 Z" fill="#F4F1FF" opacity="0.9"/>
  </g>
</g>
</svg>
