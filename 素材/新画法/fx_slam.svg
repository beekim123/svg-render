<svg xmlns="http://www.w3.org/2000/svg" class="svg-fx_slam" viewBox="0 0 400 160" width="400" height="160" style="color:#E6DEC8">
<title>特效 · 锤子砸下</title>
<style>
.svg-fx_slam g { transform-box: view-box; }
.svg-fx_slam #slam_core,
.svg-fx_slam #slam_wave_in,
.svg-fx_slam #slam_wave_out,
.svg-fx_slam #dust_left,
.svg-fx_slam #dust_right {
  opacity: 0;
  transform-origin: 200px 96px;
}

/* play 500ms：0(0%) 全透明 → 60(12%) 猛砸显形 → 160(32%) 冲击波与尘土峰值到位 → 300(60%) 横向扩散衰减 → 500(100%) 全透明 */
@keyframes svg-fx_slam-play-core {
  0% { transform: translate(0px,-6px) rotate(0deg) scale(0.35,0.45); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  12% { transform: translate(0px,0px) rotate(0deg) scale(1.04,1.02); opacity: 1; animation-timing-function: linear; }
  32% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 1; animation-timing-function: ease-in-out; }
  60% { transform: translate(0px,2px) rotate(0deg) scale(1.05,0.86); opacity: 0.68; animation-timing-function: linear; }
  100% { transform: translate(0px,4px) rotate(0deg) scale(1.08,0.72); opacity: 0; }
}
.svg-fx_slam[data-anim="play"] #slam_core { animation: svg-fx_slam-play-core 0.5s both; }

@keyframes svg-fx_slam-play-wave-in {
  0% { transform: translate(0px,0px) rotate(0deg) scale(0.4,0.48); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  12% { transform: translate(0px,0px) rotate(0deg) scale(0.92,0.94); opacity: 1; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  32% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 1; animation-timing-function: ease-in-out; }
  60% { transform: translate(0px,0px) rotate(0deg) scale(1.05,1.02); opacity: 0.76; animation-timing-function: linear; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1.08,1.04); opacity: 0; }
}
.svg-fx_slam[data-anim="play"] #slam_wave_in { animation: svg-fx_slam-play-wave-in 0.5s both; }

@keyframes svg-fx_slam-play-wave-out {
  0% { transform: translate(0px,0px) rotate(0deg) scale(0.48,0.52); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  12% { transform: translate(0px,0px) rotate(0deg) scale(0.88,0.9); opacity: 0.92; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  32% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 1; animation-timing-function: ease-in-out; }
  60% { transform: translate(0px,0px) rotate(0deg) scale(1.03,1.02); opacity: 0.78; animation-timing-function: linear; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1.05,1.03); opacity: 0; }
}
.svg-fx_slam[data-anim="play"] #slam_wave_out { animation: svg-fx_slam-play-wave-out 0.5s both; }

@keyframes svg-fx_slam-play-dust-l {
  0% { transform: translate(28px,6px) rotate(6deg) scale(0.5,0.5); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  12% { transform: translate(10px,2px) rotate(2deg) scale(0.9,0.9); opacity: 0.95; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  32% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 1; animation-timing-function: ease-in-out; }
  60% { transform: translate(-6px,-3px) rotate(-2deg) scale(1.03,1.03); opacity: 0.78; animation-timing-function: linear; }
  100% { transform: translate(-10px,-5px) rotate(-4deg) scale(0.96,0.96); opacity: 0; }
}
.svg-fx_slam[data-anim="play"] #dust_left { animation: svg-fx_slam-play-dust-l 0.5s both; }

@keyframes svg-fx_slam-play-dust-r {
  0% { transform: translate(-28px,6px) rotate(-6deg) scale(0.5,0.5); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  12% { transform: translate(-10px,2px) rotate(-2deg) scale(0.9,0.9); opacity: 0.95; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  32% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 1; animation-timing-function: ease-in-out; }
  60% { transform: translate(6px,-3px) rotate(2deg) scale(1.03,1.03); opacity: 0.78; animation-timing-function: linear; }
  100% { transform: translate(10px,-5px) rotate(4deg) scale(0.96,0.96); opacity: 0; }
}
.svg-fx_slam[data-anim="play"] #dust_right { animation: svg-fx_slam-play-dust-r 0.5s both; }
</style>
<g id="root">
  <!-- 1. 外圈贴桌面横向锯齿刀锋冲击波 (#slam_wave_out，x:22..378, y:52..142，绝不超 400×160) -->
  <g id="slam_wave_out">
    <path d="M28,96 L50,76 L90,66 L144,56 L200,52 L256,56 L310,66 L350,76 L372,96 L346,118 L302,132 L248,140 L200,142 L152,140 L98,132 L54,118 Z M56,96 L78,110 L124,122 L200,126 L276,122 L322,110 L344,96 L320,82 L272,70 L200,66 L128,70 L80,82 Z" transform="translate(.5 .7)" fill="#1C1412" fill-rule="evenodd" stroke="#1C1412" stroke-width="3.6" stroke-linejoin="round"/>
    <path d="M28,96 L50,76 L90,66 L144,56 L200,52 L256,56 L310,66 L350,76 L372,96 L346,118 L302,132 L248,140 L200,142 L152,140 L98,132 L54,118 Z M56,96 L78,110 L124,122 L200,126 L276,122 L322,110 L344,96 L320,82 L272,70 L200,66 L128,70 L80,82 Z" fill="currentColor" fill-rule="evenodd"/>
    <!-- 左上受光亮刻面与右下暗刻面 -->
    <path d="M28,96 L50,76 L90,66 L144,56 L200,52 L200,66 L128,70 L80,82 L56,96 Z" fill="#F4F1FF" opacity="0.52"/>
    <path d="M372,96 L346,118 L302,132 L248,140 L200,142 L200,126 L276,122 L322,110 L344,96 Z" fill="#1C1412" opacity="0.28"/>
    <!-- 横飞冲击尖刺 -->
    <polygon points="22,96 44,88 40,104" fill="currentColor" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="378,96 356,88 360,104" fill="currentColor" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- 2. 内圈贴地锯齿冲击环 (#slam_wave_in) -->
  <g id="slam_wave_in">
    <path d="M74,94 L98,76 L146,66 L200,62 L254,66 L302,76 L326,94 L300,114 L252,124 L200,128 L148,124 L100,114 Z M102,94 L124,106 L162,114 L200,116 L238,114 L276,106 L298,94 L274,82 L236,74 L200,72 L164,74 L126,82 Z" fill="currentColor" fill-rule="evenodd" stroke="#1C1412" stroke-width="2.6" stroke-linejoin="round"/>
    <polyline points="86,92 106,79 150,70 200,66 250,70 294,79 314,92" fill="none" stroke="#F4F1FF" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- 3. 左侧翻滚的哥特尘土团与飞石 (#dust_left，旧纸色阶 #524531 / #9A8968 / #C8B894 / #E2D6BA + 染色冲击碎晶) -->
  <g id="dust_left">
    <path d="M38,84 C42,71 54,64 68,66 C74,56 88,54 98,61 C110,63 118,74 116,86 C108,100 84,106 60,105 C46,104 37,96 38,84 Z" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="4" stroke-linejoin="round"/>
    <path d="M38,84 C42,71 54,64 68,66 C74,56 88,54 98,61 C110,63 118,74 116,86 C108,100 84,106 60,105 C46,104 37,96 38,84 Z" fill="#9A8968"/>
    <path d="M42,82 C46,71 56,66 68,68 C74,59 86,57 95,63 C102,65 106,72 102,80 C90,90 66,94 46,90 C42,88 41,85 42,82 Z" fill="#C8B894"/>
    <path d="M45,79 Q55,69 68,70 Q56,73 45,79 Z M72,66 Q82,58 93,63 Q82,62 72,66 Z" fill="#E2D6BA"/>
    <!-- 左下小尘团与碎石、染色碎晶 -->
    <path d="M68,108 C76,97 96,96 112,104 C116,114 104,125 88,125 C74,125 65,117 68,108 Z" fill="#524531" stroke="#1C1412" stroke-width="2.4" stroke-linejoin="round"/>
    <polygon points="48,50 62,44 60,58 46,56" fill="#9A8968" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="84,40 98,35 99,48 86,50" fill="currentColor" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="84,40 98,35 92,44" fill="#F4F1FF" opacity="0.65"/>
  </g>

  <!-- 4. 右侧翻滚的哥特尘土团与飞石 (#dust_right，同样遵循左上受光、右下加深) -->
  <g id="dust_right">
    <path d="M284,86 C282,74 290,63 302,61 C312,54 326,56 332,66 C346,64 358,71 362,84 C363,96 354,104 340,105 C316,106 292,100 284,86 Z" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="4" stroke-linejoin="round"/>
    <path d="M284,86 C282,74 290,63 302,61 C312,54 326,56 332,66 C346,64 358,71 362,84 C363,96 354,104 340,105 C316,106 292,100 284,86 Z" fill="#524531"/>
    <path d="M286,83 C285,73 292,64 303,62 C312,56 324,58 330,66 C342,65 352,70 355,80 C342,92 314,96 292,90 C288,88 286,86 286,83 Z" fill="#9A8968"/>
    <path d="M290,78 C292,70 300,64 310,62 C318,59 325,61 329,67 C316,74 302,78 290,78 Z" fill="#C8B894"/>
    <path d="M294,74 Q304,63 318,62 Q305,67 294,74 Z" fill="#E2D6BA"/>
    <path d="M288,104 C304,96 324,97 332,108 C335,117 326,125 312,125 C296,125 284,114 288,104 Z" fill="#524531" stroke="#1C1412" stroke-width="2.4" stroke-linejoin="round"/>
    <polygon points="352,50 338,44 340,58 354,56" fill="#9A8968" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="316,40 302,35 301,48 314,50" fill="currentColor" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="302,35 316,40 308,44" fill="#F4F1FF" opacity="0.65"/>
  </g>

  <!-- 5. 锤心砸地星芒 (#slam_core) -->
  <g id="slam_core">
    <polygon points="200,46 214,76 268,64 232,88 286,96 230,104 256,124 208,108 200,134 192,108 144,124 170,104 114,96 168,88 132,64 186,76" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="3.6" stroke-linejoin="round"/>
    <polygon points="200,46 214,76 268,64 232,88 286,96 230,104 256,124 208,108 200,134 192,108 144,124 170,104 114,96 168,88 132,64 186,76" fill="currentColor"/>
    <polygon points="200,62 210,82 246,74 220,90 256,96 218,102 234,114 200,104 166,114 182,102 144,96 180,90 154,74 190,82" fill="#F4F1FF" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
</g>
</svg>
