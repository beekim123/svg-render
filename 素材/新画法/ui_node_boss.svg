<svg xmlns="http://www.w3.org/2000/svg" class="svg-ui_node_boss" viewBox="0 0 64 64" width="64" height="64">
<title>进度节点 · 首领</title>
<style>
.svg-ui_node_boss g { transform-box: view-box; }
.svg-ui_node_boss #root { transform-origin: 32px 32px; }
.svg-ui_node_boss #dragon_head { transform-origin: 32px 33px; }
.svg-ui_node_boss #sheen { opacity: 0; }

/* idle 3000ms: 0 -> 1500 -> 3000 */
@keyframes svg-ui_node_boss-idle-head {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,-0.8px) rotate(-1.5deg) scale(1.02,1.02); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-ui_node_boss-idle-sheen {
  0% { opacity: 0; animation-timing-function: ease-in-out; }
  50% { opacity: 0.85; animation-timing-function: ease-in-out; }
  100% { opacity: 0; }
}
.svg-ui_node_boss:not([data-anim]) #dragon_head,
.svg-ui_node_boss[data-anim="idle"] #dragon_head {
  animation: svg-ui_node_boss-idle-head 3s infinite;
}
.svg-ui_node_boss:not([data-anim]) #sheen,
.svg-ui_node_boss[data-anim="idle"] #sheen {
  animation: svg-ui_node_boss-idle-sheen 3s infinite;
}
</style>
<defs>
  <clipPath id="ui_node_boss-cbase">
    <path d="M32,4.5 C35,7.5 42,8.5 53,6.8 C52,15 55.5,23 59.5,32 C55.5,41 52,49 53,57.2 C42,55.5 35,56.5 32,59.5 C29,56.5 22,55.5 11,57.2 C12,49 8.5,41 4.5,32 C8.5,23 12,15 11,6.8 C22,8.5 29,7.5 32,4.5 Z"/>
  </clipPath>
</defs>
<g id="root">
  <!-- 首领圆底：同系列哥特旧铜圆章，带四角尖棘，同一套七层画法与线宽 -->
  <path d="M32,4.5 C35,7.5 42,8.5 53,6.8 C52,15 55.5,23 59.5,32 C55.5,41 52,49 53,57.2 C42,55.5 35,56.5 32,59.5 C29,56.5 22,55.5 11,57.2 C12,49 8.5,41 4.5,32 C8.5,23 12,15 11,6.8 C22,8.5 29,7.5 32,4.5 Z" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5.6" stroke-linejoin="round"/>
  <path d="M32,4.5 C35,7.5 42,8.5 53,6.8 C52,15 55.5,23 59.5,32 C55.5,41 52,49 53,57.2 C42,55.5 35,56.5 32,59.5 C29,56.5 22,55.5 11,57.2 C12,49 8.5,41 4.5,32 C8.5,23 12,15 11,6.8 C22,8.5 29,7.5 32,4.5 Z" fill="#6E542B"/>
  <g clip-path="url(#ui_node_boss-cbase)">
    <path d="M32,4.5 C35,7.5 42,8.5 53,6.8 C52,15 55.5,23 59.5,32 C55.5,41 52,49 53,57.2 C42,55.5 35,56.5 32,59.5 C29,56.5 22,55.5 11,57.2 C12,49 8.5,41 4.5,32 C8.5,23 12,15 11,6.8 C22,8.5 29,7.5 32,4.5 Z" transform="translate(-3 -3)" fill="#9A7B46"/>
    <path d="M59.5,26 C57,42 54,52 53,57.2 C42,55.5 35,56.5 32,59.5 L24,57 C42,53 52,43 59.5,26 Z" fill="#3B2B14" opacity="0.82"/>
    <path d="M6.5,31 C9.5,22 12.5,14.5 12,8.5 C21,9.8 28,9 31.5,6.2 C27.5,10.2 21,11.2 13.5,10.2 C13.5,16.5 10.8,23.5 6.5,31 Z" fill="#C2A670"/>
    <path d="M57.2,34 C54.2,41.5 51.5,48.5 51.8,55.2 C44,54.2 37.5,55 33.5,57.5 C38,53.8 44,52.8 50.2,53.5 C50.5,47.5 53.2,40.5 57.2,34 Z" fill="#8CAAB5" opacity="0.82"/>
  </g>

  <!-- 内部暗夜紫与酒红深渊圆盘 -->
  <circle cx="32" cy="32.5" r="20.5" fill="#161221" stroke="#1C1412" stroke-width="2.5"/>
  <path d="M15,24 A19,19 0 0 1 49,24 A19,16 0 0 0 15,24 Z" fill="#381318" opacity="0.85"/>

  <!-- 中央图案：哥特恶龙龙头剪影 dragon_head（曲面轮廓 + 龙皮灰青色阶 + 渐细弯角） -->
  <g id="dragon_head">
    <!-- 整体墨色垫底 -->
    <path d="M23,21 C17,15 12.5,10.5 11,8.5 C15,7.2 22,11.5 30,18.5 C36,14 43,10 49.5,9.5 C51.5,11.5 47.5,17 41.5,22.5 C46.5,24.5 50.5,27.5 51.5,31 C48.5,33.5 44.5,34.8 41.5,35.2 C45.2,38 48,40.8 48.8,42.5 C46.8,46.5 44.2,48.8 41,49 C32,48.8 23.5,46.5 17.8,40.8 C14.5,36.8 14,32 15.5,28.2 C17.5,24.2 20,22 23,21 Z" transform="translate(.4 .6)" fill="#1C1412" stroke="#1C1412" stroke-width="4.6" stroke-linejoin="round"/>
    <!-- 后排右龙角（压暗旧骨色） -->
    <path d="M33.5,20 C39.5,14 45,10.2 50,9.8 C51,11.5 47,17 41.2,23 Z" fill="#9A8968" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- 前排左龙角（旧纸骨色曲面渐细管 + 环纹收尖线） -->
    <path d="M23.5,21.8 C17.5,16 13,11.2 11,8.5 C15.8,7.2 22.8,11.8 30.8,19 Z" fill="#C8B894" stroke="#1C1412" stroke-width="2.3" stroke-linejoin="round"/>
    <path d="M13,9.2 C17,8.8 22.5,12.5 29,18.2" fill="none" stroke="#E2D6BA" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M17.5,14.5 Q19.5,12.2 21.5,12.8 Q19.2,13.5 17.5,14.5 Z M21.5,18 Q23.8,15.5 26,16.2 Q23.5,17 21.5,18 Z" fill="#1C1412"/>

    <!-- 龙头主体与怒张下颚（龙皮暗档 #3B515C 主色，受光面 #5A7682，左上亮边 #8CAAB5） -->
    <path d="M15.2,28.5 C18.2,21.5 24.5,18.2 34.8,18.5 C42.5,20.2 48.8,24.5 51.5,30.8 C47.8,33.5 43.8,34.8 40.5,35.2 C44.8,37.8 47.8,40.5 48.8,42.5 C46.8,46.8 43.5,48.8 39.5,48.8 C29.5,48.5 22,45.8 17.8,40.8 C14.5,36.8 13.8,32.2 15.2,28.5 Z" fill="#3B515C" stroke="#1C1412" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- 龙头左上受光面 -->
    <path d="M16.2,28.5 C19,22.2 24.8,19.2 34.5,19.5 C41,20.8 46.5,24.2 49.5,29.2 C43,31.2 35,31.5 26,33 C20.5,33.8 17.2,32 16.2,28.5 Z" fill="#5A7682"/>
    <path d="M16.8,27.5 C19.5,22.2 25,19.8 34,20" fill="none" stroke="#8CAAB5" stroke-width="1.7" stroke-linecap="round"/>
    <!-- 口腔深渊与尖牙 -->
    <path d="M30.5,33.2 C37.5,32.5 44.5,31.2 49.8,30.2 L42,35.5 L47.2,41.8 L31.5,42 Z" fill="#161221" stroke="#1C1412" stroke-width="1.9" stroke-linejoin="round"/>
    <polygon points="35.5,32.2 38.2,36.8 41,31.5 43.8,36.2 46.8,31" fill="#E2D6BA" stroke="#1C1412" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="34.5,41.8 37.5,37.2 40.5,41.8 43.5,37.5 45.8,41.8" fill="#C8B894" stroke="#1C1412" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- 酒红斜三角龙眼与竖瞳 -->
    <path d="M23.5,26.2 C27.2,24.5 31.5,24.2 34.8,24.8 L32,30.8 L23,29.8 Z" fill="#8C3B45" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
    <polygon points="26.8,26 31.8,25.5 30.2,29.8 25.8,29.2" fill="#E2D6BA"/>
    <path d="M29.2,25.4 Q29.8,27.6 29,30 Q28.2,27.6 29.2,25.4 Z" fill="#1C1412"/>
  </g>

  <!-- 待机独立冷光层 -->
  <path id="sheen" opacity="0" d="M7.5,29 C10,21 12.8,14 12.5,9" fill="none" stroke="#DDCB9A" stroke-width="1.6" stroke-linecap="round"/>
</g>
</svg>
