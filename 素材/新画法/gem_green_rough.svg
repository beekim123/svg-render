    <polygon points="26,25 60,23 53,31 33,32" fill="#A6F5C6"/>
    <polygon points="26,25 33,32 34,49 28,59" fill="#4FDB85"/>
    <polygon points="60,23 63,56 54,48 53,31" fill="#128A43"/>
    <polygon points="28,59 34,49 54,48 63,56" fill="#0A5A2B"/>
    <!-- 中央方形台面 -->
    <polygon points="33,32 53,31 54,48 34,49" fill="#1DBF5E"/>
    <polygon points="33,32 53,31 46,41 34,49" fill="#4FDB85" opacity="0.85"/>
    <!-- 背光侧内反光刻面 -->
    <polygon points="45,48.5 54,48 63,56 47,57.5" fill="#4FDB85" opacity="0.75"/>
    <!-- 刻面高光细棱线（#A6F5C6） -->
    <path d="M26,25 L33,32 M60,23 L53,31 M63,56 L54,48 M28,59 L34,49 M33,32 L53,31 L54,48 L34,49 Z" fill="none" stroke="#A6F5C6" stroke-width="0.65" stroke-linejoin="round" opacity="0.68"/>
    <!-- 左上沿白亮边 -->
    <path d="M28.2,55 L26.8,26.2 L57.5,24.4 L57,26.4 L28.8,28 L30,54.5 Z" fill="#F4F1FF" opacity="0.9"/>
    <!-- 石皮压在宝石左上沿的薄暗影 -->
    <path d="M26,25 L60,23 L59.5,25.5 L28.2,27.5 L29.8,59 L28,59 Z" fill="#1C1412" opacity="0.32"/>
  </g>
  <circle cx="37" cy="35" r="2.1" fill="#F4F1FF"/>
  <circle cx="34" cy="39" r="0.95" fill="#F4F1FF" opacity="0.85"/>
  <path d="M26,25 L60,23 L63,56 L28,59 Z" fill="none" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- 右下副裂口：较小的一块方形绿宝石原矿 -->
  <path d="M53.2,61.5 L76.5,57.2 L77.8,76.8 L52.2,77.8 Z" fill="#1C1412"/>
  <path d="M55,63 L75,59 L76,75 L54,76 Z" fill="#128A43"/>
  <g clip-path="url(#gem_green_rough-csub)">
    <polygon points="55,63 75,59 69,66 60,67" fill="#4FDB85"/>
    <polygon points="55,63 60,67 60,72 54,76" fill="#1DBF5E"/>
    <polygon points="60,67 69,66 70,71 60,72" fill="#1DBF5E"/>
    <polygon points="69,66 75,59 76,75 70,71" fill="#0A5A2B"/>
    <polygon points="54,76 60,72 70,71 76,75" fill="#0A5A2B"/>
    <polygon points="64,71.5 70,71 76,75 65,75.5" fill="#4FDB85" opacity="0.68"/>
    <path d="M55,63 L60,67 M75,59 L69,66 M76,75 L70,71 M54,76 L60,72 M60,67 L69,66 L70,71 L60,72 Z" fill="none" stroke="#A6F5C6" stroke-width="0.6" opacity="0.62"/>
  </g>
  <circle cx="61.5" cy="66.5" r="1.3" fill="#F4F1FF"/>
  <path d="M55,63 L75,59 L76,75 L54,76 Z" fill="none" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>

  <!-- 第 7 层：石皮裂缝（收尖线） -->
  <path d="M60,23 Q65.5,18.2 70,14.2 Q64.2,17.5 58.5,23 Z M63,56 Q72.5,53.2 83.5,50.5 Q72.2,55.2 62.5,57.5 Z M72.5,53.5 Q76.5,48.5 79.5,46.5 Q75.5,50.8 72.5,53.5 Z M28,59 Q21.5,65.5 14.8,72.5 Q22.8,66.5 29.5,59.8 Z M22.5,65.5 Q18.2,63.2 15,63.8 Q18.8,65.2 22.5,65.5 Z M63,56 Q59.5,59.5 55,63 Q58,59 61.5,55.5 Z M54,76 Q49.5,80.5 45.5,85.5 Q51.2,81.2 55.5,76.5 Z M26,25 Q20.5,22.2 15.5,21.5 Q20.8,23.8 25.8,26.5 Z" fill="#1C1412"/>

  <!-- 裂缝深处静态暗绿矿丝 -->
  <path d="M60,23 Q64.8,18.8 68.8,15.2 M63,56.2 Q71.5,53.8 81,51.2 M28.2,59.2 Q22.2,65 16.5,70.8 M62,56.2 L55.8,62.5 M54.2,76.2 L47,84" fill="none" stroke="#1DBF5E" stroke-width="0.9" stroke-linecap="round" opacity="0.55"/>

  <!-- 待机事件层：1200 → 1400 → 1600 裂缝里透出暗绿光（平时 opacity: 0） -->
  <g id="crack_glint" opacity="0">
    <circle cx="49" cy="49" r="35" fill="url(#gem_green_rough-glow)"/>
    <polygon points="27,26 59,24 61.8,55 29,57.8" fill="#4FDB85" opacity="0.52"/>
    <polygon points="33,32 53,31 54,48 34,49" fill="#A6F5C6" opacity="0.78"/>
    <polygon points="55.8,63.6 74,60 75,74.2 55,75.2" fill="#4FDB85" opacity="0.62"/>
    <path d="M60,23 Q64.8,18.8 69.2,14.8 M63,56.2 Q72,53.5 82,50.8 M26,25.5 Q20.8,22.8 16.5,22 M28.2,59.2 Q21.8,65.2 15.8,71.5 M62,56.2 L55.8,62.5 M54.2,76.2 L46.2,84.8" fill="none" stroke="#4FDB85" stroke-width="2.2" stroke-linecap="round" opacity="0.92"/>
    <path d="M60,23 Q64.8,18.8 69.2,14.8 M63,56.2 Q72,53.5 82,50.8 M28.2,59.2 Q21.8,65.2 15.8,71.5 M62,56.2 L55.8,62.5" fill="none" stroke="#F4F1FF" stroke-width="1.0" stroke-linecap="round" opacity="0.95"/>
    <path d="M43,27 Q44,31.5 48.5,32.5 Q44,33.5 43,38 Q42,33.5 37.5,32.5 Q42,31.5 43,27 Z" fill="#F4F1FF" opacity="0.92"/>
  </g>
</g>
</svg>
