    <!-- 第 6 层：石皮旧褐矿斑与颗粒 -->
    <path d="M22,71 C26,69 31,72 29,76 C27,79 21,78 20,74 Z M69,24 C73,23 77,26 75,30 C73,32 69,31 68,27 Z M37,78 C42,76 46,79 44,83 C41,85 36,83 37,78 Z" fill="#524531" opacity="0.65"/>
    <circle cx="22" cy="20" r="1.5" fill="#2E2C28" opacity="0.65"/>
    <circle cx="18" cy="48" r="1.4" fill="#2E2C28" opacity="0.6"/>
    <circle cx="81" cy="49" r="1.7" fill="#2E2C28" opacity="0.65"/>
    <circle cx="46" cy="70" r="1.4" fill="#2E2C28" opacity="0.65"/>
    <circle cx="20" cy="34" r="1.1" fill="#948F86" opacity="0.78"/>
    <circle cx="34" cy="18" r="1.2" fill="#948F86" opacity="0.72"/>
    <!-- 第 5 层：左上受光边（#948F86 削尖月牙） -->
    <path d="M14.5,64 Q14,42 15.2,24.5 Q18.5,16.5 26,14.8 Q44,13.5 66,14.5 Q44,15.8 27,16.8 Q20.5,18.5 17.5,25.5 Q16.2,42 16.5,64 Z" fill="#948F86"/>
    <!-- 第 5 层：右下冷色轮廓光（#8CAAB5，断成两截） -->
    <path d="M84.8,44 Q85.5,58 84,72 Q83.2,58 83,44.5 Z M74,84.2 Q64,85.2 48,84.8 Q63,83.4 73.2,82.5 Z" fill="#8CAAB5" opacity="0.82"/>
  </g>

  <!-- 主裂口：方形阶梯绿宝石原矿（先垫最暗石皮凹座） -->
  <path d="M24.2,23.2 L61.8,21.2 L65,57.8 L26.2,61 Z" fill="#1C1412"/>
  <path d="M26,25 L60,23 L63,56 L28,59 Z" fill="#0A5A2B"/>
  <g clip-path="url(#gem_green_rough-cmain)">
