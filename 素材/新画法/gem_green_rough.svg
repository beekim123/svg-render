<svg xmlns="http://www.w3.org/2000/svg" class="svg-gem_green_rough" viewBox="0 0 100 100" width="100" height="100">
<title>绿宝石 · 原石</title>
<style>
.svg-gem_green_rough g { transform-box: view-box; }
.svg-gem_green_rough #crack_glint { transform-origin: 50px 50px; opacity: 0; }

/* 待机 3000ms：0 → 1200 反光开始 → 1400 反光峰值 → 1600 反光消失 → 3000 与0帧一致 */
@keyframes svg-gem_green_rough-idle-1 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; animation-timing-function: linear; }
  40% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; animation-timing-function: ease-in-out; }
  46.67% { transform: translate(0px,0px) rotate(0deg) scale(1.02,1.02); opacity: 1; animation-timing-function: ease-in-out; }
  53.33% { transform: translate(0px,0px) rotate(0deg) scale(0.96,0.96); opacity: 0; animation-timing-function: linear; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; }
}
.svg-gem_green_rough:not([data-anim]) #crack_glint,
.svg-gem_green_rough[data-anim="idle"] #crack_glint { animation: svg-gem_green_rough-idle-1 3s infinite; }
</style>
<defs>
  <clipPath id="gem_green_rough-cstone">
    <path d="M24,13 C38,12 62,12 76,13.5 C81,16 85,20 86.5,25 L83.5,28.5 L87,31.5 C88,45 87.5,61 86,75 C84,80 80,84 74,86.5 L61,86.5 L58.5,83.5 L55.5,86.8 C41,87.2 29,86.8 23,85.5 C18,83 14.5,79 13,74 C12,59 12,43 13.2,29 L16.8,26.8 L13.8,24 C15.5,19 19.5,15 24,13 Z"/>
  </clipPath>
  <clipPath id="gem_green_rough-cmain">
    <path d="M26,25 L60,23 L63,56 L28,59 Z"/>
  </clipPath>
  <clipPath id="gem_green_rough-csub">
    <path d="M55,63 L75,59 L76,75 L54,76 Z"/>
  </clipPath>
  <radialGradient id="gem_green_rough-glow" cx="49" cy="49" r="35" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#4FDB85" stop-opacity="0.58"/>
    <stop offset="0.65" stop-color="#1DBF5E" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#0A5A2B" stop-opacity="0"/>
  </radialGradient>
</defs>

<g id="root">
  <!-- 第 1 层：墨色垫底（往右下错开 0.6, 0.9） -->
