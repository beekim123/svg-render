  <!-- 第 2 层：铺石皮“暗”一档 -->
  <path d="M24,13 C38,12 62,12 76,13.5 C81,16 85,20 86.5,25 L83.5,28.5 L87,31.5 C88,45 87.5,61 86,75 C84,80 80,84 74,86.5 L61,86.5 L58.5,83.5 L55.5,86.8 C41,87.2 29,86.8 23,85.5 C18,83 14.5,79 13,74 C12,59 12,43 13.2,29 L16.8,26.8 L13.8,24 C15.5,19 19.5,15 24,13 Z" fill="#4A4742"/>

  <!-- 第 3、4、5、6 层：裁在石皮轮廓内 -->
  <g clip-path="url(#gem_green_rough-cstone)">
    <!-- 第 3 层：错位亮面（往左上挪 -4.5, -4） -->
    <path d="M24,13 C38,12 62,12 76,13.5 C81,16 85,20 86.5,25 L83.5,28.5 L87,31.5 C88,45 87.5,61 86,75 C84,80 80,84 74,86.5 L61,86.5 L58.5,83.5 L55.5,86.8 C41,87.2 29,86.8 23,85.5 C18,83 14.5,79 13,74 C12,59 12,43 13.2,29 L16.8,26.8 L13.8,24 C15.5,19 19.5,15 24,13 Z" transform="translate(-4.5 -4)" fill="#6E6A63"/>
    <!-- 右侧与右下转过去的弧边暗面 -->
    <path d="M74,14 C78,34 74,56 58,68 C42,78 26,82 14,79 L22,87 L86,86 L88,24 Z" fill="#4A4742" opacity="0.88"/>
    <!-- 第 4 层：加深 -->
    <path d="M87,52 C87,74 79,85 58,87 L30,86 C60,83 78,75 83,50 Z" fill="#2E2C28" opacity="0.85"/>
