<svg xmlns="http://www.w3.org/2000/svg" class="svg-rule_six" viewBox="0 0 64 64" width="64" height="64">
<title>规矩 · 限六张</title>
<style>
.svg-rule_six g { transform-box: view-box; }
.svg-rule_six .shackle { transform-origin: 32px 24px; }

/* 待机 3000：0 静止 → 1500 锁梁轻轻往下一顿（1.8px，不超过 2 像素）→ 3000 回到静止 */
@keyframes svg-rule_six-idle-1 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,1.8px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-rule_six:not([data-anim]) .shackle,
.svg-rule_six[data-anim="idle"] .shackle { animation: svg-rule_six-idle-1 3s infinite; }
</style>
<defs>
<clipPath id="rule_six-cshackle">
  <path d="M16.5,29 V17.5 C16.5,7.2 47.5,7.2 47.5,17.5 V29 H40.5 V18 C40.5,12.2 23.5,12.2 23.5,18 V29 Z" clip-rule="evenodd"/>
</clipPath>
<clipPath id="rule_six-cbody">
  <path d="M13,23.5 C25,22.8 39,22.8 51,23.5 C54.5,23.8 56.5,26 56.8,29.5 C57.2,37 57.2,45 56.5,52.5 C56.2,56 54,58 50.5,58.4 C38,59.2 26,59.2 13.5,58.4 C10,58 7.8,56 7.5,52.5 C7,45 7,37 7.2,29.5 C7.5,26 9.5,23.8 13,23.5 Z"/>
</clipPath>
</defs>

<g id="root">
  <!-- 锁梁 shackle（根部深入锁身内部 y=29，下顿绝不露缝） -->
  <g class="shackle">
    <!-- 第 1 层：墨色垫底 -->
    <path d="M16.5,29 V17.5 C16.5,7.2 47.5,7.2 47.5,17.5 V29 H40.5 V18 C40.5,12.2 23.5,12.2 23.5,18 V29 Z" transform="translate(.5 .7)" fill="#1C1412" fill-rule="evenodd" stroke="#1C1412" stroke-width="5.6" stroke-linejoin="round"/>
    <!-- 第 2 层：铺铁的“最暗” -->
    <path d="M16.5,29 V17.5 C16.5,7.2 47.5,7.2 47.5,17.5 V29 H40.5 V18 C40.5,12.2 23.5,12.2 23.5,18 V29 Z" fill="#2E2C28" fill-rule="evenodd"/>
    <!-- 第 3、5 层：圆管错位出暗面 + 左上受光亮边 -->
    <g clip-path="url(#rule_six-cshackle)">
      <path d="M16.5,29 V17.5 C16.5,7.2 47.5,7.2 47.5,17.5 V29 H40.5 V18 C40.5,12.2 23.5,12.2 23.5,18 V29 Z" transform="translate(-2.2 -2)" fill="#6E6A63" fill-rule="evenodd"/>
      <path d="M18,22 V17 C18,9.5 31,7.5 37,9.2 C29,9.2 21,12.2 20,18 V22 Z" fill="#948F86"/>
      <circle cx="23.5" cy="11.5" r="1.5" fill="#E2D6BA"/>
    </g>
  </g>

  <!-- 锁身（小尺寸 18pt 极简：粗外框 + 错位暗面 + 左上亮边 + 铆钉与一处铁锈 + 六道清晰竖杠） -->
  <!-- 第 1 层：墨色垫底 -->
  <path d="M13,23.5 C25,22.8 39,22.8 51,23.5 C54.5,23.8 56.5,26 56.8,29.5 C57.2,37 57.2,45 56.5,52.5 C56.2,56 54,58 50.5,58.4 C38,59.2 26,59.2 13.5,58.4 C10,58 7.8,56 7.5,52.5 C7,45 7,37 7.2,29.5 C7.5,26 9.5,23.8 13,23.5 Z" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5.8" stroke-linejoin="round"/>
  <!-- 第 2 层：铁暗部 -->
  <path d="M13,23.5 C25,22.8 39,22.8 51,23.5 C54.5,23.8 56.5,26 56.8,29.5 C57.2,37 57.2,45 56.5,52.5 C56.2,56 54,58 50.5,58.4 C38,59.2 26,59.2 13.5,58.4 C10,58 7.8,56 7.5,52.5 C7,45 7,37 7.2,29.5 C7.5,26 9.5,23.8 13,23.5 Z" fill="#2E2C28"/>

  <g clip-path="url(#rule_six-cbody)">
    <!-- 第 3 层：错位亮面 -->
    <path d="M13,23.5 C25,22.8 39,22.8 51,23.5 C54.5,23.8 56.5,26 56.8,29.5 C57.2,37 57.2,45 56.5,52.5 C56.2,56 54,58 50.5,58.4 C38,59.2 26,59.2 13.5,58.4 C10,58 7.8,56 7.5,52.5 C7,45 7,37 7.2,29.5 C7.5,26 9.5,23.8 13,23.5 Z" transform="translate(-3.2 -3.2)" fill="#4A4742"/>
    <!-- 左上受光面 -->
    <path d="M8.8,48 V29.5 C9,26.8 10.8,25 13.8,24.8 H46 C34,26.2 16,26.5 12,29.5 C10.5,31 10.2,38 8.8,48 Z" fill="#948F86"/>
    <!-- 一处铁锈（材质记号 1） -->
    <path d="M47,51 C49,48 54,49 55,53 C54,56 48,56 47,51 Z" fill="#7A4A2E" opacity="0.6"/>
    <!-- 右下冷色轮廓光 -->
    <path d="M55.2,34 Q55.2,45 54.6,52 Q53.8,55.5 50,56.4 Q44,57 38,57 Q45,55.8 49.5,55 Q52.8,54.2 53.4,51.5 Q54,45 55.2,34 Z" fill="#8CAAB5" opacity="0.82"/>
  </g>

  <!-- 锁身正面深色凹槽底盘（衬托六道竖杠） -->
  <rect x="11.5" y="29.5" width="41" height="23" rx="3.2" fill="#1C1412"/>
  <rect x="12.8" y="30.8" width="38.4" height="20.4" rx="2.4" fill="#1E2C33"/>
  <path d="M13.5,49.5 H50 V32" fill="none" stroke="#5A7682" stroke-width="0.9" opacity="0.55"/>

  <!-- 六道竖杠（锁身上刻的六道竖杠，小尺寸 18pt 下根根分明） -->
  <g fill="#E2D6BA" stroke="#1C1412" stroke-width="1.35" stroke-linejoin="round">
    <rect x="15.2" y="33.5" width="3.8" height="15" rx="1"/>
    <rect x="21.2" y="33.5" width="3.8" height="15" rx="1"/>
    <rect x="27.2" y="33.5" width="3.8" height="15" rx="1"/>
    <rect x="33.2" y="33.5" width="3.8" height="15" rx="1"/>
    <rect x="39.2" y="33.5" width="3.8" height="15" rx="1"/>
    <rect x="45.2" y="33.5" width="3.8" height="15" rx="1"/>
  </g>
  <!-- 竖杠下半截微压暗，左上留亮 -->
  <g fill="#C8B894">
    <rect x="15.9" y="40.5" width="2.4" height="7.3" rx="0.4"/>
    <rect x="21.9" y="40.5" width="2.4" height="7.3" rx="0.4"/>
    <rect x="27.9" y="40.5" width="2.4" height="7.3" rx="0.4"/>
    <rect x="33.9" y="40.5" width="2.4" height="7.3" rx="0.4"/>
    <rect x="39.9" y="40.5" width="2.4" height="7.3" rx="0.4"/>
    <rect x="45.9" y="40.5" width="2.4" height="7.3" rx="0.4"/>
  </g>

  <!-- 两颗铆钉（材质记号 2）与一处邊缘磕痕 -->
  <circle cx="11.2" cy="27.2" r="2.1" fill="#1C1412"/><circle cx="11" cy="27" r="1.4" fill="#948F86"/>
  <circle cx="52.8" cy="27.2" r="2.1" fill="#1C1412"/><circle cx="52.6" cy="27" r="1.4" fill="#6E6A63"/>
  <path d="M7.2,39 L9.8,40.2 L7.2,41.6 Z" fill="#1C1412"/>
</g>
</svg>
