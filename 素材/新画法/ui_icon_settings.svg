<svg xmlns="http://www.w3.org/2000/svg" class="svg-ui_icon_settings" viewBox="0 0 64 64" width="64" height="64">
<title>设置 · 齿轮</title>
<style>
.svg-ui_icon_settings g { transform-box: view-box; }
.svg-ui_icon_settings .gear { transform-origin: 32px 32px; }
@keyframes svg-ui_icon_settings-idle-g {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,0px) rotate(3.6deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-ui_icon_settings:not([data-anim]) .gear,
.svg-ui_icon_settings[data-anim="idle"] .gear { animation: svg-ui_icon_settings-idle-g 3s infinite; }
</style>
