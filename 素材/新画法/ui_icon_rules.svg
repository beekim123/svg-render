<svg xmlns="http://www.w3.org/2000/svg" class="svg-ui_icon_rules" viewBox="0 0 64 64" width="64" height="64">
<title>规则 · 旧书</title>
<style>
.svg-ui_icon_rules g { transform-box: view-box; }
.svg-ui_icon_rules .book { transform-origin: 32px 34px; }
.svg-ui_icon_rules .ribbon { transform-origin: 32px 51px; }
@keyframes svg-ui_icon_rules-idle-b {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,-1.2px) rotate(1.5deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-ui_icon_rules-idle-r {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,0px) rotate(-3.5deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-ui_icon_rules:not([data-anim]) .book,
.svg-ui_icon_rules[data-anim="idle"] .book { animation: svg-ui_icon_rules-idle-b 3s infinite; }
.svg-ui_icon_rules:not([data-anim]) .ribbon,
.svg-ui_icon_rules[data-anim="idle"] .ribbon { animation: svg-ui_icon_rules-idle-r 3s infinite; }
</style>
<defs>
  <clipPath id="ui_icon_rules-ccover">
    <path d="M14,10 C26,8.5 38,8 48,8.5 C50.5,21 52.5,35 54,48 C41,49.5 29,51 18,52 L10,46 C11.5,34 12.8,22 14,10 Z"/>
  </clipPath>
</defs>
<g id="root">
  <g class="book">
    <!-- 书脊与书页厚度（旧纸色七层） -->
    <path d="M10,46 L18,52 L54,48 L52,55 L16,58 L8.5,51.5 Z" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5.2" stroke-linejoin="round"/>
    <path d="M10,46 L18,52 L54,48 L52,55 L16,58 L8.5,51.5 Z" fill="#9A8968"/>
    <path d="M10,46 L18,52 L42,49.2 L40,54 L16,56.5 L9.5,51 Z" fill="#C8B894"/>
    <path d="M19,54.5 L49,51.2" stroke="#524531" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 书签酒红飘带 -->
    <g class="ribbon">
      <polygon points="28,50 36,49 38,59.5 32,56 26,59.5" transform="translate(.4 .6)" fill="#1C1412" stroke="#1C1412" stroke-width="4.4" stroke-linejoin="round"/>
      <polygon points="28,50 36,49 38,59.5 32,56 26,59.5" fill="#8C3B45"/>
      <polygon points="32,49.5 36,49 38,59.5 32,56" fill="#5E242C"/>
    </g>

    <!-- 旧木皮封面（七层画法） -->
    <path d="M14,10 C26,8.5 38,8 48,8.5 C50.5,21 52.5,35 54,48 C41,49.5 29,51 18,52 L10,46 C11.5,34 12.8,22 14,10 Z" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5.4" stroke-linejoin="round"/>
    <path d="M14,10 C26,8.5 38,8 48,8.5 C50.5,21 52.5,35 54,48 C41,49.5 29,51 18,52 L10,46 C11.5,34 12.8,22 14,10 Z" fill="#704122"/>
    <g clip-path="url(#ui_icon_rules-ccover)">
      <path d="M14,10 C26,8.5 38,8 48,8.5 C50.5,21 52.5,35 54,48 C41,49.5 29,51 18,52 L10,46 C11.5,34 12.8,22 14,10 Z" transform="translate(-3.2 -2.8)" fill="#9E6238"/>
      <path d="M38,8.5 H55 V50 H32 C40,40 41,24 38,8.5 Z" fill="#3D2212" opacity=".72"/>
      <path d="M12,43 L15.5,12 L42,10 Q24,12.5 17.5,14.5 L14,44 Z" fill="#C48A5C"/>
      <path d="M52,32 L52.8,46.8 L36,48.8 Q46,46.5 50.8,45.5 Z" fill="#8CAAB5" opacity=".82"/>
    </g>

    <!-- 封面旧铜包角与正中菱形铜徽记 -->
    <polygon points="32,18 41.5,27.5 32,37 22.5,27.5" fill="#9A7B46" stroke="#1C1412" stroke-width="2.6" stroke-linejoin="round"/>
    <polygon points="32,18 41.5,27.5 32,37" fill="#6E542B"/>
    <circle cx="30" cy="25.5" r="2" fill="#DDCB9A"/>
  </g>
</g>
</svg>
