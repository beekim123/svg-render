<svg xmlns="http://www.w3.org/2000/svg" class="svg-ui_rule_sign" viewBox="0 0 280 88" width="280" height="88">
<title>规矩牌子</title>
<style>
.svg-ui_rule_sign g { transform-box: view-box; }
.svg-ui_rule_sign #root { transform-origin: 140px 0px; }
.svg-ui_rule_sign #rope { transform-origin: 140px 44px; }
.svg-ui_rule_sign #board { transform-origin: 140px 48px; }
.svg-ui_rule_sign .tail-a { transform-origin: 80px 15px; }
.svg-ui_rule_sign .tail-b { transform-origin: 200px 15px; }

/* 待机 3000：0 木板往左歪 -1.5°（静止姿势）→ 1500 往右 +1.5° → 3000 回到左。转轴在绳顶 (140,0)，绳头多晃一下 */
@keyframes svg-ui_rule_sign-idle-1 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,0px) rotate(3deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-ui_rule_sign:not([data-anim]) #root,
.svg-ui_rule_sign[data-anim="idle"] #root { animation: svg-ui_rule_sign-idle-1 3s infinite; }
@keyframes svg-ui_rule_sign-idle-2 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,0px) rotate(-7deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-ui_rule_sign:not([data-anim]) .tail-a,
.svg-ui_rule_sign[data-anim="idle"] .tail-a { animation: svg-ui_rule_sign-idle-2 3s infinite; }
@keyframes svg-ui_rule_sign-idle-3 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,0px) rotate(-8deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-ui_rule_sign:not([data-anim]) .tail-b,
.svg-ui_rule_sign[data-anim="idle"] .tail-b { animation: svg-ui_rule_sign-idle-3 3s infinite; }

/* flip 400：0 正面 → 200 木板横向压成一条线（代码这一刻换字）→ 400 转回正面。转轴在木板中线 x=140 */
@keyframes svg-ui_rule_sign-flip-4 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: linear; }
  50% { transform: translate(0px,0px) rotate(0deg) scale(0,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-ui_rule_sign[data-anim="flip"] #board { animation: svg-ui_rule_sign-flip-4 0.4s both; }
@keyframes svg-ui_rule_sign-flip-5 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: linear; }
  50% { transform: translate(0px,0px) rotate(0deg) scale(0.08,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-ui_rule_sign[data-anim="flip"] #rope { animation: svg-ui_rule_sign-flip-5 0.4s both; }
</style>
<defs>
<clipPath id="ui_rule_sign-cb"><path d="M12,15 L60,14 L118,15.2 L190,14 L262,15 L268,14.6 L272,19 L271,48 L272,77.5 L268,82 L214,81.4 L208.5,83 L203,81.2 L120,82 L64,81.2 L12,82 L8,78 L9,50 L8,19 Z"/></clipPath>
</defs>

<g id="root">
  <!-- 转轴 (140,0)；静止姿势往左歪 -1.5° -->
  <g transform="rotate(-1.5 140 0)">
    <!-- 两根绳，从画框上沿垂下来 -->
    <g id="rope"><path d="M80,2.2 V12" stroke="#1C1412" stroke-width="7.4" fill="none"/><path d="M80,2.2 V12" stroke="#9A8968" stroke-width="4.4" fill="none"/><path d="M78.6,2.6 V12" stroke="#C8B894" stroke-width="1.2" fill="none"/><path d="M77.8,5.6 L82.2,3.4 M77.8,9 L82.2,6.8 M77.8,12.2 L82.2,10.2" stroke="#1C1412" stroke-width="1" fill="none"/><path d="M200,2.2 V12" stroke="#1C1412" stroke-width="7.4" fill="none"/><path d="M200,2.2 V12" stroke="#9A8968" stroke-width="4.4" fill="none"/><path d="M198.6,2.6 V12" stroke="#C8B894" stroke-width="1.2" fill="none"/><path d="M197.8,5.6 L202.2,3.4 M197.8,9 L202.2,6.8 M197.8,12.2 L202.2,10.2" stroke="#1C1412" stroke-width="1" fill="none"/></g>

