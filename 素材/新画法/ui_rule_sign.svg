      <path d="M12,15 L60,14 L118,15.2 L190,14 L262,15 L268,14.6 L272,19 L271,48 L272,77.5 L268,82 L214,81.4 L208.5,83 L203,81.2 L120,82 L64,81.2 L12,82 L8,78 L9,50 L8,19 Z" fill="#C8B894"/>
      <g clip-path="url(#ui_rule_sign-cb)">
        <!-- 写字的那一段（x 84–264）保持平整浅色；木纹只走上下两条边 -->
        <path d="M84,14.6 H271 V17.4 H84Z" fill="#E2D6BA"/>
        <path d="M84,75.4 H271 V81.6 H84Z" fill="#9A8968"/>
        <path d="M84,79 H271 V81.6 H84Z" fill="#524531" opacity=".55"/>
        <path d="M88,20.6Q130,20.1 176,20.8Q130,17.9 88,20.6ZM184,20.4Q224,22.6 262,19.8Q224,20.6 184,20.4ZM100,23.4Q140,25 170,23Q140,23.4 100,23.4ZM214,24Q236,24 258,24.2Q236,22.4 214,24ZM90,73Q140,75.3 196,72.8Q140,73.1 90,73ZM204,73.4Q232,73.4 262,73.6Q232,71.4 204,73.4ZM120,77.6Q170,79.5 220,77.4Q170,77.7 120,77.6Z" fill="#9A8968"/>
