        <path d="M11,60 C13,56 17,58 18,63 C19,68 16,73 12,72Z M40,75 C46,73 54,74 60,76.6 C54,79 44,79 40,75Z M77,40 C80,38 83,41 82,46 C81,50 78,50 77,46Z" fill="#7A4A2E" opacity=".6"/>
        <path d="M84,15 H88 V81.6 H84Z" fill="#1C1412" opacity=".28"/>
        <!-- 右头一条窄铁皮 -->
        <path d="M264.6,15 H271 V81.6 H264.6Z" fill="#4A4742"/>
        <path d="M266,34 C268,32 270,35 269.4,39 C268.6,42 266.4,41 266,38Z" fill="#7A4A2E" opacity=".6"/>
        <path d="M270.6,31.9L270.4,35.1L270.3,38.3L270.2,41.5L270.1,44.7L270,48L270.1,51.3L270.2,54.6L270.3,57.9L270.4,61.1L270.6,64.4L270.7,67.7L270.8,71L270.9,74.3L271.1,77.2L269.3,79.1L267.6,81.1L264.6,81L261.3,80.9L257.9,80.9L254.5,80.9L251.1,80.8L247.8,80.8L244.4,80.7L241,80.7L241,80.7L244.4,80.2L247.8,80.1L251.1,79.9L254.5,79.8L257.9,79.7L261.3,79.7L264.7,79.6L267.1,79.8L268.2,78.1L269.7,76.7L269.4,74.3L269.3,71L269.2,67.8L269.1,64.5L269,61.2L269,57.9L268.9,54.6L268.9,51.4L268.9,48L269.1,44.7L269.3,41.5L269.6,38.3L270,35.1L270.6,31.9Z" fill="#8CAAB5" opacity=".7"/>
      </g>
      <path d="M84,14.6 V81.6 M264.6,15 V81.8" stroke="#1C1412" stroke-width="1.7" fill="none"/>
      <!-- 图标槽：凹进去的暗方框，代码把 56×56 的图标放在 x 20–76、y 16–72 -->
      <rect x="20" y="16" width="56" height="56" rx="3" fill="#161221" stroke="#1C1412" stroke-width="2.2"/>
      <path d="M21.2,70.6 V17.2 H74.8 V21 H25 V70.6Z" fill="#1C1412" opacity=".6"/>
      <path d="M23,70.9 H74.9 V20" fill="none" stroke="#948F86" stroke-width="1" opacity=".65"/>
      <circle cx="13.9" cy="24.5" r="3.3" fill="#1C1412"/><circle cx="13.6" cy="24" r="2.3" fill="#6E6A63"/><circle cx="12.9" cy="23.2" r="0.83" fill="#948F86"/><circle cx="13.9" cy="66.5" r="3.3" fill="#1C1412"/><circle cx="13.6" cy="66" r="2.3" fill="#6E6A63"/><circle cx="12.9" cy="65.2" r="0.83" fill="#948F86"/><circle cx="30.3" cy="77.7" r="3.3" fill="#1C1412"/><circle cx="30" cy="77.2" r="2.3" fill="#6E6A63"/><circle cx="29.3" cy="76.4" r="0.83" fill="#948F86"/><circle cx="68.3" cy="77.7" r="3.3" fill="#1C1412"/><circle cx="68" cy="77.2" r="2.3" fill="#6E6A63"/><circle cx="67.3" cy="76.4" r="0.83" fill="#948F86"/><circle cx="268.7" cy="25.5" r="2.9" fill="#1C1412"/><circle cx="268.4" cy="25" r="1.9" fill="#6E6A63"/><circle cx="267.7" cy="24.2" r="0.68" fill="#948F86"/><circle cx="268.7" cy="71.5" r="2.9" fill="#1C1412"/><circle cx="268.4" cy="71" r="1.9" fill="#6E6A63"/><circle cx="267.7" cy="70.2" r="0.68" fill="#948F86"/>
      <!-- 裂缝、磕掉的边 -->
      <path d="M271,22.6Q256.1,20.7 240,20.6Q255.9,23.3 271,22.6ZM150,14.4Q151.9,18 156,15Q152.1,15.2 150,14.4ZM101,81.8Q103.1,81 106,81.6Q102.9,78.2 101,81.8ZM236,14.6Q237.3,17.6 240,14.8Q237.5,15.2 236,14.6Z" fill="#1C1412"/>
      <!-- 绳在木板上沿打的结，绳头垂下来 -->
      
      <g class="tail-a"><g transform="rotate(2 80 15)">
        <path d="M78.4,15 C77.6,22.5 79,27 78.2,30 L82.4,30 C83,27 81.6,22.5 82.2,15 Z" fill="#9A8968" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M78.4,30 l-.8,2.6 M80.2,30 l.2,3 M82,30 l1,2.4" stroke="#1C1412" stroke-width=".9" stroke-linecap="round" fill="none"/>
        <path d="M78.2,21.75 l3.6,-1.8" stroke="#1C1412" stroke-width=".9" fill="none"/>
      </g></g>
      <ellipse cx="80.4" cy="13.4" rx="6.6" ry="5" fill="#1C1412"/>
      <ellipse cx="80" cy="12.8" rx="5.2" ry="3.7" fill="#9A8968"/>
      <path d="M76,11.6 C78,10 81,9.8 83,10.8" fill="none" stroke="#E2D6BA" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M76.6,14.2Q80.1,13.1 83.6,13.6Q79.9,10.9 76.6,14.2Z" fill="#1C1412"/>
      <g class="tail-b"><g transform="rotate(2 200 15)">
        <path d="M198.4,15 C197.6,19.5 199,22.2 198.2,24 L202.4,24 C203,22.2 201.6,19.5 202.2,15 Z" fill="#9A8968" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M198.4,24 l-.8,2.6 M200.2,24 l.2,3 M202,24 l1,2.4" stroke="#1C1412" stroke-width=".9" stroke-linecap="round" fill="none"/>
        <path d="M198.2,19.05 l3.6,-1.8" stroke="#1C1412" stroke-width=".9" fill="none"/>
      </g></g>
      <ellipse cx="200.4" cy="13.4" rx="6.6" ry="5" fill="#1C1412"/>
      <ellipse cx="200" cy="12.8" rx="5.2" ry="3.7" fill="#9A8968"/>
      <path d="M196,11.6 C198,10 201,9.8 203,10.8" fill="none" stroke="#E2D6BA" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M196.6,14.2Q200.1,13.1 203.6,13.6Q199.9,10.9 196.6,14.2Z" fill="#1C1412"/>
      <!-- 空槽：代码往里放图标、写字（跟着木板动） -->
      <g id="icon_slot"></g>
      <g id="rule_text"></g>
    </g>
  </g>
</g>
</svg>
