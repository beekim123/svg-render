<svg xmlns="http://www.w3.org/2000/svg" class="svg-rule_duck" viewBox="0 0 64 64" width="64" height="64">
<title>规矩图标 · 缩头</title>
<style>
.svg-rule_duck g { transform-box: view-box; }
.svg-rule_duck #box_lid { transform-origin: 10px 21px; }
.svg-rule_duck #peeking_eyes { transform-origin: 32px 28px; }
@keyframes svg-rule_duck-idle-l {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,-1.2px) rotate(-2.4deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-rule_duck-idle-e {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(1.2px,-0.8px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-rule_duck:not([data-anim]) #box_lid,
.svg-rule_duck[data-anim="idle"] #box_lid { animation: svg-rule_duck-idle-l 3s infinite; }
.svg-rule_duck:not([data-anim]) #peeking_eyes,
.svg-rule_duck[data-anim="idle"] #peeking_eyes { animation: svg-rule_duck-idle-e 3s infinite; }
</style>
<defs>
  <clipPath id="rule_duck-cbody">
    <rect x="9" y="34" width="46" height="22" rx="3"/>
  </clipPath>
</defs>
<g id="root">
  <!-- 半掀开的暗腔 -->
  <rect x="10" y="18" width="44" height="20" fill="#161221" stroke="#1C1412" stroke-width="4.8" stroke-linejoin="round"/>

  <!-- 盖缝里露出的两只诡萌不对称眼睛（一大一小） -->
  <g id="peeking_eyes">
    <circle cx="23" cy="28.5" r="6" fill="#E2D6BA" stroke="#1C1412" stroke-width="2.4"/>
    <circle cx="24" cy="28.5" r="2.5" fill="#1C1412"/>
    <circle cx="22" cy="26.8" r="1.4" fill="#F4F1FF"/>
    <circle cx="41" cy="28" r="6.8" fill="#E2D6BA" stroke="#1C1412" stroke-width="2.4"/>
    <circle cx="40" cy="28" r="2.7" fill="#1C1412"/>
    <circle cx="38.2" cy="26.2" r="1.5" fill="#F4F1FF"/>
  </g>

  <!-- 半掀起的旧木盒盖（七层画法） -->
  <g id="box_lid">
    <polygon points="7,18 54,9.5 57,19 9,24.5" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5.2" stroke-linejoin="round"/>
    <polygon points="7,18 54,9.5 57,19 9,24.5" fill="#704122"/>
    <polygon points="7,18 42,11.6 40,19.5 9,23" fill="#9E6238"/>
    <path d="M10.5,19 L48,12.2" stroke="#C48A5C" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 下半截小方木盒与铁包角（七层画法） -->
  <g id="box_body">
    <rect x="9" y="34" width="46" height="22" rx="3" transform="translate(.5 .7)" fill="#1C1412" stroke="#1C1412" stroke-width="5.4"/>
    <rect x="9" y="34" width="46" height="22" rx="3" fill="#704122"/>
    <g clip-path="url(#rule_duck-cbody)">
      <rect x="6" y="31" width="46" height="22" rx="3" fill="#9E6238"/>
      <path d="M38,34 H55 V56 H32 C37,50 39,42 38,34 Z" fill="#3D2212" opacity=".78"/>
      <!-- 左右旧铁包边 -->
      <rect x="9" y="34" width="8.5" height="22" fill="#6E6A63" stroke="#1C1412" stroke-width="2.4"/>
      <rect x="46.5" y="34" width="8.5" height="22" fill="#4A4742" stroke="#1C1412" stroke-width="2.4"/>
      <path d="M53.5,38 V53.5 H48" fill="none" stroke="#8CAAB5" stroke-width="1.5" stroke-linecap="round" opacity=".82"/>
    </g>
    <path d="M20,37 H43" stroke="#C48A5C" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 木纹收尖线与铆钉 -->
    <path d="M22,47 Q32,49 42,47 Q32,47.8 22,47 Z" fill="#3D2212"/>
    <circle cx="13.2" cy="40" r="1.6" fill="#1C1412"/><circle cx="13" cy="39.8" r="1" fill="#948F86"/>
    <circle cx="13.2" cy="50" r="1.6" fill="#1C1412"/><circle cx="13" cy="49.8" r="1" fill="#948F86"/>
    <circle cx="50.8" cy="40" r="1.6" fill="#1C1412"/><circle cx="50.8" cy="50" r="1.6" fill="#1C1412"/>
  </g>
</g>
</svg>
