<svg xmlns="http://www.w3.org/2000/svg" class="svg-bg_tile_vault" viewBox="0 0 512 512" width="512" height="512">
<title>宝库背景 · 旧石砖墙</title>
<style>
.svg-bg_tile_vault g { transform-box: view-box; }
.svg-bg_tile_vault #sheen { opacity: 0; }

/* 待机 3000：0 静止 → 1500 砖缝暗宝石碎与石棱微弱冷泽最亮 → 3000 回到静止。平铺边完全固定 */
@keyframes svg-bg_tile_vault-idle-1 {
  0% { opacity: 0; animation-timing-function: ease-in-out; }
  50% { opacity: 1; animation-timing-function: ease-in-out; }
  100% { opacity: 0; }
}
.svg-bg_tile_vault:not([data-anim]) #sheen,
.svg-bg_tile_vault[data-anim="idle"] #sheen { animation: svg-bg_tile_vault-idle-1 3s infinite; }
</style>
