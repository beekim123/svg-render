<svg xmlns="http://www.w3.org/2000/svg" class="svg-card_art_hourglass" viewBox="0 0 176 188" width="176" height="188">
<title>额外牌原画 · 沙漏</title>
<style>
.svg-card_art_hourglass g { transform-box: view-box; }
.svg-card_art_hourglass #hourglass_unit { transform-origin: 102px 98px; }
.svg-card_art_hourglass #sand_top { transform-origin: 102px 90px; }
.svg-card_art_hourglass #sand_bottom { transform-origin: 102px 150px; }
.svg-card_art_hourglass #stream_idle { transform-origin: 102px 114px; }
.svg-card_art_hourglass #gems_rewind { transform-origin: 102px 110px; opacity: 0; }
.svg-card_art_hourglass #cyan_flash { transform-origin: 102px 66px; opacity: 0; }

/* 待机 3000ms：0(0%) 静止/低位 → 1500(50%) 轻变化最大/高位 → 3000(100%) 与0帧一致（上下两堆总高度不变，仅碎粒流轻落） */
@keyframes svg-card_art_hourglass-idle-stream {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 1; animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,4px) rotate(0deg) scale(1,1); opacity: 0.75; animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 1; }
}
.svg-card_art_hourglass:not([data-anim]) #stream_idle,
.svg-card_art_hourglass[data-anim="idle"] #stream_idle { animation: svg-card_art_hourglass-idle-stream 3s infinite; }

/* play 600ms：0(0%) 静止 → 150(25%) 一震并停流 → 450(75%) 青碎粒倒流，上堆变高 → 520(86.67%) 保持 → 600(100%) 恢复原堆高度 */
@keyframes svg-card_art_hourglass-play-unit {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  25% { transform: translate(0px,4px) rotate(-3deg) scale(1.03,0.96); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  75% { transform: translate(0px,-3px) rotate(1.5deg) scale(0.98,1.02); animation-timing-function: linear; }
  86.67% { transform: translate(0px,-3px) rotate(1.5deg) scale(0.98,1.02); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-card_art_hourglass-play-top {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  25% { transform: translate(0px,1px) rotate(0deg) scale(1,0.96); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  75% { transform: translate(0px,-3px) rotate(0deg) scale(1,1.38); animation-timing-function: linear; }
  86.67% { transform: translate(0px,-3px) rotate(0deg) scale(1,1.38); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-card_art_hourglass-play-bottom {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  25% { transform: translate(0px,0px) rotate(0deg) scale(1,1.04); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  75% { transform: translate(0px,0px) rotate(0deg) scale(1,0.52); animation-timing-function: linear; }
  86.67% { transform: translate(0px,0px) rotate(0deg) scale(1,0.52); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes svg-card_art_hourglass-play-stream {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 1; animation-timing-function: linear; }
  25% { transform: translate(0px,2px) rotate(0deg) scale(1,1); opacity: 0; animation-timing-function: linear; }
  75% { transform: translate(0px,-6px) rotate(0deg) scale(1,1); opacity: 0; animation-timing-function: linear; }
  86.67% { transform: translate(0px,-6px) rotate(0deg) scale(1,1); opacity: 0; animation-timing-function: linear; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 1; }
}
@keyframes svg-card_art_hourglass-play-rewind {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  25% { transform: translate(0px,8px) rotate(0deg) scale(0.95,0.95); opacity: 1; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  75% { transform: translate(0px,-22px) rotate(0deg) scale(1.04,1.04); opacity: 1; animation-timing-function: linear; }
  86.67% { transform: translate(0px,-22px) rotate(0deg) scale(1.04,1.04); opacity: 0.9; animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; }
}
@keyframes svg-card_art_hourglass-play-flash {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; animation-timing-function: linear; }
  25% { transform: translate(0px,0px) rotate(0deg) scale(0.75,0.75); opacity: 0.1; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  75% { transform: translate(0px,0px) rotate(0deg) scale(1.08,1.08); opacity: 1; animation-timing-function: linear; }
  86.67% { transform: translate(0px,0px) rotate(0deg) scale(1.04,1.04); opacity: 0.88; animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); opacity: 0; }
}
.svg-card_art_hourglass[data-anim="play"] #hourglass_unit { animation: svg-card_art_hourglass-play-unit 0.6s both; }
.svg-card_art_hourglass[data-anim="play"] #sand_top { animation: svg-card_art_hourglass-play-top 0.6s both; }
.svg-card_art_hourglass[data-anim="play"] #sand_bottom { animation: svg-card_art_hourglass-play-bottom 0.6s both; }
.svg-card_art_hourglass[data-anim="play"] #stream_idle { animation: svg-card_art_hourglass-play-stream 0.6s both; }
.svg-card_art_hourglass[data-anim="play"] #gems_rewind { animation: svg-card_art_hourglass-play-rewind 0.6s both; }
.svg-card_art_hourglass[data-anim="play"] #cyan_flash { animation: svg-card_art_hourglass-play-flash 0.6s both; }
</style>
<defs>
  <radialGradient id="card_art_hourglass-glow" cx="102" cy="64" r="34" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#A6F5C6" stop-opacity="0.72"/>
    <stop offset="0.55" stop-color="#3FE3F0" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#3FE3F0" stop-opacity="0"/>
  </radialGradient>
</defs>

<g id="root">
  <!-- 左上角 x:0..30, y:0..90 严格留空（主体范围 x:48..156, y:20..172） -->
  <ellipse cx="102" cy="168" rx="48" ry="8" fill="#0D111C" opacity="0.6"/>

  <g id="hourglass_unit">
    <!-- 上下玻璃泡腔体（冷灰暗玻璃 #161221 + #1E2C33） -->
    <path d="M68,34 H136 L132,64 C130,78 115,88 107,94 H97 C89,88 74,78 72,64 Z" transform="translate(.5 .8)" fill="#1C1412" stroke="#1C1412" stroke-width="5" stroke-linejoin="round"/>
    <path d="M68,34 H136 L132,64 C130,78 115,88 107,94 H97 C89,88 74,78 72,64 Z" fill="#161221"/>
    <path d="M97,98 H107 C115,104 130,114 132,128 L136,154 H68 L72,128 C74,114 89,104 97,98 Z" transform="translate(.5 .8)" fill="#1C1412" stroke="#1C1412" stroke-width="5" stroke-linejoin="round"/>
    <path d="M97,98 H107 C115,104 130,114 132,128 L136,154 H68 L72,128 C74,114 89,104 97,98 Z" fill="#161221"/>

    <!-- 上半截青色宝石碎粒堆 sand_top（青 = 绿 + 蓝，#3FE3F0 带晶体切面，非普通黄沙） -->
    <g id="sand_top">
      <path d="M74,58 Q88,54 102,56 Q116,54 130,58 L128,68 C124,79 113,86 106,91 H98 C91,86 80,79 76,68 Z" fill="#3FE3F0" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
      <path d="M102,56 Q116,54 130,58 L128,68 C124,79 113,86 106,91 H102 Z" fill="#128A43" opacity="0.65"/>
      <polygon points="76,59 90,55 96,62 82,66" fill="#A6F5C6"/>
      <polygon points="94,57 108,55 104,64 92,63" fill="#F4F1FF" opacity="0.88"/>
      <polygon points="82,67 94,65 98,75 85,76" fill="#6A93F8" opacity="0.75"/>
      <polygon points="106,64 118,61 122,71 110,73" fill="#1D45B8" opacity="0.72"/>
      <path d="M76,59 L88,65 L102,58 L116,64 L128,59 M85,74 L98,70 L112,76" fill="none" stroke="#F4F1FF" stroke-width="0.9" opacity="0.75"/>
    </g>

    <!-- 下半截青色宝石碎粒堆 sand_bottom -->
    <g id="sand_bottom">
      <path d="M72,152 L80,138 L94,132 L102,129 L110,132 L124,138 L132,152 Z" fill="#3FE3F0" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
      <path d="M102,129 L110,132 L124,138 L132,152 H102 Z" fill="#1D45B8" opacity="0.65"/>
      <polygon points="81,140 94,133 100,141 84,147" fill="#A6F5C6"/>
      <polygon points="96,133 104,130 106,139 98,141" fill="#F4F1FF" opacity="0.88"/>
      <path d="M81,142 L94,137 L106,143 L120,140" fill="none" stroke="#F4F1FF" stroke-width="0.9" opacity="0.75"/>
    </g>

    <!-- 待机往下掉的青色宝石碎粒流 stream_idle -->
    <g id="stream_idle">
      <polygon points="102,98 105,102 102,106 99,102" fill="#F4F1FF" stroke="#1C1412" stroke-width="1.2"/>
      <rect x="99.5" y="109" width="5" height="5" rx="1" transform="rotate(20 102 111.5)" fill="#3FE3F0" stroke="#1C1412" stroke-width="1.2"/>
      <polygon points="102,118 105.5,123 98.5,123" fill="#4FDB85" stroke="#1C1412" stroke-width="1.2"/>
      <polygon points="102,125 104.5,128 102,131 99.5,128" fill="#6A93F8" stroke="#1C1412" stroke-width="1.2"/>
    </g>

    <!-- play 时从下半截倒着飞回上半截的青色碎粒串 gems_rewind -->
    <g id="gems_rewind" opacity="0">
      <path d="M92,132 V106 M102,136 V102 M112,132 V106" stroke="#A6F5C6" stroke-width="1.8" stroke-linecap="round" opacity="0.88"/>
      <polygon points="102,90 107,96 102,102 97,96" fill="#F4F1FF" stroke="#1C1412" stroke-width="1.5"/>
      <rect x="86" y="98" width="7" height="7" rx="1" transform="rotate(-16 89.5 101.5)" fill="#3FE3F0" stroke="#1C1412" stroke-width="1.5"/>
      <polygon points="115,96 120,105 110,105" fill="#6A93F8" stroke="#1C1412" stroke-width="1.5"/>
      <polygon points="102,106 107,112 102,118 97,112" fill="#4FDB85" stroke="#1C1412" stroke-width="1.5"/>
      <polygon points="90,114 95,117 93,123 87,120" fill="#F4F1FF" stroke="#1C1412" stroke-width="1.5"/>
      <rect x="108" y="114" width="6.5" height="6.5" rx="1" transform="rotate(18 111.2 117.2)" fill="#3FE3F0" stroke="#1C1412" stroke-width="1.5"/>
      <polygon points="95,125 100,133 90,133" fill="#4FDB85" stroke="#1C1412" stroke-width="1.5"/>
      <polygon points="109,124 114,129 109,134 104,129" fill="#6A93F8" stroke="#1C1412" stroke-width="1.5"/>
    </g>

    <!-- play 上堆变高时闪出的青光 cyan_flash -->
    <g id="cyan_flash" opacity="0">
      <circle cx="102" cy="64" r="34" fill="url(#card_art_hourglass-glow)"/>
      <path d="M102,42 Q104,62 124,64 Q104,66 102,86 Q100,66 80,64 Q100,62 102,42 Z" fill="#F4F1FF"/>
    </g>

    <!-- 玻璃表面斜反光带与划痕（压在碎粒上方） -->
    <path d="M74,42 L77,64 C78,72 86,80 92,85 M75,146 L78,128 C79,120 86,112 92,107" fill="none" stroke="#8CAAB5" stroke-width="2.4" stroke-linecap="round" opacity="0.65"/>
    <path d="M128,46 L126,64 M128,144 L126,128" fill="none" stroke="#5A7682" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

    <!-- 旧铜沙漏外架（七层旧铜：上下顶底盘、中腰铜箍、左右双立柱、铜绿与铆钉） -->
    <!-- 上顶盖 -->
    <polygon points="56,22 148,22 152,34 52,34" transform="translate(.5 .8)" fill="#1C1412" stroke="#1C1412" stroke-width="4.8" stroke-linejoin="round"/>
    <polygon points="56,22 148,22 152,34 52,34" fill="#6E542B"/>
    <polygon points="56,22 142,22 144,28 54,28" fill="#9A7B46"/>
    <polygon points="106,22 148,22 152,34 106,34" fill="#3B2B14" opacity="0.72"/>
    <path d="M57,24.5 H138" stroke="#C2A670" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 下底座 -->
    <polygon points="52,154 152,154 156,166 48,166" transform="translate(.5 .8)" fill="#1C1412" stroke="#1C1412" stroke-width="4.8" stroke-linejoin="round"/>
    <polygon points="52,154 152,154 156,166 48,166" fill="#6E542B"/>
    <polygon points="52,154 146,154 148,160 50,160" fill="#9A7B46"/>
    <polygon points="106,154 152,154 156,166 106,166" fill="#3B2B14" opacity="0.75"/>
    <path d="M53,156.5 H140" stroke="#C2A670" stroke-width="1.8" stroke-linecap="round"/>

    <!-- 左右旧铜立柱與中腰铜束环 -->
    <rect x="57" y="34" width="8" height="120" transform="translate(.4 .6)" fill="#1C1412" stroke="#1C1412" stroke-width="3.6"/>
    <rect x="57" y="34" width="8" height="120" fill="#6E542B"/>
    <rect x="57" y="34" width="4" height="120" fill="#9A7B46"/>
    <path d="M58.5,38 V148" stroke="#C2A670" stroke-width="1.2" stroke-linecap="round"/>

    <rect x="139" y="34" width="8" height="120" transform="translate(.4 .6)" fill="#1C1412" stroke="#1C1412" stroke-width="3.6"/>
    <rect x="139" y="34" width="8" height="120" fill="#3B2B14"/>
    <rect x="139" y="34" width="4" height="120" fill="#6E542B"/>
    <path d="M146,42 V146" stroke="#8CAAB5" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>

    <!-- 中腰束环与立柱节箍 -->
    <polygon points="90,91 114,91 117,96 114,101 90,101 87,96" fill="#9A7B46" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="102" cy="96" r="2.2" fill="#DDCB9A"/>
    <rect x="54" y="91" width="14" height="10" rx="2" fill="#9A7B46" stroke="#1C1412" stroke-width="2"/>
    <rect x="136" y="91" width="14" height="10" rx="2" fill="#6E542B" stroke="#1C1412" stroke-width="2"/>
    <!-- 铜绿污渍 -->
    <path d="M136,150 C140,151 143,148 144,144 M64,36 C68,37 71,36 73,34" fill="none" stroke="#5F8272" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
  </g>
</g>
</svg>
