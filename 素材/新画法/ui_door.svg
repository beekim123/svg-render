<svg xmlns="http://www.w3.org/2000/svg" class="svg-ui_door" viewBox="0 0 320 480" width="320" height="480">
<title>门</title>
<style>
.svg-ui_door g { transform-box: view-box; }
.svg-ui_door #root { transform-origin: 160px 480px; }
.svg-ui_door #frame { transform-origin: 160px 480px; }
.svg-ui_door #dark { transform-origin: 160px 256px; }
.svg-ui_door #leaf { transform-origin: 48px 256px; }
.svg-ui_door #door_ring { transform-origin: 244px 124px; }
.svg-ui_door #sheen { opacity: 0; }

/* idle 3000ms: 0 -> 1500 -> 3000 (门扇、门框和铰链位置不动，仅独立材质反光3000ms轻变化) */
@keyframes svg-ui_door-idle-sheen {
  0% { opacity: 0; animation-timing-function: ease-in-out; }
  50% { opacity: 0.85; animation-timing-function: ease-in-out; }
  100% { opacity: 0; }
}
.svg-ui_door:not([data-anim]) #sheen,
.svg-ui_door[data-anim="idle"] #sheen {
  animation: svg-ui_door-idle-sheen 3s infinite;
}

/* open 600ms (stay: true, forwards): 0 -> 100 (16.67%) -> 250 (41.67%) -> 400 (66.67%) -> 600 (100%) */
@keyframes svg-ui_door-open-leaf {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  16.67% { transform: translate(0px,1px) rotate(0deg) scale(0.96,0.995); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  41.67% { transform: translate(0px,3px) rotate(0deg) scale(0.48,0.98); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  66.67% { transform: translate(0px,5px) rotate(0deg) scale(0.18,0.97); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,6px) rotate(0deg) scale(0.12,0.96); }
}
@keyframes svg-ui_door-open-ring {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  16.67% { transform: translate(0px,-3px) rotate(-12deg) scale(1,1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  41.67% { transform: translate(0px,2px) rotate(10deg) scale(1,1); animation-timing-function: ease-in-out; }
  66.67% { transform: translate(0px,1px) rotate(-4deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(2deg) scale(1,1); }
}
.svg-ui_door[data-anim="open"] #leaf {
  animation: svg-ui_door-open-leaf 0.6s forwards;
}
.svg-ui_door[data-anim="open"] #door_ring {
  animation: svg-ui_door-open-ring 0.6s forwards;
}
</style>
<defs>
  <clipPath id="ui_door-cleaf">
    <path d="M48,456 V152 Q48,68 160,36 Q272,68 272,152 V456 Z"/>
  </clipPath>
  <pattern id="ui_door-hatch" width="4.8" height="4.8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="4.8" stroke="#1C1412" stroke-width="0.95"/>
  </pattern>
</defs>
<g id="root">
  <!-- 落地点 anchor: 160,480；底部门槛接触阴影（严格在 320×480 内） -->
  <ellipse cx="160" cy="468" rx="148" ry="8" fill="#0D111C" opacity="0.65"/>

  <!-- 1. 门洞暗色层 dark（门扇打开时露出的深邃暗洞與冷灰石阶内壁，绝无暖光） -->
  <g id="dark">
    <path d="M46,458 V152 Q46,66 160,34 Q274,66 274,152 V458 Z" fill="#0D111C" stroke="#1C1412" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- 门洞内壁左侧石框厚度纵深与地面石阶 -->
    <path d="M46,458 V152 Q46,66 160,34 Q102,68 74,154 V458 Z" fill="#161221" opacity="0.88"/>
    <path d="M74,444 V154 Q100,76 160,42" fill="none" stroke="#262036" stroke-width="1.8" opacity="0.75"/>
    <path d="M254,454 V156 Q254,84 160,48" fill="none" stroke="#1E2C33" stroke-width="1.8" opacity="0.65"/>
    <polygon points="46,442 274,442 274,458 46,458" fill="#161221"/>
    <line x1="48" y1="442" x2="272" y2="442" stroke="#262036" stroke-width="1.5"/>
  </g>

  <!-- 2. 门扇 leaf（绕左门框 x=48 转轴横向压缩到 12%；拱顶、铁箍、门钉、合页、门环集中在上半截和两侧） -->
  <g id="leaf">
    <!-- 旧木门扇主底板 -->
    <path d="M48,456 V152 Q48,68 160,36 Q272,68 272,152 V456 Z" fill="#704122" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
    <g clip-path="url(#ui_door-cleaf)">
      <!-- 左上受光旧木错位亮面与右下弧形加深暗面 -->
      <path d="M48,456 V152 Q48,68 160,36 Q272,68 272,152 V456 Z" transform="translate(-10 -8)" fill="#9E6238" opacity="0.45"/>
      <path d="M168,36 Q272,68 272,152 V456 H148 C186,360 192,160 168,36 Z" fill="#3D2212" opacity="0.68"/>
      <path d="M196,80 Q272,110 272,180 V456 H188 Z" fill="url(#ui_door-hatch)" opacity="0.34"/>
      <path d="M48,396 H272 V456 H48 Z" fill="#3D2212" opacity="0.52"/>

      <!-- 竖拼旧木板收尖分缝线与顺纹木纹、木节 -->
      <path d="M91,72 Q93.2,260 91,454 Q89.2,260 91,72 Z M137,44 Q139.2,250 137,454 Q135.2,250 137,44 Z M183,44 Q185.2,250 183,454 Q181.2,250 183,44 Z M229,72 Q231.2,260 229,454 Q227.2,260 229,72 Z" fill="#1C1412"/>
      <!-- 每块木板左侧亮边与顺纹收尖木纹 -->
      <path d="M53,448 V152 Q53,74 156,41" fill="none" stroke="#C48A5C" stroke-width="2.2" stroke-linecap="round" opacity="0.82"/>
      <path d="M95,78 Q97,140 95,210 Q93.5,140 95,78 Z M141,50 Q143,120 141,195 Q139.5,120 141,50 Z M187,52 Q189,118 187,185 Q185.5,118 187,52 Z" fill="#C48A5C" opacity="0.62"/>
      <path d="M72,160 Q74.5,205 72,250 Q70,205 72,160 Z M116,145 Q118.5,185 116,225 Q114,185 116,145 Z M208,150 Q210.5,195 208,240 Q206,195 208,150 Z M250,175 Q252.5,220 250,265 Q248,220 250,175 Z" fill="#3D2212" opacity="0.72"/>
      <!-- 木节 -->
      <ellipse cx="114" cy="142" rx="4.5" ry="9" fill="#3D2212" opacity="0.78"/><ellipse cx="114" cy="142" rx="2" ry="4.5" fill="#1C1412" opacity="0.8"/>
      <ellipse cx="206" cy="248" rx="5" ry="10" fill="#3D2212" opacity="0.78"/><ellipse cx="206" cy="248" rx="2.2" ry="5" fill="#1C1412" opacity="0.8"/>
    </g>
    <path d="M48,456 V152 Q48,68 160,36 Q272,68 272,152 V456 Z" fill="none" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>

    <!-- 上半截（y:38..114）尖拱包铁箍与一排醒目铁门钉（保证怪物挡住下半截时仍一眼认出是门） -->
    <path d="M48,144 Q48,68 160,36 Q272,68 272,144 L258,148 Q256,82 160,52 Q64,82 62,148 Z" fill="#4A4742" stroke="#1C1412" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M160,36 Q272,68 272,144 L258,148 Q256,82 160,52 Z" fill="#2E2C28" opacity="0.78"/>
    <path d="M52,140 Q54,72 158,40" fill="none" stroke="#948F86" stroke-width="1.6" stroke-linecap="round" opacity="0.88"/>
    <!-- 上半截横向加固铁梁（y:92..112） -->
    <polygon points="48,92 272,94 272,112 48,110" fill="#4A4742" stroke="#1C1412" stroke-width="2.6" stroke-linejoin="round"/>
    <polygon points="160,93 272,94 272,112 160,111" fill="#2E2C28" opacity="0.75"/>
    <line x1="52" y1="95" x2="268" y2="97" stroke="#948F86" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 铁锈污渍 -->
    <path d="M196,96 C204,96 210,100 208,108 C202,110 195,106 196,96 Z M76,95 C82,95 86,99 84,106 C79,107 75,103 76,95 Z" fill="#7A4A2E" opacity="0.55"/>

    <!-- 上半截一排大铁门钉（拱顶5颗圆铆钉 + 横梁5颗方头门钉） -->
    <g>
      <circle cx="160.6" cy="64.8" r="5.6" fill="#1C1412"/><circle cx="160" cy="64" r="4.4" fill="#6E6A63"/><circle cx="158.6" cy="62.6" r="1.5" fill="#948F86"/>
      <circle cx="122.6" cy="73.8" r="5.4" fill="#1C1412"/><circle cx="122" cy="73" r="4.2" fill="#6E6A63"/><circle cx="120.6" cy="71.6" r="1.4" fill="#948F86"/>
      <circle cx="198.6" cy="73.8" r="5.4" fill="#1C1412"/><circle cx="198" cy="73" r="4.2" fill="#4A4742"/><circle cx="196.6" cy="71.6" r="1.3" fill="#948F86"/>
      <circle cx="88.6" cy="84.8" r="5" fill="#1C1412"/><circle cx="88" cy="84" r="3.9" fill="#6E6A63"/><circle cx="86.8" cy="82.8" r="1.3" fill="#948F86"/>
      <circle cx="232.6" cy="84.8" r="5" fill="#1C1412"/><circle cx="232" cy="84" r="3.9" fill="#4A4742"/><circle cx="230.8" cy="82.8" r="1.2" fill="#948F86"/>
      <g stroke="#1C1412" stroke-width="2" stroke-linejoin="round">
        <polygon points="74,96 82,102 74,108 66,102" fill="#948F86"/>
        <polygon points="115,96 123,102 115,108 107,102" fill="#948F86"/>
        <polygon points="160,96 168,102 160,108 152,102" fill="#6E6A63"/>
        <polygon points="205,97 213,103 205,109 197,103" fill="#6E6A63"/>
        <polygon points="246,97 254,103 246,109 238,103" fill="#4A4742"/>
      </g>
    </g>

    <!-- 左边两道大铁合页 hinges（咬合左门边 x=44..134） -->
    <g id="hinges">
      <!-- 上合页 -->
      <path d="M44,116 H56 V142 H44 Z" fill="#2E2C28" stroke="#1C1412" stroke-width="2.2"/>
      <path d="M52,120 L122,122 L134,129 L122,136 L52,138 Z" transform="translate(.5 .8)" fill="#1C1412" stroke="#1C1412" stroke-width="4.4" stroke-linejoin="round"/>
      <path d="M52,120 L122,122 L134,129 L122,136 L52,138 Z" fill="#4A4742" stroke="#1C1412" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M54,123 L120,124.5" stroke="#948F86" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="68" cy="129" r="3" fill="#948F86" stroke="#1C1412" stroke-width="1.5"/>
      <circle cx="96" cy="129" r="3" fill="#6E6A63" stroke="#1C1412" stroke-width="1.5"/>
      <circle cx="120" cy="129" r="3" fill="#6E6A63" stroke="#1C1412" stroke-width="1.5"/>
      <!-- 下合页 -->
      <path d="M44,342 H56 V368 H44 Z" fill="#2E2C28" stroke="#1C1412" stroke-width="2.2"/>
      <path d="M52,346 L118,348 L130,355 L118,362 L52,364 Z" transform="translate(.5 .8)" fill="#1C1412" stroke="#1C1412" stroke-width="4.4" stroke-linejoin="round"/>
      <path d="M52,346 L118,348 L130,355 L118,362 L52,364 Z" fill="#4A4742" stroke="#1C1412" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M54,349 L116,350.5" stroke="#948F86" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="68" cy="355" r="3" fill="#948F86" stroke="#1C1412" stroke-width="1.5"/>
      <circle cx="94" cy="355" r="3" fill="#6E6A63" stroke="#1C1412" stroke-width="1.5"/>
      <circle cx="116" cy="355" r="3" fill="#6E6A63" stroke="#1C1412" stroke-width="1.5"/>
    </g>

    <!-- 右边铁门环与锁鼻（位于 x:226..264, y:108..166，紧靠门扇右侧边缘） -->
    <g id="latch_plate">
      <polygon points="244,108 264,116 264,158 244,166 226,158 226,116" fill="#2E2C28" stroke="#1C1412" stroke-width="2.4" stroke-linejoin="round"/>
      <polygon points="244,112 260,118 260,154 244,160 230,154 230,118" fill="#4A4742" stroke="#1C1412" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="244" cy="146" r="3.5" fill="#0D111C"/>
      <polygon points="242,146 246,146 247,155 241,155" fill="#0D111C"/>
      <rect x="238" y="118" width="12" height="10" rx="2" fill="#6E6A63" stroke="#1C1412" stroke-width="2"/>
    </g>
    <g id="door_ring">
      <circle cx="244.6" cy="138.8" r="15" fill="none" stroke="#1C1412" stroke-width="8.6"/>
      <circle cx="244" cy="138" r="15" fill="none" stroke="#4A4742" stroke-width="4.6"/>
      <path d="M231,130 A15,15 0 0 1 255,128" fill="none" stroke="#948F86" stroke-width="2" stroke-linecap="round"/>
      <circle cx="236" cy="126" r="1.4" fill="#DDCB9A"/>
    </g>
  </g>

  <!-- 3. 尖拱石门框 frame（顶上不加额外冠饰，留给代码挂牌；七层冷灰铁石质感） -->
  <g id="frame">
    <!-- 第1层：墨色垫底 -->
    <path d="M12,462 V148 Q12,38 160,8 Q308,38 308,148 V462 Z M48,456 H272 V152 Q272,68 160,36 Q48,68 48,152 Z" transform="translate(.7 1)" fill="#1C1412" fill-rule="evenodd" stroke="#1C1412" stroke-width="6" stroke-linejoin="round"/>
    <!-- 第2层：冷铁石暗底 -->
    <path d="M12,462 V148 Q12,38 160,8 Q308,38 308,148 V462 Z M48,456 H272 V152 Q272,68 160,36 Q48,68 48,152 Z" fill="#4A4742" fill-rule="evenodd" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
    <!-- 第3、4层：左上受光石面与右侧背光暗石面 -->
    <path d="M14,458 V148 Q14,40 160,10 L160,36 Q48,68 48,152 V456 Z" fill="#6E6A63" opacity="0.55"/>
    <path d="M160,8 Q308,38 308,148 V462 H272 V152 Q272,68 160,36 Z" fill="#2E2C28" opacity="0.72"/>
    <!-- 第5层：左上受光边与右下断续冷轮廓光 -->
    <path d="M15.5,452 V148 Q15.5,42 160,11.5 Q208,22 244,44" fill="none" stroke="#948F86" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>
    <path d="M305,160 V310 M305,332 V456" fill="none" stroke="#8CAAB5" stroke-width="1.8" stroke-linecap="round" opacity="0.78"/>
    <path d="M275,452 V152 Q275,66 162,33" fill="none" stroke="#6E6A63" stroke-width="1.8" stroke-linecap="round" opacity="0.75"/>

    <!-- 尖拱顶楔石（Keystone，不超出门框顶 y=8）与两侧砌石收尖砖缝 -->
    <polygon points="142,10 178,10 170,40 150,40" fill="#6E6A63" stroke="#1C1412" stroke-width="2.6" stroke-linejoin="round"/>
    <polyline points="145,36 151,14 174,14" fill="none" stroke="#948F86" stroke-width="1.6" stroke-linecap="round"/>
    <g stroke="#1C1412" stroke-width="2.2" stroke-linecap="round">
      <line x1="106" y1="22" x2="118" y2="50"/>
      <line x1="64" y1="48" x2="84" y2="72"/>
      <line x1="30" y1="88" x2="58" y2="104"/>
      <line x1="14" y1="136" x2="48" y2="140"/>
      <line x1="214" y1="22" x2="202" y2="50"/>
      <line x1="256" y1="48" x2="236" y2="72"/>
      <line x1="290" y1="88" x2="262" y2="104"/>
      <line x1="306" y1="136" x2="272" y2="140"/>
      <line x1="12" y1="196" x2="48" y2="196"/>
      <line x1="12" y1="258" x2="48" y2="258"/>
      <line x1="12" y1="322" x2="48" y2="322"/>
      <line x1="12" y1="388" x2="48" y2="388"/>
      <line x1="272" y1="196" x2="308" y2="196"/>
      <line x1="272" y1="258" x2="308" y2="258"/>
      <line x1="272" y1="322" x2="308" y2="322"/>
      <line x1="272" y1="388" x2="308" y2="388"/>
    </g>
    <!-- 石块旧痕裂纹与磕口 -->
    <path d="M24,204 Q31,216 26,230 Q28,216 24,204 Z M294,264 Q285,275 289,288 Q288,275 294,264 Z M12,282 Q17,285 12,289 Z M308,218 Q302,221 308,225 Z" fill="#1C1412"/>

    <!-- 底部宽厚石门槛与柱脚 -->
    <polygon points="6,454 54,454 56,472 4,472" fill="#4A4742" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <polygon points="266,454 314,454 316,472 264,472" fill="#2E2C28" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <polygon points="48,456 272,456 276,470 44,470" fill="#2E2C28" stroke="#1C1412" stroke-width="2.6" stroke-linejoin="round"/>
    <line x1="10" y1="458" x2="50" y2="458" stroke="#948F86" stroke-width="1.6" stroke-linecap="round"/>

    <!-- 待机独立材质反光层（门框与铁箍微弱冷光呼吸，不移动任何结构） -->
    <path id="sheen" opacity="0" d="M16,380 V148 Q16,42 160,12 M52,138 Q54,72 158,40" fill="none" stroke="#DDCB9A" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</g>
</svg>
