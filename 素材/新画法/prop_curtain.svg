<svg xmlns="http://www.w3.org/2000/svg" class="svg-prop_curtain" viewBox="0 0 120 240" width="120" height="240">
<title>长廊摆件 · 旧窗帘</title>
<style>
.svg-prop_curtain g { transform-box: view-box; }
.svg-prop_curtain .skirt { transform-origin: 48px 130px; }
.svg-prop_curtain .tassel-a { transform-origin: 24px 131px; }
.svg-prop_curtain .tassel-b { transform-origin: 29px 132px; }

/* 待机 3000：0 静止 → 1500 下摆和流苏摆到最大（不到 3 像素）→ 3000 回到静止。上半截不动，流苏比下摆多晃一点 */
@keyframes svg-prop_curtain-idle-1 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,0px) rotate(1.3deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-prop_curtain:not([data-anim]) .skirt,
.svg-prop_curtain[data-anim="idle"] .skirt { animation: svg-prop_curtain-idle-1 3s infinite; }
@keyframes svg-prop_curtain-idle-2 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,0px) rotate(-3.4deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-prop_curtain:not([data-anim]) .tassel-a,
.svg-prop_curtain[data-anim="idle"] .tassel-a { animation: svg-prop_curtain-idle-2 3s infinite; }
@keyframes svg-prop_curtain-idle-3 {
  0% { transform: translate(0px,0px) rotate(0deg) scale(1,1); animation-timing-function: ease-in-out; }
  50% { transform: translate(0px,0px) rotate(-3deg) scale(1,1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
.svg-prop_curtain:not([data-anim]) .tassel-b,
.svg-prop_curtain[data-anim="idle"] .tassel-b { animation: svg-prop_curtain-idle-3 3s infinite; }
</style>
