<svg xmlns="http://www.w3.org/2000/svg" class="svg-ui_btn" viewBox="0 0 192 96" width="192" height="96">
<title>普通按钮底</title>
<style>
.svg-ui_btn g { transform-box: view-box; }
.svg-ui_btn #sheen { opacity: 0; }

/* idle 3000ms: 0 -> 1500 -> 3000 */
@keyframes svg-ui_btn-idle-sheen {
  0% { opacity: 0; animation-timing-function: ease-in-out; }
  50% { opacity: 0.82; animation-timing-function: ease-in-out; }
  100% { opacity: 0; }
}
.svg-ui_btn:not([data-anim]) #sheen,
.svg-ui_btn[data-anim="idle"] #sheen {
  animation: svg-ui_btn-idle-sheen 3s infinite;
}
</style>
<defs>
  <linearGradient id="ui_btn-sheen-grad" x1="10" y1="6" x2="182" y2="90" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#8C82A6" stop-opacity="0"/>
    <stop offset="0.3" stop-color="#DDCB9A" stop-opacity="0.78"/>
    <stop offset="0.65" stop-color="#62577D" stop-opacity="0"/>
  </linearGradient>
</defs>
<g id="root">
  <!-- 九宫格 [32,32,32,32]：角饰严格在 32×32 角区内，拉伸区 x=32..160 与 y=32..64 保持水平/垂直直线，中央平暗留给文字 -->
  <!-- 外框暗紫铁底板 -->
  <rect x="3" y="3" width="186" height="90" rx="11" fill="#262036" stroke="#1C1412" stroke-width="3.2"/>
  <!-- 底部暗面立体厚度（顺水平拉伸方向直线） -->
  <path d="M4.5,74 H187.5 V83 A8.5,8.5 0 0 1 179,91.5 H13 A8.5,8.5 0 0 1 4.5,83 Z" fill="#161221" opacity="0.9"/>
  <!-- 顶部受光亮边与右下冷轮廓光 -->
  <line x1="14" y1="6.2" x2="178" y2="6.2" stroke="#62577D" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="32" y1="90.8" x2="160" y2="90.8" stroke="#62577D" stroke-width="1.2" opacity="0.72"/>

  <!-- 内层旧铜细框与平暗文字底 -->
  <rect x="8.5" y="8.5" width="175" height="79" rx="7.5" fill="#1E192B" stroke="#1C1412" stroke-width="2"/>
  <rect x="10" y="10" width="172" height="76" rx="6.5" fill="none" stroke="#6E542B" stroke-width="1.5" opacity="0.88"/>

  <!-- 四角压暗旧铜/旧铁包角（严格在 32×32 角区内：x<=29 或 x>=163，y<=29 或 y>=67，统一左上受光、右下暗面） -->
  <!-- 左上角 -->
  <g>
    <path d="M3.5,11 C3.5,6.5 6.5,3.5 11,3.5 H28.5 L23.5,9.8 H11.5 V23.5 L3.5,28.5 Z" fill="#9A7B46" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M5,25.5 V11 C5,7.8 7.8,5 11,5 H25.5" fill="none" stroke="#C2A670" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="13.8" cy="13.8" r="2.2" fill="#1C1412"/><circle cx="13.5" cy="13.5" r="1.5" fill="#C2A670"/><circle cx="13" cy="13" r="0.6" fill="#DDCB9A"/>
  </g>
  <!-- 右上角 -->
  <g>
    <path d="M188.5,11 C188.5,6.5 185.5,3.5 181,3.5 H163.5 L168.5,9.8 H180.5 V23.5 L188.5,28.5 Z" fill="#9A7B46" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M181,9.8 H187.2 V26.5 L180.5,22.5 Z" fill="#6E542B" opacity="0.82"/>
    <path d="M166,5 H181 C184,5 186.2,6.8 186.8,9.8" fill="none" stroke="#C2A670" stroke-width="1.1" stroke-linecap="round"/>
    <circle cx="178.4" cy="13.8" r="2.2" fill="#1C1412"/><circle cx="178.2" cy="13.5" r="1.5" fill="#9A7B46"/><circle cx="177.7" cy="13" r="0.6" fill="#C2A670"/>
  </g>
  <!-- 左下角 -->
  <g>
    <path d="M3.5,85 C3.5,89.5 6.5,92.5 11,92.5 H28.5 L23.5,86.2 H11.5 V72.5 L3.5,67.5 Z" fill="#6E542B" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M11.5,86.2 H24.5 L27.5,91.2 H11 C7.5,91.2 5,88.8 4.8,85.2 Z" fill="#3B2B14" opacity="0.82"/>
    <path d="M5,70 V85" fill="none" stroke="#C2A670" stroke-width="1.1" stroke-linecap="round"/>
    <circle cx="13.8" cy="82.4" r="2.2" fill="#1C1412"/><circle cx="13.5" cy="82.2" r="1.5" fill="#9A7B46"/>
  </g>
  <!-- 右下角 -->
  <g>
    <path d="M188.5,85 C188.5,89.5 185.5,92.5 181,92.5 H163.5 L168.5,86.2 H180.5 V72.5 L188.5,67.5 Z" fill="#6E542B" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M187.2,69.5 V85 C187.2,88.8 184.5,91.2 181,91.2 H165.5 L169,86.2 H180.5 V72.5 Z" fill="#3B2B14" opacity="0.85"/>
    <circle cx="178.4" cy="82.4" r="2.2" fill="#1C1412"/><circle cx="178.2" cy="82.2" r="1.5" fill="#6E542B"/>
  </g>

  <!-- 待机独立光泽层 -->
  <rect id="sheen" opacity="0" x="10" y="10" width="172" height="76" rx="6.5" fill="none" stroke="url(#ui_btn-sheen-grad)" stroke-width="1.8"/>
</g>
</svg>
