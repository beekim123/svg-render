<svg xmlns="http://www.w3.org/2000/svg" class="svg-relic_twice" viewBox="0 0 96 96" width="96" height="96">
<title>宝物 · 头一张打两次</title>
<g id="root">
  <!-- 右边一模一样、淡一半的“回声”铃（opacity="0.48"） -->
  <g id="echo_bell" opacity="0.48" transform="translate(30, 4)">
    <!-- 顶部手柄与环 -->
    <circle cx="34" cy="18" r="5" fill="#6E542B" stroke="#1C1412" stroke-width="3"/>
    <rect x="30" y="22" width="8" height="9" rx="2" fill="#9A7B46" stroke="#1C1412" stroke-width="2.8"/>
    <!-- 铜铃身 -->
    <path d="M34,29 C21,29 16,39 15,52 L10,64 C9,67 11,69 16,69 H52 C57,69 59,67 58,64 L53,52 C52,39 47,29 34,29 Z" fill="#9A7B46" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M34,29 C47,29 52,39 53,52 L58,64 C59,67 57,69 52,69 H34 Z" fill="#6E542B" opacity="0.85"/>
    <line x1="15" y1="55" x2="53" y2="55" stroke="#1C1412" stroke-width="2.6"/>
    <!-- 铃舌 -->
    <circle cx="34" cy="72" r="6" fill="#FFD84A" stroke="#1C1412" stroke-width="2.8"/>
  </g>

  <!-- 中间两道短弧线（从左铃传向右回声铃的震波弧线） -->
  <g id="echo_arcs" fill="none" stroke-linecap="round">
    <path d="M51,38 Q57,49 51,60" stroke="#1C1412" stroke-width="6"/>
    <path d="M51,38 Q57,49 51,60" stroke="#FFD84A" stroke-width="3"/>
    <path d="M59,34 Q66,49 59,64" stroke="#1C1412" stroke-width="5.6"/>
    <path d="M59,34 Q66,49 59,64" stroke="#E2D6BA" stroke-width="2.8"/>
  </g>

  <!-- 左边实心主铜铃 -->
  <g id="main_bell" transform="translate(-4, 0)">
    <!-- 顶部铜吊环与柄 -->
    <circle cx="34" cy="18" r="5" fill="#9A7B46" stroke="#1C1412" stroke-width="3.2"/>
    <rect x="30" y="22" width="8" height="9" rx="2" fill="#9A7B46" stroke="#1C1412" stroke-width="3"/>
    <!-- 铜铃身 -->
    <path d="M34,29 C21,29 16,39 15,52 L10,64 C9,67 11,69 16,69 H52 C57,69 59,67 58,64 L53,52 C52,39 47,29 34,29 Z" fill="#9A7B46" stroke="#1C1412" stroke-width="3.4" stroke-linejoin="round"/>
    <!-- 右侧背光暗铜面 -->
    <path d="M34,29 C47,29 52,39 53,52 L58,64 C59,67 57,69 52,69 H34 Z" fill="#6E542B" opacity="0.85"/>
    <!-- 左上冷受光亮边 -->
    <path d="M30,33 C22,34 19,42 18,52 L14,62" fill="none" stroke="#E2D6BA" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 铃腰箍线 -->
    <line x1="15" y1="55" x2="53" y2="55" stroke="#1C1412" stroke-width="2.8"/>
    <!-- 铃心镶一颗鲜艳黄宝石与亮黄宝石铃舌 -->
    <circle cx="34" cy="44" r="5.5" fill="#FFD84A" stroke="#1C1412" stroke-width="2.4"/>
    <circle cx="32.5" cy="42.5" r="1.8" fill="#FFFFFF"/>
    <circle cx="34" cy="72" r="6.5" fill="#FFD84A" stroke="#1C1412" stroke-width="3"/>
    <circle cx="32" cy="70" r="2" fill="#FFFFFF"/>
    <!-- 外框重描 -->
    <path d="M34,29 C21,29 16,39 15,52 L10,64 C9,67 11,69 16,69 H52 C57,69 59,67 58,64 L53,52 C52,39 47,29 34,29 Z" fill="none" stroke="#1C1412" stroke-width="3.4" stroke-linejoin="round"/>
  </g>
</g>
</svg>
