<svg xmlns="http://www.w3.org/2000/svg" class="svg-card_art_whistle" viewBox="0 0 176 188" width="176" height="188">
<title>额外牌原画 · 哨子</title>
<style>
.svg-card_art_whistle g { transform-box: view-box; }
.svg-card_art_whistle #root { transform-origin: 96px 104px; }
.svg-card_art_whistle #whistle_body { transform-origin: 76px 108px; }
.svg-card_art_whistle #sound_arcs { transform-origin: 112px 76px; opacity: 0; }
.svg-card_art_whistle #called_card { transform-origin: 132px 136px; opacity: 0; }

/* 待机 idle（3000ms 循环）：0ms(0%) -> 1500ms(50%) -> 3000ms(100%)
   哨子轻轻晃 */
@keyframes svg-card_art_whistle-idle-body {
  0% { transform: translate(0px, 0px) rotate(0deg); }
  50% { transform: translate(0px, -5px) rotate(-4deg); }
  100% { transform: translate(0px, 0px) rotate(0deg); }
}
.svg-card_art_whistle:not([data-anim]) #whistle_body,
.svg-card_art_whistle[data-anim="idle"] #whistle_body {
  animation: svg-card_art_whistle-idle-body 3s ease-in-out infinite;
}

/* play（600ms）：
   0ms(0%) 静止 -> 100ms(16.6667%) 哨口冒出三道短弧线 -> 250ms(41.6667%) 一张牌背从画框下沿飞上来，停在哨子旁边
   -> 400ms(66.6667%) 停住 -> 600ms(100%) 落回去。
   所有部件严格共用：0%, 16.6667%, 41.6667%, 66.6667%, 100% */
@keyframes svg-card_art_whistle-play-body {
  0% { transform: translate(0px, 0px) rotate(0deg) scale(1, 1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  16.6667% { transform: translate(-10px, -6px) rotate(-14deg) scale(1.06, 0.95); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  41.6667% { transform: translate(-12px, -4px) rotate(-8deg) scale(1.02, 1); animation-timing-function: linear; }
  66.6667% { transform: translate(-12px, -4px) rotate(-8deg) scale(1.02, 1); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px, 0px) rotate(0deg) scale(1, 1); }
}
@keyframes svg-card_art_whistle-play-arcs {
  0% { opacity: 0; transform: translate(-6px, 4px) scale(0.6); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  16.6667% { opacity: 1; transform: translate(0px, 0px) scale(1.05); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  41.6667% { opacity: 1; transform: translate(4px, -3px) scale(1.12); animation-timing-function: linear; }
  66.6667% { opacity: 0.85; transform: translate(4px, -3px) scale(1.12); animation-timing-function: linear; }
  100% { opacity: 0; transform: translate(-6px, 4px) scale(0.6); }
}
@keyframes svg-card_art_whistle-play-card {
  0% { opacity: 0; transform: translate(0px, 0px) rotate(8deg) scale(0.85); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  16.6667% { opacity: 0.65; transform: translate(0px, -18px) rotate(4deg) scale(0.92); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  41.6667% { opacity: 1; transform: translate(0px, -46px) rotate(-4deg) scale(1); animation-timing-function: linear; }
  66.6667% { opacity: 1; transform: translate(0px, -46px) rotate(-4deg) scale(1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  100% { opacity: 0; transform: translate(0px, 0px) rotate(8deg) scale(0.85); }
}
.svg-card_art_whistle[data-anim="play"] #whistle_body {
  animation: svg-card_art_whistle-play-body 0.6s both;
}
.svg-card_art_whistle[data-anim="play"] #sound_arcs {
  animation: svg-card_art_whistle-play-arcs 0.6s both;
}
.svg-card_art_whistle[data-anim="play"] #called_card {
  animation: svg-card_art_whistle-play-card 0.6s both;
}
</style>
<g id="root">
  <!-- 左上角 x:0..30, y:0..90 留空 -->
  <ellipse cx="88" cy="166" rx="48" ry="8" fill="#0D111C" opacity="0.58"/>

  <!-- 1. 被叫来的额外牌牌背 called_card（初始位于画框内下沿 x:104..156, y:102..178，飞上 -46px 后在 y:56..132，全程绝不出框） -->
  <g id="called_card">
    
      <rect x="105.0" y="102.0" width="50" height="76" rx="6" fill="#262036" stroke="#1C1412" stroke-width="3"/>
      <rect x="109.0" y="106.0" width="42" height="68" rx="4" fill="#161221" stroke="#8CAAB5" stroke-width="1.8"/>
      <!-- 四角铜角花 -->
      <polygon points="109.0,114.0 109.0,106.0 117.0,106.0" fill="#8CAAB5"/>
      <polygon points="151.0,114.0 151.0,106.0 143.0,106.0" fill="#8CAAB5"/>
      <polygon points="109.0,166.0 109.0,174.0 117.0,174.0" fill="#8CAAB5"/>
      <polygon points="151.0,166.0 151.0,174.0 143.0,174.0" fill="#8CAAB5"/>
      <!-- 哥特菱格暗线 -->
      <polygon points="130.0,112.0 147.0,140.0 130.0,168.0 113.0,140.0" fill="none" stroke="#3A324D" stroke-width="1.2"/>
      <!-- 八角纹章铜盾 -->
      <polygon points="130.0,116.0 146.0,128.0 148.0,146.0 130.0,164.0 112.0,146.0 114.0,128.0" fill="#6E542B" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
      <polygon points="130.0,121.0 142.0,131.0 143.0,145.0 130.0,159.0 117.0,145.0 118.0,131.0" fill="#161221" stroke="#1C1412" stroke-width="1.4"/>
      <!-- 三颗宝石：红圆、绿方、蓝三角 -->
      <circle cx="130.0" cy="132.0" r="5.5" fill="#E3263A" stroke="#1C1412" stroke-width="1.6"/>
      <circle cx="128.5" cy="130.5" r="1.6" fill="#FFFFFF"/>
      <rect x="119.0" y="141.0" width="9.5" height="9.5" rx="1.5" fill="#1DBF5E" stroke="#1C1412" stroke-width="1.6"/>
      <polygon points="136.0,140.0 142.0,150.5 130.0,150.5" fill="#2E66F0" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round"/>
    
  </g>

  <!-- 2. 旧铜哨本体 whistle_body（哨身嵌一颗鲜艳黄色宝石 #FFD84A） -->
  <g id="whistle_body">
    <!-- 左下尾端旧铜挂环 -->
    <circle cx="44" cy="134" r="9" fill="none" stroke="#1C1412" stroke-width="5.6"/>
    <circle cx="44" cy="134" r="9" fill="none" stroke="#9A7B46" stroke-width="2.6"/>

    <!-- 哨管吹嘴（向右上斜伸，带出气缺口） -->
    <polygon points="82,92 118,68 126,80 112,92 106,86 94,106" fill="#9A7B46" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
    <polygon points="94,96 118,68 126,80 112,92 106,86 94,106" fill="#6E542B" opacity="0.82"/>
    <!-- 哨口音窗深槽 -->
    <polygon points="92,84 104,76 108,84 96,92" fill="#161221" stroke="#1C1412" stroke-width="2"/>

    <!-- 圆肚蜗牛铜哨主体（中心 74,114，半径 28） -->
    <circle cx="74" cy="114" r="28" fill="#9A7B46" stroke="#1C1412" stroke-width="3.4"/>
    <!-- 右下背光暗铜面 -->
    <path d="M94,94 A28,28 0 0,1 54,134 L74,114 Z" fill="#6E542B" opacity="0.85"/>
    <!-- 左上冷亮边 -->
    <path d="M50,108 A25,25 0 0,1 82,90" fill="none" stroke="#E2D6BA" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 哨身一圈铜铆钉 -->
    <circle cx="54" cy="102" r="2.2" fill="#C2A670" stroke="#1C1412" stroke-width="1.2"/>
    <circle cx="74" cy="91" r="2.2" fill="#C2A670" stroke="#1C1412" stroke-width="1.2"/>
    <circle cx="94" cy="114" r="2.2" fill="#6E542B" stroke="#1C1412" stroke-width="1.2"/>
    <circle cx="74" cy="137" r="2.2" fill="#6E542B" stroke="#1C1412" stroke-width="1.2"/>

    <!-- 哨身正中镶嵌的鲜艳黄色宝石（黄 = 红 + 绿，#FFD84A，多切面八角圆钻） -->
    <g id="yellow_gem">
      <circle cx="74" cy="114" r="16.5" fill="#3B2B14" stroke="#1C1412" stroke-width="2.4"/>
      <circle cx="74" cy="114" r="14" fill="#FFD84A" stroke="#1C1412" stroke-width="2.4"/>
      <!-- 左上亮刻面与右下暗刻面 -->
      <path d="M74,100 A14,14 0 0,0 60,114 L67,114 L69,106 Z" fill="#FFF2A6"/>
      <path d="M84,104 A14,14 0 0,1 64,124 L74,114 Z" fill="#C99718"/>
      <!-- 中央八角台面与高光白斑 -->
      <polygon points="69,106 79,106 82,111 82,117 79,122 69,122 66,117 66,111" fill="#FFD84A" stroke="#1C1412" stroke-width="1.4"/>
      <polygon points="68,108 75,107 73,113 67,112" fill="#FFFFFF" opacity="0.95"/>
    </g>
  </g>

  <!-- 3. 哨口冒出的三道短弧线 sound_arcs（play 第 100ms 冒出） -->
  <g id="sound_arcs" fill="none" stroke-linecap="round">
    <path d="M116,58 Q128,60 128,72" stroke="#1C1412" stroke-width="5.6"/>
    <path d="M116,58 Q128,60 128,72" stroke="#FFD84A" stroke-width="2.8"/>
    <path d="M122,48 Q138,52 138,68" stroke="#1C1412" stroke-width="5.4"/>
    <path d="M122,48 Q138,52 138,68" stroke="#FFF2A6" stroke-width="2.6"/>
    <path d="M128,38 Q148,44 148,64" stroke="#1C1412" stroke-width="5"/>
    <path d="M128,38 Q148,44 148,64" stroke="#E2D6BA" stroke-width="2.4"/>
  </g>
</g>
</svg>
