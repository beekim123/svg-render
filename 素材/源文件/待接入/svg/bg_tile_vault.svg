<svg xmlns="http://www.w3.org/2000/svg" class="svg-bg_tile_vault" viewBox="0 0 512 512" width="512" height="512">
<title>宝库背景 · 旧石砖墙</title>
<g id="root">
  <!-- 极暗冷夜石墙底色（与 bg_tile 一致 #0D111C，不用 width="100%" 避免预览工具误报） -->
  <path d="M0,0 H512 V512 H0 Z" fill="#0D111C"/>

  <!-- 大块宝库旧石砖色块（4层高 128px 的大石砖，左右 x=0 与 x=512、上下 y=0 与 y=512 严格无缝衔接） -->
  <g fill="#161221" opacity="0.48">
    <!-- 第1行 (y: 4..124)：跨左右边界的砖块 (0..92 与 420..512) + 中间大砖 (260..412) -->
    <path d="M0,4 H92 V124 H0 Z M420,4 H512 V124 H420 Z"/>
    <rect x="260" y="4" width="152" height="120" rx="2"/>
    <!-- 第2行 (y: 132..252)：大砖 (12..188) + (348..500) -->
    <rect x="12" y="132" width="176" height="120" rx="2"/>
    <rect x="348" y="132" width="152" height="120" rx="2"/>
    <!-- 第3行 (y: 260..380)：跨左右边界的砖块 (0..124 与 452..512) + 中间大砖 (132..300) -->
    <path d="M0,260 H124 V380 H0 Z M452,260 H512 V380 H452 Z"/>
    <rect x="132" y="260" width="168" height="120" rx="2"/>
    <!-- 第4行 (y: 388..508)：大砖 (68..236) + (396..504) -->
    <rect x="68" y="388" width="168" height="120" rx="2"/>
    <rect x="396" y="388" width="108" height="120" rx="2"/>
  </g>

  <!-- 大石砖左上微弱冷灰石棱受光边（严格在砖内或跨边界对齐） -->
  <g fill="none" stroke="#1E2C33" stroke-width="1.4" opacity="0.4">
    <!-- 第1行 (y: 0..128) -->
    <path d="M0,10 H86 M426,118 V10 H512"/>
    <path d="M104,118 V10 H248"/>
    <path d="M266,118 V10 H408"/>
    <!-- 第2行 (y: 128..256) -->
    <path d="M18,246 V138 H182"/>
    <path d="M202,246 V138 H334"/>
    <path d="M354,246 V138 H496"/>
    <!-- 第3行 (y: 256..384) -->
    <path d="M0,266 H118 M458,374 V266 H512"/>
    <path d="M138,374 V266 H294"/>
    <path d="M314,374 V266 H440"/>
    <!-- 第4行 (y: 384..512) -->
    <path d="M0,394 H54 M398,502 V394 H512"/>
    <path d="M74,502 V394 H230"/>
    <path d="M250,502 V394 H382"/>
  </g>

  <!-- 宝库大石砖深重砖缝线（y=0 与 y=512、x=0 与 x=512 严丝合缝） -->
  <path d="M0,0 H512 M0,128 H512 M0,256 H512 M0,384 H512 M0,512 H512 M96,0 V128 M256,0 V128 M416,0 V128 M8,128 V256 M192,128 V256 M344,128 V256 M128,256 V384 M304,256 V384 M448,256 V384 M64,384 V512 M240,384 V512 M392,384 V512" fill="none" stroke="#1C1412" stroke-width="2.4" opacity="0.72"/>

  <!-- 石砖表面极淡的风化斜刮痕（全在砖块内部，不跨边界） -->
  <path d="M150,42 L172,64 M158,40 L178,60 M312,56 L334,78 M76,176 L98,198 M408,182 L428,202 M206,304 L228,326 M362,318 L380,336 M136,436 L158,458 M304,442 L324,462" stroke="#1C1412" stroke-width="1.2" opacity="0.35"/>

  <!-- 砖缝里零星嵌着的几粒很暗的小宝石碎与旧金碎粒（压暗、不发光，全在内部砖缝交界处） -->
  <g stroke="#1C1412" stroke-width="1.2" opacity="0.52">
    <!-- 暗红宝石碎粒 -->
    <polygon points="96,123 102,128 96,133 91,128" fill="#6E1824"/>
    <circle cx="304" cy="384" r="3.8" fill="#6E1824"/>
    <!-- 暗绿宝石碎粒 -->
    <rect x="252.5" y="61" width="7" height="7" rx="1" fill="#12542D"/>
    <polygon points="64,442 69,447 64,452 59,447" fill="#12542D"/>
    <!-- 暗蓝宝石碎粒 -->
    <polygon points="192,251 198,260 186,260" fill="#18357A"/>
    <polygon points="416,58 421,67 411,67" fill="#18357A"/>
    <!-- 暗旧金小碎粒 -->
    <circle cx="344" cy="192" r="3.2" fill="#524020"/>
    <circle cx="128" cy="320" r="3" fill="#524020"/>
    <polygon points="240,380 245,385 240,389 235,385" fill="#524020"/>
  </g>
</g>
</svg>
