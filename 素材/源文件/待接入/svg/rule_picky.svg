<svg xmlns="http://www.w3.org/2000/svg" class="svg-rule_picky" viewBox="0 0 64 64" width="64" height="64">
<title>规矩图标 · 挑食</title>
<g id="root">
  <!-- 拨开宝石的动势短弧线 -->
  <path d="M25,44 Q32,52 40,51" fill="none" stroke="#1C1412" stroke-width="5.2" stroke-linecap="round"/>
  <path d="M25,44 Q32,52 40,51" fill="none" stroke="#E2D6BA" stroke-width="2.4" stroke-linecap="round"/>

  <!-- 被拨到右下角的一颗单独的鲜艳红色圆宝石（唯一鲜艳处：#E3263A） -->
  <g id="gem_red">
    <circle cx="45" cy="43" r="12.5" fill="#E3263A" stroke="#1C1412" stroke-width="3.2"/>
    <!-- 右下背光暗刻面 -->
    <path d="M54,34 A12.5,12.5 0 0,1 36,52 L45,43 Z" fill="#9E1424"/>
    <!-- 左上受光亮刻面 -->
    <path d="M36,52 A12.5,12.5 0 0,1 54,34 L45,43 Z" fill="#FF5C6E"/>
    <!-- 中央圆台面与高光白斑 -->
    <circle cx="45" cy="43" r="7" fill="#E3263A" stroke="#1C1412" stroke-width="1.8"/>
    <polygon points="39,38 45,36 43,42 38,42" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="45" cy="43" r="12.5" fill="none" stroke="#1C1412" stroke-width="3.2"/>
  </g>

  <!-- 从左上斜伸过来拨开宝石的小银叉（旧银 #8CAAB5 + 暗面 #5A7682 + 粗外框） -->
  <g id="silver_fork">
    <!-- 叉柄 -->
    <polygon points="6,10 12,6 27,23 21,28" fill="#8CAAB5" stroke="#1C1412" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="9,8 12,6 27,23 24,25.5" fill="#5A7682"/>
    <!-- 叉头横肩与三根粗叉齿 -->
    <path d="M16,31 L30,17 L41,29 L37,33 L29,24 L26,27 L34,36 L30,40 L22,31 L19,34 L27,43 L23,47 Z" fill="#E2D6BA" stroke="#1C1412" stroke-width="3" stroke-linejoin="round"/>
    <path d="M23,24 L30,17 L41,29 L37,33 L29,24 Z" fill="#5A7682"/>
    <line x1="9" y1="10" x2="22" y2="24" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</g>
</svg>
