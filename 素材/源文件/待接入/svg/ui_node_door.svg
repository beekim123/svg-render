<svg xmlns="http://www.w3.org/2000/svg" class="svg-ui_node_door" viewBox="0 0 64 64" width="64" height="64">
<title>进度节点 · 挑门</title>
<g id="root">
  <!-- 统一规格暗色小圆底（与 ui_node_fight 完全同款的 12 边形哥特旧铜圆章） -->
  <polygon points="32,8 44,11 53,20 56,32 53,44 44,53 32,56 20,53 11,44 8,32 11,20 20,11" fill="#6E542B" stroke="#1C1412" stroke-width="3" stroke-linejoin="round"/>
  <!-- 右下背光铜暗面 -->
  <polygon points="44,11 53,20 56,32 53,44 44,53 32,56 20,53 32,32" fill="#3B2B14" opacity="0.82"/>
  <!-- 左上冷受光亮边 -->
  <polyline points="11,42 9.5,32 12.2,20.8 20.8,12.2 32,9.5 42,11.5" fill="none" stroke="#C2A670" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 内部暗夜紫凹盘 -->
  <circle cx="32" cy="32" r="18.5" fill="#161221" stroke="#1C1412" stroke-width="2.4"/>
  <path d="M18,22 A17,17 0 0,1 46,22 A17,15 0 0,0 18,22 Z" fill="#0D111C" opacity="0.8"/>

  <!-- 四方铆钉 -->
  <circle cx="32" cy="11" r="1.6" fill="#C2A670" stroke="#1C1412" stroke-width="1"/>
  <circle cx="53" cy="32" r="1.6" fill="#9A7B46" stroke="#1C1412" stroke-width="1"/>
  <circle cx="32" cy="53" r="1.6" fill="#9A7B46" stroke="#1C1412" stroke-width="1"/>
  <circle cx="11" cy="32" r="1.6" fill="#C2A670" stroke="#1C1412" stroke-width="1"/>

  <!-- 中央图案：小尖拱门，门半开，门缝里一点暗 -->
  <g id="arch_door">
    <!-- 尖拱石门框外沿 -->
    <path d="M20,46 V28 C20,20 26,15 32,14 C38,15 44,20 44,28 V46 Z" fill="#8CAAB5" stroke="#1C1412" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M32,14 C38,15 44,20 44,28 V46 H32 Z" fill="#5A7682"/>
    <!-- 门洞深处的一点暗（右侧半开的门缝） -->
    <path d="M23,45 V28 C23,22 27,18 32,17 C37,18 41,22 41,28 V45 Z" fill="#0D111C" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <!-- 半开的旧木门扇（绕左合页向内偏转，右边露出明显暗门缝） -->
    <path d="M23,45 V28 C23,22 27,18 32,17 L35,20 V43 L23,45 Z" fill="#9E6238" stroke="#1C1412" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M25,43 V28 C25,24 28,20 32,19" fill="none" stroke="#E2D6BA" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 门上小铜环 -->
    <circle cx="31" cy="32" r="2.2" fill="#C2A670" stroke="#1C1412" stroke-width="1.4"/>
  </g>
</g>
</svg>
