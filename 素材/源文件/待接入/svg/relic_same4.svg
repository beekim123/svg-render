<svg xmlns="http://www.w3.org/2000/svg" class="svg-relic_same4" viewBox="0 0 96 96" width="96" height="96">
<title>宝物 · 同色 ×4</title>
<g id="root">
  <!-- 四瓣花形旧银胸针底托（十字花托 + 四角斜出银尖刺 + 暗面色块） -->
  <g id="brooch_base">
    <!-- 四角对角斜伸的哥特旧银尖叶衬底 -->
    <polygon points="48,32 76,20 64,48 76,76 48,64 20,76 32,48 20,20" fill="#3B515C" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
    <!-- 四瓣银花托外盘 -->
    <path d="M33,8 H63 L67,29 L88,33 V63 L67,67 L63,88 H33 L29,67 L8,63 V33 L29,29 Z" fill="#5A7682" stroke="#1C1412" stroke-width="3.4" stroke-linejoin="round"/>
    <!-- 右下背光暗银面 -->
    <path d="M48,8 H63 L67,29 L88,33 V63 L67,67 L63,88 H48 Z" fill="#3B515C" opacity="0.82"/>
    <!-- 左上冷灰青受光亮边 -->
    <polyline points="12,58 12,36 31,32 35,12 58,12" fill="none" stroke="#8CAAB5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M33,8 H63 L67,29 L88,33 V63 L67,67 L63,88 H33 L29,67 L8,63 V33 L29,29 Z" fill="none" stroke="#1C1412" stroke-width="3.4" stroke-linejoin="round"/>
  </g>

  <!-- 四瓣是四颗一模一样的鲜艳绿色方宝石（上、右、下、左四瓣对称排布，每颗 22×22） -->
  <g id="four_green_gems">
    <!-- 1. 上瓣绿方宝石 (37, 11) -->
    <g id="petal_top">
      <rect x="37" y="11" width="22" height="22" rx="2.5" fill="#1DBF5E" stroke="#1C1412" stroke-width="3"/>
      <polygon points="59,11 59,33 37,33 42,28 54,28 54,16" fill="#117A3B"/>
      <rect x="42" y="16" width="12" height="12" rx="1" fill="#5CE892" stroke="#1C1412" stroke-width="1.4"/>
      <rect x="44" y="18" width="4.5" height="4.5" fill="#FFFFFF"/>
      <rect x="37" y="11" width="22" height="22" rx="2.5" fill="none" stroke="#1C1412" stroke-width="3"/>
    </g>

    <!-- 2. 下瓣绿方宝石 (37, 63) -->
    <g id="petal_bottom" transform="translate(0, 52)">
      <rect x="37" y="11" width="22" height="22" rx="2.5" fill="#1DBF5E" stroke="#1C1412" stroke-width="3"/>
      <polygon points="59,11 59,33 37,33 42,28 54,28 54,16" fill="#117A3B"/>
      <rect x="42" y="16" width="12" height="12" rx="1" fill="#5CE892" stroke="#1C1412" stroke-width="1.4"/>
      <rect x="44" y="18" width="4.5" height="4.5" fill="#FFFFFF"/>
      <rect x="37" y="11" width="22" height="22" rx="2.5" fill="none" stroke="#1C1412" stroke-width="3"/>
    </g>

    <!-- 3. 左瓣绿方宝石 (11, 37) -->
    <g id="petal_left" transform="translate(-26, 26)">
      <rect x="37" y="11" width="22" height="22" rx="2.5" fill="#1DBF5E" stroke="#1C1412" stroke-width="3"/>
      <polygon points="59,11 59,33 37,33 42,28 54,28 54,16" fill="#117A3B"/>
      <rect x="42" y="16" width="12" height="12" rx="1" fill="#5CE892" stroke="#1C1412" stroke-width="1.4"/>
      <rect x="44" y="18" width="4.5" height="4.5" fill="#FFFFFF"/>
      <rect x="37" y="11" width="22" height="22" rx="2.5" fill="none" stroke="#1C1412" stroke-width="3"/>
    </g>

    <!-- 4. 右瓣绿方宝石 (63, 37) -->
    <g id="petal_right" transform="translate(26, 26)">
      <rect x="37" y="11" width="22" height="22" rx="2.5" fill="#1DBF5E" stroke="#1C1412" stroke-width="3"/>
      <polygon points="59,11 59,33 37,33 42,28 54,28 54,16" fill="#117A3B"/>
      <rect x="42" y="16" width="12" height="12" rx="1" fill="#5CE892" stroke="#1C1412" stroke-width="1.4"/>
      <rect x="44" y="18" width="4.5" height="4.5" fill="#FFFFFF"/>
      <rect x="37" y="11" width="22" height="22" rx="2.5" fill="none" stroke="#1C1412" stroke-width="3"/>
    </g>
  </g>

  <!-- 胸针花心旧银铆扣座 -->
  <g id="brooch_center">
    <polygon points="48,37 59,48 48,59 37,48" fill="#8CAAB5" stroke="#1C1412" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="48,37 59,48 48,59" fill="#3B515C"/>
    <circle cx="48" cy="48" r="4.2" fill="#E2D6BA" stroke="#1C1412" stroke-width="2"/>
  </g>
</g>
</svg>
