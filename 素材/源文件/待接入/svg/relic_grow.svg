<svg xmlns="http://www.w3.org/2000/svg" class="svg-relic_grow" viewBox="0 0 96 96" width="96" height="96">
<title>宝物 · 宝石长得快</title>
<g id="root">
  <!-- 锉刀旁与下方堆积的一撮亮晶晶彩色宝石粉堆与飘落晶屑 -->
  <g id="gem_dust">
    <!-- 左下堆积的一撮鲜艳宝石粉堆（青/绿/金/红晶粉簇拥成堆，强化锉宝石粉特征） -->
    <path d="M12,78 C16,66 28,62 40,66 C48,68 54,74 56,82 L10,84 Z" fill="#1DBF5E" stroke="#1C1412" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M18,82 C22,72 34,70 46,74 L50,83 L16,84 Z" fill="#3FE3F0" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
    <polygon points="24,66 30,58 37,65 31,72" fill="#FFD84A" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="18" cy="74" r="4.5" fill="#E3263A" stroke="#1C1412" stroke-width="2"/>
    <circle cx="42" cy="76" r="4" fill="#FFD84A" stroke="#1C1412" stroke-width="2"/>
    <circle cx="29" cy="78" r="3" fill="#FFFFFF" stroke="#1C1412" stroke-width="1.6"/>
    <polygon points="14,58 17,63 22,65 17,67 14,72 11,67 6,65 11,63" fill="#FFFFFF" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- 右侧飘落的鲜艳宝石碎粉晶粒与星芒 -->
    <polygon points="56,44 60,51 67,54 60,57 56,64 52,57 45,54 52,51" fill="#3FE3F0" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="74" cy="46" r="5.5" fill="#E3263A" stroke="#1C1412" stroke-width="2.2"/>
    <circle cx="72.5" cy="44.5" r="2" fill="#FFFFFF"/>
    <rect x="65" y="62" width="10" height="10" rx="2" fill="#1DBF5E" stroke="#1C1412" stroke-width="2.2" transform="rotate(18 70 67)"/>
    <polygon points="46,70 54,84 38,84" fill="#2E66F0" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
    <polygon points="82,56 85,62 91,65 85,68 82,74 79,68 73,65 79,62" fill="#FFD84A" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="60" cy="78" r="3.5" fill="#FFFFFF" stroke="#1C1412" stroke-width="1.8"/>
  </g>

  <!-- 斜置的宽平钝头铜柄大锉刀（刀头平钝、无护手剑格、加粗横排锉纹与侧边锯齿） -->
  <g id="brass_file">
    <!-- 宽厚平钝头钢锉刀身（去掉剑脊线，改为宽扁方头锉面） -->
    <path d="M8,22 L22,8 L58,44 L44,58 Z" fill="#5A7682" stroke="#1C1412" stroke-width="3.4" stroke-linejoin="round"/>
    <polygon points="15,15 22,8 58,44 51,51" fill="#3B515C"/>

    <!-- 加粗醒目的密集横排锉刀纹（粗黑横槽 + 亮灰青齿脊，缩小后依然一眼看出是锉刀） -->
    <path d="M13,25 L25,13 M20,32 L32,20 M27,39 L39,27 M34,46 L46,34 M41,53 L53,41" stroke="#A8C6D1" stroke-width="3" stroke-linecap="round"/>
    <path d="M15,27 L27,15 M22,34 L34,22 M29,41 L41,29 M36,48 L48,36 M43,55 L55,43" stroke="#1C1412" stroke-width="3.8" stroke-linecap="round"/>
    <!-- 交错斜锉齿点 -->
    <path d="M18,16 L48,46 M14,20 L44,50" stroke="#1C1412" stroke-width="1.8" stroke-dasharray="3 5" stroke-linecap="round"/>

    <!-- 钝平刀头重描与边缘粗锉齿凸起 -->
    <path d="M8,22 L22,8 L58,44 L44,58 Z" fill="none" stroke="#1C1412" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M13,13 L17,9 M25,11 L27,9 M32,18 L34,16 M39,25 L41,23 M46,32 L48,30 M11,25 L9,27 M18,32 L16,34 M25,39 L23,41 M32,46 L30,48" stroke="#1C1412" stroke-width="3.2" stroke-linecap="round"/>

    <!-- 紧凑的圆筒黄铜箍环（比锉刀面略窄，避免像剑格护手） -->
    <polygon points="47,55 55,47 61,53 53,61" fill="#C2A670" stroke="#1C1412" stroke-width="3" stroke-linejoin="round"/>

    <!-- 圆胖木锉刀手柄 -->
    <path d="M52,62 L62,52 L84,74 C89,79 87,85 83,88 C79,90 73,88 68,83 Z" fill="#9A7B46" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M57,57 L62,52 L84,74 C89,79 87,85 83,88 Z" fill="#6E542B" opacity="0.82"/>
    <circle cx="77" cy="78" r="3.2" fill="#1C1412"/>
    <path d="M52,62 L62,52 L84,74 C89,79 87,85 83,88 C79,90 73,88 68,83 Z" fill="none" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
  </g>
</g>
</svg>
