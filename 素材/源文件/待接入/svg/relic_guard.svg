<svg xmlns="http://www.w3.org/2000/svg" class="svg-relic_guard" viewBox="0 0 96 96" width="96" height="96">
<title>宝物 · 挡一次</title>
<g id="root">
  <!-- 小圆铜盾外圈厚边（旧铜 #9A7B46 + 暗面 #6E542B / #3B2B14 + 粗外框） -->
  <g id="copper_shield">
    <circle cx="48" cy="48" r="39" fill="#9A7B46" stroke="#1C1412" stroke-width="3.6"/>
    <!-- 右下背光暗铜面 -->
    <path d="M76,20 A39,39 0 0,1 20,76 L48,48 Z" fill="#6E542B"/>
    <!-- 左上受光亮边 -->
    <path d="M16,38 A34,34 0 0,1 60,15" fill="none" stroke="#E2D6BA" stroke-width="2.6" stroke-linecap="round"/>

    <!-- 盾面内盘（深一层的旧铜盾心） -->
    <circle cx="48" cy="48" r="29" fill="#9A7B46" stroke="#1C1412" stroke-width="3"/>
    <path d="M69,27 A29,29 0 0,1 27,69 L48,48 Z" fill="#6E542B" opacity="0.88"/>
    <path d="M24,40 A25,25 0 0,1 56,23" fill="none" stroke="#C2A670" stroke-width="2" stroke-linecap="round"/>

    <!-- 盾圈一圈八颗旧铜铆钉 -->
    <g fill="#C2A670" stroke="#1C1412" stroke-width="2">
      <circle cx="48" cy="14" r="3"/>
      <circle cx="48" cy="82" r="3" fill="#6E542B"/>
      <circle cx="14" cy="48" r="3"/>
      <circle cx="82" cy="48" r="3" fill="#6E542B"/>
      <circle cx="24" cy="24" r="3"/>
      <circle cx="72" cy="24" r="3"/>
      <circle cx="24" cy="72" r="3" fill="#6E542B"/>
      <circle cx="72" cy="72" r="3" fill="#3B2B14"/>
    </g>

    <!-- 盾面上被打凹了一块的深坑（核心识别特征：不规则重击凹坑 + 内陷阴影 + 放射震裂纹） -->
    <g id="shield_dent">
      <!-- 凹坑外沿翻起的高光下唇 -->
      <path d="M31,52 C34,65 51,69 62,59 C68,53 69,41 61,34" fill="none" stroke="#E2D6BA" stroke-width="3" stroke-linecap="round"/>
      <!-- 凹坑主体深陷阶梯面 -->
      <path d="M34,36 L47,30 L61,35 L65,49 L56,61 L40,62 L30,50 Z" fill="#3B2B14" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
      <!-- 凹坑下半受光反光面（上暗下亮表现出往里凹陷的体积感） -->
      <polygon points="30,50 40,62 56,61 65,49 48,47" fill="#6E542B"/>
      <!-- 凹坑最深处重击中心黑坑 -->
      <polygon points="39,41 50,37 57,44 52,53 41,52" fill="#161221" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
      <!-- 撞击处向四周炸开的四道短促裂痕 -->
      <path d="M47,30 L45,22 M61,35 L69,30 M65,49 L73,52 M30,50 L23,54 M40,62 L37,70" stroke="#1C1412" stroke-width="2.8" stroke-linecap="round"/>
    </g>

    <circle cx="48" cy="48" r="39" fill="none" stroke="#1C1412" stroke-width="3.6"/>
  </g>
</g>
</svg>
