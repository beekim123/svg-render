<svg xmlns="http://www.w3.org/2000/svg" class="svg-relic_start2" viewBox="0 0 96 96" width="96" height="96">
<title>宝物 · 倍率从 2 起</title>
<g id="root">
  <!-- 底部暗影 -->
  <ellipse cx="48" cy="84" rx="32" ry="5" fill="#0D111C" opacity="0.65"/>

  <!-- 砝码顶部旧铜提环与镶座 -->
  <path d="M35,28 C35,14 61,14 61,28" fill="none" stroke="#1C1412" stroke-width="8" stroke-linecap="round"/>
  <path d="M35,28 C35,14 61,14 61,28" fill="none" stroke="#9A7B46" stroke-width="3.6" stroke-linecap="round"/>
  <!-- 铜脖颈座 -->
  <polygon points="34,26 62,26 58,36 38,36" fill="#6E542B" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>

  <!-- 旧铜砝码厚重主体（束腰梯形台体，范围 x:16..80, y:34..82，四边留足边距） -->
  <polygon points="24,35 72,35 68,46 78,54 80,82 16,82 18,54 28,46" fill="#9A7B46" stroke="#1C1412" stroke-width="3.4" stroke-linejoin="round"/>
  <!-- 右侧背光暗铜面（1层暗面） -->
  <polygon points="48,35 72,35 68,46 78,54 80,82 48,82" fill="#6E542B" opacity="0.85"/>
  <polygon points="62,54 78,54 80,82 60,82" fill="#3B2B14" opacity="0.55"/>
  <!-- 左上冷受光亮边 -->
  <polyline points="20,78 22,55 31,47 27,39 48,39" fill="none" stroke="#E2D6BA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 砝码腰线与底座折线 -->
  <line x1="28" y1="46" x2="68" y2="46" stroke="#1C1412" stroke-width="2.6"/>
  <line x1="18" y1="54" x2="78" y2="54" stroke="#1C1412" stroke-width="2.6"/>
  <line x1="17" y1="75" x2="79" y2="75" stroke="#1C1412" stroke-width="2.4"/>

  <!-- 砝码正面深凹铭牌槽与两道醒目竖杠（表示 2，不写数字） -->
  <polygon points="28,58 68,58 70,72 26,72" fill="#3B2B14" stroke="#1C1412" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- 第一道竖杠 -->
  <rect x="37" y="56" width="7" height="18" rx="2" fill="#E2D6BA" stroke="#1C1412" stroke-width="2.6"/>
  <!-- 第二道竖杠 -->
  <rect x="52" y="56" width="7" height="18" rx="2" fill="#E2D6BA" stroke="#1C1412" stroke-width="2.6"/>

  <!-- 砝码外框重描 -->
  <polygon points="24,35 72,35 68,46 78,54 80,82 16,82 18,54 28,46" fill="none" stroke="#1C1412" stroke-width="3.4" stroke-linejoin="round"/>

  <!-- 砝码顶上嵌着的一颗闪亮小白宝石（唯一鲜艳高亮处：#F4F1FF + 三色微光切面） -->
  <g id="white_gem">
    <polygon points="48,15 62,25 57,41 39,41 34,25" fill="#F4F1FF" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
    <!-- 切面里隐约透出红、绿、蓝三色折射 -->
    <polygon points="48,15 34,25 42,29 48,22" fill="#FFD6DF"/>
    <polygon points="34,25 39,41 45,34 42,29" fill="#C4F9D8"/>
    <polygon points="48,15 62,25 57,41 48,41 48,22" fill="#B8D0FF"/>
    <!-- 中央亮白台面与高光 -->
    <polygon points="48,21 55,26 52,35 44,35 41,26" fill="#FFFFFF" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round"/>
    <polygon points="43,23 50,22 48,28 42,28" fill="#FFFFFF"/>
    <polygon points="48,15 62,25 57,41 39,41 34,25" fill="none" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
  </g>
</g>
</svg>
