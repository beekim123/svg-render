<svg xmlns="http://www.w3.org/2000/svg" class="svg-title_emblem" viewBox="0 0 400 340" width="400" height="340">
<title>首页徽记</title>
<style>
.svg-title_emblem g { transform-box: view-box; }
.svg-title_emblem #root { transform-origin: 200px 340px; }
.svg-title_emblem #glint_red { transform-origin: 200px 118px; opacity: 0; }
.svg-title_emblem #glint_green { transform-origin: 132px 194px; opacity: 0; }
.svg-title_emblem #glint_blue { transform-origin: 268px 194px; opacity: 0; }

/* 待机（4.8s 循环）：三颗宝石轮流闪一下（只动 3 个光效元素，关闭动画时元素本身 opacity="0" 保持干净静态） */
@keyframes svg-title_emblem-glint-red {
  0%, 6%, 26%, 100% { opacity: 0; transform: scale(0.42) rotate(-10deg); }
  13% { opacity: 1; transform: scale(1.06) rotate(0deg); }
  20% { opacity: 0.82; transform: scale(0.94) rotate(6deg); }
}
@keyframes svg-title_emblem-glint-green {
  0%, 38%, 58%, 100% { opacity: 0; transform: scale(0.42) rotate(-10deg); }
  45% { opacity: 1; transform: scale(1.06) rotate(0deg); }
  52% { opacity: 0.82; transform: scale(0.94) rotate(6deg); }
}
@keyframes svg-title_emblem-glint-blue {
  0%, 70%, 90%, 100% { opacity: 0; transform: scale(0.42) rotate(-10deg); }
  77% { opacity: 1; transform: scale(1.06) rotate(0deg); }
  84% { opacity: 0.82; transform: scale(0.94) rotate(6deg); }
}
.svg-title_emblem:not([data-anim]) #glint_red,
.svg-title_emblem[data-anim="idle"] #glint_red {
  animation: svg-title_emblem-glint-red 4.8s steps(8, end) infinite;
}
.svg-title_emblem:not([data-anim]) #glint_green,
.svg-title_emblem[data-anim="idle"] #glint_green {
  animation: svg-title_emblem-glint-green 4.8s steps(8, end) infinite;
}
.svg-title_emblem:not([data-anim]) #glint_blue,
.svg-title_emblem[data-anim="idle"] #glint_blue {
  animation: svg-title_emblem-glint-blue 4.8s steps(8, end) infinite;
}
</style>
<defs>
  <linearGradient id="title_emblem-stone" x1="15%" y1="5%" x2="85%" y2="95%">
    <stop offset="0%" stop-color="#3B515C"/>
    <stop offset="55%" stop-color="#262036"/>
    <stop offset="100%" stop-color="#161221"/>
  </linearGradient>
  <linearGradient id="title_emblem-brass" x1="10%" y1="0%" x2="90%" y2="100%">
    <stop offset="0%" stop-color="#C2A670"/>
    <stop offset="45%" stop-color="#9A7B46"/>
    <stop offset="100%" stop-color="#6E542B"/>
  </linearGradient>
</defs>
<g id="root">
  <!-- pivot: 200,340 -->
  <!-- 落地暗影（底边中点 200,340 落地，严格在画框内） -->
  <ellipse cx="200" cy="328" rx="148" ry="10" fill="#0D111C" opacity="0.68"/>
  <ellipse cx="200" cy="328" rx="112" ry="6" fill="#1C1412" opacity="0.5"/>
  <path d="M76,332 L90,322 M100,333 L114,322 M124,334 L138,321 M148,334 L162,321 M172,335 L186,321 M196,335 L210,321 M220,335 L234,321 M244,334 L258,321 M268,334 L282,322 M292,333 L306,322 M314,332 L328,323" stroke="#1C1412" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>

  <!-- 底部哥特石座与旧铜基座（立式牌匾底座 y:280..328） -->
  <g id="pedestal">
    <!-- 下层宽石阶 -->
    <polygon points="64,306 336,308 348,328 52,328" fill="#4A4742" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
    <polygon points="200,307 336,308 348,328 200,328" fill="#2E2C28" opacity="0.82"/>
    <path d="M56,323 L67,309 H192" fill="none" stroke="#8CAAB5" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <!-- 上层收腰石台与铜包角 -->
    <polygon points="82,282 318,284 328,308 72,306" fill="#3B515C" stroke="#1C1412" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="200,283 318,284 328,308 200,307" fill="#1E2C33" opacity="0.8"/>
    <!-- 基座左右旧铜兽爪压脚 -->
    <polygon points="68,280 106,280 112,312 60,312" fill="#6E542B" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <polygon points="294,280 332,280 340,312 288,312" fill="#3B2B14" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M71,283 H102 M64,307 H106" stroke="#C2A670" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- 左右两侧哥特尖翼护柱 -->
  <g id="side_wings">
    <!-- 左侧尖翼 -->
    <polygon points="40,126 78,94 86,262 54,274 34,212" fill="#6E542B" stroke="#1C1412" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="48,134 74,112 80,252 60,260 44,208" fill="#262036" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <path d="M43,128 L76,99" stroke="#C2A670" stroke-width="2" stroke-linecap="round"/>
    <!-- 右侧尖翼（背光偏暗、微歪不对称） -->
    <polygon points="360,130 322,96 314,262 346,274 366,210" fill="#3B2B14" stroke="#1C1412" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="352,138 326,114 320,252 340,260 356,206" fill="#161221" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- 立式主纹章盾牌牌匾（y:18..294, x:68..332） -->
  <g id="main_crest">
    <!-- 旧古铜大外框（哥特尖拱顶 + 折角盾身） -->
    <polygon points="200,16 268,42 326,92 318,246 280,292 120,292 82,246 74,92 132,42" fill="url(#title_emblem-brass)" stroke="#1C1412" stroke-width="3.4" stroke-linejoin="round"/>
    <!-- 右侧背光暗面 -->
    <polygon points="200,16 268,42 326,92 318,246 280,292 200,292" fill="#3B2B14" opacity="0.62"/>
    <!-- 左上冷受光亮边 -->
    <path d="M77,154 L77,94 L134,45 L200,20" fill="none" stroke="#E2D6BA" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>

    <!-- 内部深色暗石与暗夜紫纹章底板 -->
    <polygon points="200,32 258,54 308,98 302,238 270,278 130,278 98,238 92,98 142,54" fill="url(#title_emblem-stone)" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <polygon points="200,42 250,62 296,102 290,232 262,268 138,268 110,232 104,102 150,62" fill="#161221" stroke="#6E542B" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- 纹章内部哥特尖拱肋线与背光排线 -->
    <path d="M106,148 L200,52 L294,148 M112,230 L200,152 L288,230" fill="none" stroke="#262036" stroke-width="2"/>
    <path d="M200,44 V266 M106,152 H294" fill="none" stroke="#262036" stroke-width="1.6"/>
    <!-- 右下背光钢笔交叉排线 -->
    <path d="M242,220 L282,260 M254,212 L290,248 M228,230 L268,270 M264,198 L294,228" stroke="#1C1412" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
    <path d="M284,224 L244,264 M288,238 L258,268" stroke="#1C1412" stroke-width="1.1" stroke-linecap="round" opacity="0.4"/>

    <!-- 顶部哥特尖冠装饰与四周铆钉 -->
    <polygon points="200,10 214,30 200,44 186,30" fill="#C2A670" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
    <polygon points="130,36 142,46 134,56 122,46" fill="#9A7B46" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
    <polygon points="270,36 278,46 266,56 258,46" fill="#6E542B" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="84" cy="96" r="3.2" fill="#C2A670" stroke="#1C1412" stroke-width="1.4"/>
    <circle cx="316" cy="96" r="3.2" fill="#9A7B46" stroke="#1C1412" stroke-width="1.4"/>
    <circle cx="90" cy="242" r="3.2" fill="#C2A670" stroke="#1C1412" stroke-width="1.4"/>
    <circle cx="310" cy="242" r="3.2" fill="#9A7B46" stroke="#1C1412" stroke-width="1.4"/>
    <circle cx="126" cy="284" r="3.2" fill="#C2A670" stroke="#1C1412" stroke-width="1.4"/>
    <circle cx="274" cy="284" r="3.2" fill="#9A7B46" stroke="#1C1412" stroke-width="1.4"/>

    <!-- 中心三叉共鸣铜轨（连接三颗大宝石） -->
    <path d="M200,164 L200,118 M200,164 L132,194 M200,164 L268,194" stroke="#6E542B" stroke-width="7" stroke-linecap="round"/>
    <path d="M200,164 L200,118 M200,164 L132,194 M200,164 L268,194" stroke="#1C1412" stroke-width="2" stroke-linecap="round"/>
    <!-- 中心哥特八角铜花结 -->
    <polygon points="200,148 212,156 216,164 212,172 200,180 188,172 184,164 188,156" fill="#9A7B46" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
    <polygon points="200,155 209,164 200,173 191,164" fill="#3B2B14" stroke="#1C1412" stroke-width="1.5"/>
    <circle cx="200" cy="164" r="3" fill="#C2A670"/>
  </g>

  <!-- 1. 上方正中：红宝石 · 圆形（中心 200,118，半径 36） -->
  <g id="gem_red">
    <!-- 八角旧铜镶座 -->
    <polygon points="183,76 217,76 242,101 242,135 217,160 183,160 158,135 158,101" fill="#3B2B14" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <polygon points="185,81 215,81 237,103 237,133 215,155 185,155 163,133 163,103" fill="#6E542B" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- 红宝石本体 -->
    <polygon points="200,82 218,86 231,99 236,118 231,137 218,150 200,154 182,150 169,137 164,118 169,99 182,86" fill="#E3263A"/>
    <!-- 左上受光亮刻面 -->
    <polygon points="200,82 218,86 209,98 191,98 182,86" fill="#FF5C6E"/>
    <polygon points="182,86 191,98 179,110 169,99" fill="#FF5C6E"/>
    <polygon points="169,99 179,110 179,126 164,118" fill="#E3263A"/>
    <!-- 右下背光深暗刻面 -->
    <polygon points="218,86 231,99 221,110 209,98" fill="#E3263A"/>
    <polygon points="231,99 236,118 221,126 221,110" fill="#9E1424"/>
    <polygon points="236,118 231,137 218,150 209,138 221,126" fill="#5C0A14"/>
    <polygon points="209,138 218,150 200,154 182,150 191,138" fill="#9E1424"/>
    <polygon points="182,150 169,137 164,118 179,126 191,138" fill="#9E1424" opacity="0.85"/>
    <!-- 中央八角台面 -->
    <polygon points="191,98 209,98 221,110 221,126 209,138 191,138 179,126 179,110" fill="#E3263A" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- 刻面分界线 -->
    <path d="M200,82 V98 M218,86 L209,98 M231,99 L221,110 M236,118 H221 M231,137 L221,126 M218,150 L209,138 M200,154 V138 M182,150 L191,138 M169,137 L179,126 M164,118 H179 M169,99 L179,110 M182,86 L191,98" stroke="#1C1412" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- 台面常驻高光 -->
    <polygon points="184,108 193,101 205,101 191,116" fill="#E6DEC8" opacity="0.92"/>
    <circle cx="183" cy="96" r="3" fill="#FFFFFF" opacity="0.95"/>
    <!-- 宝石粗外框 -->
    <polygon points="200,82 218,86 231,99 236,118 231,137 218,150 200,154 182,150 169,137 164,118 169,99 182,86" fill="none" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <!-- 四个包边铜爪 -->
    <polygon points="196,74 204,74 202,85 198,85" fill="#C2A670" stroke="#1C1412" stroke-width="1.5"/>
    <polygon points="196,162 204,162 202,151 198,151" fill="#9A7B46" stroke="#1C1412" stroke-width="1.5"/>
    <polygon points="156,114 156,122 167,120 167,116" fill="#C2A670" stroke="#1C1412" stroke-width="1.5"/>
    <polygon points="244,114 244,122 233,120 233,116" fill="#9A7B46" stroke="#1C1412" stroke-width="1.5"/>
  </g>

  <!-- 2. 左下：绿宝石 · 方形（中心 132,194，宽 64） -->
  <g id="gem_green">
    <!-- 方形旧铜镶座 -->
    <polygon points="98,156 166,156 170,160 170,228 166,232 98,232 94,228 94,160" fill="#3B2B14" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <!-- 绿宝石本体 -->
    <polygon points="106,162 158,162 164,168 164,220 158,226 106,226 100,220 100,168" fill="#1DBF5E"/>
    <!-- 左上受光阶梯刻面 -->
    <polygon points="106,162 158,162 151,171 113,171" fill="#5CE892"/>
    <polygon points="100,168 106,162 113,171 109,175 109,213 100,220" fill="#5CE892"/>
    <!-- 右下背光阶梯刻面 -->
    <polygon points="158,162 164,168 164,220 155,213 155,175 151,171" fill="#117A3B"/>
    <polygon points="109,213 113,217 151,217 155,213 164,220 158,226 106,226 100,220" fill="#094722"/>
    <!-- 中央方形台面 -->
    <rect x="115" y="177" width="34" height="34" rx="2" fill="#1DBF5E" stroke="#1C1412" stroke-width="1.6"/>
    <!-- 阶梯刻面线 -->
    <path d="M113,171 H151 L155,175 V213 L151,217 H113 L109,213 V175 Z M106,162 L115,177 M158,162 L149,177 M164,168 L149,177 M164,220 L149,211 M158,226 L149,211 M106,226 L115,211 M100,220 L115,211 M100,168 L115,177" fill="none" stroke="#1C1412" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- 台面常驻高光 -->
    <polygon points="118,180 136,180 126,193 118,193" fill="#E6DEC8" opacity="0.92"/>
    <rect x="111" y="165" width="9" height="4" rx="1" fill="#FFFFFF" opacity="0.92"/>
    <!-- 宝石粗外框 -->
    <polygon points="106,162 158,162 164,168 164,220 158,226 106,226 100,220 100,168" fill="none" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <!-- 四角铜爪 -->
    <polygon points="94,156 104,156 100,166 94,164" fill="#C2A670" stroke="#1C1412" stroke-width="1.5"/>
    <polygon points="170,156 160,156 164,166 170,164" fill="#9A7B46" stroke="#1C1412" stroke-width="1.5"/>
    <polygon points="94,232 104,232 100,222 94,224" fill="#9A7B46" stroke="#1C1412" stroke-width="1.5"/>
    <polygon points="170,232 160,232 164,222 170,224" fill="#9A7B46" stroke="#1C1412" stroke-width="1.5"/>
  </g>

  <!-- 3. 右下：蓝宝石 · 三角形（中心 268,194） -->
  <g id="gem_blue">
    <!-- 三角旧铜镶座 -->
    <polygon points="264,148 272,148 312,222 306,230 230,230 224,222" fill="#3B2B14" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <!-- 蓝宝石本体 -->
    <polygon points="265,154 271,154 304,216 300,222 236,222 232,216" fill="#2E66F0"/>
    <!-- 左侧受光斜刻面 -->
    <polygon points="265,154 268,171 249,207 232,216" fill="#6B9BFF"/>
    <polygon points="265,154 271,154 268,171" fill="#6B9BFF"/>
    <!-- 右侧与底部背光暗面 -->
    <polygon points="271,154 304,216 287,207 268,171" fill="#193D9E"/>
    <polygon points="249,207 287,207 300,222 236,222" fill="#0D2159"/>
    <!-- 中央三角台面 -->
    <polygon points="268,171 287,207 249,207" fill="#2E66F0" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- 刻面分界线 -->
    <path d="M265,154 L268,171 L271,154 M232,216 L249,207 L236,222 M304,216 L287,207 L300,222 M268,207 V222" fill="none" stroke="#1C1412" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- 台面常驻高光 -->
    <polygon points="267,176 273,188 259,192" fill="#E6DEC8" opacity="0.92"/>
    <circle cx="258" cy="175" r="2.5" fill="#FFFFFF" opacity="0.95"/>
    <!-- 宝石粗外框 -->
    <polygon points="265,154 271,154 304,216 300,222 236,222 232,216" fill="none" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <!-- 三角铜爪 -->
    <polygon points="263,146 273,146 271,156 265,156" fill="#C2A670" stroke="#1C1412" stroke-width="1.5"/>
    <polygon points="224,224 234,216 236,226 226,228" fill="#C2A670" stroke="#1C1412" stroke-width="1.5"/>
    <polygon points="312,224 302,216 300,226 310,228" fill="#9A7B46" stroke="#1C1412" stroke-width="1.5"/>
  </g>

  <!-- 牌匾下半部哥特饰带横档（深色干净无字，供代码叠加标题或独立展示） -->
  <g id="plaque_band">
    <polygon points="88,242 312,242 320,256 312,272 88,272 80,256" fill="#262036" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <rect x="96" y="247" width="208" height="20" rx="2" fill="#161221" stroke="#6E542B" stroke-width="1.4"/>
    <polygon points="80,256 92,244 92,268" fill="#9A7B46" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round"/>
    <polygon points="320,256 308,244 308,268" fill="#6E542B" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round"/>
    <polygon points="200,238 208,246 200,254 192,246" fill="#9A7B46" stroke="#1C1412" stroke-width="1.6"/>
  </g>

  <!-- 待机轮流闪烁的 3 个光效组（默认 opacity="0" 写在元素本身上） -->
  <g id="glint_red" opacity="0"><!-- pivot: 200,118 -->
    <polygon points="191,98 209,98 221,110 221,126 209,138 191,138 179,126 179,110" fill="#FFD6DC" opacity="0.6"/>
    <path d="M216,84 L220,96 L232,100 L220,104 L216,116 L212,104 L200,100 L212,96 Z" fill="#FFFFFF" stroke="#1C1412" stroke-width="1.3" stroke-linejoin="round"/>
  </g>
  <g id="glint_green" opacity="0"><!-- pivot: 132,194 -->
    <rect x="115" y="177" width="34" height="34" rx="2" fill="#5CE892" opacity="0.55"/>
    <path d="M150,162 L154,174 L166,178 L154,182 L150,194 L146,182 L134,178 L146,174 Z" fill="#FFFFFF" stroke="#1C1412" stroke-width="1.3" stroke-linejoin="round"/>
  </g>
  <g id="glint_blue" opacity="0"><!-- pivot: 268,194 -->
    <polygon points="268,171 287,207 249,207" fill="#6B9BFF" opacity="0.6"/>
    <path d="M282,164 L286,176 L298,180 L286,184 L282,196 L278,184 L266,180 L278,176 Z" fill="#FFFFFF" stroke="#1C1412" stroke-width="1.3" stroke-linejoin="round"/>
  </g>
</g>
</svg>
