<svg xmlns="http://www.w3.org/2000/svg" class="svg-npc_knocker" viewBox="0 0 240 240" width="240" height="240">
<title>老门环</title>
<style>
.svg-npc_knocker g { transform-box: view-box; }
.svg-npc_knocker #root { transform-origin: 120px 120px; }
.svg-npc_knocker #plate { transform-origin: 120px 112px; }
.svg-npc_knocker #face { transform-origin: 120px 104px; }
.svg-npc_knocker #brows { transform-origin: 120px 72px; }
.svg-npc_knocker #eyes { transform-origin: 120px 88px; }
.svg-npc_knocker #mouth { transform-origin: 120px 134px; }
.svg-npc_knocker #ring { transform-origin: 120px 132px; }

/* 待机 idle（两轮 3000ms 合成 6000ms 循环）：
   0ms(0%) 铜环在左 -4° -> 1500ms(25%) 铜环在右 +4° 且眨一次眼 -> 3000ms(50%) 回到左 -4° -> 4500ms(75%) 铜环在右 +4°（不眨眼） -> 6000ms(100%) 回到左 -4°
   同一动作所有部件（#ring 与 #eyes）严格共用同一组百分比：0%, 22.5%, 25%, 27.5%, 50%, 75%, 100% */
@keyframes svg-npc_knocker-idle-ring {
  0% {
    transform: rotate(-4deg);
    animation-timing-function: ease-in-out;
  }
  22.5% {
    transform: rotate(3.7deg);
    animation-timing-function: ease-in-out;
  }
  25% {
    transform: rotate(4deg);
    animation-timing-function: ease-in-out;
  }
  27.5% {
    transform: rotate(3.7deg);
    animation-timing-function: ease-in-out;
  }
  50% {
    transform: rotate(-4deg);
    animation-timing-function: ease-in-out;
  }
  75% {
    transform: rotate(4deg);
    animation-timing-function: ease-in-out;
  }
  100% {
    transform: rotate(-4deg);
  }
}
@keyframes svg-npc_knocker-idle-eyes {
  0% {
    transform: scaleY(1);
    animation-timing-function: linear;
  }
  22.5% {
    transform: scaleY(1);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  25% {
    transform: scaleY(0.08);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  27.5% {
    transform: scaleY(1);
    animation-timing-function: linear;
  }
  50% {
    transform: scaleY(1);
    animation-timing-function: linear;
  }
  75% {
    transform: scaleY(1);
    animation-timing-function: linear;
  }
  100% {
    transform: scaleY(1);
  }
}
.svg-npc_knocker:not([data-anim]) #ring,
.svg-npc_knocker[data-anim="idle"] #ring {
  animation: svg-npc_knocker-idle-ring 6s infinite;
}
.svg-npc_knocker:not([data-anim]) #eyes,
.svg-npc_knocker[data-anim="idle"] #eyes {
  animation: svg-npc_knocker-idle-eyes 6s infinite;
}

/* talk（1200ms）：
   0ms(0%) 待机 -> 150ms(12.5%) 嘴张开(下巴下移16px>=14px)、铜环被带起来(上移12px>=10px)、眉毛挑起
   -> 300ms(25%) 合上 -> 450ms(37.5%) 张 -> 600ms(50%) 合 -> 750ms(62.5%) 张 -> 900ms(75%) 合 -> 1050ms(87.5%) 小张 -> 1200ms(100%) 回到待机 */
@keyframes svg-npc_knocker-talk-mouth {
  0% {
    transform: translateY(0px);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  12.5% {
    transform: translateY(16px);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  25% {
    transform: translateY(0px);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  37.5% {
    transform: translateY(15px);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  50% {
    transform: translateY(0px);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  62.5% {
    transform: translateY(16px);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  75% {
    transform: translateY(0px);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  87.5% {
    transform: translateY(10px);
    animation-timing-function: cubic-bezier(.34,1.56,.64,1);
  }
  100% {
    transform: translateY(0px);
  }
}
@keyframes svg-npc_knocker-talk-ring {
  0% {
    transform: translateY(0px) rotate(-4deg);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  12.5% {
    transform: translateY(-12px) rotate(2deg);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  25% {
    transform: translateY(1px) rotate(-2deg);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  37.5% {
    transform: translateY(-11px) rotate(-3deg);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  50% {
    transform: translateY(1px) rotate(1deg);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  62.5% {
    transform: translateY(-12px) rotate(3deg);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  75% {
    transform: translateY(1px) rotate(-1deg);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  87.5% {
    transform: translateY(-8px) rotate(1.5deg);
    animation-timing-function: cubic-bezier(.34,1.56,.64,1);
  }
  100% {
    transform: translateY(0px) rotate(-4deg);
  }
}
@keyframes svg-npc_knocker-talk-brows {
  0% {
    transform: translateY(0px) rotate(0deg);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  12.5% {
    transform: translateY(-7px) rotate(-2.5deg);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  25% {
    transform: translateY(-1px) rotate(0deg);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  37.5% {
    transform: translateY(-6px) rotate(2deg);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  50% {
    transform: translateY(-1px) rotate(0deg);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  62.5% {
    transform: translateY(-7px) rotate(-2deg);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  75% {
    transform: translateY(0px) rotate(0deg);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  87.5% {
    transform: translateY(-4px) rotate(-1deg);
    animation-timing-function: cubic-bezier(.34,1.56,.64,1);
  }
  100% {
    transform: translateY(0px) rotate(0deg);
  }
}
.svg-npc_knocker[data-anim="talk"] #mouth {
  animation: svg-npc_knocker-talk-mouth 1.2s both;
}
.svg-npc_knocker[data-anim="talk"] #ring {
  animation: svg-npc_knocker-talk-ring 1.2s both;
}
.svg-npc_knocker[data-anim="talk"] #brows {
  animation: svg-npc_knocker-talk-brows 1.2s both;
}
</style>
<g id="root">
  <!-- 中心 anchor: 120,120 -->
  <!-- 1. 圆形旧铜底板 plate（略带哥特十二边形折角与铆钉，范围 x:22..218, y:14..210） -->
  <g id="plate">
    <!-- 底板背影 -->
    <circle cx="122" cy="116" r="94" fill="#0D111C" opacity="0.65"/>
    <!-- 外层折角铜圆盘（压暗旧古铜 #6E542B + 右下深暗部 #3B2B14） -->
    <polygon points="120,16 168,28 202,62 214,110 202,158 168,192 120,204 72,192 38,158 26,110 38,62 72,28" fill="#6E542B" stroke="#1C1412" stroke-width="3.4" stroke-linejoin="round"/>
    <!-- 右下背光暗面 -->
    <polygon points="120,16 168,28 202,62 214,110 202,158 168,192 120,204 120,110" fill="#3B2B14" opacity="0.72"/>
    <!-- 左上受光冷铜边高光 -->
    <polyline points="42,152 30,110 42,64 74,32 120,20 162,31" fill="none" stroke="#C2A670" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>

    <!-- 内层凹陷铜盘与交叉排线暗影 -->
    <circle cx="120" cy="110" r="76" fill="#3B2B14" stroke="#1C1412" stroke-width="2.8"/>
    <path d="M58,154 L84,180 M72,164 L98,190 M152,160 L180,188 M164,148 L190,174 M172,134 L196,158" stroke="#1C1412" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>

    <!-- 底板四周 6 颗粗铆钉 -->
    <g fill="#9A7B46" stroke="#1C1412" stroke-width="2">
      <circle cx="120" cy="27" r="4.5" fill="#C2A670"/>
      <circle cx="48" cy="68" r="4.5" fill="#C2A670"/>
      <circle cx="192" cy="68" r="4.5"/>
      <circle cx="48" cy="152" r="4.5"/>
      <circle cx="192" cy="152" r="4.5" fill="#3B2B14"/>
      <circle cx="120" cy="193" r="4.5" fill="#3B2B14"/>
    </g>
  </g>

  <!-- 2. 嘴里叼着的大铜环 ring（放在下巴后方、底板前方，上沿深入嘴腔 y=126，张嘴与晃动绝不露缝） -->
  <g id="ring">
    <!-- 铜环投在底板与下巴下的暗影 -->
    <ellipse cx="120" cy="222" rx="52" ry="8" fill="#0D111C" opacity="0.55"/>
    <!-- 大铜环主体（粗壮微不对称哥特古铜环，垂在下巴下面，底沿到 y=224，严格在 240 画框内） -->
    <path d="M76,128 C52,142 48,184 74,208 C96,226 144,226 166,208 C192,184 188,142 164,128 L148,136 C166,148 168,178 150,194 C134,208 106,208 90,194 C72,178 74,148 92,136 Z" fill="#9A7B46" stroke="#1C1412" stroke-width="3.4" stroke-linejoin="round"/>
    <!-- 铜环右侧与内沿背光暗面 -->
    <path d="M120,221 C140,221 156,216 166,208 C192,184 188,142 164,128 L148,136 C166,148 168,178 150,194 C142,201 131,205 120,205 Z" fill="#6E542B" opacity="0.85"/>
    <!-- 铜环底部最厚处卡箍浮雕 -->
    <polygon points="106,201 134,201 138,224 102,224" fill="#6E542B" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <polygon points="120,201 134,201 138,224 120,224" fill="#3B2B14" opacity="0.75"/>
    <line x1="106" y1="205" x2="132" y2="205" stroke="#C2A670" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 铜环左上冷受光高光弧 -->
    <path d="M74,134 C58,148 56,178 74,198" fill="none" stroke="#C2A670" stroke-width="2.4" stroke-linecap="round" opacity="0.88"/>
    <!-- 铜环穿过嘴腔的上沿横梁（嘴张开时完整露出） -->
    <rect x="78" y="122" width="84" height="14" rx="5" fill="#6E542B" stroke="#1C1412" stroke-width="2.8"/>
    <line x1="84" y1="126" x2="154" y2="126" stroke="#C2A670" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- 3. 嘴部组件 mouth（含嘴腔深暗底与可大幅张合的下巴，张开 >=16px 时内部完整不露缝） -->
  <!-- 注意：固定嘴腔深底放在 face 下沿，活动下颚放在 #mouth 内，或将加高上延的深色嘴腔放在 #mouth 顶部随下巴移动 -->
  <g id="mouth">
    <!-- 随下颚一起移动的深渊嘴腔背景（向上延伸至 y=104，平时被上唇盖住，下移 16px 时完整露出暗色嘴腔与上牙、铜环上沿） -->
    <path d="M78,106 H162 V144 Q120,158 78,144 Z" fill="#0D111C" stroke="#1C1412" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- 嘴腔内含着的铜环横杆与暗红舌影（增加张嘴细节层次） -->
    <rect x="86" y="116" width="68" height="10" rx="4" fill="#3B2B14" stroke="#1C1412" stroke-width="2"/>
    <line x1="92" y1="119" x2="148" y2="119" stroke="#9A7B46" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 下牙（两颗歪斜旧铜门牙） -->
    <polygon points="94,136 106,136 104,126 96,126" fill="#C8B894" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="134,136 146,136 144,126 136,126" fill="#9A8968" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>

    <!-- 厚重铜下巴与翘山羊胡主体 -->
    <path d="M72,132 Q120,142 168,132 L162,158 Q144,174 120,176 Q96,174 78,158 Z" fill="#9A7B46" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
    <!-- 下巴右侧暗面 -->
    <path d="M120,137 Q144,137 168,132 L162,158 Q144,174 120,176 Z" fill="#6E542B" opacity="0.82"/>
    <!-- 下唇受光高光边 -->
    <path d="M76,135 Q120,144 162,135" fill="none" stroke="#C2A670" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 铜雕山羊胡纹理 -->
    <path d="M104,152 L100,172 M120,154 L120,175 M136,152 L140,172" stroke="#1C1412" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- 4. 老头脸主体 face（宽大铜脸、高颧骨、八字胡、大圆鼻、粗眉毛） -->
  <g id="face">
    <!-- 脸颊与额头主体（微不对称诡萌老头轮廓，五官粗大） -->
    <path d="M64,58 L88,42 L152,44 L176,60 L184,96 L176,130 L152,138 L88,138 L64,128 L56,94 Z" fill="#9A7B46" stroke="#1C1412" stroke-width="3.4" stroke-linejoin="round"/>
    <!-- 右半脸背光暗面 -->
    <path d="M120,43 L152,44 L176,60 L184,96 L176,130 L152,138 L120,138 Z" fill="#6E542B" opacity="0.78"/>
    <!-- 左额与左颧骨受光亮边 -->
    <polyline points="62,122 59,94 67,60 90,46 126,46" fill="none" stroke="#C2A670" stroke-width="2.4" stroke-linecap="round"/>

    <!-- 左右高颧骨涡卷与法令纹 -->
    <path d="M64,104 Q74,96 84,106 Q80,118 68,116" fill="none" stroke="#1C1412" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M176,104 Q166,96 156,106 Q160,118 172,116" fill="none" stroke="#1C1412" stroke-width="2.4" stroke-linecap="round"/>

    <!-- 上唇翘八字铜胡子（盖住嘴腔上沿，带一点欠欠的坏笑弧度） -->
    <path d="M58,132 Q84,114 120,126 Q156,114 182,132 Q164,144 138,136 Q120,132 102,136 Q76,144 58,132 Z" fill="#6E542B" stroke="#1C1412" stroke-width="3" stroke-linejoin="round"/>
    <path d="M64,130 Q86,119 116,127" fill="none" stroke="#C2A670" stroke-width="2" stroke-linecap="round"/>
    <path d="M120,126 Q156,114 182,132 Q164,144 138,136 Q128,133 120,133 Z" fill="#3B2B14" opacity="0.75"/>

    <!-- 5. 两只小眼睛 eyes（深陷眼窝 + 羊皮纸眼白 + 全图唯一鲜艳的绿宝石亮瞳） -->
    <g id="eyes">
      <!-- 左眼（略大，透着精明算计） -->
      <ellipse cx="90" cy="88" rx="16" ry="13" fill="#161221" stroke="#1C1412" stroke-width="2.8"/>
      <ellipse cx="90" cy="88" rx="12" ry="9.5" fill="#C8B894" stroke="#1C1412" stroke-width="2"/>
      <!-- 左眼绿宝石瞳孔（唯一鲜艳色 #1DBF5E + #5CE892） -->
      <circle cx="92" cy="88" r="5.5" fill="#1DBF5E" stroke="#1C1412" stroke-width="1.8"/>
      <circle cx="90.5" cy="86.5" r="2" fill="#5CE892"/>
      <circle cx="89.5" cy="85.5" r="1" fill="#FFFFFF"/>

      <!-- 右眼（半眯略小，不对称诡萌感） -->
      <ellipse cx="150" cy="89" rx="15" ry="11.5" fill="#161221" stroke="#1C1412" stroke-width="2.8"/>
      <ellipse cx="150" cy="89" rx="11" ry="8" fill="#9A8968" stroke="#1C1412" stroke-width="2"/>
      <!-- 右眼绿宝石瞳孔（唯一鲜艳色 #1DBF5E + #5CE892） -->
      <circle cx="148" cy="89" r="5.2" fill="#1DBF5E" stroke="#1C1412" stroke-width="1.8"/>
      <circle cx="146.5" cy="87.5" r="1.9" fill="#5CE892"/>
      <circle cx="145.5" cy="86.5" r="0.9" fill="#FFFFFF"/>
    </g>

    <!-- 正中大圆铜鼻子（压在眼间与上唇之间，立体饱满） -->
    <g id="nose">
      <path d="M110,78 L100,104 C98,116 108,124 120,124 C132,124 142,116 140,104 L130,78 Z" fill="#9A7B46" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M120,78 L130,78 L140,104 C142,116 132,124 120,124 Z" fill="#6E542B" opacity="0.8"/>
      <!-- 鼻梁与圆鼻头高光 -->
      <path d="M113,82 L105,104 C104,111 110,117 117,117" fill="none" stroke="#C2A670" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="113" cy="108" r="4.5" fill="#C2A670" opacity="0.85"/>
    </g>

    <!-- 粗眉毛 brows（一高一低，爱打赌的狡黠神态，talk 时一起挑眉） -->
    <g id="brows">
      <!-- 左粗眉（高挑） -->
      <polygon points="62,74 74,58 112,68 108,79 74,72" fill="#6E542B" stroke="#1C1412" stroke-width="3" stroke-linejoin="round"/>
      <polyline points="66,71 75,61 108,69" fill="none" stroke="#C2A670" stroke-width="2" stroke-linecap="round"/>
      <!-- 右粗眉（微压带折角） -->
      <polygon points="128,70 166,62 178,76 166,75 132,80" fill="#3B2B14" stroke="#1C1412" stroke-width="3" stroke-linejoin="round"/>
      <polyline points="131,72 165,65 174,73" fill="none" stroke="#9A7B46" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>
</g>
</svg>
