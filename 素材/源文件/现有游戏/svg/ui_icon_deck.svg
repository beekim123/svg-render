      <polygon points="28,22 34,31 28,40 22,31" fill="#9A7B46" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="27" cy="29" r="2" fill="#E6DEC8"/>
      <path d="M14,46 V12 H38" fill="none" stroke="#62577D" stroke-width="1.6" stroke-linecap="round"/>
    </g>
