<svg xmlns="http://www.w3.org/2000/svg" class="svg-relic_grow" viewBox="0 0 96 96" width="96" height="96">
<title>宝物 · 宝石长得快</title>
<g id="root">
  <!-- 锉刀锉下的一缕亮晶晶宝石粉与四角星芒（鲜艳青/红/绿/蓝晶屑飘落，右下区域） -->
  <g id="gem_dust">
    <!-- 飘落的鲜艳宝石碎粉晶粒 -->
    <polygon points="56,48 60,55 67,58 60,61 56,68 52,61 45,58 52,55" fill="#3FE3F0" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="72" cy="48" r="5" fill="#E3263A" stroke="#1C1412" stroke-width="2.2"/>
    <circle cx="70.5" cy="46.5" r="1.8" fill="#FFFFFF"/>
    <rect x="64" y="64" width="10" height="10" rx="2" fill="#1DBF5E" stroke="#1C1412" stroke-width="2.2" transform="rotate(18 69 69)"/>
    <polygon points="48,70 55,82 41,82" fill="#2E66F0" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
    <polygon points="80,58 83,64 89,67 83,70 80,76 77,70 71,67 77,64" fill="#FFD84A" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="58" cy="78" r="3.5" fill="#FFFFFF" stroke="#1C1412" stroke-width="1.8"/>
    <circle cx="74" cy="82" r="3" fill="#3FE3F0" stroke="#1C1412" stroke-width="1.8"/>
  </g>

  <!-- 斜置的小铜锉刀（左上钢锉刀身 -> 右下旧铜木柄，简化粗轮廓） -->
  <g id="brass_file">
    <!-- 钢锉刀身（冷铁灰青 #5A7682 + 暗面 #3B515C + 粗十字锉纹） -->
    <polygon points="10,16 20,10 56,46 46,56" fill="#5A7682" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
    <polygon points="15,13 20,10 56,46 51,51" fill="#3B515C"/>
    <line x1="13" y1="17" x2="45" y2="49" stroke="#8CAAB5" stroke-width="2" stroke-linecap="round"/>
    <!-- 简化的粗锉齿斜线 -->
    <path d="M20,24 L28,16 M28,32 L36,24 M36,40 L44,32 M44,48 L52,40" stroke="#1C1412" stroke-width="2.4" stroke-linecap="round"/>
    <polygon points="10,16 20,10 56,46 46,56" fill="none" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>

    <!-- 旧铜护格箍环 -->
    <polygon points="44,58 58,44 64,50 50,64" fill="#C2A670" stroke="#1C1412" stroke-width="3" stroke-linejoin="round"/>

    <!-- 旧铜手柄 -->
    <path d="M52,62 L62,52 L84,74 C88,78 86,84 82,86 C78,88 72,86 68,82 Z" fill="#9A7B46" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M57,57 L62,52 L84,74 C88,78 86,84 82,86 Z" fill="#6E542B" opacity="0.82"/>
    <circle cx="77" cy="77" r="3" fill="#1C1412"/>
    <path d="M52,62 L62,52 L84,74 C88,78 86,84 82,86 C78,88 72,86 68,82 Z" fill="none" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
  </g>
</g>
</svg>
