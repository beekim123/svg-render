<svg xmlns="http://www.w3.org/2000/svg" class="svg-gem_blue_cut" viewBox="0 0 100 100" width="100" height="100">
<title>蓝宝石 · 切好</title>
<style>
.svg-gem_blue_cut g { transform-box: view-box; }
.svg-gem_blue_cut #root { transform-origin: 50px 50px; }
.svg-gem_blue_cut #sweep_wrap { opacity: 0; }
.svg-gem_blue_cut #sweep_band { transform-origin: 50px 50px; }
.svg-gem_blue_cut #glint_star { transform-origin: 62px 38px; opacity: 0; }

/* 待机（4.2s 循环）：一道光从刻面上斜着扫过，同时一颗小四角星闪一下；动画关闭时保持原貌 */
@keyframes svg-gem_blue_cut-sweep-wrap {
  0%, 14%, 46%, 100% { opacity: 0; }
  20%, 38% { opacity: 1; }
}
@keyframes svg-gem_blue_cut-sweep-band {
  0%, 14% { transform: translate(-54px, -54px); }
  44%, 100% { transform: translate(54px, 54px); }
}
@keyframes svg-gem_blue_cut-glint-star {
  0%, 22%, 50%, 100% { opacity: 0; transform: scale(0.35) rotate(-15deg); }
  30% { opacity: 1; transform: scale(1.08) rotate(0deg); }
  38% { opacity: 0.92; transform: scale(0.95) rotate(8deg); }
}
.svg-gem_blue_cut:not([data-anim]) #sweep_wrap,
.svg-gem_blue_cut[data-anim="idle"] #sweep_wrap {
  animation: svg-gem_blue_cut-sweep-wrap 4.2s linear infinite;
}
.svg-gem_blue_cut:not([data-anim]) #sweep_band,
.svg-gem_blue_cut[data-anim="idle"] #sweep_band {
  animation: svg-gem_blue_cut-sweep-band 4.2s steps(10, end) infinite;
}
.svg-gem_blue_cut:not([data-anim]) #glint_star,
.svg-gem_blue_cut[data-anim="idle"] #glint_star {
  animation: svg-gem_blue_cut-glint-star 4.2s steps(8, end) infinite;
}
</style>
<defs>
<linearGradient id="gem_blue_cut-base" x1="15%" y1="10%" x2="85%" y2="90%">
        <stop offset="0%" stop-color="#2E66F0"/>
        <stop offset="55%" stop-color="#2E66F0"/>
        <stop offset="100%" stop-color="#193D9E"/>
      </linearGradient>
  <clipPath id="gem_blue_cut-clip">
    <path d="M47,12 L53,12 L88,78 L84,84 L16,84 L12,78 Z"/>
  </clipPath>
</defs>
<g id="root">
  <!-- pivot: 50,50 -->
<!-- 宝石底色 -->
        <path d="M47,12 L53,12 L88,78 L84,84 L16,84 L12,78 Z" fill="url(#gem_blue_cut-base)"/>
        <!-- 左侧受光斜刻面 -->
        <polygon points="47,12 50,30 30,68 12,78" fill="#6B9BFF"/>
        <polygon points="47,12 53,12 50,30" fill="#6B9BFF"/>
        <!-- 右侧背光斜刻面 -->
        <polygon points="53,12 88,78 70,68 50,30" fill="#193D9E"/>
        <!-- 底部暗刻面 -->
        <polygon points="30,68 70,68 84,84 16,84" fill="#0D2159"/>
        <polygon points="12,78 30,68 16,84" fill="#193D9E"/>
        <polygon points="88,78 84,84 70,68" fill="#0D2159"/>
        <!-- 中央三角台面 -->
        <path d="M50,30 L70,68 L30,68 Z" fill="#2E66F0"/>
        
        <!-- 亭部内部折射刻面线 -->
        <path d="M50,30 L50,68 M30,68 L60,49 M70,68 L40,49" stroke="#193D9E" stroke-width="1.2" opacity="0.4"/>

  <!-- 斜向刻面扫光（平时 opacity="0"，裁剪在宝石轮廓内） -->
  <g id="sweep_wrap" clip-path="url(#gem_blue_cut-clip)" opacity="0">
    <g id="sweep_band"><!-- pivot: 50,50 -->
      <polygon points="10,74 74,10 88,24 24,88" fill="#D9E6FF" opacity="0.42"/>
      <polygon points="16,78 78,16 84,22 22,84" fill="#FFFFFF" opacity="0.82"/>
    </g>
  </g>

        <!-- 冠部刻面分界线 -->
        <path d="M50,30 L70,68 L30,68 Z M47,12 L50,30 L53,12 M12,78 L30,68 L16,84 M88,78 L70,68 L84,84 M30,45 L40,49 M70,45 L60,49 M50,68 L50,84" fill="none" stroke="#1C1412" stroke-width="1.5" stroke-linejoin="round"/>
        <!-- 台面高光 -->
        <polygon points="49,35 55,48 41,52" fill="#E6DEC8" opacity="0.92"/>
        <circle cx="40" cy="34" r="2.5" fill="#FFFFFF" opacity="0.95"/>
        <!-- 手绘双层哥特外框 -->
        <path d="M47,12 L53,12 L88,78 L84,84 L16,84 L12,78 Z" fill="none" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
        <path d="M46.6,11.6 L53.4,11.8 L88.4,78.2 L83.8,84.4 L16.2,84.2 L11.6,77.6 Z" fill="none" stroke="#1C1412" stroke-width="1.5" stroke-linejoin="round" opacity="0.65"/>

  <!-- 扫光时闪一下的小四角星（平时 opacity="0"，动画关闭时不显示） -->
  <g id="glint_star" opacity="0"><!-- pivot: 62,38 -->
    <path d="M62,29 L64.4,35.6 L71,38 L64.4,40.4 L62,47 L59.6,40.4 L53,38 L59.6,35.6 Z" fill="#FFFFFF" stroke="#1C1412" stroke-width="1.1" stroke-linejoin="round"/>
  </g>
</g>
</svg>
