<svg xmlns="http://www.w3.org/2000/svg" class="svg-ui_reward_shop" viewBox="0 0 64 64" width="64" height="64">
<title>奖励图标 · 工坊</title>
<g id="root">
  <!-- 1. 下层：旧剪刀（左上张开双刃，右下双圆铜环手柄，代表「扔牌/裁牌」） -->
  <g id="scissors">
    <!-- 剪刀竖向刀刃（冷铁灰青 + 亮刃边） -->
    <polygon points="15,8 23,11 34,36 27,38" fill="#5A7682" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <polyline points="16.5,10 21.5,12 31,34" fill="none" stroke="#8CAAB5" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 剪刀横向刀刃（张开呈明显 V 字剪影） -->
    <polygon points="8,19 12,12 37,27 34,34" fill="#3B515C" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <polyline points="10,18 12.5,14 34,27" fill="none" stroke="#8CAAB5" stroke-width="1.6" stroke-linecap="round"/>

    <!-- 剪刀两根旧铜柄杆 -->
    <path d="M30,33 L42,46 M33,29 L48,38" fill="none" stroke="#1C1412" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M30,33 L42,46 M33,29 L48,38" fill="none" stroke="#9A7B46" stroke-width="3" stroke-linecap="round"/>

    <!-- 左下旧铜指环 -->
    <circle cx="43" cy="50" r="7.5" fill="none" stroke="#1C1412" stroke-width="6.8"/>
    <circle cx="43" cy="50" r="7.5" fill="none" stroke="#9A7B46" stroke-width="3.2"/>
    <path d="M38,45 A7.5,7.5 0 0,1 48,45" fill="none" stroke="#C2A670" stroke-width="1.4" stroke-linecap="round"/>

    <!-- 右上旧铜指环 -->
    <circle cx="51" cy="39" r="7.2" fill="none" stroke="#1C1412" stroke-width="6.8"/>
    <circle cx="51" cy="39" r="7.2" fill="none" stroke="#6E542B" stroke-width="3.2"/>
    <path d="M46,34 A7.2,7.2 0 0,1 55,34" fill="none" stroke="#C2A670" stroke-width="1.4" stroke-linecap="round"/>

    <!-- 剪刀交叉轴心铜铆钉 -->
    <circle cx="30" cy="31" r="3.4" fill="#C2A670" stroke="#1C1412" stroke-width="2"/>
  </g>

  <!-- 2. 上层：交叉的羽毛笔（右上宽大白羽翎 -> 左下金属蘸墨笔尖，代表「抄牌」） -->
  <g id="quill">
    <!-- 宽大旧羊皮纸羽毛翎（带 2 处分叉缺口，粗轮廓，1 层暗面） -->
    <path d="M55,8 C42,8 30,15 23,29 L28,34 C41,28 53,19 55,8 Z" fill="#E6DEC8" stroke="#1C1412" stroke-width="3" stroke-linejoin="round"/>
    <!-- 羽翎右下背光暗面（带一处三角羽毛缺口特征） -->
    <path d="M55,8 C50,15 44,21 38,25 L42,20 L34,28 C32,30 30,32 28,34 L25.5,31.5 L55,8 Z" fill="#9A8968"/>
    <!-- 羽翎左上受光高光边 -->
    <path d="M52,9.5 C41,10.5 31,16.5 25,28" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 羽翎外框重描（加入一处明显羽毛分叉缺口） -->
    <path d="M55,8 C45,8 36,12 31,19 L35,19 L28,24 C25,26 24,28 23,29 L28,34 C35,31 42,27 47,21 L43,21 L50,16 C53,13 54,10 55,8 Z" fill="#E6DEC8" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M55,8 C54,10 53,13 50,16 L43,21 L47,21 C42,27 35,31 28,34 L25.5,31.5 L55,8 Z" fill="#9A8968"/>
    <path d="M55,8 C45,8 36,12 31,19 L35,19 L28,24 C25,26 24,28 23,29 L28,34 C35,31 42,27 47,21 L43,21 L50,16 C53,13 54,10 55,8 Z" fill="none" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>

    <!-- 中央羽管轴线 -->
    <path d="M53,10 L21,42" fill="none" stroke="#1C1412" stroke-width="2.4" stroke-linecap="round"/>

    <!-- 旧铜笔箍 -->
    <polygon points="23,31 30,38 25,43 18,36" fill="#9A7B46" stroke="#1C1412" stroke-width="2.4" stroke-linejoin="round"/>

    <!-- 钢笔尖（左下角锋利笔尖，粗外框清晰可辨） -->
    <polygon points="18,36 25,43 19,52 9,55 12,45" fill="#5A7682" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <polygon points="21.5,39.5 25,43 19,52 9,55" fill="#1E2C33" opacity="0.75"/>
    <polygon points="18,36 25,43 19,52 9,55 12,45" fill="none" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <!-- 笔尖中缝与呼吸孔 -->
    <line x1="9.5" y1="54.5" x2="17" y2="47" stroke="#1C1412" stroke-width="2" stroke-linecap="round"/>
    <circle cx="17.5" cy="46.5" r="1.6" fill="#1C1412"/>
  </g>
</g>
</svg>
