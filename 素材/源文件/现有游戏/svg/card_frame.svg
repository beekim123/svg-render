<svg xmlns="http://www.w3.org/2000/svg" class="svg-card_frame" viewBox="0 0 200 300" width="200" height="300">
<title>牌框</title>
<defs>
<linearGradient id="card_frame-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A324D"/>
      <stop offset="55%" stop-color="#262036"/>
      <stop offset="100%" stop-color="#161221"/>
    </linearGradient>
</defs>
<g id="root">
<!-- 牌身底板（evenodd 挖空原画窗） -->
    <path d="M12,2 H188 A10,10 0 0,1 198,12 V288 A10,10 0 0,1 188,298 H12 A10,10 0 0,1 2,288 V12 A10,10 0 0,1 12,2 Z M20,14 H180 A6,6 0 0,1 186,20 V192 A6,6 0 0,1 180,198 H20 A6,6 0 0,1 14,192 V20 A6,6 0 0,1 20,14 Z" fill="url(#card_frame-body)" fill-rule="evenodd"/>
    <!-- 牌身左上冷灰紫轮廓受光边 -->
    <path d="M4,280 V13 A9,9 0 0,1 13,4 H184" fill="none" stroke="#62577D" stroke-width="2" opacity="0.75"/>
    <!-- 下半截文字框暗底（y222..290，平整深暗，绝不放花纹） -->
    <rect x="12" y="222" width="176" height="68" rx="6" fill="#161221" stroke="#1C1412" stroke-width="2"/>
    <rect x="14" y="224" width="172" height="64" rx="4.5" fill="none" stroke="#6E542B" stroke-width="1" opacity="0.75"/>
    <!-- 旧古铜双线外框 -->
    <rect x="6" y="6" width="188" height="288" rx="8" fill="none" stroke="#6E542B" stroke-width="1.6"/>
    <!-- 原画窗旧铜镶边（压住窗边） -->
    <rect x="12" y="12" width="176" height="188" rx="8" fill="none" stroke="#1C1412" stroke-width="3.2"/>
    <rect x="13.5" y="13.5" width="173" height="185" rx="7" fill="none" stroke="#9A7B46" stroke-width="2"/>
    <path d="M15,190 V20 A5,5 0 0,1 20,15 H178" fill="none" stroke="#C2A670" stroke-width="1.1" opacity="0.85"/>
    <!-- 原画窗四角维多利亚哥特折线角花 -->
    <g fill="#9A7B46" stroke="#1C1412" stroke-width="1.4" stroke-linejoin="round">
      <!-- 左上角花 -->
      <polygon points="8,8 28,8 24,14 14,14 14,24 8,28"/>
      <!-- 右上角花 -->
      <polygon points="192,8 172,8 176,14 186,14 186,24 192,28"/>
      <!-- 左下窗角花 -->
      <polygon points="8,204 26,204 22,198 14,198 14,188 8,184"/>
      <!-- 右下窗角花 -->
      <polygon points="192,204 174,204 178,198 186,198 186,188 192,184"/>
      <!-- 牌底左右两角小包铜 -->
      <polygon points="8,292 24,292 20,287 13,287 13,280 8,276"/>
      <polygon points="192,292 176,292 180,287 187,287 187,280 192,276"/>
    </g>
    <!-- 牌身手绘粗外框 -->
    <path d="M12,2 H188 A10,10 0 0,1 198,12 V288 A10,10 0 0,1 188,298 H12 A10,10 0 0,1 2,288 V12 A10,10 0 0,1 12,2 Z" fill="none" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
</g>
</svg>
