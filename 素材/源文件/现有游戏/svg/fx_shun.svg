<svg xmlns="http://www.w3.org/2000/svg" class="svg-fx_shun" viewBox="0 0 60 240" width="60" height="240">
<title>特效 · 顺色</title>
<style>
.svg-fx_shun g { transform-box: view-box; }
.svg-fx_shun #beam_wrap { opacity: 0; }
.svg-fx_shun #beam_bolt { transform-origin: 30px 120px; }
.svg-fx_shun #beam_motes { opacity: 0; transform-origin: 30px 120px; }
@keyframes svg-fx_shun-wrap {
  0%, 100% { opacity: 0; }
  10%, 82% { opacity: 1; }
}
@keyframes svg-fx_shun-bolt {
  0% { transform: translateY(65px) scaleY(0.45); }
  45% { transform: translateY(0px) scaleY(1); }
  85% { transform: translateY(-55px) scaleY(0.6); }
  100% { transform: translateY(-65px) scaleY(0.3); }
}
@keyframes svg-fx_shun-motes {
  0%, 18% { opacity: 0; transform: translateY(20px); }
  45% { opacity: 1; transform: translateY(0px); }
  88% { opacity: 0.7; transform: translateY(-20px); }
  100% { opacity: 0; transform: translateY(-28px); }
}
.svg-fx_shun[data-anim="play"] #beam_wrap { animation: svg-fx_shun-wrap 0.5s linear both; }
.svg-fx_shun[data-anim="play"] #beam_bolt { animation: svg-fx_shun-bolt 0.5s steps(7, end) both; }
.svg-fx_shun[data-anim="play"] #beam_motes { animation: svg-fx_shun-motes 0.5s steps(7, end) both; }
</style>
<defs>
<clipPath id="fx_shun-clip">
      <rect x="2" y="4" width="56" height="232"/>
    </clipPath>
</defs>
<g id="root">
<!-- pivot: 30,120 -->
    <g id="beam_wrap" opacity="0" clip-path="url(#fx_shun-clip)">
      <g id="beam_bolt"><!-- pivot: 30,120 -->
        <polygon points="30,18 44,64 36,112 46,162 30,222 16,166 24,116 14,68" fill="currentColor" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
        <polygon points="30,32 37,72 32,116 38,158 30,204 23,160 28,116 22,74" fill="#FFFFFF"/>
      </g>
      <g id="beam_motes" opacity="0"><!-- pivot: 30,120 -->
        <path d="M16,49 L18,54 L23,56 L18,58 L16,63 L14,58 L9,56 L14,54 Z" fill="#FFFFFF" stroke="#1C1412" stroke-width="1.1"/>
        <path d="M44,88 L46.2,93.8 L52,96 L46.2,98.2 L44,104 L41.8,98.2 L36,96 L41.8,93.8 Z" fill="currentColor" stroke="#1C1412" stroke-width="1.1"/>
        <path d="M18,141 L20,146 L25,148 L20,150 L18,155 L16,150 L11,148 L16,146 Z" fill="currentColor" stroke="#1C1412" stroke-width="1.1"/>
        <path d="M42,177.5 L43.8,182.2 L48.5,184 L43.8,185.8 L42,190.5 L40.2,185.8 L35.5,184 L40.2,182.2 Z" fill="#FFFFFF" stroke="#1C1412" stroke-width="1.1"/>
      </g>
    </g>
</g>
</svg>
