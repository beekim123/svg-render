<svg xmlns="http://www.w3.org/2000/svg" class="svg-fx_rainbow" viewBox="0 0 400 160" width="400" height="160">
<title>特效 · 彩虹</title>
<style>
.svg-fx_rainbow g { transform-box: view-box; }
.svg-fx_rainbow #rb_arcs, .svg-fx_rainbow #rb_sparks { opacity: 0; transform-origin: 200px 90px; }
@keyframes svg-fx_rainbow-arcs {
  0% { opacity: 0; clip-path: inset(0 100% 0 0); }
  12% { opacity: 1; clip-path: inset(0 70% 0 0); }
  48% { opacity: 1; clip-path: inset(0 0% 0 0); }
  75% { opacity: 0.85; clip-path: inset(0 0% 0 35%); }
  100% { opacity: 0; clip-path: inset(0 0% 0 100%); }
}
@keyframes svg-fx_rainbow-sparks {
  0%, 35% { opacity: 0; transform: translateY(6px) scale(0.6); }
  55% { opacity: 1; transform: translateY(0px) scale(1); }
  88% { opacity: 0.8; transform: translateY(-8px) scale(1.08); }
  100% { opacity: 0; transform: translateY(-12px) scale(0.8); }
}
.svg-fx_rainbow[data-anim="play"] #rb_arcs { animation: svg-fx_rainbow-arcs 0.8s steps(10, end) both; }
.svg-fx_rainbow[data-anim="play"] #rb_sparks { animation: svg-fx_rainbow-sparks 0.8s steps(8, end) both; }
</style>
<g id="root">
