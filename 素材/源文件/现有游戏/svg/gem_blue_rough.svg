<svg xmlns="http://www.w3.org/2000/svg" class="svg-gem_blue_rough" viewBox="0 0 100 100" width="100" height="100">
<title>蓝宝石 · 原石</title>
<style>
.svg-gem_blue_rough g { transform-box: view-box; }
.svg-gem_blue_rough #root { transform-origin: 50px 50px; }
.svg-gem_blue_rough #crack_glint { transform-origin: 50px 54px; opacity: 0; }

/* 待机（5.8s 循环）：石皮裂缝里偶尔透出一道暗暗的光，一次不超过 0.4s（6.5% * 5.8s = 0.377s） */
@keyframes svg-gem_blue_rough-glint {
  0%, 30%, 36.5%, 100% { opacity: 0; transform: scale(0.94); }
  32.5% { opacity: 0.85; transform: scale(1.02); }
  34.8% { opacity: 0.55; transform: scale(1); }
}
.svg-gem_blue_rough:not([data-anim]) #crack_glint,
.svg-gem_blue_rough[data-anim="idle"] #crack_glint {
  animation: svg-gem_blue_rough-glint 5.8s steps(4, end) infinite;
}
</style>
<defs>
<linearGradient id="gem_blue_rough-stone" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#6E6A63"/>
        <stop offset="60%" stop-color="#4A4742"/>
        <stop offset="100%" stop-color="#524531"/>
      </linearGradient>
</defs>
<g id="root">
  <!-- pivot: 50,50 -->
<!-- 三角石皮底 -->
        <path d="M47,12 L53,12 L88,78 L84,84 L16,84 L12,78 Z" fill="url(#gem_blue_rough-stone)"/>
        <!-- 背光暗部石皮 -->
        <path d="M53,12 L88,78 L84,84 L16,84 L48,58 Z" fill="#2E2C28" opacity="0.78"/>
        <!-- 左上冷受光边 -->
        <path d="M14,74 L47,12 L53,12" fill="none" stroke="#948F86" stroke-width="2.5" stroke-linecap="round"/>
        <!-- 裂隙露出的三角蓝宝石原矿 -->
        <polygon points="48,26 66,58 30,62" fill="#193D9E" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
        <polygon points="48,30 58,52 35,55" fill="#2E66F0"/>
        <polygon points="47,34 53,46 40,48" fill="#6B9BFF" opacity="0.78"/>
        <polygon points="56,66 76,68 68,79 48,77" fill="#193D9E" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
        <polygon points="58,68 72,70 66,76" fill="#2E66F0"/>
        <!-- 石皮裂缝偶尔透出的暗蓝微光（平时 opacity="0"，动画关闭时完全隐藏） -->
        <g id="crack_glint" opacity="0">
          <!-- pivot: 50,54 -->
          <polygon points="48,28 64,56 32,60" fill="#6B9BFF" opacity="0.45"/>
          <polygon points="47,32 56,50 37,53" fill="#D9E6FF" opacity="0.72"/>
          <polygon points="57,67 74,69 67,77 50,75" fill="#6B9BFF" opacity="0.65"/>
          <path d="M48,26 L50,15 M66,58 L79,63 M30,62 L18,73 M48,77 L43,82" stroke="#6B9BFF" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.75"/>
        </g>
        <!-- 石皮裂纹与排线 -->
        <path d="M48,26 L50,12 M66,58 L82,64 M30,62 L14,76 M48,77 L42,84" stroke="#1C1412" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <path d="M22,82 L34,70 M30,82 L42,70 M64,46 L72,38 M68,52 L76,44" stroke="#1C1412" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
        <!-- 外轮廓手绘线 -->
        <path d="M47,12 L53,12 L88,78 L84,84 L16,84 L12,78 Z" fill="none" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
        <path d="M46.6,11.6 L53.4,11.8 L88.4,78.2 L83.8,84.4 L16.2,84.2 L11.6,77.6 Z" fill="none" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round" opacity="0.65"/>
</g>
</svg>
