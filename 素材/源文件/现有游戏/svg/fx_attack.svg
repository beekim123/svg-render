<svg xmlns="http://www.w3.org/2000/svg" class="svg-fx_attack" viewBox="0 0 320 320" width="320" height="320">
<title>特效 · 怪打到你</title>
<style>
.svg-fx_attack g { transform-box: view-box; }
.svg-fx_attack #claw_1 { transform-origin: 140px 120px; opacity: 0; }
.svg-fx_attack #claw_2 { transform-origin: 160px 160px; opacity: 0; }
.svg-fx_attack #claw_3 { transform-origin: 180px 200px; opacity: 0; }
.svg-fx_attack #slash_sparks { transform-origin: 160px 160px; opacity: 0; }

/* play（500ms）：三道哥特折角爪痕依次横扫而过，墨色主体带羊皮纸浅边与冷灰青高光，无血无红；平时全透明 */
@keyframes svg-fx_attack-claw1 {
  0%, 100% { opacity: 0; transform: translate(28px, -24px) scale(0.65); }
  12% { opacity: 1; transform: translate(0px, 0px) scale(1.04); }
  58% { opacity: 0.95; transform: translate(-6px, 5px) scale(1); }
  88% { opacity: 0; transform: translate(-12px, 10px) scale(0.94); }
}
@keyframes svg-fx_attack-claw2 {
  0%, 8%, 100% { opacity: 0; transform: translate(32px, -26px) scale(0.65); }
  22% { opacity: 1; transform: translate(0px, 0px) scale(1.06); }
  66% { opacity: 0.95; transform: translate(-8px, 6px) scale(1); }
  94% { opacity: 0; transform: translate(-14px, 12px) scale(0.94); }
}
@keyframes svg-fx_attack-claw3 {
  0%, 16%, 100% { opacity: 0; transform: translate(28px, -24px) scale(0.65); }
  32% { opacity: 1; transform: translate(0px, 0px) scale(1.04); }
  74% { opacity: 0.92; transform: translate(-6px, 5px) scale(1); }
  98% { opacity: 0; transform: translate(-12px, 10px) scale(0.94); }
}
@keyframes svg-fx_attack-sparks {
  0%, 14%, 92%, 100% { opacity: 0; transform: scale(0.6); }
  30% { opacity: 1; transform: scale(1.02); }
  64% { opacity: 0.85; transform: scale(1.12); }
}
.svg-fx_attack[data-anim="play"] #claw_1 { animation: svg-fx_attack-claw1 0.5s steps(7, end) both; }
.svg-fx_attack[data-anim="play"] #claw_2 { animation: svg-fx_attack-claw2 0.5s steps(7, end) both; }
.svg-fx_attack[data-anim="play"] #claw_3 { animation: svg-fx_attack-claw3 0.5s steps(7, end) both; }
.svg-fx_attack[data-anim="play"] #slash_sparks { animation: svg-fx_attack-sparks 0.5s steps(6, end) both; }
</style>
<g id="root">
  <!-- pivot: 160,160 -->
  <!-- 第 1 道爪痕（左上侧，墨色内核 + 羊皮纸浅亮边，带手绘折角锯齿） -->
  <g id="claw_1" opacity="0">
    <!-- pivot: 140,120 -->
    <polygon points="236,34 196,62 152,96 108,136 68,176 34,218 60,196 102,158 146,120 192,80" fill="#E2D6BA" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="228,40 184,72 138,112 92,154 44,204 72,182 118,140 166,98" fill="#1C1412"/>
    <path d="M214,48 L150,98 L82,162" fill="none" stroke="#8CAAB5" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 第 2 道主爪痕（正中，最粗最长，带哥特断刺缺口） -->
  <g id="claw_2" opacity="0">
    <!-- pivot: 160,160 -->
    <polygon points="278,42 228,80 176,124 148,142 122,172 72,218 28,268 62,240 116,194 156,162 184,142 234,98" fill="#E6DEC8" stroke="#1C1412" stroke-width="2.4" stroke-linejoin="round"/>
    <polygon points="268,50 214,94 162,138 110,186 42,254 78,224 134,176 190,128 242,82" fill="#1C1412"/>
    <path d="M250,62 L172,128 L92,202" fill="none" stroke="#8CAAB5" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- 第 3 道爪痕（右下侧） -->
  <g id="claw_3" opacity="0">
    <!-- pivot: 180,200 -->
    <polygon points="286,98 244,132 198,170 152,212 112,252 78,288 108,266 152,228 198,188 246,146" fill="#E2D6BA" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="276,106 230,144 182,186 134,232 90,276 122,252 170,210 220,166" fill="#1C1412"/>
    <path d="M262,116 L192,176 L124,240" fill="none" stroke="#8CAAB5" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 撕裂迸出的碎墨刺与浅色刮痕闪星（不要血、不要红） -->
  <g id="slash_sparks" opacity="0">
    <!-- pivot: 160,160 -->
    <polygon points="154,142 132,126 144,152" fill="#E6DEC8" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round"/>
    <polygon points="178,168 202,182 188,158" fill="#8CAAB5" stroke="#1C1412" stroke-width="1.6" stroke-linejoin="round"/>
    <polygon points="116,188 94,176 106,200" fill="#1C1412" stroke="#E2D6BA" stroke-width="1.4" stroke-linejoin="round"/>
    <polygon points="208,118 228,130 218,108" fill="#1C1412" stroke="#E2D6BA" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M98,118 L76,104 M224,198 L246,212 M136,228 L122,250 M192,86 L206,66" stroke="#E2D6BA" stroke-width="2.6" stroke-linecap="round"/>
  </g>
</g>
</svg>
