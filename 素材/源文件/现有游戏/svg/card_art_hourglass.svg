<svg xmlns="http://www.w3.org/2000/svg" class="svg-card_art_hourglass" viewBox="0 0 176 188" width="176" height="188">
<title>额外牌原画 · 沙漏</title>
<style>
.svg-card_art_hourglass g { transform-box: view-box; }
.svg-card_art_hourglass #root { transform-origin: 102px 98px; }
.svg-card_art_hourglass #hourglass_unit { transform-origin: 102px 98px; }
.svg-card_art_hourglass #sand_top { transform-origin: 102px 90px; }
.svg-card_art_hourglass #sand_bottom { transform-origin: 102px 146px; }
.svg-card_art_hourglass #stream_idle { transform-origin: 102px 116px; }
.svg-card_art_hourglass #gems_rewind { transform-origin: 102px 104px; opacity: 0; }
.svg-card_art_hourglass #cyan_flash { transform-origin: 102px 68px; opacity: 0; }

/* 待机 idle（2.5s 循环）：青色宝石碎粒一粒一粒顺滑往下掉，上下两堆高度不变 */
@keyframes svg-card_art_hourglass-idle-stream {
  0% {
    transform: translateY(-7px);
    opacity: 0.25;
    animation-timing-function: linear;
  }
  20% {
    transform: translateY(-4px);
    opacity: 1;
    animation-timing-function: linear;
  }
  80% {
    transform: translateY(5px);
    opacity: 1;
    animation-timing-function: linear;
  }
  100% {
    transform: translateY(8px);
    opacity: 0.25;
  }
}
.svg-card_art_hourglass:not([data-anim]) #stream_idle,
.svg-card_art_hourglass[data-anim="idle"] #stream_idle {
  animation: svg-card_art_hourglass-idle-stream 2.5s infinite;
}

/* play（600ms）：
   0ms(0%) 待机 -> 150ms(25%) 整只一震、停流 -> 450ms(75%) 一串碎粒(8粒)从下半截倒着飞回上半截，上面那堆长高 16px(>=12px)，闪一下青光
   -> 520ms(86.67%) 停住 -> 600ms(100%) 回到待机的高度。
   所有部件严格共用同一组百分比：0%, 25%, 75%, 86.67%, 100% */
@keyframes svg-card_art_hourglass-play-unit {
  0% {
    transform: translate(0px, 0px) rotate(0deg) scale(1, 1);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  25% {
    transform: translate(0px, 5px) rotate(-3.5deg) scale(1.04, 0.95);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  75% {
    transform: translate(0px, -4px) rotate(1.8deg) scale(0.98, 1.03);
    animation-timing-function: linear;
  }
  86.67% {
    transform: translate(0px, -4px) rotate(1.8deg) scale(0.98, 1.03);
    animation-timing-function: cubic-bezier(.34,1.56,.64,1);
  }
  100% {
    transform: translate(0px, 0px) rotate(0deg) scale(1, 1);
  }
}
@keyframes svg-card_art_hourglass-play-top {
  0% {
    transform: translateY(0px) scaleY(1);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  25% {
    transform: translateY(1px) scaleY(0.96);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  75% {
    transform: translateY(-4px) scaleY(1.42);
    animation-timing-function: linear;
  }
  86.67% {
    transform: translateY(-4px) scaleY(1.42);
    animation-timing-function: cubic-bezier(.34,1.56,.64,1);
  }
  100% {
    transform: translateY(0px) scaleY(1);
  }
}
@keyframes svg-card_art_hourglass-play-bottom {
  0% {
    transform: scaleY(1);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  25% {
    transform: scaleY(1.05);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  75% {
    transform: scaleY(0.48);
    animation-timing-function: linear;
  }
  86.67% {
    transform: scaleY(0.48);
    animation-timing-function: cubic-bezier(.34,1.56,.64,1);
  }
  100% {
    transform: scaleY(1);
  }
}
@keyframes svg-card_art_hourglass-play-stream {
  0% {
    opacity: 1;
    transform: translateY(0px);
    animation-timing-function: linear;
  }
  25% {
    opacity: 0;
    transform: translateY(2px);
    animation-timing-function: linear;
  }
  75% {
    opacity: 0;
    transform: translateY(-8px);
    animation-timing-function: linear;
  }
  86.67% {
    opacity: 0;
    transform: translateY(-8px);
    animation-timing-function: linear;
  }
  100% {
    opacity: 1;
    transform: translateY(0px);
  }
}
@keyframes svg-card_art_hourglass-play-rewind {
  0% {
    opacity: 0;
    transform: translateY(14px) scale(0.75);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  25% {
    opacity: 1;
    transform: translateY(12px) scale(0.95);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  75% {
    opacity: 1;
    transform: translateY(-28px) scale(1.06);
    animation-timing-function: linear;
  }
  86.67% {
    opacity: 0.9;
    transform: translateY(-28px) scale(1.04);
    animation-timing-function: linear;
  }
  100% {
    opacity: 0;
    transform: translateY(-32px) scale(0.7);
  }
}
@keyframes svg-card_art_hourglass-play-flash {
  0% {
    opacity: 0;
    transform: scale(0.65);
    animation-timing-function: linear;
  }
  25% {
    opacity: 0.1;
    transform: scale(0.75);
    animation-timing-function: cubic-bezier(.2,.8,.2,1);
  }
  75% {
    opacity: 1;
    transform: scale(1.1);
    animation-timing-function: linear;
  }
  86.67% {
    opacity: 0.85;
    transform: scale(1.05);
    animation-timing-function: linear;
  }
  100% {
    opacity: 0;
    transform: scale(0.7);
  }
}
.svg-card_art_hourglass[data-anim="play"] #hourglass_unit {
  animation: svg-card_art_hourglass-play-unit 0.6s both;
}
.svg-card_art_hourglass[data-anim="play"] #sand_top {
  animation: svg-card_art_hourglass-play-top 0.6s both;
}
.svg-card_art_hourglass[data-anim="play"] #sand_bottom {
  animation: svg-card_art_hourglass-play-bottom 0.6s both;
}
.svg-card_art_hourglass[data-anim="play"] #stream_idle {
  animation: svg-card_art_hourglass-play-stream 0.6s both;
}
.svg-card_art_hourglass[data-anim="play"] #gems_rewind {
  animation: svg-card_art_hourglass-play-rewind 0.6s both;
}
.svg-card_art_hourglass[data-anim="play"] #cyan_flash {
  animation: svg-card_art_hourglass-play-flash 0.6s both;
}
</style>
<defs>
  <radialGradient id="card_art_hourglass-glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#A6F9FF" stop-opacity="0.75"/>
    <stop offset="55%" stop-color="#3FE3F0" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#3FE3F0" stop-opacity="0"/>
  </radialGradient>
</defs>
<g id="root">
  <!-- 左上角 x:0..30, y:0..90 严格留空（主体范围 x:44..160, y:20..172） -->
  <!-- 落地暗影 -->
  <ellipse cx="102" cy="166" rx="48" ry="8" fill="#0D111C" opacity="0.6"/>

  <g id="hourglass_unit">
    <!-- 1. 玻璃沙漏腔体底层（冷灰蓝暗玻璃 #1E2C33 + #161221） -->
    <!-- 上玻璃泡 -->
    <path d="M66,34 H138 L134,64 C132,78 116,88 108,94 H96 C88,88 72,78 70,64 Z" fill="#161221" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <!-- 下玻璃泡 -->
    <path d="M96,98 H108 C116,104 132,114 134,128 L138,154 H66 L70,128 C72,114 88,104 96,98 Z" fill="#161221" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>

    <!-- 2. 上半截青色宝石碎粒堆 sand_top（原本剩一大半 y:56..92，高36px；play 时 scaleY(1.42) + translateY(-4px) 长高约 19px >= 12px 下限） -->
    <g id="sand_top">
      <!-- 青色碎粒主堆体 -->
      <path d="M72,58 Q88,53 102,56 Q116,53 132,58 L130,68 C126,80 114,87 106,92 H98 C90,87 78,80 74,68 Z" fill="#3FE3F0" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
      <!-- 右侧背光深青暗面 -->
      <path d="M102,56 Q116,53 132,58 L130,68 C126,80 114,87 106,92 H102 Z" fill="#1794A3" opacity="0.82"/>
      <!-- 顶部与左侧晶体切面亮块（体现是宝石碎粒而非普通沙子） -->
      <polygon points="75,59 89,55 95,62 82,66" fill="#A6F9FF"/>
      <polygon points="94,57 108,55 104,64 92,63" fill="#A6F9FF" opacity="0.9"/>
      <polygon points="82,67 94,65 98,75 85,76" fill="#72F2FC"/>
      <polygon points="106,64 118,61 122,71 110,73" fill="#1794A3"/>
      <!-- 碎粒堆表面分界折线 -->
      <path d="M74,59 L88,65 L102,58 L116,64 L130,59 M85,74 L98,70 L112,76" fill="none" stroke="#1C1412" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 3. 下半截底部青色宝石碎粒堆 sand_bottom -->
    <g id="sand_bottom">
      <path d="M70,152 L78,138 L94,132 L102,129 L110,132 L126,138 L134,152 Z" fill="#3FE3F0" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M102,129 L110,132 L126,138 L134,152 H102 Z" fill="#1794A3" opacity="0.82"/>
      <polygon points="80,140 94,133 100,141 84,147" fill="#A6F9FF"/>
      <polygon points="96,133 104,130 106,139 98,141" fill="#FFFFFF" opacity="0.85"/>
      <path d="M80,142 L94,137 L106,143 L122,140" fill="none" stroke="#1C1412" stroke-width="1.3" stroke-linecap="round"/>
    </g>

    <!-- 4. 待机往下掉的宝石碎粒流 stream_idle（4 颗清晰分明的青色小晶体） -->
    <g id="stream_idle">
      <polygon points="102,97 105,101 102,105 99,101" fill="#A6F9FF" stroke="#1C1412" stroke-width="1.4"/>
      <rect x="99.5" y="108" width="5" height="5" rx="1" transform="rotate(20 102 110.5)" fill="#3FE3F0" stroke="#1C1412" stroke-width="1.4"/>
      <polygon points="102,117 105.5,122 98.5,122" fill="#3FE3F0" stroke="#1C1412" stroke-width="1.4"/>
      <polygon points="102,125 104.5,128 102,131 99.5,128" fill="#A6F9FF" stroke="#1C1412" stroke-width="1.3"/>
    </g>

    <!-- 5. play 时从下半截倒着飞回上半截的碎粒群 gems_rewind（共 8 粒 >= 6 粒下限，带上升轨迹残影线） -->
    <g id="gems_rewind">
      <!-- 倒飞上升流光细线 -->
      <path d="M90,132 V108 M102,136 V104 M114,132 V108 M84,120 V102 M120,120 V102" stroke="#A6F9FF" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
      <!-- 粒 1（中上菱形晶粒） -->
      <polygon points="102,88 107,94 102,100 97,94" fill="#A6F9FF" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- 粒 2（左上方块晶粒） -->
      <rect x="84" y="96" width="8" height="8" rx="1" transform="rotate(-18 88 100)" fill="#3FE3F0" stroke="#1C1412" stroke-width="1.8"/>
      <!-- 粒 3（右上三角晶粒） -->
      <polygon points="116,94 122,104 110,104" fill="#3FE3F0" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- 粒 4（中腰大菱形晶粒） -->
      <polygon points="101,105 106,111 101,117 96,111" fill="#3FE3F0" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- 粒 5（左中多边晶粒） -->
      <polygon points="88,112 94,115 92,122 85,119" fill="#A6F9FF" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- 粒 6（右中方块晶粒） -->
      <rect x="109" y="112" width="7.5" height="7.5" rx="1" transform="rotate(22 112.7 115.7)" fill="#A6F9FF" stroke="#1C1412" stroke-width="1.8"/>
      <!-- 粒 7（左下三角晶粒） -->
      <polygon points="93,124 98,133 88,133" fill="#3FE3F0" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- 粒 8（右下菱形晶粒） -->
      <polygon points="110,123 115,128 110,134 105,128" fill="#3FE3F0" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
    </g>

    <!-- 6. play 时上半截闪一下青光 cyan_flash -->
    <g id="cyan_flash">
      <circle cx="102" cy="64" r="34" fill="url(#card_art_hourglass-glow)"/>
      <!-- 青色四角星芒与逆时针回溯光弧 -->
      <path d="M64,62 C68,40 136,40 140,62" fill="none" stroke="#A6F9FF" stroke-width="2.6" stroke-linecap="round"/>
      <polygon points="64,66 58,56 69,58" fill="#A6F9FF" stroke="#1C1412" stroke-width="1.2" stroke-linejoin="round"/>
      <polygon points="102,36 105,45 114,48 105,51 102,60 99,51 90,48 99,45" fill="#FFFFFF" stroke="#3FE3F0" stroke-width="1.2" stroke-linejoin="round"/>
      <polygon points="78,46 80,51 85,53 80,55 78,60 76,55 71,53 76,51" fill="#A6F9FF"/>
      <polygon points="126,48 128,53 133,55 128,57 126,62 124,57 119,55 124,53" fill="#A6F9FF"/>
    </g>

    <!-- 7. 玻璃泡表面冷色高光弧与重描外框 -->
    <path d="M72,40 L74,62 C75,73 86,82 94,88 M74,148 L74,128 C75,117 86,108 94,102" fill="none" stroke="#8CAAB5" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- 8. 哥特旧铜沙漏外架（顶座、底座、左右弯柱、中腰铜箍，压暗旧铜色不抢青宝石光彩） -->
    <!-- 中腰旧铜束环 -->
    <polygon points="88,91 116,91 120,96 116,101 88,101 84,96" fill="#9A7B46" stroke="#1C1412" stroke-width="2.6" stroke-linejoin="round"/>
    <polygon points="102,91 116,91 120,96 116,101 102,101" fill="#6E542B"/>
    <circle cx="92" cy="96" r="1.8" fill="#C2A670"/>
    <circle cx="112" cy="96" r="1.8" fill="#3B2B14"/>

    <!-- 左右对称折角哥特铜立柱 -->
    <!-- 左立柱 -->
    <path d="M56,34 L64,34 L60,88 L66,96 L60,104 L64,154 L56,154 L52,104 L46,96 L52,88 Z" fill="#9A7B46" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <polyline points="54,150 50,104 45,96 50,88 54,38" fill="none" stroke="#C2A670" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 右立柱 -->
    <path d="M140,34 L148,34 L152,88 L158,96 L152,104 L148,154 L140,154 L144,104 L138,96 L144,88 Z" fill="#6E542B" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M144,34 L148,34 L152,88 L158,96 L152,104 L148,154 L144,154 Z" fill="#3B2B14" opacity="0.7"/>

    <!-- 顶部旧铜冠座 -->
    <polygon points="48,24 156,24 150,36 54,36" fill="#9A7B46" stroke="#1C1412" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="102,24 156,24 150,36 102,36" fill="#6E542B" opacity="0.8"/>
    <line x1="52" y1="27" x2="148" y2="27" stroke="#C2A670" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 顶座两端小铜尖饰 -->
    <polygon points="56,18 62,24 50,24" fill="#C2A670" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="148,18 154,24 142,24" fill="#6E542B" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>

    <!-- 底部旧铜台座 -->
    <polygon points="54,152 150,152 156,164 48,164" fill="#9A7B46" stroke="#1C1412" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="102,152 150,152 156,164 102,164" fill="#3B2B14" opacity="0.8"/>
    <line x1="56" y1="155" x2="146" y2="155" stroke="#C2A670" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</g>
</svg>
