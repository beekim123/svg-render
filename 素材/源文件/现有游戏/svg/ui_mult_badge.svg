<svg xmlns="http://www.w3.org/2000/svg" class="svg-ui_mult_badge" viewBox="0 0 220 100" width="220" height="100">
<title>倍率牌子</title>
<style>
.svg-ui_mult_badge g { transform-box: view-box; }
.svg-ui_mult_badge #sweep_group { opacity: 0; }
.svg-ui_mult_badge #sweep_bar { transform-origin: 110px 50px; }
.svg-ui_mult_badge #sparks_group { opacity: 0; transform-origin: 110px 50px; }
.svg-ui_mult_badge .sp-l { transform-origin: 24px 50px; }
.svg-ui_mult_badge .sp-r { transform-origin: 196px 50px; }
.svg-ui_mult_badge .sp-t { transform-origin: 110px 14px; }
.svg-ui_mult_badge .sp-b { transform-origin: 110px 86px; }

/* up (300ms): 一道光从左往右扫过牌面 */
@keyframes svg-ui_mult_badge-up-group {
  0%, 100% { opacity: 0; }
  10%, 85% { opacity: 1; }
}
@keyframes svg-ui_mult_badge-up-bar {
  0% { transform: translateX(-180px); }
  100% { transform: translateX(180px); }
}
.svg-ui_mult_badge[data-anim="up"] #sweep_group { animation: svg-ui_mult_badge-up-group 0.3s linear both; }
.svg-ui_mult_badge[data-anim="up"] #sweep_bar { animation: svg-ui_mult_badge-up-bar 0.3s ease-out both; }

/* double (600ms): 扫光 + 边上迸出几颗哥特火星（严格在 220×100 画框内） */
@keyframes svg-ui_mult_badge-double-sparks {
  0%, 100% { opacity: 0; }
  8%, 75% { opacity: 1; }
}
@keyframes svg-ui_mult_badge-double-l {
  0% { transform: translate(0px, 0px) scale(0.4); }
  45% { transform: translate(-12px, -4px) scale(1.1); }
  100% { transform: translate(-16px, 2px) scale(0.3); }
}
@keyframes svg-ui_mult_badge-double-r {
  0% { transform: translate(0px, 0px) scale(0.4); }
  45% { transform: translate(12px, -4px) scale(1.1); }
  100% { transform: translate(16px, 2px) scale(0.3); }
}
@keyframes svg-ui_mult_badge-double-t {
  0% { transform: translate(0px, 0px) scale(0.4); }
  45% { transform: translate(0px, -8px) scale(1.1); }
  100% { transform: translate(0px, -10px) scale(0.3); }
}
@keyframes svg-ui_mult_badge-double-b {
  0% { transform: translate(0px, 0px) scale(0.4); }
  45% { transform: translate(0px, 8px) scale(1.1); }
  100% { transform: translate(0px, 10px) scale(0.3); }
}
.svg-ui_mult_badge[data-anim="double"] #sweep_group { animation: svg-ui_mult_badge-up-group 0.45s linear both; }
.svg-ui_mult_badge[data-anim="double"] #sweep_bar { animation: svg-ui_mult_badge-up-bar 0.45s ease-out both; }
.svg-ui_mult_badge[data-anim="double"] #sparks_group { animation: svg-ui_mult_badge-double-sparks 0.6s linear both; }
.svg-ui_mult_badge[data-anim="double"] .sp-l { animation: svg-ui_mult_badge-double-l 0.6s steps(6, end) both; }
.svg-ui_mult_badge[data-anim="double"] .sp-r { animation: svg-ui_mult_badge-double-r 0.6s steps(6, end) both; }
.svg-ui_mult_badge[data-anim="double"] .sp-t { animation: svg-ui_mult_badge-double-t 0.6s steps(6, end) both; }
.svg-ui_mult_badge[data-anim="double"] .sp-b { animation: svg-ui_mult_badge-double-b 0.6s steps(6, end) both; }
</style>
<defs>
<clipPath id="ui_mult_badge-clip">
      <path d="M32,16 H188 L198,26 V74 L188,84 H32 L22,74 V26 Z"/>
    </clipPath>
</defs>
<g id="root">
<!-- pivot: 110,50 -->
    <!-- 铜牌外框 -->
    <path d="M28,10 H192 L206,24 V76 L192,90 H28 L14,76 V24 Z" fill="#6E542B" stroke="#1C1412" stroke-width="3" stroke-linejoin="round"/>
    <path d="M29,13 H191 L203,25" fill="none" stroke="#C2A670" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <!-- 中间深暗平板区（给 52 号浅铜色粗字留白） -->
    <path d="M32,16 H188 L198,26 V74 L188,84 H32 L22,74 V26 Z" fill="#161221" stroke="#9A7B46" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- 四角铆钉 -->
    <circle cx="26" cy="24" r="2.6" fill="#C2A670" stroke="#1C1412" stroke-width="1.2"/>
    <circle cx="194" cy="24" r="2.6" fill="#C2A670" stroke="#1C1412" stroke-width="1.2"/>
    <circle cx="26" cy="76" r="2.6" fill="#C2A670" stroke="#1C1412" stroke-width="1.2"/>
    <circle cx="194" cy="76" r="2.6" fill="#C2A670" stroke="#1C1412" stroke-width="1.2"/>

    <!-- up / double 扫光层（裁剪在铜牌内） -->
    <g id="sweep_group" opacity="0" clip-path="url(#ui_mult_badge-clip)">
      <g id="sweep_bar"><!-- pivot: 110,50 -->
        <polygon points="85,10 120,10 95,90 60,90" fill="#C2A670" opacity="0.45"/>
        <polygon points="98,10 112,10 87,90 73,90" fill="#E6DEC8" opacity="0.85"/>
      </g>
    </g>

    <!-- double 火星迸散层（严格控制在 220×100 内） -->
    <g id="sparks_group" opacity="0"><!-- pivot: 110,50 -->
      <path d="M28,10 H192 L206,24 V76 L192,90 H28 L14,76 V24 Z" fill="none" stroke="#F2C166" stroke-width="2.2"/>
      <g class="sp-l"><!-- pivot: 24,50 -->
        <path d="M20,27 L22,32 L27,34 L22,36 L20,41 L18,36 L13,34 L18,32 Z" fill="#F2C166" stroke="#1C1412" stroke-width="1"/>
        <polygon points="18,54 25,50 22,58" fill="#D98E32" stroke="#1C1412" stroke-width="1"/>
        <path d="M22,62.5 L23.8,66.2 L27.5,68 L23.8,69.8 L22,73.5 L20.2,69.8 L16.5,68 L20.2,66.2 Z" fill="#E6DEC8" stroke="#1C1412" stroke-width="1"/>
      </g>
      <g class="sp-r"><!-- pivot: 196,50 -->
        <path d="M200,25 L202,30 L207,32 L202,34 L200,39 L198,34 L193,32 L198,30 Z" fill="#F2C166" stroke="#1C1412" stroke-width="1"/>
        <polygon points="202,52 195,48 198,56" fill="#D98E32" stroke="#1C1412" stroke-width="1"/>
        <path d="M198,62 L199.8,66.2 L204,68 L199.8,69.8 L198,74 L196.2,69.8 L192,68 L196.2,66.2 Z" fill="#E6DEC8" stroke="#1C1412" stroke-width="1"/>
      </g>
      <g class="sp-t"><!-- pivot: 110,14 -->
        <path d="M78,6 L79.8,10.2 L84,12 L79.8,13.8 L78,18 L76.2,13.8 L72,12 L76.2,10.2 Z" fill="#F2C166" stroke="#1C1412" stroke-width="1"/>
        <path d="M142,5.5 L143.8,10.2 L148.5,12 L143.8,13.8 L142,18.5 L140.2,13.8 L135.5,12 L140.2,10.2 Z" fill="#E6DEC8" stroke="#1C1412" stroke-width="1"/>
      </g>
      <g class="sp-b"><!-- pivot: 110,86 -->
        <path d="M84,82.5 L85.6,86.4 L89.5,88 L85.6,89.6 L84,93.5 L82.4,89.6 L78.5,88 L82.4,86.4 Z" fill="#D98E32" stroke="#1C1412" stroke-width="1"/>
        <path d="M138,82 L139.8,86.2 L144,88 L139.8,89.8 L138,94 L136.2,89.8 L132,88 L136.2,86.2 Z" fill="#F2C166" stroke="#1C1412" stroke-width="1"/>
      </g>
    </g>
</g>
</svg>
