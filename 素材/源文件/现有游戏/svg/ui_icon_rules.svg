<svg xmlns="http://www.w3.org/2000/svg" class="svg-ui_icon_rules" viewBox="0 0 64 64" width="64" height="64">
<title>规则 · 旧书</title>
<g id="root">
<!-- 书本主体（歪角哥特旧法典） -->
    <polygon points="14,10 48,8 54,48 18,52 10,46" fill="#9E6238" stroke="#1C1412" stroke-width="3" stroke-linejoin="round"/>
    <!-- 右侧与底部暗面 -->
    <polygon points="34,9 48,8 54,48 18,52 32,42" fill="#704122"/>
    <!-- 书脊与书页厚度 -->
    <polygon points="10,46 18,52 54,48 52,55 16,58 8,52" fill="#C8B894" stroke="#1C1412" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- 书签暗红飘带 -->
    <polygon points="28,51 36,50 38,60 32,56 26,60" fill="#8C3B45" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <!-- 左上冷受光轮廓线 -->
    <path d="M12,43 L16,12 L44,10" fill="none" stroke="#E2D6BA" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 封面旧铜菱形徽记与高光点 -->
    <polygon points="32,19 41,28 32,37 23,28" fill="#9A7B46" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="30" cy="26" r="2.2" fill="#E6DEC8"/>
</g>
</svg>
