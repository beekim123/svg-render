<svg xmlns="http://www.w3.org/2000/svg" class="svg-ui_node_fight" viewBox="0 0 64 64" width="64" height="64">
<title>进度节点 · 普通仗</title>
<g id="root">
  <!-- 统一规格暗色小圆底（12边形哥特旧铜圆章，中心 32,32，半径约 24） -->
  <polygon points="32,8 44,11 53,20 56,32 53,44 44,53 32,56 20,53 11,44 8,32 11,20 20,11" fill="#6E542B" stroke="#1C1412" stroke-width="3" stroke-linejoin="round"/>
  <!-- 右下背光铜暗面 -->
  <polygon points="44,11 53,20 56,32 53,44 44,53 32,56 20,53 32,32" fill="#3B2B14" opacity="0.82"/>
  <!-- 左上冷受光亮边 -->
  <polyline points="11,42 9.5,32 12.2,20.8 20.8,12.2 32,9.5 42,11.5" fill="none" stroke="#C2A670" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 内部暗夜紫凹盘 -->
  <circle cx="32" cy="32" r="18.5" fill="#161221" stroke="#1C1412" stroke-width="2.4"/>
  <path d="M18,22 A17,17 0 0,1 46,22 A17,15 0 0,0 18,22 Z" fill="#0D111C" opacity="0.8"/>
  <path d="M19,43 A17,17 0 0,0 45,43" fill="none" stroke="#3A324D" stroke-width="1.4" stroke-linecap="round"/>

  <!-- 四方铆钉 -->
  <circle cx="32" cy="11" r="1.6" fill="#C2A670" stroke="#1C1412" stroke-width="1"/>
  <circle cx="53" cy="32" r="1.6" fill="#9A7B46" stroke="#1C1412" stroke-width="1"/>
  <circle cx="32" cy="53" r="1.6" fill="#9A7B46" stroke="#1C1412" stroke-width="1"/>
  <circle cx="11" cy="32" r="1.6" fill="#C2A670" stroke="#1C1412" stroke-width="1"/>

  <!-- 中央图案：斜置哥特阔刃小剑（粗外框 + 一层暗面 + 一点高光，48/74px 清晰易读） -->
  <g id="sword">
    <!-- 剑身（左下向右上斜指） -->
    <polygon points="45,17 43,28 28,41 23,36 36,21" fill="#E2D6BA" stroke="#1C1412" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- 剑身背光暗面（下半侧） -->
    <polygon points="45,17 43,28 28,41 25.5,38.5" fill="#8CAAB5"/>
    <polygon points="45,17 43,28 28,41 26.5,39.5" fill="#5A7682" opacity="0.85"/>
    <!-- 剑刃左上亮高光与血槽中脊线 -->
    <polyline points="25,35.5 36.5,22.5 43.5,18.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="26" y1="38" x2="43" y2="21" stroke="#1C1412" stroke-width="1.5" stroke-linecap="round"/>

    <!-- 折角铜护手 -->
    <polygon points="18,31 23,30 34,41 33,46 28,43 21,36" fill="#C2A670" stroke="#1C1412" stroke-width="2.4" stroke-linejoin="round"/>
    <polygon points="26,37 34,41 33,46 28,43" fill="#6E542B"/>

    <!-- 暗酒红剑柄与铜配重球 -->
    <polygon points="21,40 24,43 19,48 16,45" fill="#8C3B45" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
    <polygon points="16,44 20,48 16,50 14,48" fill="#9A7B46" stroke="#1C1412" stroke-width="2.2" stroke-linejoin="round"/>
  </g>
</g>
</svg>
