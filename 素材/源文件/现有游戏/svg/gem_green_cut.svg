<svg xmlns="http://www.w3.org/2000/svg" class="svg-gem_green_cut" viewBox="0 0 100 100" width="100" height="100">
<title>绿宝石 · 切好</title>
<style>
.svg-gem_green_cut g { transform-box: view-box; }
.svg-gem_green_cut #root { transform-origin: 50px 50px; }
.svg-gem_green_cut #sweep_wrap { opacity: 0; }
.svg-gem_green_cut #sweep_band { transform-origin: 50px 50px; }
.svg-gem_green_cut #glint_star { transform-origin: 67px 26px; opacity: 0; }

/* 待机（3.8s 循环）：一道光从刻面上斜着扫过，同时一颗小四角星闪一下；动画关闭时保持原貌 */
@keyframes svg-gem_green_cut-sweep-wrap {
  0%, 12%, 44%, 100% { opacity: 0; }
  18%, 36% { opacity: 1; }
}
@keyframes svg-gem_green_cut-sweep-band {
  0%, 12% { transform: translate(-54px, -54px); }
  42%, 100% { transform: translate(54px, 54px); }
}
@keyframes svg-gem_green_cut-glint-star {
  0%, 20%, 48%, 100% { opacity: 0; transform: scale(0.35) rotate(-15deg); }
  28% { opacity: 1; transform: scale(1.08) rotate(0deg); }
  36% { opacity: 0.92; transform: scale(0.95) rotate(8deg); }
}
.svg-gem_green_cut:not([data-anim]) #sweep_wrap,
.svg-gem_green_cut[data-anim="idle"] #sweep_wrap {
  animation: svg-gem_green_cut-sweep-wrap 3.8s linear infinite;
}
.svg-gem_green_cut:not([data-anim]) #sweep_band,
.svg-gem_green_cut[data-anim="idle"] #sweep_band {
  animation: svg-gem_green_cut-sweep-band 3.8s steps(10, end) infinite;
}
.svg-gem_green_cut:not([data-anim]) #glint_star,
.svg-gem_green_cut[data-anim="idle"] #glint_star {
  animation: svg-gem_green_cut-glint-star 3.8s steps(8, end) infinite;
}
</style>
<defs>
<linearGradient id="gem_green_cut-base" x1="15%" y1="10%" x2="85%" y2="90%">
        <stop offset="0%" stop-color="#1DBF5E"/>
        <stop offset="55%" stop-color="#1DBF5E"/>
        <stop offset="100%" stop-color="#117A3B"/>
      </linearGradient>
  <clipPath id="gem_green_cut-clip">
    <path d="M22,14 L78,14 L86,22 L86,78 L78,86 L22,86 L14,78 L14,22 Z"/>
  </clipPath>
</defs>
<g id="root">
  <!-- pivot: 50,50 -->
<!-- 宝石底色 -->
        <path d="M22,14 L78,14 L86,22 L86,78 L78,86 L22,86 L14,78 L14,22 Z" fill="url(#gem_green_cut-base)"/>
        <!-- 外圈阶梯刻面（左上亮，右下暗） -->
        <polygon points="22,14 78,14 72,24 28,24" fill="#5CE892"/>
        <polygon points="14,22 22,14 28,24 24,28 24,72 14,78" fill="#5CE892"/>
        <polygon points="78,14 86,22 86,78 76,72 76,28 72,24" fill="#117A3B"/>
        <polygon points="24,72 28,76 72,76 76,72 86,78 78,86 22,86 14,78" fill="#094722"/>
        <!-- 二层阶梯刻面 -->
        <polygon points="28,24 72,24 65,33 35,33" fill="#5CE892"/>
        <polygon points="24,28 28,24 35,33 33,35 33,65 24,72" fill="#1DBF5E"/>
        <polygon points="72,24 76,28 76,72 67,65 67,35 65,33" fill="#117A3B"/>
        <polygon points="33,65 35,67 65,67 67,65 76,72 72,76 28,76 24,72" fill="#117A3B"/>
        <!-- 中央方形台面 -->
        <path d="M35,33 L65,33 L67,35 L67,65 L65,67 L35,67 L33,65 L33,35 Z" fill="#1DBF5E"/>

  <!-- 斜向刻面扫光（平时 opacity="0"，裁剪在宝石轮廓内） -->
  <g id="sweep_wrap" clip-path="url(#gem_green_cut-clip)" opacity="0">
    <g id="sweep_band"><!-- pivot: 50,50 -->
      <polygon points="10,74 74,10 88,24 24,88" fill="#D4FFEA" opacity="0.42"/>
      <polygon points="16,78 78,16 84,22 22,84" fill="#FFFFFF" opacity="0.82"/>
    </g>
  </g>
        
        <!-- 阶梯刻面线 -->
        <path d="M28,24 L72,24 L76,28 L76,72 L72,76 L28,76 L24,72 L24,28 Z M35,33 L65,33 L67,35 L67,65 L65,67 L35,67 L33,65 L33,35 Z M22,14 L35,33 M78,14 L65,33 M86,22 L67,35 M86,78 L67,65 M78,86 L65,67 M22,86 L35,67 M14,78 L33,65 M14,22 L33,35" fill="none" stroke="#1C1412" stroke-width="1.5" stroke-linejoin="round"/>
        <!-- 台面高光 -->
        <polygon points="36,36 56,36 44,50 36,50" fill="#E6DEC8" opacity="0.92"/>
        <rect x="27" y="17" width="8" height="4" rx="1" fill="#FFFFFF" opacity="0.92"/>
        <!-- 手绘双层哥特外框 -->
        <path d="M22,14 L78,14 L86,22 L86,78 L78,86 L22,86 L14,78 L14,22 Z" fill="none" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
        <path d="M21.5,13.6 L78.4,14.3 L86.4,22.3 L85.7,78.2 L77.7,86.4 L22.2,85.7 L13.6,77.7 L14.3,21.8 Z" fill="none" stroke="#1C1412" stroke-width="1.5" stroke-linejoin="round" opacity="0.65"/>

  <!-- 扫光时闪一下的小四角星（平时 opacity="0"，动画关闭时不显示） -->
  <g id="glint_star" opacity="0"><!-- pivot: 67,26 -->
    <path d="M67,17 L69.4,23.6 L76,26 L69.4,28.4 L67,35 L64.6,28.4 L58,26 L64.6,23.6 Z" fill="#FFFFFF" stroke="#1C1412" stroke-width="1.1" stroke-linejoin="round"/>
  </g>
</g>
</svg>
