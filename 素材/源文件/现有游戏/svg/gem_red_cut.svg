<svg xmlns="http://www.w3.org/2000/svg" class="svg-gem_red_cut" viewBox="0 0 100 100" width="100" height="100">
<title>红宝石 · 切好</title>
<style>
.svg-gem_red_cut g { transform-box: view-box; }
.svg-gem_red_cut #root { transform-origin: 50px 50px; }
.svg-gem_red_cut #sweep_wrap { opacity: 0; }
.svg-gem_red_cut #sweep_band { transform-origin: 50px 50px; }
.svg-gem_red_cut #glint_star { transform-origin: 65px 28px; opacity: 0; }

/* 待机（3.4s 循环）：一道光从刻面上斜着扫过，同时一颗小四角星闪一下；动画关闭时保持原貌 */
@keyframes svg-gem_red_cut-sweep-wrap {
  0%, 10%, 42%, 100% { opacity: 0; }
  16%, 34% { opacity: 1; }
}
@keyframes svg-gem_red_cut-sweep-band {
  0%, 10% { transform: translate(-54px, -54px); }
  40%, 100% { transform: translate(54px, 54px); }
}
@keyframes svg-gem_red_cut-glint-star {
  0%, 18%, 46%, 100% { opacity: 0; transform: scale(0.35) rotate(-15deg); }
  26% { opacity: 1; transform: scale(1.08) rotate(0deg); }
  34% { opacity: 0.92; transform: scale(0.95) rotate(8deg); }
}
.svg-gem_red_cut:not([data-anim]) #sweep_wrap,
.svg-gem_red_cut[data-anim="idle"] #sweep_wrap {
  animation: svg-gem_red_cut-sweep-wrap 3.4s linear infinite;
}
.svg-gem_red_cut:not([data-anim]) #sweep_band,
.svg-gem_red_cut[data-anim="idle"] #sweep_band {
  animation: svg-gem_red_cut-sweep-band 3.4s steps(10, end) infinite;
}
.svg-gem_red_cut:not([data-anim]) #glint_star,
.svg-gem_red_cut[data-anim="idle"] #glint_star {
  animation: svg-gem_red_cut-glint-star 3.4s steps(8, end) infinite;
}
</style>
<defs>
  <linearGradient id="gem_red_cut-base" x1="15%" y1="10%" x2="85%" y2="90%">
    <stop offset="0%" stop-color="#E3263A"/>
    <stop offset="55%" stop-color="#E3263A"/>
    <stop offset="100%" stop-color="#9E1424"/>
  </linearGradient>
  <clipPath id="gem_red_cut-clip">
    <path d="M50,12 L69,16 L83,30 L88,50 L83,70 L69,84 L50,88 L31,84 L17,70 L12,50 L17,30 L31,16 Z"/>
  </clipPath>
</defs>
<g id="root">
  <!-- pivot: 50,50 -->
  <!-- 宝石底色 -->
  <path d="M50,12 L69,16 L83,30 L88,50 L83,70 L69,84 L50,88 L31,84 L17,70 L12,50 L17,30 L31,16 Z" fill="url(#gem_red_cut-base)"/>
  <!-- 左上冠部受光刻面 -->
  <polygon points="50,12 69,16 59,28 41,28 31,16" fill="#FF5C6E"/>
  <polygon points="31,16 41,28 28,41 17,30" fill="#FF5C6E"/>
  <polygon points="17,30 28,41 28,59 12,50" fill="#E3263A"/>
  <!-- 右下冠部背光暗刻面 -->
  <polygon points="69,16 83,30 72,41 59,28" fill="#E3263A"/>
  <polygon points="83,30 88,50 72,59 72,41" fill="#9E1424"/>
  <polygon points="88,50 83,70 69,84 59,72 72,59" fill="#5C0A14"/>
  <polygon points="59,72 69,84 50,88 31,84 41,72" fill="#9E1424"/>
  <polygon points="31,84 17,70 12,50 28,59 41,72" fill="#9E1424" opacity="0.85"/>
  <!-- 中央八角台面 -->
  <path d="M41,28 L59,28 L72,41 L72,59 L59,72 L41,72 L28,59 L28,41 Z" fill="#E3263A"/>

  <!-- 内部亭部折射折线 -->
  <path d="M41,28 L59,72 M59,28 L41,72 M28,41 L72,59 M28,59 L72,41" stroke="#9E1424" stroke-width="1.1" opacity="0.35"/>

  <!-- 斜向刻面扫光（平时 opacity="0"，裁剪在宝石轮廓内） -->
  <g id="sweep_wrap" clip-path="url(#gem_red_cut-clip)" opacity="0">
    <g id="sweep_band"><!-- pivot: 50,50 -->
      <polygon points="10,74 74,10 88,24 24,88" fill="#FFD6DC" opacity="0.42"/>
      <polygon points="16,78 78,16 84,22 22,84" fill="#FFFFFF" opacity="0.82"/>
    </g>
  </g>

  <!-- 刻面分界线 -->
  <path d="M41,28 L59,28 L72,41 L72,59 L59,72 L41,72 L28,59 L28,41 Z M50,12 L50,28 M69,16 L59,28 M83,30 L72,41 M88,50 L72,50 M83,70 L72,59 M69,84 L59,72 M50,88 L50,72 M31,84 L41,72 M17,70 L28,59 M12,50 L28,50 M17,30 L28,41 M31,16 L41,28" fill="none" stroke="#1C1412" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- 台面高光 -->
  <polygon points="34,39 43,31 55,31 41,47" fill="#E6DEC8" opacity="0.92"/>
  <circle cx="33" cy="27" r="2.6" fill="#FFFFFF" opacity="0.95"/>
  <!-- 手绘双层哥特外框 -->
  <path d="M50,12 L69,16 L83,30 L88,50 L83,70 L69,84 L50,88 L31,84 L17,70 L12,50 L17,30 L31,16 Z" fill="none" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M50,11.5 L69.5,16.5 L83.5,30.5 L88.5,50 L82.5,69.5 L68.5,84.5 L50,88.5 L30.5,83.5 L16.5,69.5 L11.5,50 L16.5,29.5 L31.5,15.5 Z" fill="none" stroke="#1C1412" stroke-width="1.5" stroke-linejoin="round" opacity="0.65"/>

  <!-- 扫光时闪一下的小四角星（平时 opacity="0"，动画关闭时不显示） -->
  <g id="glint_star" opacity="0"><!-- pivot: 65,28 -->
    <path d="M65,19 L67.4,25.6 L74,28 L67.4,30.4 L65,37 L62.6,30.4 L56,28 L62.6,25.6 Z" fill="#FFFFFF" stroke="#1C1412" stroke-width="1.1" stroke-linejoin="round"/>
  </g>
</g>
</svg>
