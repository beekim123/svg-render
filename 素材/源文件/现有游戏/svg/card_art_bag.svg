<svg xmlns="http://www.w3.org/2000/svg" class="svg-card_art_bag" viewBox="0 0 176 188" width="176" height="188">
<title>额外牌原画 · 口袋</title>
<style>
.svg-card_art_bag g { transform-box: view-box; }
.svg-card_art_bag #root { transform-origin: 98px 116px; }
.svg-card_art_bag #shadow { transform-origin: 98px 166px; }
.svg-card_art_bag #bag_back { transform-origin: 98px 158px; }
.svg-card_art_bag #card_1 { transform-origin: 82px 84px; }
.svg-card_art_bag #card_2 { transform-origin: 114px 86px; }
.svg-card_art_bag #bag_front { transform-origin: 98px 158px; }
.svg-card_art_bag #strings { transform-origin: 98px 92px; }
.svg-card_art_bag #clasp { transform-origin: 98px 120px; }
.svg-card_art_bag #pop_fx { transform-origin: 98px 64px; opacity: 0; }

/* ==========================================================================
   1. 待机 idle（2500ms 循环）：两张牌在敞开的袋口一起一伏，袋身轻柔呼吸
   关键时间点：0ms(0%) 低 → 1250ms(50%) 高 → 2500ms(100%) 低
   ========================================================================== */
@keyframes svg-card_art_bag-idle-card1 {
  0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
  50% { transform: translate(-1px, -6px) rotate(-2deg); }
}
@keyframes svg-card_art_bag-idle-card2 {
  0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
  50% { transform: translate(1px, -6px) rotate(2deg); }
}
@keyframes svg-card_art_bag-idle-bag {
  0%, 100% { transform: translate(0px, 0px) scale(1, 1); }
  50% { transform: translate(0px, -2px) scale(1.01, 0.99); }
}
@keyframes svg-card_art_bag-idle-strings {
  0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
  50% { transform: translate(0px, -2px) rotate(3deg); }
}
@keyframes svg-card_art_bag-idle-clasp {
  0%, 100% { transform: translate(0px, 0px) scale(1, 1); }
  50% { transform: translate(0px, -2.5px) scale(1.02, 1.02); }
}
@keyframes svg-card_art_bag-idle-shadow {
  0%, 100% { transform: scale(1, 1); }
  50% { transform: scale(0.96, 0.96); }
}
.svg-card_art_bag:not([data-anim]) #card_1,
.svg-card_art_bag[data-anim="idle"] #card_1 {
  animation: svg-card_art_bag-idle-card1 2.5s ease-in-out infinite;
}
.svg-card_art_bag:not([data-anim]) #card_2,
.svg-card_art_bag[data-anim="idle"] #card_2 {
  animation: svg-card_art_bag-idle-card2 2.5s ease-in-out infinite;
}
.svg-card_art_bag:not([data-anim]) #bag_back,
.svg-card_art_bag[data-anim="idle"] #bag_back,
.svg-card_art_bag:not([data-anim]) #bag_front,
.svg-card_art_bag[data-anim="idle"] #bag_front {
  animation: svg-card_art_bag-idle-bag 2.5s ease-in-out infinite;
}
.svg-card_art_bag:not([data-anim]) #strings,
.svg-card_art_bag[data-anim="idle"] #strings {
  animation: svg-card_art_bag-idle-strings 2.5s ease-in-out infinite;
}
.svg-card_art_bag:not([data-anim]) #clasp,
.svg-card_art_bag[data-anim="idle"] #clasp {
  animation: svg-card_art_bag-idle-clasp 2.5s ease-in-out infinite;
}
.svg-card_art_bag:not([data-anim]) #shadow,
.svg-card_art_bag[data-anim="idle"] #shadow {
  animation: svg-card_art_bag-idle-shadow 2.5s ease-in-out infinite;
}

/* ==========================================================================
   2. 打出 play（600ms）
   关键时间点：0ms(0%) → 150ms(25%) 袋口一张 → 300ms(50%) 第一张弹出飞到画框上沿
               → 450ms(75%) 第二张跟着弹出 → 600ms(100%) 袋口合回待机
   ========================================================================== */
@keyframes svg-card_art_bag-play-bag {
  0% { transform: translate(0px, 0px) scale(1, 1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  25% { transform: translate(0px, 5px) scale(1.08, 0.90); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  50% { transform: translate(0px, -4px) scale(0.95, 1.05); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  75% { transform: translate(0px, -2px) scale(0.97, 1.03); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px, 0px) scale(1, 1); }
}
@keyframes svg-card_art_bag-play-card1 {
  0% { transform: translate(0px, 0px) rotate(0deg) scale(1, 1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  25% { transform: translate(-2px, 5px) rotate(-3deg) scale(0.97, 0.95); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  50% { transform: translate(-6px, -32px) rotate(-5deg) scale(1.05, 1.05); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  75% { transform: translate(-8px, -28px) rotate(-7deg) scale(1.02, 1.02); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px, 0px) rotate(0deg) scale(1, 1); }
}
@keyframes svg-card_art_bag-play-card2 {
  0% { transform: translate(0px, 0px) rotate(0deg) scale(1, 1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  25% { transform: translate(2px, 5px) rotate(3deg) scale(0.97, 0.95); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  50% { transform: translate(3px, -10px) rotate(3deg) scale(1.01, 1.01); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  75% { transform: translate(6px, -32px) rotate(6deg) scale(1.05, 1.05); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px, 0px) rotate(0deg) scale(1, 1); }
}
@keyframes svg-card_art_bag-play-strings {
  0% { transform: translate(0px, 0px) rotate(0deg); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  25% { transform: translate(0px, 4px) rotate(5deg); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  50% { transform: translate(0px, -4px) rotate(-5deg); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  75% { transform: translate(0px, -2px) rotate(-3deg); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px, 0px) rotate(0deg); }
}
@keyframes svg-card_art_bag-play-clasp {
  0% { transform: translate(0px, 0px) scale(1, 1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  25% { transform: translate(0px, 5px) scale(1.08, 0.94); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  50% { transform: translate(0px, -5px) scale(1.05, 1.05); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  75% { transform: translate(0px, -3px) scale(1.03, 1.03); animation-timing-function: ease-in-out; }
  100% { transform: translate(0px, 0px) scale(1, 1); }
}
@keyframes svg-card_art_bag-play-fx {
  0% { opacity: 0; transform: translate(0px, 8px) scale(0.75); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  25% { opacity: 0.4; transform: translate(0px, 4px) scale(0.88); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  50% { opacity: 1; transform: translate(0px, -6px) scale(1.02); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  75% { opacity: 0.95; transform: translate(0px, -12px) scale(1.06); animation-timing-function: ease-in-out; }
  100% { opacity: 0; transform: translate(0px, -4px) scale(0.85); }
}
@keyframes svg-card_art_bag-play-shadow {
  0% { transform: scale(1, 1); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  25% { transform: scale(1.08, 0.92); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  50% { transform: scale(0.92, 0.92); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  75% { transform: scale(0.94, 0.94); animation-timing-function: ease-in-out; }
  100% { transform: scale(1, 1); }
}
.svg-card_art_bag[data-anim="play"] #bag_back,
.svg-card_art_bag[data-anim="play"] #bag_front { animation: svg-card_art_bag-play-bag 0.6s both; }
.svg-card_art_bag[data-anim="play"] #card_1 { animation: svg-card_art_bag-play-card1 0.6s both; }
.svg-card_art_bag[data-anim="play"] #card_2 { animation: svg-card_art_bag-play-card2 0.6s both; }
.svg-card_art_bag[data-anim="play"] #strings { animation: svg-card_art_bag-play-strings 0.6s both; }
.svg-card_art_bag[data-anim="play"] #clasp { animation: svg-card_art_bag-play-clasp 0.6s both; }
.svg-card_art_bag[data-anim="play"] #pop_fx { animation: svg-card_art_bag-play-fx 0.6s both; }
.svg-card_art_bag[data-anim="play"] #shadow { animation: svg-card_art_bag-play-shadow 0.6s both; }
</style>

<defs>
  <radialGradient id="card_art_bag-gem-glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#5CE892" stop-opacity="0.55"/>
    <stop offset="65%" stop-color="#1DBF5E" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#1DBF5E" stop-opacity="0"/>
  </radialGradient>
</defs>

<g id="root">
  <!-- pivot: 98,116 -->
  <!-- 左上角 x:0..30, y:0..90 严格留空 -->

  <!-- 落地暗影 -->
  <g id="shadow">
    <!-- pivot: 98,166 -->
    <ellipse cx="98" cy="166" rx="48" ry="8" fill="#0D111C" opacity="0.62"/>
  </g>

  <!-- 敞开袋口的后沿与深暗内腔（位于两张牌背底层） -->
  <g id="bag_back">
    <!-- pivot: 98,158 -->
    <path d="M52,88 Q62,72 98,72 Q134,72 144,88 L140,104 L56,104 Z" fill="#3D2212" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <ellipse cx="98" cy="88" rx="42" ry="13" fill="#0D111C" stroke="#1C1412" stroke-width="2.6"/>
    <ellipse cx="98" cy="90" rx="36" ry="9" fill="#161221"/>
  </g>

  <!-- 第一张牌背 card_1（左侧微倾，严格照 card_back.svg 缩小，完整画出下半截保证弹出不露缝） -->
  <g id="card_1">
    <!-- pivot: 82,84 -->
    <g transform="rotate(-9 82 84)">
      <!-- 牌背暗紫底板 (44×64, x:58..102, y:44..108) -->
      <rect x="58" y="44" width="44" height="64" rx="4" fill="#262036" stroke="#1C1412" stroke-width="2.6"/>
      <rect x="61" y="47" width="38" height="58" rx="2.5" fill="#161221" stroke="#6E542B" stroke-width="1.2"/>
      <!-- 哥特菱格暗纹与四角铜饰 -->
      <polygon points="80,50 95,76 80,102 65,76" fill="none" stroke="#3A324D" stroke-width="1.1"/>
      <path d="M62,53 V48 H67 M93,48 H98 V53 M62,99 V104 H67 M93,104 H98 V99" fill="none" stroke="#C2A670" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="80,48 84,52 80,56 76,52" fill="#9A7B46" stroke="#1C1412" stroke-width="1"/>
      <!-- 正中八角铜盾徽记（上移至牌背上半截 y:55..87，确保在袋口清晰露出三色宝石） -->
      <polygon points="80,54 94,63 96,75 89,86 80,90 71,86 64,75 66,63" fill="#6E542B" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
      <polygon points="80,57 91,65 92,74 87,83 80,86 73,83 68,74 69,65" fill="#161221" stroke="#9A7B46" stroke-width="1"/>
      <!-- 三色宝石徽记：上红圆、左绿方、右蓝三角 -->
      <circle cx="80" cy="65" r="5.2" fill="#E3263A" stroke="#1C1412" stroke-width="1.4"/>
      <circle cx="78.5" cy="63.5" r="1.8" fill="#FFFFFF" opacity="0.92"/>
      <rect x="70" y="72" width="8.5" height="8.5" rx="1" fill="#1DBF5E" stroke="#1C1412" stroke-width="1.4"/>
      <rect x="71.5" y="73.5" width="3.2" height="3.2" fill="#5CE892"/>
      <polygon points="86,71 91.5,80.5 80.5,80.5" fill="#2E66F0" stroke="#1C1412" stroke-width="1.4" stroke-linejoin="round"/>
      <polygon points="86,73.5 88.5,79 83.5,79" fill="#6B9BFF"/>
    </g>
  </g>

  <!-- 第二张牌背 card_2（右侧微倾，与第一张并排交叠，一眼看出「摸 2 张」） -->
  <g id="card_2">
    <!-- pivot: 114,86 -->
    <g transform="rotate(9 114 86)">
      <!-- 牌背暗紫底板 (44×64, x:92..136, y:46..110) -->
      <rect x="92" y="46" width="44" height="64" rx="4" fill="#262036" stroke="#1C1412" stroke-width="2.6"/>
      <rect x="95" y="49" width="38" height="58" rx="2.5" fill="#161221" stroke="#6E542B" stroke-width="1.2"/>
      <!-- 哥特菱格暗纹与四角铜饰 -->
      <polygon points="114,52 129,78 114,104 99,78" fill="none" stroke="#3A324D" stroke-width="1.1"/>
      <path d="M96,55 V50 H101 M127,50 H132 V55 M96,101 V106 H101 M127,106 H132 V101" fill="none" stroke="#C2A670" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="114,50 118,54 114,58 110,54" fill="#9A7B46" stroke="#1C1412" stroke-width="1"/>
      <!-- 正中八角铜盾徽记 -->
      <polygon points="114,56 128,65 130,77 123,88 114,92 105,88 98,77 100,65" fill="#6E542B" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
      <polygon points="114,59 125,67 126,76 121,85 114,88 107,85 102,76 103,67" fill="#161221" stroke="#9A7B46" stroke-width="1"/>
      <!-- 三色宝石徽记：上红圆、左绿方、右蓝三角 -->
      <circle cx="114" cy="67" r="5.2" fill="#E3263A" stroke="#1C1412" stroke-width="1.4"/>
      <circle cx="112.5" cy="65.5" r="1.8" fill="#FFFFFF" opacity="0.92"/>
      <rect x="104" y="74" width="8.5" height="8.5" rx="1" fill="#1DBF5E" stroke="#1C1412" stroke-width="1.4"/>
      <rect x="105.5" y="75.5" width="3.2" height="3.2" fill="#5CE892"/>
      <polygon points="120,73 125.5,82.5 114.5,82.5" fill="#2E66F0" stroke="#1C1412" stroke-width="1.4" stroke-linejoin="round"/>
      <polygon points="120,75.5 122.5,81 117.5,81" fill="#6B9BFF"/>
    </g>
  </g>

  <!-- play 时弹出气流与绿宝石星芒特效 pop_fx（平时 opacity="0"，范围 x:44..152, y:18..76） -->
  <g id="pop_fx" opacity="0">
    <!-- pivot: 98,64 -->
    <path d="M52,58 L44,42 M98,38 L98,22 M144,58 L152,42" stroke="#E6DEC8" stroke-width="2.4" stroke-linecap="round"/>
    <polygon points="56,30 59,36 65,39 59,42 56,48 53,42 47,39 53,36" fill="#5CE892" stroke="#1C1412" stroke-width="1.3" stroke-linejoin="round"/>
    <polygon points="140,28 143,34 149,37 143,40 140,46 137,40 131,37 137,34" fill="#1DBF5E" stroke="#1C1412" stroke-width="1.3" stroke-linejoin="round"/>
  </g>

  <!-- 旧皮口袋前袋身与外翻袋口沿 bag_front（遮住两张牌背的下半截） -->
  <g id="bag_front">
    <!-- pivot: 98,158 -->
    <!-- 主袋肚（范围 x:42..152, y:88..164） -->
    <path d="M54,88 Q98,98 142,88 L150,122 L144,152 L120,164 L74,164 L48,150 L44,118 Z" fill="#704122" stroke="#1C1412" stroke-width="3" stroke-linejoin="round"/>
    <!-- 袋身右侧背光暗面 -->
    <path d="M98,93 Q120,93 142,88 L150,122 L144,152 L120,164 L94,164 Q108,128 98,93 Z" fill="#3D2212" opacity="0.82"/>
    <!-- 袋身左侧冷受光边 -->
    <path d="M56,92 L48,119 L52,147 L75,160" fill="none" stroke="#C48A5C" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
    <!-- 左下旧羊皮纸补丁与手工缝线 -->
    <polygon points="54,126 78,122 82,148 58,152" fill="#9A8968" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <path d="M52,130 L58,129 M53,138 L59,137 M55,146 L61,145 M75,126 L81,125 M77,135 L83,134 M78,143 L84,142" stroke="#1C1412" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 右侧背光交叉排线 -->
    <path d="M116,120 L140,144 M110,130 L134,154 M104,140 L124,160 M124,116 L144,136" stroke="#1C1412" stroke-width="1.2" opacity="0.48"/>
    <path d="M138,122 L114,146 M140,134 L118,156" stroke="#1C1412" stroke-width="1" opacity="0.35"/>

    <!-- 敞开外翻的厚皮袋口领边（清晰勾勒袋口张开弧度） -->
    <path d="M48,86 Q98,100 148,86 L142,102 Q98,114 54,102 Z" fill="#9E6238" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M98,93 Q123,93 148,86 L142,102 Q120,108 98,108 Z" fill="#704122" opacity="0.82"/>
    <path d="M52,89 Q98,101 144,89" fill="none" stroke="#E2D6BA" stroke-width="1.8" stroke-linecap="round" opacity="0.82"/>
  </g>

  <!-- 袋口抽绳组 strings -->
  <g id="strings">
    <!-- pivot: 98,92 -->
    <path d="M54,96 Q98,108 142,96" fill="none" stroke="#3D2212" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M54,96 Q98,108 142,96" fill="none" stroke="#C8B894" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>
    <path d="M138,94 Q152,104 150,124" fill="none" stroke="#C8B894" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M138,94 Q152,104 150,124" fill="none" stroke="#1C1412" stroke-width="1.2" stroke-linecap="round"/>
    <polygon points="146,122 154,122 156,132 144,132" fill="#9A7B46" stroke="#1C1412" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- 袋身正中绿色方宝石搭扣 clasp -->
  <g id="clasp">
    <!-- pivot: 98,120 -->
    <circle cx="98" cy="120" r="24" fill="url(#card_art_bag-gem-glow)"/>
    <!-- 旧铜方形搭扣底座 -->
    <polygon points="80,102 116,102 120,136 98,144 76,136" fill="#6E542B" stroke="#1C1412" stroke-width="2.4" stroke-linejoin="round"/>
    <polygon points="83,105 113,105 116,133 98,139 80,133" fill="#9A7B46" stroke="#1C1412" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- 搭扣中央镶嵌的鲜艳绿色方宝石 -->
    <rect x="85" y="107" width="26" height="26" rx="2.5" fill="#1DBF5E" stroke="#1C1412" stroke-width="2.2"/>
    <polygon points="85,107 111,107 105,113 91,113" fill="#5CE892"/>
    <polygon points="85,107 91,113 91,127 85,133" fill="#5CE892"/>
    <polygon points="111,107 111,133 85,133 91,127 105,127 105,113" fill="#117A3B"/>
    <rect x="91" y="113" width="14" height="14" rx="1" fill="#1DBF5E" stroke="#1C1412" stroke-width="1.2"/>
    <polygon points="93,115 101,115 97,121 93,121" fill="#FFFFFF" opacity="0.92"/>
    <rect x="87" y="109" width="4" height="2" rx="0.5" fill="#FFFFFF" opacity="0.95"/>
  </g>
</g>
</svg>
