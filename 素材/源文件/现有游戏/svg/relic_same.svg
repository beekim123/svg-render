<svg xmlns="http://www.w3.org/2000/svg" class="svg-relic_same" viewBox="0 0 96 96" width="96" height="96">
<title>宝物 · 同色也翻倍</title>
<g id="root">
  <!-- 左耳坠（与右耳坠一模一样：旧铜弯钩 + 菱形铜托 + 鲜艳绿方宝石） -->
  <g id="earring_left">
    <!-- 顶部旧铜耳钩与吊环 -->
    <path d="M18,22 C18,11 32,11 32,20 C32,25 28,28 28,33" fill="none" stroke="#1C1412" stroke-width="6.8" stroke-linecap="round"/>
    <path d="M18,22 C18,11 32,11 32,20 C32,25 28,28 28,33" fill="none" stroke="#9A7B46" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="28" cy="35" r="4" fill="#C2A670" stroke="#1C1412" stroke-width="2.4"/>

    <!-- 旧铜哥特菱形坠托 -->
    <polygon points="28,38 45,56 28,84 11,56" fill="#9A7B46" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
    <polygon points="28,38 45,56 28,84" fill="#6E542B" opacity="0.82"/>
    <polyline points="14,56 28,41" fill="none" stroke="#E2D6BA" stroke-width="2" stroke-linecap="round"/>
    <polygon points="28,38 45,56 28,84 11,56" fill="none" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>

    <!-- 镶嵌的鲜艳同色绿方宝石（斜放正方切面） -->
    <polygon points="28,45 39,56 28,67 17,56" fill="#1DBF5E" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <polygon points="28,45 39,56 28,67" fill="#117A3B"/>
    <polygon points="28,50 34,56 28,62 22,56" fill="#5CE892" stroke="#1C1412" stroke-width="1.4" stroke-linejoin="round"/>
    <polygon points="25,52 29,51 28,56 23,55" fill="#FFFFFF" opacity="0.95"/>
    <!-- 底部铜坠珠 -->
    <circle cx="28" cy="85" r="4" fill="#6E542B" stroke="#1C1412" stroke-width="2.4"/>
  </g>

  <!-- 右耳坠（与左耳坠完全一模一样，平移 x+40，强化“同色成对”识别度） -->
  <g id="earring_right" transform="translate(40, 0)">
    <path d="M18,22 C18,11 32,11 32,20 C32,25 28,28 28,33" fill="none" stroke="#1C1412" stroke-width="6.8" stroke-linecap="round"/>
    <path d="M18,22 C18,11 32,11 32,20 C32,25 28,28 28,33" fill="none" stroke="#9A7B46" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="28" cy="35" r="4" fill="#C2A670" stroke="#1C1412" stroke-width="2.4"/>

    <polygon points="28,38 45,56 28,84 11,56" fill="#9A7B46" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
    <polygon points="28,38 45,56 28,84" fill="#6E542B" opacity="0.82"/>
    <polyline points="14,56 28,41" fill="none" stroke="#E2D6BA" stroke-width="2" stroke-linecap="round"/>
    <polygon points="28,38 45,56 28,84 11,56" fill="none" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>

    <polygon points="28,45 39,56 28,67 17,56" fill="#1DBF5E" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <polygon points="28,45 39,56 28,67" fill="#117A3B"/>
    <polygon points="28,50 34,56 28,62 22,56" fill="#5CE892" stroke="#1C1412" stroke-width="1.4" stroke-linejoin="round"/>
    <polygon points="25,52 29,51 28,56 23,55" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="28" cy="85" r="4" fill="#6E542B" stroke="#1C1412" stroke-width="2.4"/>
  </g>
</g>
</svg>
