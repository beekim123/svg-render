<svg xmlns="http://www.w3.org/2000/svg" class="svg-ui_node_boss" viewBox="0 0 64 64" width="64" height="64">
<title>进度节点 · 首领</title>
<g id="root">
  <!-- 首领圆底：同系列哥特旧铜圆章，但尺寸比普通/精英稍大（半径约 27），外缘带 4 个凶悍尖刺角 -->
  <polygon points="32,3 37,7 46,8 56,6 54,16 59,25 61,32 58,42 56,54 46,53 39,58 32,61 25,58 18,53 8,54 6,42 3,32 5,25 10,16 8,6 18,8 27,7" fill="#6E542B" stroke="#1C1412" stroke-width="3" stroke-linejoin="round"/>
  <!-- 右下背光铜暗面 -->
  <polygon points="46,8 56,6 54,16 59,25 61,32 58,42 56,54 46,53 39,58 32,61 25,58 32,32" fill="#3B2B14" opacity="0.85"/>
  <!-- 左上受光亮边 -->
  <polyline points="6,39 5,32 6.8,25 11.8,16.5 10,8.5 18,9.8 27,8.8 32,5.2" fill="none" stroke="#C2A670" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 内部暗夜紫与暗酒红深渊圆盘（比普通节点略大 r=21） -->
  <circle cx="32" cy="33" r="21" fill="#161221" stroke="#1C1412" stroke-width="2.6"/>
  <path d="M15,24 A19,19 0 0,1 49,24 A19,16 0 0,0 15,24 Z" fill="#381318" opacity="0.85"/>

  <!-- 中央图案：凶悍的哥特恶龙龙头剪影（双弯角 + 怒张大嘴尖牙 + 冷冽竖瞳，不发光） -->
  <g id="dragon_head">
    <!-- 后排右龙角（暗铜色） -->
    <polygon points="34,20 48,9 54,12 43,25" fill="#9A7B46" stroke="#1C1412" stroke-width="2.4" stroke-linejoin="round"/>
    <!-- 前排左龙角（亮羊皮骨色 + 暗面，向左上扬起） -->
    <polygon points="24,22 10,9 18,7 32,19" fill="#E2D6BA" stroke="#1C1412" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="24,22 14,13 18,11 29,20" fill="#9A8968"/>

    <!-- 龙头主体与张开的下颚剪影（朝向右下咆哮，造型尖锐微歪） -->
    <path d="M14,29 L21,19 L35,18 L49,25 L52,31 L42,35 L49,42 L44,49 L27,48 L18,41 Z" fill="#5A7682" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <!-- 龙头背光暗面（下半部与颈部） -->
    <path d="M18,41 L27,48 L44,49 L49,42 L42,35 L30,35 L20,33 Z" fill="#3B515C"/>
    <!-- 口腔深渊与上下利齿 -->
    <polygon points="31,33 50,30 43,36 47,42 32,42" fill="#161221" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="36,32 39,37 42,31 45,36 48,31" fill="#E2D6BA" stroke="#1C1412" stroke-width="1.4" stroke-linejoin="round"/>
    <polygon points="35,42 38,37 41,42 44,37 46,42" fill="#E2D6BA" stroke="#1C1412" stroke-width="1.4" stroke-linejoin="round"/>

    <!-- 鼻尖棘刺与左上冷高光 -->
    <polyline points="16,28 22,20.8 34.5,19.8 46,25.5" fill="none" stroke="#8CAAB5" stroke-width="1.8" stroke-linecap="round"/>

    <!-- 凶狠斜三角龙眼（暗酒红眼白 + 羊皮纸亮边，不加暖光） -->
    <polygon points="24,26 35,24 32,31 23,30" fill="#8C3B45" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="27,26 32,25.5 30,30 26,29.5" fill="#E2D6BA"/>
    <line x1="29.5" y1="25.5" x2="29" y2="30" stroke="#1C1412" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</g>
</svg>
