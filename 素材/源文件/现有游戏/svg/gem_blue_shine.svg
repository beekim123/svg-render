<svg xmlns="http://www.w3.org/2000/svg" class="svg-gem_blue_shine" viewBox="0 0 100 100" width="100" height="100">
<title>蓝宝石 · 闪光</title>
<style>
.svg-gem_blue_shine g { transform-box: view-box; }
.svg-gem_blue_shine #root { transform-origin: 50px 50px; }
.svg-gem_blue_shine #halo { transform-origin: 50px 50px; }
.svg-gem_blue_shine #star_1 { transform-origin: 28px 22px; }
.svg-gem_blue_shine #star_2 { transform-origin: 78px 30px; }
.svg-gem_blue_shine #star_3 { transform-origin: 20px 62px; }

/* 待机（3.2s 循环）：外圈淡光慢慢一呼一吸，三颗四角星轮流闪；动画关闭时与原静态稿完全一致 */
@keyframes svg-gem_blue_shine-halo {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(0.88); opacity: 0.52; }
}
@keyframes svg-gem_blue_shine-star1 {
  0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
  22% { transform: scale(1.08) rotate(6deg); opacity: 1; }
  56% { transform: scale(0.52) rotate(-8deg); opacity: 0.25; }
  84% { transform: scale(0.78) rotate(0deg); opacity: 0.65; }
}
@keyframes svg-gem_blue_shine-star2 {
  0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
  24% { transform: scale(0.5) rotate(-8deg); opacity: 0.22; }
  54% { transform: scale(1.1) rotate(6deg); opacity: 1; }
  80% { transform: scale(0.68) rotate(0deg); opacity: 0.48; }
}
@keyframes svg-gem_blue_shine-star3 {
  0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
  34% { transform: scale(0.65) rotate(6deg); opacity: 0.42; }
  60% { transform: scale(0.48) rotate(-6deg); opacity: 0.2; }
  86% { transform: scale(1.12) rotate(4deg); opacity: 1; }
}
.svg-gem_blue_shine:not([data-anim]) #halo,
.svg-gem_blue_shine[data-anim="idle"] #halo {
  animation: svg-gem_blue_shine-halo 3.2s ease-in-out infinite;
}
.svg-gem_blue_shine:not([data-anim]) #star_1,
.svg-gem_blue_shine[data-anim="idle"] #star_1 {
  animation: svg-gem_blue_shine-star1 3.2s steps(8, end) infinite;
}
.svg-gem_blue_shine:not([data-anim]) #star_2,
.svg-gem_blue_shine[data-anim="idle"] #star_2 {
  animation: svg-gem_blue_shine-star2 3.2s steps(8, end) infinite;
}
.svg-gem_blue_shine:not([data-anim]) #star_3,
.svg-gem_blue_shine[data-anim="idle"] #star_3 {
  animation: svg-gem_blue_shine-star3 3.2s steps(8, end) infinite;
}
</style>
<defs>
<linearGradient id="gem_blue_shine-base" x1="15%" y1="10%" x2="85%" y2="90%">
        <stop offset="0%" stop-color="#6B9BFF"/>
        <stop offset="55%" stop-color="#2E66F0"/>
        <stop offset="100%" stop-color="#193D9E"/>
      </linearGradient>
      <radialGradient id="gem_blue_shine-halo" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#6B9BFF" stop-opacity="0.55"/>
        <stop offset="68%" stop-color="#2E66F0" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="#2E66F0" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="gem_blue_shine-inner" cx="42%" cy="38%" r="48%">
        <stop offset="0%" stop-color="#F0F5FF" stop-opacity="0.9"/>
        <stop offset="45%" stop-color="#6B9BFF" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#2E66F0" stop-opacity="0"/>
      </radialGradient>
</defs>
<g id="root">
  <!-- pivot: 50,50 -->
  <g id="halo"><!-- pivot: 50,50 -->
    <circle cx="50" cy="50" r="48" fill="url(#gem_blue_shine-halo)"/>
  </g>
        <!-- 宝石底色 -->
        <path d="M47,12 L53,12 L88,78 L84,84 L16,84 L12,78 Z" fill="url(#gem_blue_shine-base)"/>
        <!-- 左侧受光斜刻面 -->
        <polygon points="47,12 50,30 30,68 12,78" fill="#D9E6FF"/>
        <polygon points="47,12 53,12 50,30" fill="#6B9BFF"/>
        <!-- 右侧背光斜刻面 -->
        <polygon points="53,12 88,78 70,68 50,30" fill="#193D9E"/>
        <!-- 底部暗刻面 -->
        <polygon points="30,68 70,68 84,84 16,84" fill="#0D2159"/>
        <polygon points="12,78 30,68 16,84" fill="#193D9E"/>
        <polygon points="88,78 84,84 70,68" fill="#0D2159"/>
        <!-- 中央三角台面 -->
        <path d="M50,30 L70,68 L30,68 Z" fill="#6B9BFF"/>
        <path d="M50,30 L70,68 L30,68 Z" fill="url(#gem_blue_shine-inner)"/>
        <!-- 亭部内部折射刻面线 -->
        <path d="M50,30 L50,68 M30,68 L60,49 M70,68 L40,49" stroke="#D9E6FF" stroke-width="1.2" opacity="0.68"/>
        <!-- 冠部刻面分界线 -->
        <path d="M50,30 L70,68 L30,68 Z M47,12 L50,30 L53,12 M12,78 L30,68 L16,84 M88,78 L70,68 L84,84 M30,45 L40,49 M70,45 L60,49 M50,68 L50,84" fill="none" stroke="#1C1412" stroke-width="1.5" stroke-linejoin="round"/>
        <!-- 台面高光 -->
        <polygon points="49,35 55,48 41,52" fill="#E6DEC8" opacity="0.92"/>
        <circle cx="40" cy="34" r="2.5" fill="#FFFFFF" opacity="0.95"/>
        <!-- 手绘双层哥特外框 -->
        <path d="M47,12 L53,12 L88,78 L84,84 L16,84 L12,78 Z" fill="none" stroke="#1C1412" stroke-width="3.2" stroke-linejoin="round"/>
        <path d="M46.6,11.6 L53.4,11.8 L88.4,78.2 L83.8,84.4 L16.2,84.2 L11.6,77.6 Z" fill="none" stroke="#1C1412" stroke-width="1.5" stroke-linejoin="round" opacity="0.65"/>
        <!-- 闪光态：内部亮斑与外围三颗四角星闪 -->
        <polygon points="50,44 58,60 42,60" fill="#FFFFFF" opacity="0.52"/>
  <g id="star_1"><!-- pivot: 28,22 -->
    <path d="M28,11 L31.2,18.8 L39,22 L31.2,25.2 L28,33 L24.8,25.2 L17,22 L24.8,18.8 Z" fill="#FFFFFF" stroke="#1C1412" stroke-width="1.2"/>
  </g>
  <g id="star_2"><!-- pivot: 78,30 -->
    <path d="M78,21 L80.6,27.4 L87,30 L80.6,32.6 L78,39 L75.4,32.6 L69,30 L75.4,27.4 Z" fill="#D9E6FF" stroke="#1C1412" stroke-width="1.1"/>
  </g>
  <g id="star_3"><!-- pivot: 20,62 -->
    <path d="M20,54.5 L22.2,59.8 L27.5,62 L22.2,64.2 L20,69.5 L17.8,64.2 L12.5,62 L17.8,59.8 Z" fill="#FFFFFF" stroke="#1C1412" stroke-width="1"/>
  </g>
</g>
</svg>
