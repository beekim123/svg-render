<svg xmlns="http://www.w3.org/2000/svg" class="svg-ui_heart" viewBox="0 0 64 64" width="64" height="64">
<title>心形挂坠</title>
<style>
.svg-ui_heart g { transform-box: view-box; }
.svg-ui_heart #root { transform-origin: 32px 34px; }
.svg-ui_heart #pendant { transform-origin: 32px 35px; }
.svg-ui_heart #gem_intact { transform-origin: 32px 35px; }
.svg-ui_heart #dark_overlay { transform-origin: 32px 35px; opacity: 0; }
.svg-ui_heart #shards_fall { transform-origin: 32px 36px; opacity: 0; }
.svg-ui_heart #gain_flash { transform-origin: 32px 34px; opacity: 0; }

/* 待机（1.6s 循环）：很轻的心跳，放大不超过 6% */
@keyframes svg-ui_heart-idle-beat {
  0%, 62%, 100% { transform: scale(1); }
  16% { transform: scale(1.052); }
  30% { transform: scale(0.99); }
  44% { transform: scale(1.032); }
}
.svg-ui_heart:not([data-anim]) #pendant,
.svg-ui_heart[data-anim="idle"] #pendant {
  animation: svg-ui_heart-idle-beat 1.6s steps(8, end) infinite;
}

/* lose（600ms）：宝石裂开、碎片往下掉、整个暗掉，最后全透明 */
@keyframes svg-ui_heart-lose-root {
  0% { transform: translate(0px, 0px) rotate(0deg); opacity: 1; }
  14% { transform: translate(-2.5px, 0.5px) rotate(-3deg); opacity: 1; }
  28% { transform: translate(2.5px, 1px) rotate(3deg); opacity: 0.95; }
  55% { transform: translate(0px, 2px) rotate(-1deg); opacity: 0.72; }
  82% { transform: translate(0px, 3px) rotate(0deg); opacity: 0.28; }
  100% { transform: translate(0px, 4px) rotate(0deg); opacity: 0; }
}
@keyframes svg-ui_heart-lose-dark {
  0%, 6% { opacity: 0; }
  22%, 100% { opacity: 1; }
}
@keyframes svg-ui_heart-lose-gem {
  0%, 10% { opacity: 1; }
  25%, 100% { opacity: 0.15; }
}
@keyframes svg-ui_heart-lose-shards {
  0%, 8% { opacity: 0; transform: translateY(0px) scale(0.85); }
  18% { opacity: 1; transform: translateY(1px) scale(1); }
  68% { opacity: 0.9; transform: translateY(8px) scale(0.95); }
  100% { opacity: 0; transform: translateY(11px) scale(0.8); }
}
.svg-ui_heart[data-anim="lose"] #root {
  animation: svg-ui_heart-lose-root 0.6s steps(8, end) both;
}
.svg-ui_heart[data-anim="lose"] #dark_overlay {
  animation: svg-ui_heart-lose-dark 0.6s linear both;
}
.svg-ui_heart[data-anim="lose"] #gem_intact {
  animation: svg-ui_heart-lose-gem 0.6s linear both;
}
.svg-ui_heart[data-anim="lose"] #shards_fall {
  animation: svg-ui_heart-lose-shards 0.6s steps(6, end) both;
}

/* gain（500ms）：从小弹出来，闪一下 */
@keyframes svg-ui_heart-gain-root {
  0% { transform: scale(0.22); opacity: 0; }
  52% { transform: scale(1.1); opacity: 1; }
  78% { transform: scale(0.96); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes svg-ui_heart-gain-flash {
  0%, 20%, 100% { opacity: 0; transform: scale(0.5); }
  48% { opacity: 1; transform: scale(1.06); }
  76% { opacity: 0.45; transform: scale(1); }
}
.svg-ui_heart[data-anim="gain"] #root {
  animation: svg-ui_heart-gain-root 0.5s steps(7, end) both;
}
.svg-ui_heart[data-anim="gain"] #gain_flash {
  animation: svg-ui_heart-gain-flash 0.5s steps(6, end) both;
}
</style>
<defs>
  <linearGradient id="ui_heart-ruby" x1="20%" y1="12%" x2="82%" y2="88%">
    <stop offset="0%" stop-color="#FF5C6E"/>
    <stop offset="50%" stop-color="#E3263A"/>
    <stop offset="100%" stop-color="#9E1424"/>
  </linearGradient>
</defs>
<g id="root">
  <!-- pivot: 32,34 -->
  <g id="pendant">
    <!-- pivot: 32,35 -->
    <!-- 顶部旧铜挂环 -->
    <circle cx="32" cy="9.5" r="4.2" fill="none" stroke="#1C1412" stroke-width="4.2"/>
    <circle cx="32" cy="9.5" r="4.2" fill="none" stroke="#9A7B46" stroke-width="2"/>
    <path d="M29.2,7.2 A4,4 0 0,1 34.5,7" fill="none" stroke="#C2A670" stroke-width="1.1" stroke-linecap="round"/>
    <rect x="29.5" y="12" width="5" height="4" rx="1" fill="#6E542B" stroke="#1C1412" stroke-width="1.8"/>

    <!-- 旧铜心形外框（微折角哥特轮廓，范围 x:9..55, y:13..56） -->
    <path d="M32,18 L24,13 L14,16 L9,26 L12,38 L32,56 L52,38 L55,26 L50,16 L40,13 Z" fill="#6E542B" stroke="#1C1412" stroke-width="2.8" stroke-linejoin="round"/>
    <!-- 右下背光铜框暗面 -->
    <path d="M32,18 L40,13 L50,16 L55,26 L52,38 L32,56 L32,49 L47,35 L49,26 L46,19 L39,17 L32,22 Z" fill="#3B2B14" opacity="0.8"/>
    <!-- 左上冷受光铜边高光 -->
    <path d="M30,17 L24,14.8 L15.5,17.5 L11,26.2 L13.5,36.5" fill="none" stroke="#C2A670" stroke-width="1.8" stroke-linecap="round"/>

    <!-- 内部暗色镶嵌空槽底（lose 时露出暗槽） -->
    <path d="M32,22 L25,18 L17,20.5 L14,27.5 L16.5,36.5 L32,50.5 L47.5,36.5 L50,27.5 L47,20.5 L39,18 Z" fill="#161221" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>

    <!-- 鲜艳心形红宝石主体 -->
    <g id="gem_intact">
      <!-- pivot: 32,35 -->
      <path d="M32,22 L25,18 L17,20.5 L14,27.5 L16.5,36.5 L32,50.5 L47.5,36.5 L50,27.5 L47,20.5 L39,18 Z" fill="url(#ui_heart-ruby)"/>
      <!-- 左上受光亮刻面 -->
      <polygon points="32,22 25,18 17,20.5 23,27 32,28" fill="#FF5C6E"/>
      <polygon points="17,20.5 14,27.5 16.5,36.5 23,34 23,27" fill="#FF5C6E" opacity="0.88"/>
      <!-- 右下背光深暗刻面 -->
      <polygon points="39,18 47,20.5 50,27.5 41,27 32,22" fill="#E3263A"/>
      <polygon points="50,27.5 47.5,36.5 32,50.5 32,41 41,34 41,27" fill="#9E1424"/>
      <polygon points="47.5,36.5 32,50.5 32,41 41,34" fill="#5C0A14" opacity="0.75"/>
      <!-- 中央心形台面 -->
      <polygon points="32,27 23,24 20,30 23,36 32,43 41,36 44,30 41,24" fill="#E3263A" stroke="#1C1412" stroke-width="1.2" stroke-linejoin="round"/>
      <!-- 刻面分界线 -->
      <path d="M25,18 L23,24 M17,20.5 L20,30 M16.5,36.5 L23,36 M32,50.5 L32,43 M47.5,36.5 L41,36 M50,27.5 L44,30 M47,20.5 L41,24 M39,18 L41,24" stroke="#1C1412" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 宝石高光斑 -->
      <polygon points="22,25.5 28,24.5 26,30.5 20.5,29.5" fill="#FFFFFF" opacity="0.92"/>
      <circle cx="19" cy="23" r="1.6" fill="#FFFFFF" opacity="0.95"/>
      <!-- 宝石外轮廓线 -->
      <path d="M32,22 L25,18 L17,20.5 L14,27.5 L16.5,36.5 L32,50.5 L47.5,36.5 L50,27.5 L47,20.5 L39,18 Z" fill="none" stroke="#1C1412" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <!-- 三个包边铜爪与铆钉 -->
    <polygon points="12,26 16,25 16,29 12,29" fill="#C2A670" stroke="#1C1412" stroke-width="1.3" stroke-linejoin="round"/>
    <polygon points="52,26 48,25 48,29 52,29" fill="#9A7B46" stroke="#1C1412" stroke-width="1.3" stroke-linejoin="round"/>
    <polygon points="29.5,53 32,49.5 34.5,53 32,56.5" fill="#9A7B46" stroke="#1C1412" stroke-width="1.3" stroke-linejoin="round"/>

    <!-- lose 状态：变暗遮罩与裂纹（平时 opacity="0"） -->
    <g id="dark_overlay" opacity="0">
      <!-- pivot: 32,35 -->
      <path d="M32,18 L24,13 L14,16 L9,26 L12,38 L32,56 L52,38 L55,26 L50,16 L40,13 Z" fill="#2E2C28" opacity="0.72"/>
      <path d="M25,19 L34,31 L27,37 L35,48 M34,31 L45,27 M27,37 L18,34" fill="none" stroke="#1C1412" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M26,20 L34,30 L28,36 L35,47" fill="none" stroke="#948F86" stroke-width="1" stroke-linecap="round"/>
    </g>
  </g>

  <!-- lose 状态：往下掉落的红宝石碎片（平时 opacity="0"，落点严格在 64×64 内） -->
  <g id="shards_fall" opacity="0">
    <!-- pivot: 32,36 -->
    <polygon points="22,33 29,31 27,39 20,38" fill="#E3263A" stroke="#1C1412" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="35,34 43,32 41,40 34,39" fill="#9E1424" stroke="#1C1412" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="28,41 35,40 32,47" fill="#FF5C6E" stroke="#1C1412" stroke-width="1.4" stroke-linejoin="round"/>
  </g>

  <!-- gain 状态：回心时的闪光与四角星（平时 opacity="0"） -->
  <g id="gain_flash" opacity="0">
    <!-- pivot: 32,34 -->
    <path d="M32,22 L25,18 L17,20.5 L14,27.5 L16.5,36.5 L32,50.5 L47.5,36.5 L50,27.5 L47,20.5 L39,18 Z" fill="#FFD6DC" opacity="0.65"/>
    <path d="M21,14 L23,19 L28,21 L23,23 L21,28 L19,23 L14,21 L19,19 Z" fill="#FFFFFF" stroke="#1C1412" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M46,36 L47.5,39.5 L51,41 L47.5,42.5 L46,46 L44.5,42.5 L41,41 L44.5,39.5 Z" fill="#FFD6DC" stroke="#1C1412" stroke-width="1" stroke-linejoin="round"/>
  </g>
</g>
</svg>
